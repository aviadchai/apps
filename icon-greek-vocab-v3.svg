<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#EAFBF5"/>
      <stop offset="1" stop-color="#DFF7EF"/>
    </linearGradient>
    <radialGradient id="tile" gradientUnits="userSpaceOnUse" cx="193" cy="150" r="360">
      <stop offset="0" stop-color="#33E6CF"/>
      <stop offset="0.55" stop-color="#0FB9A7"/>
      <stop offset="1" stop-color="#0A8577"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="70" y="70" width="372" height="372" rx="92" fill="url(#tile)"/>

  <!-- Greek letter -->
  <text x="256" y="212" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800"
        font-size="196" fill="#ffffff">Σ</text>

  <!-- number counter (odometer) to illustrate counting -->
  <g>
    <rect x="140" y="316" width="232" height="86" rx="24" fill="#ffffff"/>
    <line x1="217" y1="326" x2="217" y2="392" stroke="#DFF7EF" stroke-width="4"/>
    <line x1="295" y1="326" x2="295" y2="392" stroke="#DFF7EF" stroke-width="4"/>
    <text x="178" y="360" text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800"
          font-size="58" fill="#0A8577">1</text>
    <text x="256" y="360" text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800"
          font-size="58" fill="#0FB9A7">2</text>
    <text x="334" y="360" text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800"
          font-size="58" fill="#33C9B6">3</text>
  </g>
</svg>
