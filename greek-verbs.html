<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>יוונית — פרק 1: פעלים</title>
<link rel="manifest" href="greek-verbs-manifest.json">
<link rel="icon" href="icon-greek.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-greek-180.png">
<meta name="theme-color" content="#3d3d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יוונית פרק 1">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --ink:#3d3d6b; --ink2:#565694; --accent:#6c63e0; --accent-soft:#eceafd;
  --done-bg:#dcf3c8; --done-border:#a8d989; --done-check:#5cab2e;
  --bg:#fdfcf9; --card:#fff; --muted:#8a8aa8; --danger:#e05656; --gold:#f5b626;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;}
button{font-family:inherit;border:none;background:none;cursor:pointer;-webkit-appearance:none;transition:transform .12s ease,opacity .12s ease;}
button:active{transform:scale(.97);opacity:.9;}
.greek{font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---- top stats bar ---- */
#statsBar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;padding:calc(8px + env(safe-area-inset-top)) 6px 8px;}
#statsBar .st{flex:1;text-align:center;}
#statsBar .st .lbl{font-size:11px;opacity:.85;}
#statsBar .st .val{font-size:17px;font-weight:800;margin-top:2px;}

/* ---- screens ---- */
.screen{display:none;max-width:520px;margin:0 auto;padding:0 14px 110px;animation:fadeIn .25s ease;}
.screen.active{display:block;}

/* ---- chapter header ---- */
#chHead{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 4px;}
#chHead .badge{width:52px;height:52px;border-radius:12px;background:#efe9fb;border:2px solid #c9b8ef;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--ink);}
#chHead .mid{text-align:center;flex:1;}
#chHead h1{font-size:22px;font-weight:800;color:var(--ink);}
#chHead .under{font-size:11px;color:var(--muted);margin-top:2px;}
#dots{display:flex;gap:6px;justify-content:center;margin:10px 0 2px;direction:ltr;}
#dots i{width:8px;height:8px;border-radius:50%;background:#d5d5e6;}
#dots i.on{background:var(--ink);}
.section-title{font-size:18px;font-weight:800;color:var(--ink);margin:26px 4px 12px;}
.lesson-pill{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:2px solid var(--ink);border-radius:26px;padding:12px 16px;margin-bottom:12px;box-shadow:0 2px 0 rgba(61,61,107,.35);text-align:right;}
.lesson-pill .nm{flex:1;font-size:16px;font-weight:700;color:var(--ink);}
.lesson-pill .ic{font-size:18px;}
.lesson-pill .ring{width:22px;height:22px;border-radius:50%;border:2px solid #c5c5da;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
.lesson-pill.done{background:var(--done-bg);border-color:var(--done-border);box-shadow:0 2px 0 rgba(92,171,46,.3);}
.lesson-pill.done .ring{background:var(--done-check);border-color:var(--done-check);}
.lesson-pill.next{border-color:var(--accent);background:var(--accent-soft);}

/* ---- lesson header ---- */
#lessonBar{position:sticky;top:0;z-index:31;background:#8080bd;color:#fff;display:none;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;}
#lessonBar.show{display:flex;}
#lessonBar .back{font-size:20px;color:#fff;line-height:1;}
#lessonBar .ttl{flex:1;font-size:16px;font-weight:700;text-align:center;}
#lessonBar .prg{font-size:12px;opacity:.9;min-width:44px;text-align:left;}

/* ---- lesson body ---- */
#lessonScreen{padding-top:14px;}
.teach-row{display:flex;align-items:stretch;margin:0 auto 12px;max-width:360px;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff;box-shadow:2px 2px 0 rgba(61,61,107,.45);opacity:.45;transition:opacity .3s,box-shadow .3s;}
.teach-row.lit{opacity:1;box-shadow:2px 2px 0 var(--accent);border-color:var(--accent);}
.teach-row.seen{opacity:1;}
.teach-row .he{background:var(--ink);color:#fff;font-weight:700;padding:12px 14px;min-width:96px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.teach-row.lit .he{background:var(--accent);}
.teach-row .el{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;}
.teach-row .el .g{font-size:20px;font-weight:600;}
.teach-row .el .t{font-size:12px;color:var(--muted);margin-top:2px;}
.audio-ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(480px,92%);background:var(--ink);border-radius:22px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:22px;color:#fff;z-index:25;}
.audio-ctl button{color:#fff;font-size:22px;}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(480px,92%);background:var(--accent);color:#fff;font-size:18px;font-weight:800;padding:16px;border-radius:30px;z-index:25;box-shadow:0 4px 14px rgba(108,99,224,.4);}
.cta:disabled{opacity:.45;}
.cta.secondary{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:none;}

/* info lesson */
.info-card{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:22px;margin:14px auto;max-width:420px;box-shadow:0 2px 0 rgba(61,61,107,.35);font-size:16px;line-height:1.7;}
.info-card h3{margin-bottom:10px;font-size:18px;}
.info-card .big{font-size:30px;text-align:center;margin-bottom:12px;}

/* quiz */
.qbar{height:10px;background:#e4e4f0;border-radius:8px;margin:6px auto 20px;max-width:420px;overflow:hidden;}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8bc34a,#5cab2e);border-radius:8px;transition:width .3s;}
.qprompt{text-align:center;margin:8px auto 22px;max-width:420px;}
.qprompt .ask{font-size:14px;color:var(--muted);margin-bottom:8px;}
.qprompt .word{font-size:30px;font-weight:800;color:var(--ink);}
.qprompt .sub{font-size:15px;color:var(--muted);margin-top:6px;}
.speakBig{width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:6px auto 4px;box-shadow:0 6px 16px rgba(108,99,224,.35);}
.opts{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto;}
.opt{background:#fff;border:2px solid var(--ink);border-radius:22px;padding:14px 18px;font-size:19px;font-weight:600;color:var(--ink);box-shadow:0 2px 0 rgba(61,61,107,.35);text-align:center;}
.opt.correct{background:var(--done-bg);border-color:var(--done-check);}
.opt.wrong{background:#fde3e3;border-color:var(--danger);}
.opt:disabled{opacity:.85;}
.feedback{text-align:center;font-size:17px;font-weight:800;min-height:26px;margin:16px 0 8px;}
.feedback.good{color:var(--done-check);}
.feedback.bad{color:var(--danger);}

/* sentence builder */
.build-target{text-align:center;font-size:20px;font-weight:800;margin:4px auto 14px;max-width:420px;}
.answer-line{min-height:64px;border-bottom:3px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:420px;margin:0 auto 22px;padding:8px 4px;direction:ltr;}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:420px;margin:0 auto;direction:ltr;}
.tile{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 16px;font-size:19px;font-weight:600;color:var(--ink);box-shadow:0 2px 0 rgba(61,61,107,.35);}
.tile.used{opacity:.25;pointer-events:none;}
.answer-line .tile{box-shadow:none;background:var(--accent-soft);border-color:var(--accent);}

/* speaking */
.speak-card{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:24px 18px;max-width:420px;margin:8px auto 16px;text-align:center;box-shadow:0 2px 0 rgba(61,61,107,.35);}
.speak-card .he-line{font-size:17px;color:var(--muted);margin-bottom:10px;}
.speak-card .el-line{font-size:26px;font-weight:700;}
.speak-card .tr-line{font-size:14px;color:var(--muted);margin-top:8px;}
.speak-btns{display:flex;gap:14px;justify-content:center;margin-top:10px;}
.round-btn{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;}
.round-btn.play{background:var(--ink);}
.round-btn.mic{background:var(--danger);}
.round-btn.mic.rec{animation:pop .8s infinite;}
.heard{text-align:center;font-size:17px;min-height:24px;color:var(--muted);margin-top:12px;}

/* result */
.result-wrap{text-align:center;padding-top:40px;}
.result-wrap .emoji{font-size:64px;animation:pop .5s ease;}
.result-wrap h2{font-size:26px;margin:14px 0 6px;}
.result-wrap p{color:var(--muted);font-size:16px;}

/* words tab */
.word-row{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #e0e0ec;border-radius:14px;padding:10px 14px;margin-bottom:10px;}
.word-row .g{font-size:19px;font-weight:600;flex:1;text-align:left;direction:ltr;}
.word-row .h{font-size:15px;font-weight:700;}
.word-row .p{font-size:12px;color:var(--muted);}
.word-row button{font-size:20px;}

/* bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);}
#nav button{flex:1;color:#fff;opacity:.6;padding:10px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;}
#nav button.on{opacity:1;font-weight:700;}
body.in-lesson #nav{display:none;}
#nav .nic{font-size:20px;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
</style>
</head>
<body>

<div id="statsBar">
  <div class="st"><div class="lbl">אוצר מילים</div><div class="val" id="stVocab">0</div></div>
  <div class="st"><div class="lbl">הרכבת משפט</div><div class="val" id="stBuild">0</div></div>
  <div class="st"><div class="lbl">זיהוי משמיעה</div><div class="val" id="stListen">0</div></div>
  <div class="st"><div class="lbl">דיבור</div><div class="val" id="stSpeak">0</div></div>
</div>

<div id="lessonBar">
  <button class="back" id="lessonBack">→</button>
  <div class="ttl" id="lessonTitle"></div>
  <div class="prg" id="lessonProg"></div>
</div>

<div class="screen active" id="chapterScreen">
  <div id="chHead">
    <div class="badge greek">Αα</div>
    <div class="mid">
      <h1>פרק 1 — פעלים</h1>
      <div class="under">יסודות היוונית</div>
      <div id="dots"></div>
    </div>
    <div style="width:52px"></div>
  </div>
  <div id="sections"></div>
</div>

<div class="screen" id="lessonScreen"></div>

<div class="screen" id="wordsScreen">
  <h1 style="font-size:22px;margin:18px 4px 14px;">המילים של פרק 1</h1>
  <div id="wordsList"></div>
</div>

<div id="nav">
  <button data-tab="words"><span class="nic">🔤</span>מילים</button>
  <button data-tab="chapter" class="on"><span class="nic">🚀</span>קורס</button>
</div>

<canvas id="confetti"></canvas>

<script>
/* ================= data ================= */
const PERSONS=[
  {he:'אני',el:'εγώ',tr:'אֶגוֹ'},
  {he:'אתה / את',el:'εσύ',tr:'אֶסִי'},
  {he:'הוא',el:'αυτός',tr:'אַפְטוֹס'},
  {he:'היא',el:'αυτή',tr:'אַפְטִי'},
  {he:'זה',el:'αυτό',tr:'אַפְטוֹ'},
  {he:'אנחנו',el:'εμείς',tr:'אֶמִיס'},
  {he:'אתם',el:'εσείς',tr:'אֶסִיס'},
  {he:'הם',el:'αυτοί',tr:'אַפְטִי'},
];
const OBJECTS=[
  {he:'אותי',el:'με',tr:'מֶה'},
  {he:'אותך',el:'σε',tr:'סֶה'},
  {he:'אותו',el:'τον',tr:'טוֹן'},
  {he:'אותה',el:'την',tr:'טִין'},
  {he:'את זה',el:'το',tr:'טוֹ'},
  {he:'אותנו',el:'μας',tr:'מַאס'},
  {he:'אתכם',el:'σας',tr:'סַאס'},
  {he:'אותם',el:'τους',tr:'טוּס'},
];
const VERBS=[
  {he:'רוצה',el:'θέλω',tr:'תֶ׳לוֹ'},
  {he:'יש לי',el:'έχω',tr:'אֶחוֹ'},
  {he:'יודע',el:'ξέρω',tr:'קְסֶרוֹ'},
  {he:'רואה',el:'βλέπω',tr:'וְלֶפּוֹ'},
  {he:'שומע',el:'ακούω',tr:'אַקוּאוֹ'},
  {he:'מדבר',el:'μιλάω',tr:'מִילַאוֹ'},
  {he:'אוכל',el:'τρώω',tr:'טְרוֹאוֹ'},
  {he:'שותה',el:'πίνω',tr:'פִּינוֹ'},
  {he:'אוהב',el:'αγαπάω',tr:'אַגַאפַּאוֹ'},
  {he:'מבין',el:'καταλαβαίνω',tr:'קַטַלַאבֶנוֹ'},
  {he:'גר',el:'μένω',tr:'מֶנוֹ'},
  {he:'הולך',el:'πάω',tr:'פַּאוֹ'},
];
const CONJ=[
  {he:'אני רוצה',el:'θέλω',tr:'תֶ׳לוֹ'},
  {he:'אתה רוצה',el:'θέλεις',tr:'תֶ׳לִיס'},
  {he:'הוא רוצה',el:'θέλει',tr:'תֶ׳לִי'},
  {he:'אנחנו רוצים',el:'θέλουμε',tr:'תֶ׳לוּמֶה'},
  {he:'אתם רוצים',el:'θέλετε',tr:'תֶ׳לֶטֶה'},
  {he:'הם רוצים',el:'θέλουν',tr:'תֶ׳לוּן'},
];
const CONJ_QUIZ=[
  {he:'אתה יודע',el:'ξέρεις',opts:['ξέρεις','ξέρω','ξέρει','ξέρουμε']},
  {he:'היא שותה',el:'πίνει',opts:['πίνει','πίνω','πίνεις','πίνουν']},
  {he:'אנחנו רואים',el:'βλέπουμε',opts:['βλέπουμε','βλέπω','βλέπετε','βλέπει']},
  {he:'הם גרים',el:'μένουν',opts:['μένουν','μένω','μένει','μένουμε']},
  {he:'אתם רוצים',el:'θέλετε',opts:['θέλετε','θέλεις','θέλουν','θέλω']},
  {he:'אני שומע',el:'ακούω',opts:['ακούω','ακούς','ακούει','ακούμε']},
  {he:'הוא מבין',el:'καταλαβαίνει',opts:['καταλαβαίνει','καταλαβαίνω','καταλαβαίνεις','καταλαβαίνουν']},
  {he:'אתה שותה',el:'πίνεις',opts:['πίνεις','πίνω','πίνει','πίνετε']},
  {he:'אנחנו יודעים',el:'ξέρουμε',opts:['ξέρουμε','ξέρετε','ξέρουν','ξέρω']},
  {he:'הם רואים',el:'βλέπουν',opts:['βλέπουν','βλέπει','βλέπουμε','βλέπω']},
];
const SENTENCES_A=[
  {he:'אני רוצה מים',el:['Θέλω','νερό'],x:['εγώ','πίνω']},
  {he:'אני לא יודע',el:['Δεν','ξέρω'],x:['όχι','θέλω']},
  {he:'אני אוהב אותך',el:['Σε','αγαπάω'],x:['με','εσύ']},
  {he:'אתה רואה אותי?',el:['Με','βλέπεις;'],x:['σε','βλέπω']},
  {he:'אני שותה קפה',el:['Πίνω','καφέ'],x:['τρώω','νερό']},
];
const SENTENCES_B=[
  {he:'אנחנו מדברים יוונית',el:['Μιλάμε','ελληνικά'],x:['μιλάω','εμείς']},
  {he:'יש לי בית',el:['Έχω','σπίτι'],x:['έχει','καφέ']},
  {he:'אתה מבין יוונית?',el:['Καταλαβαίνεις','ελληνικά;'],x:['καταλαβαίνω','εβραϊκά']},
  {he:'אנחנו אוכלים עכשיו',el:['Τρώμε','τώρα'],x:['τρώω','εδώ']},
  {he:'אני גר באתונה',el:['Μένω','στην','Αθήνα'],x:['μένεις','στο']},
];
const SENTENCES_C=[
  {he:'הוא רוצה קפה',el:['Αυτός','θέλει','καφέ'],x:['θέλω','αυτή']},
  {he:'היא רואה אותו',el:['Αυτή','τον','βλέπει'],x:['την','βλέπω']},
  {he:'אנחנו שומעים אותך',el:['Σε','ακούμε'],x:['ακούω','μας']},
  {he:'הם שותים מים',el:['Πίνουν','νερό'],x:['πίνω','καφέ']},
  {he:'אתם יודעים יוונית',el:['Ξέρετε','ελληνικά'],x:['ξέρω','εβραϊκά']},
];
const SPEAK_A=[
  {he:'אני רוצה מים',el:'Θέλω νερό',tr:'תֶ׳לוֹ נֶרוֹ'},
  {he:'אני לא יודע',el:'Δεν ξέρω',tr:'דֶן קְסֶרוֹ'},
  {he:'אני אוהב אותך',el:'Σε αγαπάω',tr:'סֶה אַגַאפַּאוֹ'},
  {he:'אני שותה קפה',el:'Πίνω καφέ',tr:'פִּינוֹ קַפֶה'},
  {he:'אני מבין',el:'Καταλαβαίνω',tr:'קַטַלַאבֶנוֹ'},
];
const SPEAK_B=[
  {he:'אנחנו מדברים יוונית',el:'Μιλάμε ελληνικά',tr:'מִילַאמֶה אֶלִינִיקַה'},
  {he:'יש לי בית',el:'Έχω σπίτι',tr:'אֶחוֹ סְפִּיטִי'},
  {he:'אתה מבין?',el:'Καταλαβαίνεις;',tr:'קַטַלַאבֶנִיס?'},
  {he:'אני גר באתונה',el:'Μένω στην Αθήνα',tr:'מֶנוֹ סְטִין אַתִ׳ינַה'},
  {he:'אני שומע אותך',el:'Σε ακούω',tr:'סֶה אַקוּאוֹ'},
];
const ALL_WORDS=[...PERSONS,...OBJECTS,...VERBS];

function mcFrom(list,pool){return list.map(w=>({he:w.he,el:w.el,opts:null,pool:pool||list}));}

const LESSONS=[
  {sec:'הקדמה'},
  {id:'tour',name:'איך לומדים כאן',ic:'🧭',type:'info'},
  {sec:'א. הגופים'},
  {id:'persons',name:'הגופים',ic:'📖',type:'teach',rows:PERSONS,note:'ביוונית לרוב משמיטים את כינוי הגוף — הפועל כבר אומר מי מדבר. אבל חייבים להכיר אותם!'},
  {id:'personsQuiz',name:'תרגול גופים',ic:'🌿',type:'quiz',items:mcFrom(PERSONS)},
  {id:'objects',name:'המושאים',ic:'📖',type:'teach',rows:OBJECTS,note:'אותי, אותך, אותו... ביוונית המושא בא לפני הפועל: Σε αγαπάω = אותך אני-אוהב.'},
  {id:'objectsQuiz',name:'תרגול: אותי, אותו, אותה',ic:'🌿',type:'quiz',items:mcFrom(OBJECTS)},
  {id:'listen1',name:'זיהוי משמיעה',ic:'🧩',type:'listen',items:mcFrom([...PERSONS.slice(0,6),...OBJECTS.slice(0,4)],[...PERSONS,...OBJECTS])},
  {id:'build1',name:'הרכבת משפטים',ic:'💬',type:'build',items:SENTENCES_A},
  {sec:'ב. אוצר המילים הראשון'},
  {id:'verbs',name:'אוצר המילים הראשון',ic:'📖',type:'teach',rows:VERBS,note:'12 הפעלים הכי שימושיים ביוונית. כולם מוצגים בגוף ראשון (אני...).'},
  {id:'verbsQuiz',name:'תרגול פעלים',ic:'🌿',type:'quiz',items:mcFrom(VERBS)},
  {id:'listen2',name:'זיהוי משמיעה',ic:'🧩',type:'listen',items:mcFrom(VERBS.slice(0,10),VERBS)},
  {id:'build2',name:'הרכבת משפטים',ic:'💬',type:'build',items:SENTENCES_B},
  {sec:'✨ ג. חוק דקדוק 1 — הטיית פעלים ✨'},
  {id:'conj',name:'חוק דקדוק 1 — פעלים',ic:'📖',type:'teach',rows:CONJ,note:'החוק: מורידים את ה־ω ומוסיפים סיומת לפי הגוף: ‏-ω, -εις, -ει, -ουμε, -ετε, -ουν. ככה מטים כל פועל רגיל!'},
  {id:'conjQuiz',name:'תרגול הטיית פעלים',ic:'🌿',type:'quiz',items:CONJ_QUIZ},
  {id:'build3',name:'הרכבת משפטים',ic:'💬',type:'build',items:SENTENCES_C},
  {sec:'ד. תרגול דיבור'},
  {id:'speak1',name:'תרגול דיבור לאט',ic:'🎤',type:'speak',items:SPEAK_A,rate:.6},
  {id:'speak2',name:'תרגול דיבור',ic:'🎤',type:'speak',items:SPEAK_B,rate:.85},
  {sec:'ה. סיכום פרק 1'},
  {id:'finalTest',name:'מבחן סוף פרק',ic:'🏆',type:'test'},
];
const LESSON_IDS=LESSONS.filter(l=>l.id).map(l=>l.id);

/* ================= state ================= */
const KEY='greekVerbs.v1';
let state={done:{},stats:{vocab:0,build:0,listen:0,speak:0},vocabSeen:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done)state={...state,...s};}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function markDone(id){if(!state.done[id]){state.done[id]=true;save();}renderChapter();renderStats();}
function addVocab(el){if(!state.vocabSeen[el]){state.vocabSeen[el]=1;state.stats.vocab=Object.keys(state.vocabSeen).length;save();renderStats();}}
function bump(k,n){state.stats[k]+=(n||1);save();renderStats();}

/* ================= audio ================= */
let VOICES=[];function loadVoices(){VOICES=window.speechSynthesis?speechSynthesis.getVoices():[];}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(t,rate,onend){
  if(!('speechSynthesis'in window)||!t){if(onend)setTimeout(onend,600);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/;/g,'?'));
  const v=VOICES.find(v=>v.lang&&v.lang.startsWith('el'));
  u.lang='el-GR';if(v)u.voice=v;u.rate=rate||.8;u.pitch=1;
  if(onend){
    let fired=false;const fin=()=>{if(fired)return;fired=true;clearTimeout(tm);onend();};
    const tm=setTimeout(fin,Math.max(2500,t.length*220));
    u.onend=fin;u.onerror=fin;
  }
  speechSynthesis.speak(u);
}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function confetti(){
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*3,r:4+Math.random()*5,h:Math.random()*360,w:Math.random()*2-1}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=p.w;x.fillStyle=`hsl(${p.h},80%,60%)`;x.fillRect(p.x,p.y,p.r,p.r);});if(++n<130)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();
}

/* ================= chapter screen ================= */
function nextLessonId(){return LESSON_IDS.find(id=>!state.done[id]);}
function renderStats(){
  $('#stVocab').textContent=state.stats.vocab;
  $('#stBuild').textContent=state.stats.build;
  $('#stListen').textContent=state.stats.listen;
  $('#stSpeak').textContent=state.stats.speak;
}
function renderChapter(){
  const doneCount=LESSON_IDS.filter(id=>state.done[id]).length;
  $('#dots').innerHTML=Array.from({length:8},(_,i)=>`<i class="${i<Math.round(doneCount/LESSON_IDS.length*8)?'on':''}"></i>`).join('');
  const next=nextLessonId();
  let html='';
  LESSONS.forEach(l=>{
    if(l.sec){html+=`<div class="section-title">${esc(l.sec)}</div>`;return;}
    const done=!!state.done[l.id];
    html+=`<button class="lesson-pill ${done?'done':(l.id===next?'next':'')}" data-lesson="${l.id}">
      <span class="nm">${esc(l.name)}</span><span class="ic">${l.ic}</span>
      <span class="ring">${done?'✓':''}</span></button>`;
  });
  $('#sections').innerHTML=html;
  document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));
}

/* ================= lesson framework ================= */
let CURRENT=null;
function openLesson(id){
  CURRENT=LESSONS.find(l=>l.id===id);
  $('#lessonTitle').textContent=CURRENT.name;
  $('#lessonProg').textContent='';
  $('#lessonBar').classList.add('show');
  $('#statsBar').style.display='none';
  document.body.classList.add('in-lesson');
  showScreen('lessonScreen');
  const L=$('#lessonScreen');L.innerHTML='';
  ({info:renderInfo,teach:renderTeach,quiz:q=>renderQuiz(q,false),listen:q=>renderQuiz(q,true),build:renderBuild,speak:renderSpeak,test:renderTest})[CURRENT.type](CURRENT);
}
function closeLesson(){
  speechSynthesis&&speechSynthesis.cancel();
  stopRec();
  $('#lessonBar').classList.remove('show');
  $('#statsBar').style.display='flex';
  document.body.classList.remove('in-lesson');
  showScreen('chapterScreen');
}
$('#lessonBack').onclick=closeLesson;
function finishLesson(msg,sub){
  speechSynthesis&&speechSynthesis.cancel();
  markDone(CURRENT.id);confetti();
  $('#lessonScreen').innerHTML=`<div class="result-wrap"><div class="emoji">🎉</div><h2>${esc(msg||'כל הכבוד!')}</h2><p>${esc(sub||'השיעור הושלם')}</p></div>
  <button class="cta" id="doneBtn">חזרה לפרק</button>`;
  $('#doneBtn').onclick=closeLesson;
}

/* ---- info ---- */
function renderInfo(){
  $('#lessonScreen').innerHTML=`
  <div class="info-card"><div class="big">🇬🇷</div>
    <h3>ברוכים הבאים לפרק 1!</h3>
    בפרק הזה לומדים את הבסיס של היוונית בדיוק כמו שלומדים שפה אמיתית: <b>גופים ← מילים ← חוק דקדוק ← דיבור</b>.
  </div>
  <div class="info-card"><h3>ככה זה עובד:</h3>
    📖 שיעור — מקשיבים וקוראים<br>
    🌿 תרגול — עונים על שאלות<br>
    🧩 זיהוי משמיעה — מזהים מילים באוזן<br>
    💬 הרכבת משפטים — בונים משפט ביוונית<br>
    🎤 דיבור — אומרים בקול רם
  </div>
  <div class="info-card">כל שיעור שמסיימים נצבע בירוק ✓. מומלץ ללכת לפי הסדר!</div>
  <button class="cta" id="infoDone">יאללה, מתחילים!</button>`;
  $('#infoDone').onclick=()=>finishLesson('מוכנים!','עכשיו לומדים את הגופים');
}

/* ---- teach ---- */
function renderTeach(l){
  const L=$('#lessonScreen');
  L.innerHTML=(l.note?`<div class="info-card" style="font-size:14px;padding:14px 18px;">💡 ${esc(l.note)}</div>`:'')+
    l.rows.map((r,i)=>`<div class="teach-row" id="tr${i}">
      <div class="he">${esc(r.he)}</div>
      <div class="el"><div class="g greek">${esc(r.el)}</div><div class="t">${esc(r.tr)}</div></div>
    </div>`).join('')+
    `<div style="height:150px"></div>
    <div class="audio-ctl"><button id="replayBtn" title="נגן שוב">↻</button><button id="playBtn">▶</button></div>
    <button class="cta" id="teachDone" disabled>הבנתי</button>`;
  let i=0,playing=false,seen=false;
  const rows=l.rows;
  function lightRow(n){document.querySelectorAll('.teach-row').forEach((e,j)=>{e.classList.toggle('lit',j===n);if(j<=n)e.classList.add('seen');});
    const el=document.getElementById('tr'+n);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});}
  function playNext(){
    if(!playing)return;
    if(i>=rows.length){playing=false;$('#playBtn').textContent='▶';$('#teachDone').disabled=false;seen=true;
      document.querySelectorAll('.teach-row').forEach(e=>e.classList.remove('lit'));return;}
    lightRow(i);addVocab(rows[i].el);
    speak(rows[i].el,.72,()=>{setTimeout(()=>{i++;playNext();},450);});
  }
  $('#playBtn').onclick=()=>{
    if(playing){playing=false;speechSynthesis.cancel();$('#playBtn').textContent='▶';}
    else{playing=true;$('#playBtn').textContent='⏸';if(i>=rows.length)i=0;playNext();}
  };
  $('#replayBtn').onclick=()=>{speechSynthesis.cancel();i=0;playing=true;$('#playBtn').textContent='⏸';playNext();};
  document.querySelectorAll('.teach-row').forEach((e,j)=>e.onclick=()=>{playing=false;$('#playBtn').textContent='▶';speechSynthesis.cancel();lightRow(j);speak(rows[j].el,.72);addVocab(rows[j].el);});
  $('#teachDone').onclick=()=>finishLesson('יפה מאוד!','למדת '+rows.length+' ביטויים חדשים');
  // allow finishing without audio support
  if(!('speechSynthesis'in window)){$('#teachDone').disabled=false;}
}

/* ---- quiz / listen ---- */
function renderQuiz(l,listening,customItems,onAllDone){
  const items=shuffle(customItems||l.items);
  let idx=0,correct=0;
  const L=$('#lessonScreen');
  function step(){
    if(idx>=items.length){
      if(onAllDone)return onAllDone(correct,items.length);
      return finishLesson(correct===items.length?'מושלם!':'כל הכבוד!',`ענית נכון על ${correct} מתוך ${items.length}`);
    }
    $('#lessonProg').textContent=`${idx+1}/${items.length}`;
    const it=items[idx];
    const opts=it.opts?shuffle(it.opts):shuffle([it.el,...shuffle((it.pool||items).map(p=>p.el).filter(e=>e!==it.el)).slice(0,3)]);
    L.innerHTML=`<div class="qbar"><i style="width:${idx/items.length*100}%"></i></div>
      <div class="qprompt">
        ${listening
          ?`<div class="ask">מה שמעתם? הקישו להשמעה חוזרת</div><button class="speakBig" id="hearBtn">🔊</button>`
          :`<div class="ask">איך אומרים ביוונית:</div><div class="word">${esc(it.he)}</div>`}
      </div>
      <div class="opts">${opts.map(o=>{
        const lab=listening?(it.pool||items).find(p=>p.el===o).he:o;
        return `<button class="opt ${listening?'':'greek'}" data-v="${esc(o)}">${esc(listening?lab:o)}</button>`;}).join('')}
      </div><div class="feedback" id="fb"></div>`;
    if(listening){$('#hearBtn').onclick=()=>speak(it.el,.7);setTimeout(()=>speak(it.el,.7),350);}
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      const ok=b.dataset.v===it.el;
      b.classList.add(ok?'correct':'wrong');
      if(!ok)document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.v===it.el)x.classList.add('correct');});
      $('#fb').textContent=ok?'נכון! 🎉':'לא נורא — התשובה: '+it.el;
      $('#fb').className='feedback '+(ok?'good':'bad');
      if(ok){correct++;addVocab(it.el);if(listening)bump('listen');}
      if(!listening)speak(it.el,.8);
      setTimeout(()=>{idx++;step();},ok?900:1800);
    });
  }
  step();
}

/* ---- sentence builder ---- */
function renderBuild(l,customItems,onAllDone){
  const items=shuffle(customItems||l.items);
  let idx=0,correct=0;
  const L=$('#lessonScreen');
  function step(){
    if(idx>=items.length){
      if(onAllDone)return onAllDone(correct,items.length);
      return finishLesson('אלופים!',`הרכבת נכון ${correct} מתוך ${items.length} משפטים`);
    }
    $('#lessonProg').textContent=`${idx+1}/${items.length}`;
    const it=items[idx];let ans=[];
    const tiles=shuffle([...it.el,...(it.x||[])]);
    L.innerHTML=`<div class="qbar"><i style="width:${idx/items.length*100}%"></i></div>
      <div class="qprompt"><div class="ask">הרכיבו את המשפט ביוונית:</div><div class="word" style="font-size:24px">${esc(it.he)}</div></div>
      <div class="answer-line greek" id="ansLine"></div>
      <div class="bank greek" id="bank">${tiles.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <button class="cta" id="checkBtn" disabled>בדיקה</button>`;
    function redraw(){
      $('#ansLine').innerHTML=ans.map((a,j)=>`<button class="tile" data-j="${j}">${esc(tiles[a])}</button>`).join('');
      document.querySelectorAll('#ansLine .tile').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;const ti=ans.splice(j,1)[0];document.querySelector(`#bank [data-i="${ti}"]`).classList.remove('used');redraw();});
      $('#checkBtn').disabled=ans.length===0;
    }
    document.querySelectorAll('#bank .tile').forEach(b=>b.onclick=()=>{b.classList.add('used');ans.push(+b.dataset.i);redraw();});
    $('#checkBtn').onclick=()=>{
      const got=ans.map(a=>tiles[a]).join(' ');
      const want=it.el.join(' ');
      const ok=got===want;
      $('#fb').textContent=ok?'נכון! 🎉 '+want:'התשובה הנכונה: '+want;
      $('#fb').className='feedback '+(ok?'good':'bad');
      speak(want,.8);
      if(ok){correct++;bump('build');}
      $('#checkBtn').disabled=true;
      setTimeout(()=>{idx++;step();},ok?1300:2300);
    };
  }
  step();
}

/* ---- speaking ---- */
let REC=null;
function stopRec(){if(REC){try{REC.abort();}catch(e){}REC=null;}}
function normGreek(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[;،.,!?·΄]/g,'').replace(/\s+/g,' ').trim();}
function renderSpeak(l){
  const items=l.items;const rate=l.rate||.8;
  let idx=0,doneCount=0;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const L=$('#lessonScreen');
  function step(){
    if(idx>=items.length)return finishLesson('איזה יופי!','תרגלת דיבור על '+items.length+' משפטים');
    $('#lessonProg').textContent=`${idx+1}/${items.length}`;
    const it=items[idx];
    L.innerHTML=`<div class="qbar"><i style="width:${idx/items.length*100}%"></i></div>
      <div class="qprompt"><div class="ask">הקשיבו — ואז אמרו בקול רם:</div></div>
      <div class="speak-card">
        <div class="he-line">${esc(it.he)}</div>
        <div class="el-line greek">${esc(it.el)}</div>
        <div class="tr-line">${esc(it.tr)}</div>
        <div class="speak-btns">
          <button class="round-btn play" id="pl">🔊</button>
          ${SR?'<button class="round-btn mic" id="mic">🎙️</button>':''}
        </div>
        <div class="heard" id="heard"></div>
      </div>
      <div class="feedback" id="fb"></div>
      <button class="cta secondary" id="selfOk">אמרתי! ממשיכים ←</button>`;
    $('#pl').onclick=()=>speak(it.el,rate);
    setTimeout(()=>speak(it.el,rate),300);
    function pass(msg){bump('speak');doneCount++;$('#fb').textContent=msg;$('#fb').className='feedback good';setTimeout(()=>{idx++;step();},1000);}
    if(SR){
      $('#mic').onclick=()=>{
        stopRec();speechSynthesis.cancel();
        const r=new SR();REC=r;r.lang='el-GR';r.interimResults=false;r.maxAlternatives=3;
        $('#mic').classList.add('rec');$('#heard').textContent='מקשיב...';
        r.onresult=e=>{
          $('#mic').classList.remove('rec');
          const alts=[...e.results[0]].map(a=>a.transcript);
          $('#heard').textContent='שמעתי: '+alts[0];
          if(alts.some(a=>normGreek(a)===normGreek(it.el)))pass('הגייה מצוינת! 🎉');
          else{$('#fb').textContent='כמעט! נסו שוב או המשיכו';$('#fb').className='feedback bad';}
        };
        r.onerror=()=>{$('#mic').classList.remove('rec');$('#heard').textContent='';};
        r.onend=()=>$('#mic').classList.remove('rec');
        try{r.start();}catch(e){}
      };
    }
    $('#selfOk').onclick=()=>pass('יפה! 👏');
  }
  step();
}

/* ---- final test ---- */
function renderTest(){
  const vocabQ=shuffle(mcFrom(ALL_WORDS,ALL_WORDS)).slice(0,6);
  const conjQ=shuffle(CONJ_QUIZ).slice(0,4);
  const listenQ=shuffle(mcFrom(VERBS,VERBS)).slice(0,3);
  const buildQ=shuffle([...SENTENCES_A,...SENTENCES_B,...SENTENCES_C]).slice(0,2);
  let total=0,got=0;
  renderQuiz(CURRENT,false,[...vocabQ,...conjQ],(c,n)=>{
    got+=c;total+=n;
    renderQuiz(CURRENT,true,listenQ,(c2,n2)=>{
      got+=c2;total+=n2;
      renderBuild(CURRENT,buildQ,(c3,n3)=>{
        got+=c3;total+=n3;
        const pct=Math.round(got/total*100);
        if(pct>=60)finishLesson(pct>=90?'מדהים! ציון '+pct:'עברת! ציון '+pct,'סיימת את פרק 1 — פעלים 🏆');
        else{
          $('#lessonScreen').innerHTML=`<div class="result-wrap"><div class="emoji">💪</div><h2>ציון ${pct}</h2><p>צריך 60 כדי לעבור — שווה לחזור על התרגולים ולנסות שוב</p></div>
          <button class="cta" id="doneBtn">חזרה לפרק</button>`;
          $('#doneBtn').onclick=closeLesson;
        }
      });
    });
  });
}

/* ================= words tab ================= */
function renderWords(){
  $('#wordsList').innerHTML=[['הגופים',PERSONS],['המושאים',OBJECTS],['פעלים',VERBS]].map(([t,list])=>
    `<div class="section-title" style="margin-top:18px">${t}</div>`+
    list.map(w=>`<div class="word-row"><div class="h">${esc(w.he)}<div class="p">${esc(w.tr)}</div></div>
      <div class="g greek">${esc(w.el)}</div><button data-say="${esc(w.el)}">🔊</button></div>`).join('')
  ).join('');
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,.72));
}

/* ================= nav ================= */
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));window.scrollTo(0,0);}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  closeLessonIfOpen();
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  showScreen(b.dataset.tab==='words'?'wordsScreen':'chapterScreen');
});
function closeLessonIfOpen(){if($('#lessonBar').classList.contains('show'))closeLesson();}

renderStats();renderChapter();renderWords();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
