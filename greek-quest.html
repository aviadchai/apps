<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אוצר המילים שלי</title>
<link rel="manifest" href="greek-vocab-manifest.json">
<link rel="icon" href="icon-greek-vocab-v3.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-greek-vocab-180-v3.png">
<meta name="theme-color" content="#0FB9A7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אוצר מילים">
<style>
  html,body{margin:0;height:100%;}
  body{
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:linear-gradient(160deg,#EAFBF5 0%,#FDF3E4 100%);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  .loader{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 24px;text-align:center;}
  .dot{
    width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#2FE0C9,#0FB9A7 55%,#0A8577 100%);
    box-shadow:0 12px 32px rgba(15,185,167,0.35);
    animation:breathe 1.2s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(0.82);opacity:0.7;} }
  .txt{color:#0A8577;font-weight:700;font-size:0.95rem;letter-spacing:0.2px;line-height:1.6;}
  .txt small{display:block;font-weight:600;opacity:0.7;font-size:0.82rem;margin-top:2px;}
</style>
</head>
<body>
<div class="loader">
  <div class="dot"></div>
  <div class="txt">אוצר המילים שלי<small>הלימוד עבר לכאן — פותח…</small></div>
</div>
<script>
  // "יאללה יוונית" has been retired — learning now lives inside "אוצר המילים שלי".
  setTimeout(function(){ window.location.replace('greek-vocab.html?r=' + Date.now()); }, 350);
</script>
</body>
</html>
