<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>אוצר המילים שלי — יוונית</title>
<link rel="manifest" href="greek-vocab-manifest.json">
<link rel="icon" href="icon-greek-vocab-v3.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-greek-vocab-180-v3.png">
<meta name="theme-color" content="#0FB9A7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="אוצר מילים">
<style>
  :root{
    --teal:#0FB9A7; --teal-dark:#0A8577;
    --coral:#FF6B6B; --sun:#FFC93C; --plum:#3E2C56;
    --bg1:#EAFBF5; --bg2:#FDF3E4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--plum);}
  body{min-height:100vh;background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 44px);overflow-x:hidden;}
  .container{max-width:440px;margin:0 auto;padding:20px;}
  button{transition:transform .16s ease, box-shadow .3s ease, opacity .2s ease;}

  /* header */
  header{text-align:center;margin-bottom:4px;}
  header h1{font-size:1.35rem;font-weight:800;color:var(--plum);display:flex;align-items:center;justify-content:center;gap:9px;}
  header .sub{font-size:0.85rem;color:rgba(62,44,86,0.5);margin-top:3px;font-weight:600;}
  .hero{margin:20px auto 0;width:185px;height:185px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#2FE0C9,var(--teal) 55%,var(--teal-dark) 100%);
    box-shadow:0 12px 32px rgba(15,185,167,0.35), inset 0 -8px 18px rgba(0,0,0,0.12), inset 0 6px 14px rgba(255,255,255,0.25);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
  .hero .num{font-size:3.6rem;font-weight:800;line-height:1;transition:transform .2s ease;}
  .hero .num.bump{transform:scale(1.22);}
  .hero .lbl{font-size:0.82rem;font-weight:700;margin-top:6px;opacity:0.95;}
  .hero .days{font-size:0.72rem;opacity:0.8;margin-top:2px;}

  /* tabs */
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,0.85);border-radius:99px;padding:4px;margin:22px 0 16px;box-shadow:0 2px 10px rgba(62,44,86,0.12);}
  .tabs button{flex:1;padding:10px 0;border:none;border-radius:99px;background:transparent;font-size:0.9rem;font-weight:700;color:rgba(62,44,86,0.55);font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .tabs button.on{background:var(--teal);color:#fff;box-shadow:0 4px 14px rgba(15,185,167,0.35);}

  .card{background:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(62,44,86,0.10);opacity:0;transform:translateY(14px);animation:rise .35s ease forwards;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  .card h2{font-size:0.98rem;font-weight:800;color:var(--plum);margin-bottom:12px;}

  /* add form */
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:0.76rem;font-weight:700;color:rgba(62,44,86,0.55);margin-bottom:5px;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid rgba(62,44,86,0.15);border-radius:14px;font-size:1.05rem;font-family:inherit;background:#fff;color:var(--plum);outline:none;transition:border-color .2s ease;}
  .field input:focus{border-color:var(--teal);}
  .field input::placeholder{color:rgba(62,44,86,0.3);}
  .field input[dir=ltr]{text-align:left;}
  .hint{font-size:0.7rem;color:rgba(62,44,86,0.45);margin-top:8px;text-align:center;}
  .btn{width:100%;padding:14px;border:none;border-radius:16px;font-size:1rem;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
  .btn:active{transform:scale(0.97);opacity:.9;}
  .btn-main{background:var(--teal);color:#fff;box-shadow:0 8px 22px rgba(15,185,167,0.35);}
  .btn-main:disabled{background:rgba(62,44,86,0.08);color:rgba(62,44,86,0.4);box-shadow:none;}
  .btn-ghost{background:rgba(62,44,86,0.06);color:var(--plum);}
  .btn-row{display:flex;gap:9px;margin-top:12px;}
  .btn-row .btn{width:auto;flex:1;padding:12px 8px;font-size:0.85rem;}

  /* verdict panel */
  .verdict{border-radius:18px;padding:16px;margin-bottom:14px;font-size:0.9rem;line-height:1.65;display:none;}
  .verdict.show{display:block;animation:rise .35s ease both;}
  .verdict.ok{background:rgba(15,185,167,0.14);color:var(--teal-dark);}
  .verdict.warn{background:rgba(255,201,60,0.25);color:#7a5a00;}
  .verdict.bad{background:rgba(255,107,107,0.14);color:#c93a3a;}
  .verdict .btn-ghost{background:rgba(255,255,255,0.75);}
  .verdict .big-el{font-size:1.4rem;font-weight:800;direction:ltr;display:inline-block;}
  .verdict .tr{font-size:0.8rem;opacity:.7;direction:ltr;display:inline-block;}

  /* word list */
  .search{width:100%;padding:12px 18px;border:none;border-radius:99px;font-size:0.9rem;font-family:inherit;background:rgba(255,255,255,0.85);box-shadow:0 2px 10px rgba(62,44,86,0.12);outline:none;margin-bottom:12px;color:var(--plum);}
  .search::placeholder{color:rgba(62,44,86,0.35);}
  .word{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(62,44,86,0.08);animation:rise .3s ease both;}
  .word .info{flex:1;min-width:0;}
  .word .el{font-size:1.25rem;font-weight:800;color:var(--teal-dark);direction:ltr;text-align:right;unicode-bidi:isolate;}
  .word .el .wtr{font-size:0.72rem;font-weight:500;color:rgba(62,44,86,0.4);margin-inline-start:7px;}
  .word .he{font-size:0.9rem;color:rgba(62,44,86,0.65);font-weight:600;margin-top:1px;}
  .word .meta{font-size:0.68rem;color:rgba(62,44,86,0.38);margin-top:3px;}
  .word .meta .unv{color:var(--coral);font-weight:700;}
  .icon-btn{width:44px;height:44px;border-radius:14px;border:none;font-size:1.1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .icon-btn:active{transform:scale(0.94);}
  .play{background:rgba(15,185,167,0.12);color:var(--teal-dark);}
  .play.speaking{background:var(--teal);color:#fff;animation:speakpulse 1s ease-in-out infinite;}
  @keyframes speakpulse{0%,100%{opacity:1;}50%{opacity:0.72;}}
  .del{background:transparent;color:rgba(62,44,86,0.25);font-size:0.95rem;width:34px;}
  .del.arm{background:var(--coral);color:#fff;font-size:0.72rem;font-weight:800;width:auto;padding:0 14px;border-radius:99px;}
  .empty{text-align:center;color:rgba(62,44,86,0.45);font-size:0.88rem;padding:30px 10px;line-height:1.8;}
  .empty .e{font-size:2.4rem;}

  /* stats */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px;}
  .tile{background:#fff;border-radius:20px;padding:16px 12px;text-align:center;box-shadow:0 10px 30px rgba(62,44,86,0.08);opacity:0;transform:translateY(14px);animation:rise .35s ease forwards;}
  .tile .v{font-size:1.9rem;font-weight:800;color:var(--teal-dark);line-height:1.15;}
  .tile .k{font-size:0.74rem;color:rgba(62,44,86,0.5);margin-top:4px;font-weight:600;}
  .date-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(15,185,167,0.06);border-radius:14px;padding:10px 14px;font-size:0.85rem;font-weight:600;color:rgba(62,44,86,0.7);}
  .date-row label{flex:1;display:inline-flex;align-items:center;gap:7px;}
  .date-row input{border:1px solid rgba(62,44,86,0.15);border-radius:10px;padding:7px 10px;font-size:0.85rem;color:var(--teal-dark);background:#fff;font-family:inherit;}

  /* chart */
  .chart-wrap{position:relative;}
  .chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:18px;direction:ltr;}
  .cbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;position:relative;}
  .cbar .fill{background:var(--teal);border-radius:4px 4px 0 0;width:100%;transition:height .3s;}
  .cbar.zero .fill{height:3px !important;background:rgba(62,44,86,0.08);border-radius:2px;}
  .cbar.today .fill{background:var(--teal-dark);}
  .cxl{display:flex;gap:3px;margin-top:6px;direction:ltr;}
  .cxl span{flex:1;text-align:center;font-size:0.6rem;color:rgba(62,44,86,0.4);}
  .ttip{position:absolute;background:var(--plum);color:#fff;font-size:0.75rem;padding:6px 11px;border-radius:10px;pointer-events:none;white-space:nowrap;transform:translate(50%,-100%);display:none;z-index:5;line-height:1.5;box-shadow:0 6px 18px rgba(62,44,86,0.3);}
  .ttip.show{display:block;}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:60;background:var(--plum);color:#fff;font-size:0.85rem;font-weight:700;padding:11px 20px;border-radius:99px;box-shadow:0 10px 28px rgba(62,44,86,0.3);opacity:0;pointer-events:none;transition:opacity .28s ease, transform .28s cubic-bezier(.22,1,.36,1);max-width:88vw;text-align:center;display:inline-flex;align-items:center;gap:7px;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* stroke icons (same set/style as "שתי מילים ביום") */
  .ic{vertical-align:-0.15em;flex:0 0 auto;}
  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap .search{margin-bottom:0;padding-inline-start:46px;}
  .search-ic{position:absolute;inset-inline-start:17px;top:50%;transform:translateY(-50%);color:rgba(62,44,86,0.35);pointer-events:none;display:inline-flex;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="pageTitle">אוצר המילים שלי</h1>
    <div class="sub">כמה מילים ביוונית כבר למדת?</div>
    <div class="hero">
      <div class="num" id="heroNum">0</div>
      <div class="lbl">מילים למדתי</div>
      <div class="days" id="heroDays"></div>
    </div>
  </header>

  <div class="tabs">
    <button id="tabWords" class="on"></button>
    <button id="tabStats"></button>
  </div>

  <!-- ============ WORDS SCREEN ============ -->
  <section id="scrWords">
    <div class="card">
      <h2>הוספת מילה חדשה</h2>
      <div class="field">
        <label>המילה ביוונית (אותיות יווניות או לטיניות)</label>
        <input id="inEl" dir="ltr" placeholder="Kalimera / Καλημέρα" autocomplete="off" autocapitalize="off">
      </div>
      <div class="field">
        <label>הפירוש בעברית</label>
        <input id="inHe" placeholder="בוקר טוב" autocomplete="off">
      </div>
      <button class="btn btn-main" id="btnCheck"></button>
      <div class="hint">אני אבדוק את המילה מול מילון של 596 מילים נפוצות ואתקן שגיאות קטנות</div>
    </div>

    <div class="verdict" id="verdict"></div>

    <div class="search-wrap hidden" id="searchWrap">
      <span class="search-ic" id="searchIc"></span>
      <input class="search" id="search" placeholder="חיפוש ברשימה...">
    </div>
    <div id="list"></div>
  </section>

  <!-- ============ STATS SCREEN ============ -->
  <section id="scrStats" class="hidden">
    <div class="card">
      <div class="date-row">
        <label id="dateLabel">תאריך תחילת הלימודים</label>
        <input type="date" id="startDate">
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="v" id="stTotal">0</div><div class="k">מילים בסך הכל</div></div>
      <div class="tile"><div class="v" id="stDays">0</div><div class="k">ימי לימוד</div></div>
      <div class="tile"><div class="v" id="stAvg">0</div><div class="k">מילים ליום בממוצע</div></div>
      <div class="tile"><div class="v" id="stWeek">0</div><div class="k">מילים בשבוע האחרון</div></div>
    </div>

    <div class="card">
      <h2>מילים חדשות — 14 הימים האחרונים</h2>
      <div class="chart-wrap" id="chartWrap">
        <div class="chart" id="chart"></div>
        <div class="cxl" id="chartX"></div>
        <div class="ttip" id="ttip"></div>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>

/* ================= text normalization & matching ================= */
const stripGr = s => s.normalize('NFD').replace(/[\u0300-\u036f\u0342\u0345]/g,'').toLowerCase().replace(/\u03c2/g,'\u03c3').replace(/\s+/g,' ').trim();
const stripLat = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
const hasGreek = s => /[\u0370-\u03ff\u1f00-\u1fff]/.test(s);
const hasHebrew = s => /[\u0590-\u05ff]/.test(s);

function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}

/* romanize greek so latin input can be compared against dict words too */
const ROM=[['ου','ou'],['αι','e'],['ει','i'],['οι','i'],['υι','i'],['αυ','av'],['ευ','ev'],['γγ','ng'],['γκ','g'],['μπ','b'],['ντ','d'],['τσ','ts'],['τζ','tz'],['θ','th'],['χ','ch'],['ψ','ps'],['ξ','x'],['φ','f'],['β','v'],['γ','g'],['δ','d'],['ζ','z'],['κ','k'],['λ','l'],['μ','m'],['ν','n'],['π','p'],['ρ','r'],['σ','s'],['τ','t'],['α','a'],['ε','e'],['η','i'],['ι','i'],['ο','o'],['υ','i'],['ω','o'],[' ',' ']];
function romanize(g){
  let s = stripGr(g), out='';
  outer: while(s.length){
    for(const [k,v] of ROM){ if(s.startsWith(k)){ out+=v; s=s.slice(k.length); continue outer; } }
    s=s.slice(1);
  }
  return out;
}
/* loosen latin: b/mp d/nt u/ou h/ch variants collapse so kalimera==kalimera, boro==mporo */
const loose = s => s.replace(/ou/g,'u').replace(/mp/g,'b').replace(/nt/g,'d').replace(/gh/g,'g').replace(/kh|ch/g,'h').replace(/y/g,'i').replace(/w/g,'o').replace(/(.)\1+/g,'$1');

function typoBudget(len){ return len<=3 ? 0 : len<=5 ? 1 : len<=9 ? 2 : 3; }

/* find best dictionary match for the greek/latin input */
function matchGreek(input){
  const isGr = hasGreek(input);
  const qGr = stripGr(input), qLat = loose(stripLat(input));
  let best=null, bestD=Infinity;
  for(const [el,tr,he] of DICT){
    let d;
    if(isGr){ d = lev(qGr, stripGr(el)); }
    else{
      d = Math.min(lev(qLat, loose(stripLat(tr))), lev(qLat, loose(romanize(el))));
    }
    if(d<bestD){ bestD=d; best=[el,tr,he]; if(!d) break; }
  }
  if(!best) return null;
  const refLen = isGr ? stripGr(best[0]).length : loose(stripLat(best[1])).length;
  if(bestD===0) return {entry:best, kind:'exact'};
  if(bestD<=typoBudget(refLen)) return {entry:best, kind:'typo', d:bestD};
  return null;
}

/* does user's hebrew meaning match the dict gloss? */
function glossVariants(he){
  const out=[];
  he.split('/').forEach(p=>{
    const clean=p.replace(/\(.*?\)/g,'').replace(/[^\u0590-\u05ff ]/g,' ').replace(/\s+/g,' ').trim();
    if(clean) out.push(clean);
  });
  const whole=he.replace(/[^\u0590-\u05ff ]/g,' ').replace(/\s+/g,' ').trim();
  if(whole) out.push(whole);
  return out;
}
function heWords(s){ return s.replace(/[^\u0590-\u05ff ]/g,' ').split(/\s+/).filter(Boolean); }
function heMatch(userHe, gloss){
  const u = userHe.replace(/[^\u0590-\u05ff ]/g,' ').replace(/\s+/g,' ').trim();
  if(!u) return false;
  for(const v of glossVariants(gloss)){
    if(v===u) return true;
    if(lev(v,u)<=typoBudget(v.length)) return true;
    // word-level: every user word appears (fuzzily, incl. dropped ה prefix) in the variant
    const vw = heWords(v);
    const uw = heWords(u);
    if(uw.length && uw.every(w=>{
      const w2 = w.startsWith('ה')&&w.length>2 ? w.slice(1) : w;
      return vw.some(x=>{
        const x2 = x.startsWith('ה')&&x.length>2 ? x.slice(1) : x;
        return x===w||x2===w2||lev(x2,w2)<=(w2.length<=3?0:1);
      });
    })) return true;
  }
  return false;
}
/* reverse lookup: find dict entry by hebrew meaning */
function matchHebrew(userHe){
  for(const e of DICT){ if(heMatch(userHe, e[2])) return e; }
  return null;
}

/* ================= speech ================= */
let grVoice=null;
function pickVoice(){
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []) || [];
  grVoice = vs.find(v=>v.lang==='el-GR') || vs.find(v=>v.lang&&v.lang.startsWith('el')) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t, btn){
  if(!('speechSynthesis' in window)){ toast('אין תמיכה בהשמעה במכשיר זה'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang='el-GR'; if(grVoice) u.voice=grVoice; u.rate=0.85; u.pitch=1;
  if(btn){ btn.classList.add('speaking'); u.onend=u.onerror=()=>btn.classList.remove('speaking'); }
  speechSynthesis.speak(u);
}

/* ================= toast ================= */
let toastT=null;
function toast(msg){
  const t=$('toast'); t.innerHTML=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ================= add & validate flow ================= */
const verdict = $('verdict');
function showVerdict(cls, html){ verdict.className='verdict show '+cls; verdict.innerHTML=html; }
function hideVerdict(){ verdict.className='verdict'; verdict.innerHTML=''; }

function elBlock(el,tr){ return `<span class="big-el">${el}</span> <span class="tr">(${tr})</span>`; }

function isDup(el){
  const k=stripGr(el);
  return S.words.some(w=>stripGr(w.el)===k);
}

function addWord(el,tr,he,verified){
  S.words.unshift({el,tr,he,ts:Date.now(),v:!!verified});
  if(!S.startDate) S.startDate = todayKey();
  save(); render();
  $('inEl').value=''; $('inHe').value='';
  const n=$('heroNum'); n.classList.add('bump'); setTimeout(()=>n.classList.remove('bump'),250);
  toast(ic('sparkles',16)+`נוספה! זו המילה ה־${S.words.length} שלך`);
}

function check(){
  const rawEl = $('inEl').value.trim();
  const rawHe = $('inHe').value.trim();
  hideVerdict();
  if(!rawEl && !rawHe){ toast('כתוב מילה קודם 🙂'); return; }
  if(!rawEl){
    // only hebrew given — try reverse lookup and suggest the greek
    const rev = matchHebrew(rawHe);
    if(rev){
      showVerdict('warn', `לפי המילון, <b>"${rawHe}"</b> ביוונית זה ${elBlock(rev[0],rev[1])}.<div class="btn-row"><button class="btn btn-main" onclick="acceptFix('${esc(rev[0])}','${esc(rev[1])}','${esc(rev[2])}')">הוסף את המילה ✓</button><button class="btn btn-ghost" onclick="hideVerdict()">ביטול</button></div>`);
    } else toast('כתוב גם את המילה ביוונית');
    return;
  }
  if(hasHebrew(rawEl)){ toast('בשדה הזה כותבים את המילה ביוונית 🙂'); return; }

  const m = matchGreek(rawEl);

  if(m){
    const [el,tr,he] = m.entry;
    if(isDup(el)){ showVerdict('warn', `המילה ${elBlock(el,tr)} כבר נמצאת ברשימה שלך! 🎉 כבר למדת אותה.`); return; }
    const meaningOk = rawHe ? heMatch(rawHe, he) : false;

    if(m.kind==='exact' && meaningOk){
      addWord(el,tr,rawHe,true);
      showVerdict('ok', `${ic('checkCircle',18)} מעולה! ${elBlock(el,tr)} = <b>${rawHe}</b> — נכון!`);
      return;
    }
    if(!rawHe){
      showVerdict('warn', `מצאתי את ${elBlock(el,tr)} — הפירוש הוא <b>"${he}"</b>. להוסיף?<div class="btn-row"><button class="btn btn-main" onclick="acceptFix('${esc(el)}','${esc(tr)}','${esc(he)}')">כן, הוסף ✓</button><button class="btn btn-ghost" onclick="hideVerdict()">ביטול</button></div>`);
      return;
    }
    if(m.kind==='typo' && meaningOk){
      showVerdict('warn', `כמעט מדויק! כתבת <b>"${rawEl}"</b> — הצורה הנכונה היא ${elBlock(el,tr)}. הפירוש "<b>${rawHe}</b>" נכון ✓<div class="btn-row"><button class="btn btn-main" onclick="acceptFix('${esc(el)}','${esc(tr)}','${esc(rawHe)}')">הוסף עם התיקון ✓</button><button class="btn btn-ghost" onclick="hideVerdict()">ביטול</button></div>`);
      return;
    }
    // meaning mismatch
    showVerdict('bad', `רגע! ${elBlock(el,tr)} פירושו <b>"${he}"</b>, לא "<b>${rawHe}</b>".<div class="btn-row"><button class="btn btn-main" onclick="acceptFix('${esc(el)}','${esc(tr)}','${esc(he)}')">הוסף עם הפירוש הנכון</button><button class="btn btn-ghost" onclick="forceAdd('${esc(rawEl)}','${esc(rawHe)}')">אני בטוח — כמו שכתבתי</button></div>`);
    return;
  }

  // greek word not found — maybe the hebrew leads us to the right word
  const rev = rawHe ? matchHebrew(rawHe) : null;
  if(rev && !isDup(rev[0])){
    showVerdict('bad', `לא זיהיתי את "<b>${rawEl}</b>", אבל לפי המילון "<b>${rawHe}</b>" ביוונית זה ${elBlock(rev[0],rev[1])}. אולי לזה התכוונת?<div class="btn-row"><button class="btn btn-main" onclick="acceptFix('${esc(rev[0])}','${esc(rev[1])}','${esc(rawHe)}')">כן! הוסף ✓</button><button class="btn btn-ghost" onclick="forceAdd('${esc(rawEl)}','${esc(rawHe)}')">לא, כמו שכתבתי</button></div>`);
    return;
  }
  if(isDup(rawEl)){ showVerdict('warn','המילה הזאת כבר נמצאת ברשימה שלך! 🎉'); return; }
  showVerdict('warn', `לא מצאתי את "<b>${rawEl}</b>" במילון המובנה (596 מילים), אז אני לא יכול לאמת אותה.${rawHe?'':'<br>הוסף גם פירוש בעברית.'}<div class="btn-row"><button class="btn btn-main" ${rawHe?'':'disabled'} onclick="forceAdd('${esc(rawEl)}','${esc(rawHe)}')">הוסף בכל זאת</button><button class="btn btn-ghost" onclick="hideVerdict()">ביטול</button></div>`);
}

const esc = s => s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
window.acceptFix = (el,tr,he) => { hideVerdict(); if(isDup(el)){toast('כבר ברשימה 🎉');return;} addWord(el,tr,he,true); };
window.forceAdd  = (el,he)    => { hideVerdict(); if(isDup(el)){toast('כבר ברשימה 🎉');return;} addWord(el, hasGreek(el)?romanize(el):'', he, false); };
window.hideVerdict = hideVerdict;

/* ================= render list ================= */
const fmtDate = ts => new Date(ts).toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'});
let armT=null;
function renderList(){
  const q = $('search').value.trim().toLowerCase();
  const list = $('list');
  $('searchWrap').classList.toggle('hidden', S.words.length<6);
  if(!S.words.length){
    list.innerHTML = `<div class="empty"><div class="e">${ic('book',44)}</div>עדיין אין מילים ברשימה.<br>הוסף את המילה הראשונה שלמדת!</div>`;
    return;
  }
  const items = S.words.filter(w=>!q || w.el.toLowerCase().includes(q)||w.tr.toLowerCase().includes(q)||w.he.includes(q));
  list.innerHTML = items.map((w,i)=>{
    const idx = S.words.indexOf(w);
    return `<div class="word">
      <button class="icon-btn play" data-say="${w.el.replace(/"/g,'&quot;')}">${ic('speaker',20)}</button>
      <div class="info">
        <div class="el">${w.el}${w.tr?`<span class="wtr">${w.tr}</span>`:''}</div>
        <div class="he">${w.he}</div>
        <div class="meta">${fmtDate(w.ts)} · ${w.v?ic('check',12)+' אומת מול המילון':'<span class="unv">לא אומת</span>'}</div>
      </div>
      <button class="icon-btn del" data-del="${idx}">${ic('trash',18)}</button>
    </div>`;
  }).join('') || `<div class="empty">לא נמצאו מילים לחיפוש הזה</div>`;

  list.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,b));
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('arm')){
      list.querySelectorAll('.del.arm').forEach(x=>{x.classList.remove('arm');x.innerHTML=ic('trash',18);});
      b.classList.add('arm'); b.textContent='למחוק?';
      clearTimeout(armT); armT=setTimeout(()=>{b.classList.remove('arm');b.innerHTML=ic('trash',18);},2500);
    } else {
      S.words.splice(+b.dataset.del,1); save(); render(); toast('המילה נמחקה');
    }
  });
}

/* ================= stats ================= */
function daysLearning(){
  if(!S.startDate) return 0;
  const start = new Date(S.startDate+'T00:00:00');
  const diff = Math.floor((new Date() - start)/86400000);
  return Math.max(1, diff+1);
}
function renderStats(){
  const total=S.words.length, days=daysLearning();
  $('stTotal').textContent=total;
  $('stDays').textContent=S.startDate?days:'—';
  $('stAvg').textContent=S.startDate&&total? (total/days).toFixed(1).replace(/\.0$/,'') : '0';
  const weekAgo=Date.now()-7*86400000;
  $('stWeek').textContent=S.words.filter(w=>w.ts>=weekAgo).length;
  $('startDate').value=S.startDate||'';
  $('heroDays').textContent = S.startDate ? `ב־${days} ימי לימוד` : '';

  // chart: last 14 days
  const byDay={};
  S.words.forEach(w=>{const k=todayKey(w.ts);byDay[k]=(byDay[k]||0)+1;});
  const daysArr=[];
  for(let i=13;i>=0;i--){
    const d=new Date(Date.now()-i*86400000);
    daysArr.push({k:todayKey(d),d,c:byDay[todayKey(d)]||0});
  }
  const max=Math.max(1,...daysArr.map(x=>x.c));
  $('chart').innerHTML = daysArr.map((x,i)=>
    `<div class="cbar ${x.c?'':'zero'} ${i===13?'today':''}" data-i="${i}"><div class="fill" style="height:${x.c/max*100}%"></div></div>`).join('');
  $('chartX').innerHTML = daysArr.map((x,i)=>`<span>${i%2?x.d.getDate()+'.'+(x.d.getMonth()+1):''}</span>`).join('');

  const tt=$('ttip');
  $('chart').querySelectorAll('.cbar').forEach(b=>{
    const show=()=>{
      const x=daysArr[+b.dataset.i];
      tt.innerHTML=`<b>${x.d.toLocaleDateString('he-IL',{day:'numeric',month:'long'})}</b><br>${x.c===1?'מילה אחת':x.c+' מילים'}`;
      const wrap=$('chartWrap').getBoundingClientRect(), r=b.getBoundingClientRect();
      tt.style.right=(wrap.right-r.right+r.width/2)+'px'; tt.style.top=(r.top-wrap.top)+'px';
      tt.classList.add('show');
      clearTimeout(tt._t); tt._t=setTimeout(()=>tt.classList.remove('show'),2200);
    };
    b.onclick=show; b.onmouseenter=show; b.onmouseleave=()=>tt.classList.remove('show');
  });
}

function render(){
  $('heroNum').textContent=S.words.length;
  renderList(); renderStats();
}

/* ================= wire up ================= */
$('btnCheck').onclick=check;
$('inHe').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
$('inEl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('inHe').focus();}});
$('search').addEventListener('input',renderList);
$('startDate').addEventListener('change',e=>{
  const v=e.target.value;
  if(v && new Date(v)>new Date()){ toast('התאריך לא יכול להיות בעתיד'); e.target.value=S.startDate||''; return; }
  S.startDate=v||null; save(); renderStats(); toast('תאריך ההתחלה נשמר');
});
$('tabWords').onclick=()=>{$('tabWords').classList.add('on');$('tabStats').classList.remove('on');$('scrWords').classList.remove('hidden');$('scrStats').classList.add('hidden');};
$('tabStats').onclick=()=>{$('tabStats').classList.add('on');$('tabWords').classList.remove('on');$('scrStats').classList.remove('hidden');$('scrWords').classList.add('hidden');renderStats();};

/* static UI icons */
$('pageTitle').innerHTML = ic('book',24)+'<span>אוצר המילים שלי</span>';
$('tabWords').innerHTML = ic('pencil',18)+'<span>מילים</span>';
$('tabStats').innerHTML = ic('chart',18)+'<span>סטטיסטיקה</span>';
$('btnCheck').innerHTML = ic('checkCircle',19)+'<span>בדוק והוסף</span>';
$('searchIc').innerHTML = ic('search',17);
$('dateLabel').innerHTML = ic('calendar',17)+'<span>תאריך תחילת הלימודים</span>';

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
