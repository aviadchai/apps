<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Δύο λέξεις · שתי מילים ביום</title>
<link rel="manifest" href="greek-daily-manifest.json">
<link rel="icon" href="icon-greek-daily-v3.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-greek-daily-180-v3.png">
<meta name="theme-color" content="#0FB9A7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="שתי מילים">
<style>
  :root{
    --teal:#0FB9A7; --teal-dark:#0A8577;
    --coral:#FF6B6B; --sun:#FFC93C; --plum:#3E2C56;
    --bg1:#EAFBF5; --bg2:#FDF3E4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    color:var(--plum); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:7vh 20px 50px; overflow-x:hidden;
  }
  .menu-btn{
    height:38px; padding:0 16px; margin-bottom:22px;
    border-radius:99px; background:rgba(255,255,255,0.85); border:none;
    color:var(--teal-dark); font-size:0.82rem; font-weight:700;
    display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; box-shadow:0 2px 10px rgba(62,44,86,0.12);
  }
  .stat{ font-size:0.85rem; color:rgba(62,44,86,0.5); margin-bottom:10px; font-weight:600; }
  .stat b{ color:var(--teal-dark); font-size:1rem; }
  .progress-track{ width:100%; max-width:320px; height:9px; border-radius:99px; background:rgba(62,44,86,0.08); overflow:hidden; margin-bottom:30px; }
  .progress-fill{ height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--sun)); border-radius:99px; transition:width .5s ease; }
  .ic{ vertical-align:middle; flex:0 0 auto; }
  .action, .study-speak, .card-speak, .li-speak, .badge, .btn-learned-big, .btn-extra{ display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  /* Speaker button stays lit while the word is being spoken */
  .btn-speak.speaking, .study-speak.speaking, .card-speak.speaking, .li-speak.speaking{ background:var(--teal); color:#fff; }
  .speaking{ animation:speakpulse 1s ease-in-out infinite; }
  @keyframes speakpulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.72; } }

  .coin-wrap{ position:relative; width:220px; height:220px; margin-bottom:28px; }
  .coin{
    width:220px; height:220px; border-radius:50%; border:none;
    background:radial-gradient(circle at 32% 28%,#2FE0C9,var(--teal) 55%,var(--teal-dark) 100%);
    box-shadow:0 12px 32px rgba(15,185,167,0.35), inset 0 -8px 18px rgba(0,0,0,0.12), inset 0 6px 14px rgba(255,255,255,0.25);
    color:#fff; font-size:1.15rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:20px; line-height:1.45; transition:transform .15s ease;
  }
  .coin:active{ transform:scale(0.96); }
  .coin.pulse{ animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 12px 32px rgba(15,185,167,0.35), inset 0 -8px 18px rgba(0,0,0,0.12), inset 0 6px 14px rgba(255,255,255,0.25); }
    50%{ box-shadow:0 16px 44px rgba(15,185,167,0.55), inset 0 -8px 18px rgba(0,0,0,0.12), inset 0 6px 14px rgba(255,255,255,0.25); }
  }
  .coin.done{
    background:radial-gradient(circle at 32% 28%,#2FE0C9,var(--teal) 55%,var(--teal-dark) 100%);
    box-shadow:0 12px 32px rgba(15,185,167,0.35), inset 0 -8px 18px rgba(0,0,0,0.12), inset 0 6px 14px rgba(255,255,255,0.25);
    cursor:default; transition:box-shadow .5s ease;
  }
  .coin.done:active{ transform:none;
    box-shadow:0 0 0 10px rgba(15,185,167,0.16), 0 16px 40px rgba(15,185,167,0.5), inset 0 -8px 18px rgba(0,0,0,0.12), inset 0 6px 14px rgba(255,255,255,0.25);
  }
  /* countdown ring around the coin (shown while waiting for tomorrow) */
  .ring{ position:absolute; top:-14px; left:-14px; width:248px; height:248px; transform:rotate(-90deg); pointer-events:none; opacity:0; transition:opacity .5s ease; }
  .ring.on{ opacity:1; }
  .ring circle{ fill:none; stroke-width:6; stroke-linecap:round; }
  .ring-bg{ stroke:rgba(15,185,167,0.14); }
  .ring-fg{ stroke:url(#ringGrad); transition:stroke-dashoffset 1s linear; }
  .confetti{ position:absolute; inset:0; pointer-events:none; }
  .confetti span{ position:absolute; top:50%; left:50%; width:9px; height:9px; border-radius:2px; }
  @keyframes burst{ to{ transform:translate(var(--dx),var(--dy)) scale(.4); opacity:0; } }

  .cards{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:14px; }
  .card{
    background:#fff; border-radius:22px; padding:22px 20px; text-align:center;
    box-shadow:0 10px 30px rgba(62,44,86,0.10);
    opacity:0; transform:translateY(14px); animation:rise .35s ease forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  .card.marked{ background:rgba(255,255,255,0.55); box-shadow:none; }
  .card .greek{ font-size:1.8rem; font-weight:800; margin-bottom:2px; }
  .card .translit{ font-size:0.78rem; color:rgba(62,44,86,0.45); direction:ltr; margin-bottom:8px; }
  .card .hebrew{ font-size:1.02rem; color:var(--teal-dark); font-weight:600; margin-bottom:16px; }
  .row{ display:flex; gap:9px; }
  button.action{ border:none; border-radius:14px; padding:11px 8px; font-size:0.8rem; font-weight:700; cursor:pointer; flex:1; gap:5px; }
  .btn-speak{ background:rgba(15,185,167,0.12); color:var(--teal-dark); flex:0 0 44px; }
  .btn-refresh{ background:rgba(255,107,107,0.12); color:var(--coral); flex:0 0 44px; }
  .btn-learned{ background:rgba(15,185,167,0.12); color:var(--teal-dark); }
  .badge{ font-size:0.85rem; font-weight:700; color:var(--teal-dark); }

  .done-msg{ text-align:center; font-size:0.9rem; color:rgba(62,44,86,0.55); margin-top:6px; animation:fadeUp .5s ease both; }
  /* waiting screen: countdown + fading ambient words */
  .wait-count{ text-align:center; margin-top:2px; animation:fadeUp .5s ease both; }
  .wait-count .cd{ font-size:1.4rem; font-weight:800; color:var(--teal-dark); direction:ltr; letter-spacing:1px; display:inline-flex; align-items:center; gap:7px; }
  .wait-count .cd-cap{ font-size:0.78rem; color:rgba(62,44,86,0.5); margin-top:4px; }
  .ambient{ min-height:104px; margin-top:20px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .ambient-inner{ opacity:0; transform:scale(0.9); border:1.5px solid rgba(15,185,167,0.18); border-radius:18px; padding:12px 26px;
    transition:opacity 1.2s ease, transform 4.4s linear; }
  .ambient-inner.show{ opacity:0.5; transform:scale(1.06); }
  .ambient .g{ font-size:1.35rem; font-weight:800; color:var(--teal-dark); }
  .ambient .t{ font-size:0.72rem; color:rgba(62,44,86,0.4); direction:ltr; margin-top:1px; }
  .ambient .h{ font-size:0.92rem; color:rgba(62,44,86,0.55); font-weight:600; margin-top:3px; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:translateY(0); } }
  .toast{ position:fixed; left:50%; bottom:34px; transform:translate(-50%,16px); z-index:60;
    background:var(--plum); color:#fff; font-size:0.85rem; font-weight:700; padding:11px 20px; border-radius:99px;
    box-shadow:0 10px 28px rgba(62,44,86,0.3); display:inline-flex; align-items:center; gap:7px;
    opacity:0; pointer-events:none; transition:opacity .28s ease, transform .28s cubic-bezier(.22,1,.36,1); }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  @keyframes popIn{ 0%{ opacity:0; transform:scale(.94); } 100%{ opacity:1; transform:scale(1); } }
  /* Subtle micro-interactions (gentle easing, no bounce) */
  button{ transition:transform .16s ease, box-shadow .3s ease, opacity .2s ease; }
  .action:active, .study-speak:active, .card-speak:active, .li-speak:active,
  .sw-actions button:active, .menu-btn:active, .panel-ic:active, .btn-learned-big:active,
  .btn-extra:active, .quiz-opt:active, .quiz-btn:active{ transform:scale(.97); opacity:.9; }
  .coin.done #coinLabel{ animation:popIn .4s ease both; }
  .study-word{ animation:fadeUp .42s ease both; }
  .study-screen{ animation:fadeUp .4s ease both; }
  .prog-bar-fill, .progress-fill{ transition:width .8s cubic-bezier(.22,1,.36,1); }
  .btn-extra{
    display:block; margin:16px auto 0; border:none; border-radius:16px;
    padding:13px 24px; font-size:0.92rem; font-weight:700; cursor:pointer;
    color:#fff; background:linear-gradient(135deg,var(--coral),#FF9364);
    box-shadow:0 8px 22px rgba(255,107,107,0.35);
  }
  .btn-extra:active{ transform:scale(0.96); }
  .btn-study{ background:var(--teal); color:#fff; }

  /* Study mode takes over the screen: hide the coin, counter and menu. */
  body.study-mode{ justify-content:center; padding-top:5vh; }
  body.study-mode .coin-wrap, body.study-mode .stat, body.study-mode .progress-track{ display:none; }

  .study-screen{ width:100%; max-width:400px; display:flex; flex-direction:column; gap:16px; }
  .study-head{ text-align:center; margin-bottom:2px; }
  .study-title{ font-size:1.5rem; font-weight:800; color:var(--teal-dark); display:flex; align-items:center; justify-content:center; gap:9px; }
  .study-sub{ font-size:0.85rem; color:rgba(62,44,86,0.5); margin-top:3px; }
  .study-timer{ background:#fff; border-radius:20px; padding:16px 18px; text-align:center; box-shadow:0 10px 30px rgba(62,44,86,0.08); }
  .study-timer-label{ font-size:0.8rem; color:rgba(62,44,86,0.5); margin-bottom:4px; }
  .study-timer-val{ font-size:1.9rem; font-weight:800; color:var(--teal-dark); direction:ltr; letter-spacing:1px; }
  .study-track{ height:6px; border-radius:99px; background:rgba(15,185,167,0.12); margin-top:12px; overflow:hidden; }
  .study-track-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--teal-dark)); border-radius:99px; transition:width 1s linear; }
  .study-timer.zero .study-timer-val{ color:var(--coral); }
  .study-timer.zero .study-track-fill{ background:var(--coral); }
  .study-word{ background:#fff; border-radius:22px; padding:22px 20px; text-align:center; box-shadow:0 10px 30px rgba(62,44,86,0.10); }
  .study-word .greek{ font-size:2rem; font-weight:800; }
  .study-word .translit{ font-size:0.8rem; color:rgba(62,44,86,0.45); direction:ltr; margin:2px 0 7px; }
  .study-word .hebrew{ font-size:1.1rem; color:var(--teal-dark); font-weight:600; margin-bottom:14px; }
  .study-speak{ background:rgba(15,185,167,0.12); color:var(--teal-dark); border:none; border-radius:12px; padding:9px 22px; font-size:0.9rem; font-weight:700; cursor:pointer; }
  .btn-learned-big{ border:none; border-radius:16px; padding:16px; font-size:1.05rem; font-weight:800; color:#fff; background:var(--teal); box-shadow:0 8px 22px rgba(15,185,167,0.35); cursor:pointer; margin-top:4px; }
  .btn-learned-big:active{ transform:scale(0.97); }
  .card.studying{ background:rgba(255,255,255,0.55); box-shadow:none; }
  .sw-actions{ display:flex; gap:9px; margin-top:14px; }
  .sw-actions button{ flex:1; border:none; border-radius:14px; padding:12px 10px; font-size:0.9rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .sw-actions button:active{ transform:scale(0.97); }
  .sw-miss{ background:rgba(255,107,107,0.12); color:var(--coral); }
  .sw-got{ background:var(--teal); color:#fff; }

  .panel{ position:fixed; inset:0; background:rgba(62,44,86,0.35); display:flex; align-items:flex-end; justify-content:center; z-index:30; opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease; }
  .panel.show{ opacity:1; visibility:visible; }
  .panel .panel-inner{ transform:translateY(38px); transition:transform .4s cubic-bezier(.22,1,.36,1); }
  .panel.show .panel-inner{ transform:translateY(0); }
  .panel-inner{ background:#fff; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:24px 24px 0 0; padding:20px 20px 30px; }
  .panel-inner h2{ font-size:1.05rem; margin:0 0 4px; }
  .panel-sub{ font-size:0.82rem; color:rgba(62,44,86,0.5); margin-bottom:14px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .panel-head h2{ margin:0; }
  .panel-ic{ width:36px; height:36px; border-radius:50%; background:rgba(62,44,86,0.06); border:none; color:var(--plum); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
  .settings-box{ max-height:0; opacity:0; overflow:hidden; margin-bottom:0; transition:max-height .34s cubic-bezier(.22,1,.36,1), opacity .26s ease, margin-bottom .3s ease; }
  .settings-box.open{ max-height:120px; opacity:1; margin-bottom:12px; }
  .panel-ic svg{ transition:transform .34s cubic-bezier(.22,1,.36,1); }
  #panelSettings.on svg{ transform:rotate(65deg); }
  .pace-hero{ text-align:center; margin:8px 0 16px; }
  .pace-big{ font-size:2.7rem; font-weight:800; color:var(--teal-dark); line-height:1; }
  .pace-cap{ font-size:0.92rem; font-weight:600; color:var(--plum); margin-top:5px; }
  .pace-sub{ font-size:0.76rem; color:rgba(62,44,86,0.5); margin-top:7px; }
  .startdate-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(15,185,167,0.06); border-radius:14px; padding:10px 14px; margin-bottom:14px; font-size:0.85rem; font-weight:600; color:rgba(62,44,86,0.7); }
  .startdate-row input{ border:1px solid rgba(62,44,86,0.15); border-radius:10px; padding:6px 10px; font-size:0.85rem; color:var(--teal-dark); background:#fff; font-family:inherit; }
  .list-hint{ font-size:0.72rem; color:rgba(62,44,86,0.4); text-align:center; margin:2px 0 10px; }
  .learned-item{ position:relative; overflow:hidden; border-bottom:1px solid rgba(62,44,86,0.08); }
  .li-front{ position:relative; z-index:1; display:flex; align-items:center; gap:10px; padding:9px 4px; background:#fff; font-size:0.9rem; transition:transform .22s cubic-bezier(.22,1,.36,1); }
  .learned-item .g{ color:var(--teal-dark); font-weight:700; }
  .li-meta{ margin-inline-start:auto; display:flex; flex-direction:column; align-items:flex-start; }
  .learned-item .h{ color:rgba(62,44,86,0.6); text-align:start; }
  .learned-item .ld{ font-size:0.66rem; color:rgba(62,44,86,0.38); direction:ltr; }
  .li-del{ position:absolute; top:0; bottom:0; width:88px; border:none; background:var(--coral); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .li-del-l{ left:0; } .li-del-r{ right:0; }
  .li-speak{ flex:0 0 auto; background:rgba(15,185,167,0.12); color:var(--teal-dark); border:none; border-radius:10px; padding:6px 12px; font-size:0.95rem; cursor:pointer; }
  .card-speak{ margin-top:10px; background:rgba(15,185,167,0.12); color:var(--teal-dark); border:none; border-radius:12px; padding:8px 20px; font-size:0.85rem; font-weight:700; cursor:pointer; }
  .empty-note{ color:rgba(62,44,86,0.45); font-size:0.85rem; }
  .prog-empty{ font-size:0.82rem; color:rgba(62,44,86,0.45); margin-bottom:14px; text-align:center; }
  #progChart{ margin-bottom:22px; }
  .prog-bar-label{ text-align:center; font-size:0.9rem; color:var(--plum); font-weight:600; margin-bottom:10px; }
  .prog-bar-label b{ color:var(--teal-dark); font-size:1.1rem; }
  .prog-bar-track{ position:relative; height:14px; border-radius:99px; background:rgba(62,44,86,0.08); overflow:hidden; }
  .prog-bar-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--sun)); border-radius:99px; transition:width .6s ease; }
  .prog-tick{ position:absolute; top:0; bottom:0; width:2px; background:rgba(255,255,255,0.65); }
  .prog-tick.hit{ background:rgba(255,255,255,0.9); }
  .stage-now{ text-align:center; margin-top:14px; font-size:1rem; font-weight:800; color:var(--teal-dark); }
  .stage-next{ text-align:center; margin-top:3px; font-size:0.78rem; color:rgba(62,44,86,0.5); }

  .quiz-btn{ width:100%; margin:2px 0 6px; border:none; border-radius:16px; padding:13px; font-size:0.95rem; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--teal),var(--teal-dark)); box-shadow:0 8px 22px rgba(15,185,167,.3); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .quiz-btn:disabled{ background:rgba(62,44,86,0.08); color:rgba(62,44,86,0.4); box-shadow:none; cursor:default; }
  .quiz{ position:fixed; inset:0; z-index:40; background:linear-gradient(160deg,var(--bg1),var(--bg2)); display:flex; flex-direction:column; align-items:center; padding:6vh 20px 30px; overflow-y:auto; opacity:0; visibility:hidden; transform:scale(1.015); transition:opacity .3s ease, visibility .3s ease, transform .3s ease; }
  .quiz.show{ opacity:1; visibility:visible; transform:scale(1); }
  .quiz-top{ width:100%; max-width:400px; display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .quiz-prog{ font-size:0.85rem; font-weight:700; color:var(--plum); }
  .quiz-pts{ font-size:0.8rem; font-weight:700; color:var(--teal-dark); }
  .quiz .quiz-close{ width:36px; height:36px; border-radius:50%; background:rgba(62,44,86,0.06); border:none; color:var(--plum); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .quiz-card{ width:100%; max-width:400px; background:#fff; border-radius:24px; padding:30px 20px; text-align:center; box-shadow:0 12px 34px rgba(62,44,86,.1); margin-bottom:18px; animation:popIn .35s ease both; }
  .quiz-greek{ font-size:2.4rem; font-weight:800; color:var(--plum); }
  .quiz-translit{ font-size:0.85rem; color:rgba(62,44,86,.45); direction:ltr; margin:4px 0 14px; }
  .quiz-speak{ background:rgba(15,185,167,0.12); color:var(--teal-dark); border:none; border-radius:12px; padding:9px 22px; font-size:0.9rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .quiz-opts{ width:100%; max-width:400px; display:flex; flex-direction:column; gap:11px; }
  .quiz-opt{ border:none; border-radius:16px; padding:15px; font-size:1rem; font-weight:600; color:var(--plum); background:#fff; box-shadow:0 6px 18px rgba(62,44,86,.08); cursor:pointer; transition:transform .12s ease, background .2s ease; }
  .quiz-opt:active{ transform:scale(.98); }
  .quiz-opt.correct{ background:var(--teal); color:#fff; box-shadow:0 8px 20px rgba(15,185,167,.35); }
  .quiz-opt.wrong{ background:rgba(255,107,107,.14); color:var(--coral); }
  .quiz-end{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .quiz-score{ font-size:3.2rem; font-weight:800; color:var(--teal-dark); }
  .quiz-score-cap{ font-size:1.05rem; color:var(--plum); font-weight:600; margin-bottom:10px; }
  .quiz-again{ border:none; border-radius:14px; padding:13px 44px; font-weight:800; color:#fff; background:var(--teal); box-shadow:0 8px 22px rgba(15,185,167,.3); cursor:pointer; }
  .quiz-end .quiz-close{ width:auto; height:auto; border-radius:14px; padding:10px 26px; background:rgba(62,44,86,.06); font-weight:600; font-size:0.9rem; }
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="המילים שאני יודע"></button>
<div class="stat" id="statText"></div>
<div class="progress-track"><div class="progress-fill" id="progFill"></div></div>

<div class="coin-wrap">
  <svg class="ring" id="ring" viewBox="0 0 248 248">
    <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FE0C9"/><stop offset="1" stop-color="#0A8577"/>
    </linearGradient></defs>
    <circle class="ring-bg" cx="124" cy="124" r="118"/>
    <circle class="ring-fg" id="ringFg" cx="124" cy="124" r="118"/>
  </svg>
  <div class="confetti" id="confetti"></div>
  <button class="coin pulse" id="coinBtn"><span id="coinLabel">לחץ<br>ל־2 המילים של היום</span></button>
</div>

<div class="cards" id="cards"></div>

<div class="panel" id="panel">
  <div class="panel-inner">
    <div class="panel-head">
      <button class="panel-ic" id="panelSettings" aria-label="הגדרות"></button>
      <h2>מילים שלמדתי</h2>
      <button class="panel-ic" id="panelClose" aria-label="סגור"></button>

const KEY = "greekDaily_v3";
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };

function load(){
  try{
    const p = JSON.parse(localStorage.getItem(KEY));
    if(!p || !Array.isArray(p.known)) throw 0;
    if(!p.day) p.day = { date:"", slots:[], opened:false };
    if(!Array.isArray(p.log)) p.log = [];
    if(!Array.isArray(p.review)) p.review = [];   // missed words waiting to resurface
    const logged = new Set(p.log.map(e=>e.w));   // backfill dates for pre-existing known words
    p.known.forEach(g=>{ if(!logged.has(g)) p.log.push({ w:g, t:Date.now() }); });
    return p;
  }catch(e){ return { known: [], log: [], review: [], day: { date:"", slots:[], opened:false } }; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

let state = load();
if(state.day.date !== todayKey()){
  state.day = { date: todayKey(), slots: [], opened: false };
  save();
}

// Study phase: after tapping "ללמוד" a word moves to a study screen with a countdown.
const STUDY_SECONDS = 24 * 60 * 60;   // 24 hours from the moment "ללמוד" is tapped
let timerId = null;

const studyingSlots = () => state.day.slots.filter(s => s.studying && !s.done);
// The study screen opens only once every remaining word has been sent to study.
function inStudy(){
  const rest = state.day.slots.filter(s => !s.done);
  return state.day.opened && rest.length > 0 && rest.every(s => s.studying);
}
function studyRemaining(){
  if(!state.day.studyStart) return STUDY_SECONDS;
  return Math.max(0, STUDY_SECONDS - Math.floor((Date.now() - state.day.studyStart)/1000));
}
function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60, p=x=>String(x).padStart(2,'0');
  return h>0 ? h+':'+p(m)+':'+p(ss) : m+':'+p(ss);
}

const dayStr = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dayLabel = ts => { const d=new Date(ts); return d.getDate()+'.'+(d.getMonth()+1); };

function startDayTs(){
  if(state.startDate){ const a=state.startDate.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]).getTime(); }
  if(state.log.length){ const d=new Date(Math.min(...state.log.map(e=>e.t))); d.setHours(0,0,0,0); return d.getTime(); }
  const n=new Date(); n.setHours(0,0,0,0); return n.getTime();
}

// Prefer a real, non-robotic Greek voice when the device offers one.
function bestGreekVoice(){
  try{
    const vs=speechSynthesis.getVoices()||[];
    const el=vs.filter(v=>/^el(\b|-|_)/i.test(v.lang));
    if(!el.length) return null;
    return el.find(v=>/(enhanced|premium|natural|neural|siri|google|microsoft)/i.test(v.name)) || el.find(v=>v.default) || el[0];
  }catch(e){ return null; }
}
let speakingBtn=null;
function speak(t, btn){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if(speakingBtn){ speakingBtn.classList.remove('speaking'); speakingBtn=null; }
  const u = new SpeechSynthesisUtterance(t);
  u.lang='el-GR'; u.rate=0.85;
  try{ const v=bestGreekVoice(); if(v) u.voice=v; }catch(e){}
  if(btn){
    speakingBtn=btn; btn.classList.add('speaking');
    const clear=()=>{ btn.classList.remove('speaking'); if(speakingBtn===btn) speakingBtn=null; };
    u.onend=clear; u.onerror=clear;
  }
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }

// Pick the next word: a due "missed" word first, otherwise a fresh one not yet seen.
// "skip" holds words the user asked to swap out today, so they don't come straight back.
function pickOne(onScreen){
  const now=Date.now();
  const skip = state.day.skipped || [];
  const due=state.review.find(r=> r.due<=now && !onScreen.includes(r.w) && !skip.includes(r.w));
  if(due) return due.w;
  const inReview=new Set(state.review.map(r=>r.w));
  const w=WORDS.find(x=> !state.known.includes(x[0]) && !inReview.has(x[0]) && !onScreen.includes(x[0]) && !skip.includes(x[0]));
  return w ? w[0] : null;
}
function nextWord(){ return pickOne(state.day.slots.map(s => s.word)); }

function markKnown(g){
  if(!state.known.includes(g)){
    state.known.push(g);
    state.log.push({ w:g, t:Date.now() });   // record the date this word was learned
  }
  state.review = state.review.filter(r=>r.w!==g);   // learned for good — drop from review
}
function scheduleReview(g){   // missed — bring it back in the future
  const due=Date.now()+REVIEW_DAYS*24*60*60*1000;
  const ex=state.review.find(r=>r.w===g);
  if(ex) ex.due=due; else state.review.push({ w:g, due });
}

function pickSlots(){
  const slots=[];
  for(let i=0;i<2;i++){
    const w=pickOne(slots.map(s=>s.word));
    if(w) slots.push({ word:w, done:false, studying:false });
  }
  return slots;
}

// Bonus round: after finishing the daily 2, deal 2 more on demand
function extraRound(){
  const slots=pickSlots();
  if(!slots.length) return;
  state.day.slots=slots;
  state.day.studyStart=0;
  save(); render();
}

function dayFinished(){
  return state.day.opened && state.day.slots.length > 0 && state.day.slots.every(s => s.done);
}

function confetti(){
  const el = document.getElementById('confetti');
  const colors = ['#0FB9A7','#FF6B6B','#FFC93C','#3E2C56'];
  for(let i=0;i<18;i++){
    const s=document.createElement('span');
    const a=Math.random()*Math.PI*2, d=70+Math.random()*70;
    s.style.background=colors[i%colors.length];
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    s.style.animation='burst .75s ease-out forwards';
    s.style.animationDelay=(Math.random()*0.06)+'s';
    el.appendChild(s);
    setTimeout(()=>s.remove(),850);
  }
}

let _toastH=null;
function toast(html){
  const t=document.getElementById('toast');
  if(!t) return;
  t.innerHTML=html;
  t.classList.add('show');
  clearTimeout(_toastH);
  _toastH=setTimeout(()=>t.classList.remove('show'), 1900);
}

function renderStat(){
  document.getElementById('statText').innerHTML =
    "<b>"+state.known.length+"</b> / "+WORDS.length+" מילים שאני יודע";
  const f=document.getElementById('progFill');
  if(f){
    const pct = state.known.length/WORDS.length*100;
    f.style.width = state.known.length ? Math.max(pct,2).toFixed(2)+'%' : '0%';  // keep a visible sliver
  }
}

let waitTimers=[];
function clearWait(){ waitTimers.forEach(clearInterval); waitTimers=[]; document.getElementById('ring').classList.remove('on'); }
const RING_C = 2*Math.PI*118;
function msToMidnight(){ const n=new Date(); const m=new Date(n); m.setHours(24,0,0,0); return m-n; }
// The waiting screen: a depleting ring + live countdown to tomorrow's words, and gently fading words.
function startWait(cds, ambient){
  const ring=document.getElementById('ring'), fg=document.getElementById('ringFg');
  fg.style.strokeDasharray=RING_C;
  const tick=()=>{
    if(todayKey()!==state.day.date){ state.day={date:todayKey(),slots:[],opened:false}; save(); render(); return; }
    const ms=msToMidnight(), frac=Math.max(0,Math.min(1,ms/86400000));
    fg.style.strokeDashoffset=(RING_C*(1-frac)).toFixed(1);
    const s=Math.floor(ms/1000), p=x=>String(x).padStart(2,'0');
    cds.innerHTML=ic('clock',18)+p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60);
  };
  requestAnimationFrame(()=>ring.classList.add('on'));
  tick(); waitTimers.push(setInterval(tick,1000));
  // fading ambient words
  const inner=ambient.querySelector('.ambient-inner');
  const swap=()=>{
    const e=WORDS[Math.floor(Math.random()*WORDS.length)];
    inner.innerHTML='<div class="g">'+e[0]+'</div><div class="t">'+e[1]+'</div><div class="h">'+e[2]+'</div>';
    inner.classList.add('show');
    waitTimers.push(setTimeout(()=>inner.classList.remove('show'),3200));
  };
  swap(); waitTimers.push(setInterval(swap,4600));
}

function render(){
  const coin=document.getElementById('coinBtn');
  const label=document.getElementById('coinLabel');
  const cards=document.getElementById('cards');
  if(timerId){ clearInterval(timerId); timerId=null; }
  clearWait();
  cards.innerHTML='';
  renderStat();

  if(dayFinished()){
    document.body.classList.remove('study-mode');
    coin.classList.remove('pulse'); coin.classList.add('done');
    label.innerHTML=ic('check',30)+'<br>סיימת להיום';
    const m=document.createElement('div');
    m.className='done-msg'; m.textContent='יפה. חזור מחר ל־2 מילים חדשות';
    cards.appendChild(m);
    const wc=document.createElement('div');
    wc.className='wait-count';
    wc.innerHTML='<div class="cd"></div><div class="cd-cap">עד המילים הבאות</div>';
    cards.appendChild(wc);
    const amb=document.createElement('div');
    amb.className='ambient'; amb.innerHTML='<div class="ambient-inner"></div>';
    cards.appendChild(amb);
    const x=document.createElement('button');
    x.className='btn-extra'; x.innerHTML=ic('plus',18)+'אקסטרה 2 מילים';
    x.onclick=extraRound;
    cards.appendChild(x);
    startWait(wc.querySelector('.cd'), amb);
    return;
  }

  coin.classList.add('pulse'); coin.classList.remove('done');

  if(!state.day.opened){
    document.body.classList.remove('study-mode');
    label.innerHTML='לחץ ל־2 המילים<br>של היום<br>'+ic('sparkles',24);
    return;
  }

  // Study screen: a full, calm view — no coin, just the words and the timer.
  if(inStudy()){
    document.body.classList.add('study-mode');
    renderStudy(cards);
    return;
  }

  document.body.classList.remove('study-mode');
  label.innerHTML='2 מילים<br>של היום';

  state.day.slots.forEach((slot, i) => {
    const e = entryOf(slot.word);
    if(!e) return;
    const card=document.createElement('div');
    if(slot.done){
      card.className='card marked';
      card.innerHTML='<div class="greek">'+e[0]+'</div><div class="translit">'+e[1]+'</div>'+
        '<div class="hebrew">'+e[2]+'</div><button class="card-speak">'+ic('speaker',18)+'השמעה</button>'+
        '<div class="badge">'+ic('checkCircle',16)+'ברשימה שלי</div>';
      card.querySelector('.card-speak').onclick=(ev)=>speak(e[0], ev.currentTarget);
    } else if(slot.studying){
      card.className='card studying';
      card.innerHTML='<div class="greek">'+e[0]+'</div><div class="translit">'+e[1]+'</div>'+
        '<div class="hebrew">'+e[2]+'</div><button class="card-speak">'+ic('speaker',18)+'השמעה</button>'+
        '<div class="badge">'+ic('book',16)+'במסך הלימוד</div>';
      card.querySelector('.card-speak').onclick=(ev)=>speak(e[0], ev.currentTarget);
    } else {
      card.className='card';
      card.innerHTML='<div class="greek">'+e[0]+'</div><div class="translit">'+e[1]+'</div>'+
        '<div class="hebrew">'+e[2]+'</div>'+
        '<div class="row">'+
          '<button class="action btn-speak" data-a="speak" aria-label="האזנה">'+ic('speaker',20)+'</button>'+
          '<button class="action btn-refresh" data-a="refresh" aria-label="מילה אחרת">'+ic('refresh',20)+'</button>'+
          '<button class="action btn-study" data-a="study">'+ic('book',16)+'ללמוד</button>'+
          '<button class="action btn-learned" data-a="learn">'+ic('check',16)+'למדתי</button>'+
        '</div>';
      card.querySelector('[data-a=speak]').onclick = (ev) => speak(e[0], ev.currentTarget);
      card.querySelector('[data-a=refresh]').onclick = () => {   // skip this word, show a different one
        if(!state.day.skipped) state.day.skipped = [];
        state.day.skipped.push(slot.word);
        const nw = nextWord();
        if(nw){ state.day.slots[i] = { word: nw, done:false, studying:false }; }
        else  { state.day.slots[i].done = true; }
        save(); render();
      };
      card.querySelector('[data-a=study]').onclick = () => {
        state.day.slots[i].studying = true;         // queue for study; screen opens once both are queued
        if(!state.day.studyStart) state.day.studyStart = Date.now();
        save(); render();
      };
      card.querySelector('[data-a=learn]').onclick = () => {   // save to "learned" and bring a different word
        markKnown(slot.word);
        const nw = nextWord();
        if(nw){ state.day.slots[i] = { word: nw, done:false, studying:false }; }
        else  { state.day.slots[i].done = true; }
        save(); render();
        toast(ic('checkCircle',16)+'נוסף למילים שלמדתי');
      };
    }
    cards.appendChild(card);
  });
}

// Resolve one studied word: success -> known; miss -> comes back in a few days.
function resolveWord(slot, success){
  if(success) markKnown(slot.word); else scheduleReview(slot.word);
  slot.done=true; slot.learned=!!success;
  save();
  const finished=dayFinished();
  render();
  if(finished && state.day.slots.some(s=>s.learned)) confetti();   // celebrate only if something stuck
}

// Study screen: a calm full view — the words, a countdown, and a per-word success/miss choice.
function renderStudy(cards){
  const wrap=document.createElement('div');
  wrap.className='study-screen';

  const head=document.createElement('div');
  head.className='study-head';
  head.innerHTML='<div class="study-title">'+ic('cap',26)+'<span>זמן ללמוד</span></div><div class="study-sub">כשאתם מוכנים — סמנו לכל מילה אם זכרתם</div>';
  wrap.appendChild(head);

  const timer=document.createElement('div');
  timer.className='study-timer';
  wrap.appendChild(timer);

  studyingSlots().forEach(slot=>{
    const e=entryOf(slot.word);
    if(!e) return;
    const w=document.createElement('div');
    w.className='study-word';
    w.innerHTML='<div class="greek">'+e[0]+'</div><div class="translit">'+e[1]+'</div>'+
      '<div class="hebrew">'+e[2]+'</div><button class="study-speak">'+ic('speaker',18)+'השמעה</button>'+
      '<div class="sw-actions">'+
        '<button class="sw-miss">'+ic('x',18)+'לא הצלחתי</button>'+
        '<button class="sw-got">'+ic('check',18)+'למדתי</button>'+
      '</div>';
    w.querySelector('.study-speak').onclick=(ev)=>speak(e[0], ev.currentTarget);
    w.querySelector('.sw-got').onclick=()=>resolveWord(slot,true);
    w.querySelector('.sw-miss').onclick=()=>resolveWord(slot,false);
    wrap.appendChild(w);
  });

  cards.appendChild(wrap);

  const upd=()=>{
    const r=studyRemaining();
    const frac=Math.max(0, Math.min(1, r/STUDY_SECONDS));
    timer.innerHTML='<div class="study-timer-label">'+ic('clock',15)+'נשאר זמן ללמוד</div>'+
      '<div class="study-timer-val">'+fmtTime(r)+'</div>'+
      '<div class="study-track"><div class="study-track-fill" style="width:'+(frac*100).toFixed(1)+'%"></div></div>';
    timer.classList.toggle('zero', r<=0);
  };
  upd();
  timerId=setInterval(upd,1000);
}

document.getElementById('coinBtn').onclick = () => {
  if(state.day.opened || dayFinished()) return;
  state.day.slots=pickSlots();
  state.day.opened=true;
  state.day.studyStart=0;
  save(); render();
};

// Simple headline (average words/day) + a filling bar of overall progress.
function renderProgress(){
  const hero=document.getElementById('progHero');
  const chartBox=document.getElementById('progChart');
  if(!hero || !chartBox) return;
  const known=state.known.length, all=WORDS.length;
  const pct=known/all*100, w=known?Math.max(pct,2).toFixed(2):0;
  // Milestones — words are ordered by usefulness, so each threshold is a real jump in ability.
  const STAGES=[
    {min:0,   name:'הצעד הראשון'},
    {min:15,  name:'מדברים קצת יוונית'},
    {min:50,  name:'מסתדרים במשפטים'},
    {min:120, name:'שיחה יומיומית זורמת'},
    {min:250, name:'שולטים יפה בשפה'},
    {min:420, name:'כמעט שוטפים'},
    {min:all, name:'שוטפים — סיימת הכול! 🏆'}
  ];
  let ci=0; STAGES.forEach((s,i)=>{ if(known>=s.min) ci=i; });
  const cur=STAGES[ci], nxt=STAGES[ci+1];
  const ticks=STAGES.filter(s=>s.min>0 && s.min<all)
    .map(s=>'<span class="prog-tick'+(known>=s.min?' hit':'')+'" style="right:'+(s.min/all*100).toFixed(2)+'%"></span>').join('');
  chartBox.innerHTML =
    '<div class="prog-bar">'+
      '<div class="prog-bar-label"><b>'+known+'</b> מתוך '+all+' מילים</div>'+
      '<div class="prog-bar-track"><div class="prog-bar-fill" style="width:'+w+'%"></div>'+ticks+'</div>'+
      '<div class="stage-now">'+cur.name+'</div>'+
      (nxt ? '<div class="stage-next">עוד '+(nxt.min-known)+' מילים ל־'+nxt.name+'</div>'
           : '<div class="stage-next">כל הכבוד! 🎉</div>')+
    '</div>';

  if(!state.log || !state.log.length){
    hero.innerHTML='<div class="prog-empty">עדיין אין נתונים — סמנו מילה ראשונה כדי לראות את הקצב.</div>';
    return;
  }
  const today=new Date(); today.setHours(0,0,0,0);
  let first=new Date(startDayTs()); first.setHours(0,0,0,0);
  if(first>today) first=new Date(today);
  const total=state.log.length;
  const spanDays=Math.max(1, Math.round((today.getTime()-first.getTime())/86400000)+1);
  const per=total/spanDays;
  const paceNum = per>=1 ? Math.round(per*10)/10 : Math.round(per*100)/100;   // always words/day
  const paceCap = 'מילים ביום בממוצע';

  hero.innerHTML =
    '<div class="pace-hero">'+
      '<div class="pace-big">'+paceNum+'</div>'+
      '<div class="pace-cap">'+paceCap+'</div>'+
      '<div class="pace-sub">מאז '+dayLabel(first.getTime())+'</div>'+
    '</div>';
}

// Remove a word from "known" so it returns to the learning rotation.
function returnToLearning(g){
  state.known = state.known.filter(x=>x!==g);
  state.log   = state.log.filter(e=>e.w!==g);
  state.review= state.review.filter(r=>r.w!==g);
  save(); renderProgress(); renderList(); renderStat();
}

// Swipe a row left/right to reveal a delete action.
function attachSwipe(front, onDel){
  let sx=0, dx=0, drag=false, open=0; const W=88;
  front.style.touchAction='pan-y';
  front.addEventListener('pointerdown', e=>{ drag=true; sx=e.clientX; front.style.transition='none'; try{front.setPointerCapture(e.pointerId);}catch(_){} });
  front.addEventListener('pointermove', e=>{ if(!drag) return; dx=e.clientX-sx; let t=Math.max(-W,Math.min(W, open*W+dx)); front.style.transform='translateX('+t+'px)'; });
  const end=()=>{ if(!drag) return; drag=false; front.style.transition=''; const t=open*W+dx; open = t>W/2?1 : t<-W/2?-1 : 0; front.style.transform='translateX('+(open*W)+'px)'; dx=0; };
  front.addEventListener('pointerup', end);
  front.addEventListener('pointercancel', end);
}

function renderList(){
  const el=document.getElementById('learnedList');
  const hint=document.getElementById('listHint');
  el.innerHTML='';
  if(!state.known.length){ if(hint) hint.textContent=''; el.innerHTML='<div class="empty-note">עדיין לא סימנת מילים.</div>'; return; }
  if(hint) hint.textContent='החליקו מילה הצידה כדי להחזיר אותה ללמידה';
  const dateOf={}; state.log.forEach(e=>{ dateOf[e.w]=e.t; });
  state.known.slice().reverse().forEach(g=>{
    const e=entryOf(g);
    const row=document.createElement('div');
    row.className='learned-item';
    row.innerHTML=
      '<button class="li-del li-del-l" aria-label="החזרה ללמידה">'+ic('trash',20)+'</button>'+
      '<button class="li-del li-del-r" aria-label="החזרה ללמידה">'+ic('trash',20)+'</button>'+
      '<div class="li-front">'+
        '<button class="li-speak" title="השמעה">'+ic('speaker',18)+'</button>'+
        '<span class="g">'+g+'</span>'+
        '<div class="li-meta"><span class="h">'+(e?e[2]:'')+'</span>'+
          '<span class="ld">'+(dateOf[g]?dayLabel(dateOf[g]):'')+'</span></div>'+
      '</div>';
    row.querySelector('.li-speak').onclick=(ev)=>{ ev.stopPropagation(); speak(g, ev.currentTarget); };
    row.querySelectorAll('.li-del').forEach(b=>b.onclick=()=>returnToLearning(g));
    attachSwipe(row.querySelector('.li-front'), ()=>returnToLearning(g));
    el.appendChild(row);
  });
}
const startInput = document.getElementById('startDate');
const settingsBox = document.getElementById('settingsBox');
function openPanel(){
  document.getElementById('panel').classList.add('show');
  settingsBox.classList.remove('open');
  document.getElementById('panelSettings').classList.remove('on');
  startInput.value = dayStr(startDayTs());
  renderProgress(); renderList(); refreshQuizBtn();
  document.querySelector('.panel-inner').scrollTop = 0;
}
document.getElementById('menuBtn').onclick = openPanel;
document.getElementById('panelClose').onclick = () => document.getElementById('panel').classList.remove('show');
document.getElementById('panelSettings').onclick = (e) => {
  const open = settingsBox.classList.toggle('open');
  e.currentTarget.classList.toggle('on', open);
};
startInput.max = dayStr(Date.now());
startInput.onchange = () => { if(startInput.value){ state.startDate = startInput.value; save(); renderProgress(); } };

document.getElementById('menuBtn').innerHTML = ic('list',18)+'<span>מילים שלמדתי</span>';
document.getElementById('panelSettings').innerHTML = ic('gear',19);
document.getElementById('panelClose').innerHTML = ic('x',18);

// ---------------- Quiz: test yourself on words you've learned ----------------
const quizBtn = document.getElementById('quizBtn');
const quizEl = document.getElementById('quiz');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let quiz=null;
function startQuiz(){
  const pool = state.known.map(entryOf).filter(Boolean);
  if(pool.length < 4){ return; }
  const qs = shuffle(pool.slice()).slice(0, Math.min(10, pool.length));
  quiz = { qs, i:0, score:0 };
  quizEl.classList.add('show');
  renderQuiz();
}
function closeQuiz(){ quizEl.classList.remove('show'); quiz=null; setTimeout(()=>{ if(!quiz) quizEl.innerHTML=''; }, 320); }
function renderQuiz(){
  if(!quiz) return;
  if(quiz.i >= quiz.qs.length){
    const perfect = quiz.score===quiz.qs.length;
    quizEl.innerHTML =
      '<div class="quiz-card quiz-end">'+
        '<div class="quiz-score">'+quiz.score+'/'+quiz.qs.length+'</div>'+
        '<div class="quiz-score-cap">'+(perfect?'מושלם! 🎉':'כל הכבוד')+'</div>'+
        '<button class="quiz-again">שוב</button>'+
        '<button class="quiz-close">סגירה</button>'+
      '</div>';
    quizEl.querySelector('.quiz-again').onclick=startQuiz;
    quizEl.querySelector('.quiz-close').onclick=closeQuiz;
    return;
  }
  const q = quiz.qs[quiz.i];
  const wrongs = shuffle(WORDS.filter(w=>w[2]!==q[2])).slice(0,3).map(w=>w[2]);
  const opts = shuffle([q[2], ...wrongs]);
  quizEl.innerHTML =
    '<div class="quiz-top">'+
      '<button class="quiz-close" aria-label="סגירה">'+ic('x',18)+'</button>'+
      '<div class="quiz-prog">שאלה '+(quiz.i+1)+' מתוך '+quiz.qs.length+'</div>'+
      '<div class="quiz-pts">'+quiz.score+' נכון</div>'+
    '</div>'+
    '<div class="quiz-card">'+
      '<div class="quiz-greek">'+q[0]+'</div>'+
      '<div class="quiz-translit">'+q[1]+'</div>'+
      '<button class="quiz-speak">'+ic('speaker',18)+'השמעה</button>'+
    '</div>'+
    '<div class="quiz-opts">'+opts.map(o=>'<button class="quiz-opt">'+o+'</button>').join('')+'</div>';
  quizEl.querySelector('.quiz-close').onclick=closeQuiz;
  quizEl.querySelector('.quiz-speak').onclick=(ev)=>speak(q[0], ev.currentTarget);
  quizEl.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.onclick=()=>{
      if(quizEl.querySelector('.quiz-opt.correct, .quiz-opt.wrong')) return; // already answered
      const ok = btn.textContent===q[2];
      if(ok){ btn.classList.add('correct'); quiz.score++; }
      else { btn.classList.add('wrong'); quizEl.querySelectorAll('.quiz-opt').forEach(b=>{ if(b.textContent===q[2]) b.classList.add('correct'); }); }
      quizEl.querySelectorAll('.quiz-opt').forEach(b=>b.classList.add('done'));
      setTimeout(()=>{ quiz.i++; renderQuiz(); }, ok?650:1150);
    };
  });
}
function refreshQuizBtn(){
  const enough = state.known.length>=4;
  quizBtn.disabled = !enough;
  quizBtn.innerHTML = ic('quiz',18)+(enough?'מבחן על מה שלמדתי':'מבחן — צריך 4 מילים לפחות');
}
quizBtn.onclick = ()=>{ if(state.known.length>=4) startQuiz(); };

render();
</script>
