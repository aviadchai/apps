<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Apps — Aviad</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f8fafc">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.container{max-width:480px;margin:0 auto;padding:32px 20px;}
h1{text-align:center;font-size:28px;font-weight:800;color:#1e3a5f;margin-bottom:8px;}
.subtitle{text-align:center;color:#6b7280;font-size:14px;margin-bottom:32px;}
.grid{display:flex;flex-direction:column;gap:14px;}
a.card{display:flex;align-items:center;gap:16px;padding:18px 20px;background:#fff;border-radius:16px;border:1px solid #e2e8f0;text-decoration:none;color:inherit;transition:transform 0.15s,box-shadow 0.15s;}
a.card:active{transform:scale(0.98);box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.card-icon{font-size:36px;flex-shrink:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;}
.card-text h2{font-size:17px;font-weight:700;margin-bottom:2px;}
.card-text p{font-size:13px;color:#6b7280;}
</style>
</head>
<body>
<div class="container">
  <h1>האפליקציות שלי</h1>
  <p class="subtitle">בחר אפליקציה</p>
  <div class="grid">
    <a class="card" href="shopping-list.html">
      <div class="card-icon" style="background:#eff6ff;">🛒</div>
      <div class="card-text">
        <h2>Carty — רשימת קניות</h2>
        <p>רשימת קניות חכמה עם AI</p>
      </div>
    </a>
    <a class="card" href="greek.html">
      <div class="card-icon" style="background:#f0f9ff;">🇬🇷</div>
      <div class="card-text">
        <h2>יווניCal</h2>
        <p>500 מילים יווניות לתייר</p>
      </div>
    </a>
    <a class="card" href="greek-abc.html">
      <div class="card-icon" style="background:#f0f9ff;">🔤</div>
      <div class="card-text">
        <h2>ABC יוונית</h2>
        <p>למד את האלפבית היווני — בינגו, חידונים ואתגר</p>
      </div>
    </a>
    <a class="card" href="deal.html">
      <div class="card-icon" style="background:#f0fdf4;">💪</div>
      <div class="card-text">
        <h2>Fitness Deal</h2>
        <p>עסקאות כושר יומיות</p>
      </div>
    </a>
  </div>
</div>
</body>
</html>
