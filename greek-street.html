<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>יוונית לרחוב — Greek2Go</title>
<link rel="manifest" href="greek-street-manifest.json">
<link rel="icon" href="icon-greek-street.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-greek-street-180.png">
<meta name="theme-color" content="#0d4c9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יוונית לרחוב">
<style>
:root{
  --blue:#0d5eaf; --blue-d:#0d4c9e; --ink:#12203a; --muted:#6b7688;
  --bg:#eef2f8; --card:#ffffff; --line:#e3e9f2;
  --good:#12a06a; --good-bg:#e6f7ef; --bad:#e0453b; --bad-bg:#fdecea;
  --shadow:0 6px 20px rgba(20,40,80,.08);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);overflow-x:hidden;}
body{padding-top:var(--safe-t);padding-bottom:var(--safe-b);}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;
  transition:transform .12s ease,opacity .12s ease,background .15s;}
button:active{transform:scale(.97);}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;}
.wrap{padding:16px 18px 120px;}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--blue) 0%,var(--blue-d) 100%);
  color:#fff;padding:calc(var(--safe-t) + 14px) 18px 16px;display:flex;align-items:center;gap:12px;
  border-radius:0 0 22px 22px;box-shadow:0 4px 18px rgba(13,76,158,.25);}
.hdr h1{font-size:19px;font-weight:800;flex:1;}
.hdr .sub{font-size:12px;opacity:.85;font-weight:500;margin-top:2px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0;}
/* home hero */
.hero{background:linear-gradient(180deg,var(--blue) 0%,var(--blue-d) 100%);color:#fff;
  padding:calc(var(--safe-t) + 22px) 20px 26px;border-radius:0 0 26px 26px;
  box-shadow:0 6px 22px rgba(13,76,158,.28);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.hero-top .flag{font-size:34px;}
.hero h1{font-size:25px;font-weight:800;line-height:1.15;}
.hero .tag{font-size:13px;opacity:.9;margin-top:4px;font-weight:500;}
.streak{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 12px;text-align:center;min-width:60px;}
.streak b{font-size:20px;display:block;font-weight:800;}
.streak span{font-size:10px;opacity:.85;}
.ring-row{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.13);
  border-radius:18px;padding:14px 16px;}
.ring-row .stats{flex:1;}
.ring-row .stats .big{font-size:15px;font-weight:700;}
.ring-row .stats .small{font-size:12px;opacity:.85;margin-top:2px;}
.ring{position:relative;width:76px;height:76px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;}
/* CTA */
.cta{width:100%;margin-top:14px;background:#fff;color:var(--blue-d);border-radius:16px;
  padding:15px 18px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px;
  box-shadow:var(--shadow);}
.cta .badge{margin-inline-start:auto;background:var(--blue);color:#fff;border-radius:20px;
  padding:3px 11px;font-size:13px;font-weight:800;}
.cta.small{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;font-size:14px;padding:12px 16px;}
.cta.small .badge{background:#fff;color:var(--blue-d);}
/* section titles */
.sec{font-size:13px;font-weight:800;color:var(--muted);margin:22px 4px 12px;
  text-transform:none;letter-spacing:.2px;}
/* mode tiles */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mode{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;text-align:start;border:1px solid var(--line);}
.mode .emoji{font-size:26px;}
.mode b{font-size:15px;font-weight:800;}
.mode span{font-size:12px;color:var(--muted);line-height:1.3;}
/* category cards */
.cats{display:flex;flex-direction:column;gap:11px;}
.cat{background:var(--card);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);border:1px solid var(--line);width:100%;text-align:start;}
.cat .cemoji{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:24px;flex-shrink:0;}
.cat .ctxt{flex:1;min-width:0;}
.cat .ctxt b{font-size:15.5px;font-weight:700;display:block;}
.cat .ctxt .cbar{height:6px;background:var(--line);border-radius:4px;margin-top:7px;overflow:hidden;}
.cat .ctxt .cbar i{display:block;height:100%;border-radius:4px;transition:width .4s;}
.cat .cmeta{font-size:12px;color:var(--muted);flex-shrink:0;text-align:center;}
.cat .cmeta b{font-size:15px;color:var(--ink);display:block;}
.chev{color:#c3ccda;font-size:20px;flex-shrink:0;}
/* flashcard */
.progress{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:20px;}
.progress i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .3s;}
.count-lbl{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600;}
.scene{perspective:1400px;margin:6px 0 22px;}
.card{position:relative;width:100%;min-height:320px;transition:transform .5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;cursor:pointer;}
.card.flip{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(20,40,80,.12);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:26px;text-align:center;}
.face.back{transform:rotateY(180deg);background:linear-gradient(170deg,#f4f9ff,#eaf2ff);}
.face .emoji{font-size:56px;margin-bottom:14px;}
.face .el{font-size:38px;font-weight:800;color:var(--ink);line-height:1.15;direction:ltr;}
.face .tr{font-size:20px;color:var(--blue);font-weight:700;margin-top:12px;}
.face .he{font-size:30px;font-weight:800;margin-top:6px;}
.face .hint{font-size:12.5px;color:var(--muted);margin-top:20px;}
.face .catpill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;margin-bottom:16px;}
.sound{margin-top:18px;background:var(--blue);color:#fff;border-radius:30px;padding:10px 22px;
  font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.gbtn{padding:16px;border-radius:16px;font-size:16px;font-weight:800;box-shadow:var(--shadow);}
.gbtn.no{background:var(--bad-bg);color:var(--bad);}
.gbtn.yes{background:var(--good-bg);color:var(--good);}
.flip-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:2px;}
/* quiz */
.q-el{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);
  padding:30px 22px;text-align:center;margin-bottom:8px;}
.q-el .big{font-size:34px;font-weight:800;direction:ltr;}
.q-el .tr{font-size:18px;color:var(--blue);font-weight:700;margin-top:10px;}
.q-el .he{font-size:30px;font-weight:800;}
.q-prompt{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:600;}
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:16px 18px;
  font-size:17px;font-weight:600;text-align:start;box-shadow:0 2px 8px rgba(20,40,80,.05);
  display:flex;align-items:center;gap:10px;direction:rtl;}
.opt.ltr{direction:ltr;justify-content:center;}
.opt.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:800;}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.opt .mark{margin-inline-start:auto;font-size:20px;}
/* listen */
.listen-btn{width:130px;height:130px;border-radius:50%;background:linear-gradient(160deg,var(--blue),var(--blue-d));
  color:#fff;font-size:52px;display:flex;align-items:center;justify-content:center;margin:8px auto 22px;
  box-shadow:0 10px 26px rgba(13,76,158,.35);}
.listen-btn.play{animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* phrasebook */
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 16px;font-size:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.prow{background:var(--card);border-radius:15px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(20,40,80,.05);
  padding:13px 15px;display:flex;align-items:center;gap:13px;margin-bottom:10px;width:100%;text-align:start;}
.prow .pplay{width:42px;height:42px;border-radius:12px;background:#eaf2ff;color:var(--blue);
  font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.prow .ptxt{flex:1;min-width:0;}
.prow .ptxt .pel{font-size:18px;font-weight:800;direction:ltr;text-align:start;}
.prow .ptxt .ptr{font-size:13px;color:var(--blue);font-weight:600;direction:ltr;text-align:start;}
.prow .phe{font-size:15px;font-weight:700;flex-shrink:0;max-width:42%;text-align:end;}
/* result */
.result{text-align:center;padding:30px 10px;}
.result .big{font-size:72px;margin-bottom:6px;}
.result h2{font-size:26px;font-weight:800;margin-bottom:6px;}
.result p{color:var(--muted);font-size:15px;margin-bottom:24px;}
.result .score{font-size:56px;font-weight:800;color:var(--blue);}
.btn-primary{width:100%;background:var(--blue);color:#fff;border-radius:16px;padding:16px;
  font-size:16px;font-weight:800;box-shadow:var(--shadow);margin-top:12px;}
.btn-ghost{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:16px;padding:15px;font-size:15px;font-weight:700;margin-top:10px;}
/* stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
.stat-box{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);
  border:1px solid var(--line);text-align:center;}
.stat-box b{font-size:30px;font-weight:800;color:var(--blue);display:block;}
.stat-box span{font-size:12.5px;color:var(--muted);}
.legend{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);}
.legend .lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.legend .lrow:last-child{border-bottom:none;}
.legend .lrow .ldot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.legend .lrow b{flex:1;font-size:14.5px;font-weight:600;}
.legend .lrow span{font-size:13px;color:var(--muted);font-weight:700;}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px;line-height:1.5;}
.empty .e{font-size:44px;margin-bottom:10px;}
.fade{animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:calc(var(--safe-b) + 20px);left:50%;transform:translateX(-50%);
  background:rgba(18,32,58,.94);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;
  font-weight:600;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;}
.toast.show{opacity:1;}
</style>
</head>

/* ---------------- Storage / SRS (Leitner) ---------------- */
const KEY='gr_street_v1';
const DAY=86400000;
const INTERVALS=[0,1,2,4,8]; // ימים לפי box (1..5)
function load(){
  try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
let DB=load();
DB.srs=DB.srs||{};            // {id:{box:1..5, due:ts}}
DB.streak=DB.streak||0;
DB.lastDay=DB.lastDay||null;
DB.bestQuiz=DB.bestQuiz||0;

function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function bumpStreak(){
  const t=todayKey();
  if(DB.lastDay===t) return;
  const y=new Date(Date.now()-DAY);
  const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  DB.streak = (DB.lastDay===yk) ? DB.streak+1 : 1;
  DB.lastDay=t; save();
}
function grade(id,knew){
  const s=DB.srs[id]||{box:1,due:0};
  s.box = knew ? Math.min(5,s.box+1) : 1;
  s.due = Date.now() + INTERVALS[s.box-1]*DAY;
  DB.srs[id]=s; bumpStreak(); save();
}
function boxOf(id){return DB.srs[id]?DB.srs[id].box:0}
function isMastered(id){return boxOf(id)>=5}
function isSeen(id){return !!DB.srs[id]}
function isDue(id){const s=DB.srs[id];return !s || s.due<=Date.now()}
function dueList(scope){
  const pool = scope&&scope!=='all' ? WORDS.filter(w=>w.cat===scope) : WORDS;
  const nw = pool.filter(w=>!isSeen(w.id));
  const rv = pool.filter(w=>isSeen(w.id)&&isDue(w.id)).sort((a,b)=>DB.srs[a.id].due-DB.srs[b.id].due);
  return {nw,rv,all:rv.concat(nw)};
}
function catProgress(cat){
  const pool=WORDS.filter(w=>w.cat===cat);
  const learned=pool.filter(w=>isSeen(w.id)).length;
  const mastered=pool.filter(w=>isMastered(w.id)).length;
  return {total:pool.length,learned,mastered};
}
function totalMastered(){return WORDS.filter(w=>isMastered(w.id)).length}
function totalSeen(){return WORDS.filter(w=>isSeen(w.id)).length}

/* ---------------- Audio (Web Speech) ---------------- */
let VOICES=[];
function loadVoices(){VOICES=window.speechSynthesis?speechSynthesis.getVoices():[]}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function greekVoice(){
  return VOICES.find(v=>/el(-|_)?GR/i.test(v.lang))||VOICES.find(v=>/^el/i.test(v.lang))||null;
}
function speak(text){
  if(!('speechSynthesis' in window)){toast('אין תמיכה בהשמעה במכשיר זה');return;}
  speechSynthesis.cancel();
  const clean=text.replace(/\.\.\.$/,'').replace(/;$/,'');
  const u=new SpeechSynthesisUtterance(clean);
  const v=greekVoice();
  u.lang='el-GR'; if(v)u.voice=v; u.rate=.82; u.pitch=1;
  speechSynthesis.speak(u);
}

}

  if(queue.length===0) queue=shuffle(WORDS.filter(w=>scope==='all'||w.cat===scope)).slice(0,20);
  SESS={mode:'study',scope,queue,idx:0,flip:false,done:0};
  go('study');
}

function startQuiz(scope){
  const pool=shuffle(WORDS.filter(w=>scope==='all'||w.cat===scope));
  const qs=pool.slice(0,Math.min(10,pool.length)).map(w=>{
    const dir=Math.random()<.5?'el2he':'he2el'; // הצג יוונית->בחר עברית / הצג עברית->בחר יוונית
    const wrong=shuffle(WORDS.filter(x=>x.id!==w.id)).slice(0,3);
    const opts=shuffle([w,...wrong]);
    return {w,dir,opts};
  });
  SESS={mode:'quiz',scope,qs,idx:0,score:0,answered:false,picked:null};
  go('quiz');
}
function renderQuiz(){
  const s=SESS;
  if(s.idx>=s.qs.length)return renderResult('quiz');
  const q=s.qs[s.idx];const w=q.w;
  const prog=Math.round(s.idx/s.qs.length*100);
  const showEl=q.dir==='el2he';
  const prompt=showEl?'מה הפירוש?':'איך אומרים ביוונית?';
  const stim = showEl
     ? `<div class="q-el"><div class="big">${esc(w.el)}</div><div class="tr">${esc(w.tr)}</div>
          <button class="sound" data-act="say" data-el="${esc(w.el)}">🔊 השמע</button></div>`
     : `<div class="q-el"><div class="he">${esc(w.he)}</div></div>`;
  const opts=q.opts.map(o=>{
    const label=showEl?esc(o.he):esc(o.el);
    let cls='opt'+(showEl?'':' ltr');
    let mark='';
    if(s.answered){
      if(o.id===w.id){cls+=' correct';mark='<span class="mark">✓</span>';}
      else if(o.id===s.picked){cls+=' wrong';mark='<span class="mark">✕</span>';}
    }
    const sub=showEl?'':`<span style="font-size:12px;color:var(--muted);direction:ltr">${esc(o.tr)}</span>`;
    return `<button class="${cls}" data-act="answer" data-id="${o.id}" ${s.answered?'disabled':''}>
      ${label}${sub}${mark}</button>`;
  }).join('');
  app.innerHTML=header('חידון',`שאלה ${s.idx+1}/${s.qs.length} · ${s.score} נכונות`)+`
  <div class="wrap fade">
    <div class="progress"><i style="width:${prog}%"></i></div>
    <div class="q-prompt">${prompt}</div>
    ${stim}
    <div class="opts">${opts}</div>
    ${s.answered?`<button class="btn-primary" data-act="qnext">${s.idx+1>=s.qs.length?'סיום':'הבא ›'}</button>`:''}
  </div>`;
}

/* ----- Listening ----- */
function startListen(scope){
  const pool=shuffle(WORDS.filter(w=>scope==='all'||w.cat===scope));
  const qs=pool.slice(0,Math.min(10,pool.length)).map(w=>{
    const wrong=shuffle(WORDS.filter(x=>x.id!==w.id)).slice(0,3);
    return {w,opts:shuffle([w,...wrong])};
  });
  SESS={mode:'listen',scope,qs,idx:0,score:0,answered:false,picked:null};
  go('listen');
  setTimeout(()=>speak(qs[0].w.el),350);
}
function renderListen(){
  const s=SESS;
  if(s.idx>=s.qs.length)return renderResult('listen');
  const q=s.qs[s.idx];const w=q.w;
  const prog=Math.round(s.idx/s.qs.length*100);
  const opts=q.opts.map(o=>{
    let cls='opt';let mark='';
    if(s.answered){
      if(o.id===w.id){cls+=' correct';mark='<span class="mark">✓</span>';}
      else if(o.id===s.picked){cls+=' wrong';mark='<span class="mark">✕</span>';}
    }
    return `<button class="${cls}" data-act="lanswer" data-id="${o.id}" ${s.answered?'disabled':''}>
      ${esc(o.he)}${mark}</button>`;
  }).join('');
  app.innerHTML=header('תרגול הקשבה',`שאלה ${s.idx+1}/${s.qs.length} · ${s.score} נכונות`)+`
  <div class="wrap fade">
    <div class="progress"><i style="width:${prog}%"></i></div>
    <div class="q-prompt">הקש להשמעה — מה שמעת?</div>
    <button class="listen-btn" data-act="say" data-el="${esc(w.el)}">🔊</button>
    ${s.answered?`<div class="q-prompt" style="font-size:16px;color:var(--ink);font-weight:800;direction:ltr">${esc(w.el)} · ${esc(w.tr)}</div>`:''}
    <div class="opts">${opts}</div>
    ${s.answered?`<button class="btn-primary" data-act="lnext">${s.idx+1>=s.qs.length?'סיום':'הבא ›'}</button>`:''}
  </div>`;
}

/* ----- Result ----- */
function renderResult(mode){
  let emoji,title,body,extra='';
  if(mode==='study'){
    emoji='🎉';title='כל הכבוד!';
    body=`סיימת ${SESS.queue.length} כרטיסיות. החזרות הבאות תוזמנו אוטומטית.`;
  }else{
    const total=SESS.qs.length,sc=SESS.score,p=Math.round(sc/total*100);
    emoji=p>=80?'🏆':p>=50?'👏':'💪';
    title=p>=80?'מצוין!':p>=50?'יפה מאוד!':'ממשיכים להתאמן!';
    body=`ענית נכון על ${sc} מתוך ${total}`;
    extra=`<div class="score">${p}%</div>`;
    if(mode==='quiz'&&sc>DB.bestQuiz){DB.bestQuiz=sc;save();}
  }
  const scope=SESS.scope;
  app.innerHTML=header('','')+`
  <div class="wrap fade"><div class="result">
    <div class="big">${emoji}</div>${extra}
    <h2>${title}</h2><p>${body}</p>
    <button class="btn-primary" data-act="again" data-mode="${mode}" data-scope="${scope}">↻ עוד סבב</button>
    <button class="btn-ghost" data-act="home">🏠 חזרה למסך הבית</button>
  </div></div>`;
}

/* ----- Category detail ----- */
function renderCat(){
  const c=CATMAP[S.scope];const p=catProgress(c.id);
  const w=Math.round(p.mastered/p.total*100);
  app.innerHTML=header(c.he,`${p.mastered}/${p.total} נלמדו · ${p.total} מילים`)+`
  <div class="wrap fade">
    <div style="background:${c.color}12;border:1px solid ${c.color}33;border-radius:18px;padding:18px;text-align:center;margin-bottom:6px">
      <div style="font-size:40px">${c.emoji}</div>
      <div class="progress" style="margin:14px 0 0"><i style="width:${w}%;background:${c.color}"></i></div>
    </div>
    <div class="sec">בחר תרגול</div>
    <div class="modes">
      <button class="mode" data-act="study" data-scope="${c.id}"><div class="emoji">🃏</div><b>כרטיסיות</b><span>למידה עם חזרה מרווחת</span></button>
      <button class="mode" data-act="quiz" data-scope="${c.id}"><div class="emoji">🎯</div><b>חידון</b><span>בחירה מרובה</span></button>
      <button class="mode" data-act="listen" data-scope="${c.id}"><div class="emoji">🎧</div><b>הקשבה</b><span>זיהוי לפי שמע</span></button>
      <button class="mode" data-act="phrase" data-scope="${c.id}"><div class="emoji">📖</div><b>שיחון</b><span>עיון מהיר עם הגייה</span></button>
    </div>
  </div>`;
}

/* ----- Phrasebook ----- */
function renderPhrase(){
  const scope=S.scope;
  const title = scope==='all'?'שיחון מלא':CATMAP[scope].he;
  const q=(S.pq||'').trim().toLowerCase();
  const match=(w,qq)=>w.el.toLowerCase().includes(qq)||w.he.includes(qq)||w.tr.includes(qq);
  let list=WORDS.filter(w=>scope==='all'||w.cat===scope);
  if(q) list=list.filter(w=>match(w,q));
  const rows=list.map(w=>`
    <button class="prow" data-act="say" data-el="${esc(w.el)}">
      <div class="pplay">🔊</div>
      <div class="ptxt"><div class="pel">${esc(w.el)}</div><div class="ptr">${esc(w.tr)}</div></div>
      <div class="phe">${esc(w.he)}</div>
    </button>`).join('')||`<div class="empty"><div class="e">🔎</div>לא נמצאו מילים</div>`;
  app.innerHTML=header('שיחון',`${title} · הקש להשמעה`)+`
  <div class="wrap fade">
    <input class="search" placeholder="🔎 חיפוש מילה בעברית או ביוונית..." value="${esc(q)}" data-role="search">
    ${rows}
  </div>`;
  const inp=app.querySelector('[data-role="search"]');
  if(inp){inp.addEventListener('input',e=>{S.pq=e.target.value;
    const cont=app.querySelector('.wrap');
    // עדכון רשימה בלבד כדי לא לאבד פוקוס
    let l=WORDS.filter(w=>scope==='all'||w.cat===scope);
    const qq=e.target.value.trim().toLowerCase();
    if(qq)l=l.filter(w=>match(w,qq));
    const html=l.map(w=>`<button class="prow" data-act="say" data-el="${esc(w.el)}">
      <div class="pplay">🔊</div><div class="ptxt"><div class="pel">${esc(w.el)}</div>
      <div class="ptr">${esc(w.tr)}</div></div><div class="phe">${esc(w.he)}</div></button>`).join('')
      ||`<div class="empty"><div class="e">🔎</div>לא נמצאו מילים</div>`;
    // הסר את כל ה-prow/empty הקיימים והוסף חדשים
    cont.querySelectorAll('.prow,.empty').forEach(n=>n.remove());
    inp.insertAdjacentHTML('afterend',html);
  });}
}

/* ----- Stats ----- */
function renderStats(){
  const mastered=totalMastered(),seen=totalSeen(),total=WORDS.length;
  const cats=CATS.map(c=>{const p=catProgress(c.id);const w=Math.round(p.mastered/p.total*100);
    return `<div class="lrow"><div class="ldot" style="background:${c.color}"></div>
      <b>${c.emoji} ${c.he}</b><span>${p.mastered}/${p.total}</span></div>`;}).join('');
  app.innerHTML=header('ההתקדמות שלי','')+`
  <div class="wrap fade">
    <div class="stat-grid">
      <div class="stat-box"><b>${mastered}</b><span>מילים בשליטה</span></div>
      <div class="stat-box"><b>${seen}</b><span>מילים בלמידה</span></div>
      <div class="stat-box"><b>${DB.streak}🔥</b><span>ימי רצף</span></div>
      <div class="stat-box"><b>${DB.bestQuiz}/10</b><span>שיא בחידון</span></div>
    </div>
    <div class="sec">התקדמות לפי נושא</div>
    <div class="legend">${cats}</div>
    <div style="font-size:12px;color:var(--muted);text-align:center;margin:16px 4px">
      "בשליטה" = מילה שענית עליה נכון חמש פעמים ברצף במערכת החזרה המרווחת.
    </div>
    <button class="btn-ghost" data-act="reset">🗑️ איפוס כל ההתקדמות</button>
  </div>`;
}

/* ---------------- Router ---------------- */
function render(){
  const r={home:renderHome,study:renderStudy,quiz:renderQuiz,listen:renderListen,
    cat:renderCat,phrase:renderPhrase,stats:renderStats}[S.screen]||renderHome;
  r();
}

/* ---------------- Events ---------------- */
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  switch(a){
    case 'home': SESS=null; go('home'); break;
    case 'say': speak(t.dataset.el); break;
    case 'flip': SESS.flip=!SESS.flip; render(); break;
    case 'grade':{
      const w=SESS.queue[SESS.idx];
      grade(w.id, t.dataset.knew==='1');
      SESS.idx++; SESS.flip=false; render(); break;
    }
    case 'cat': go('cat',{scope:t.dataset.cat}); break;
    case 'study': startStudy(t.dataset.scope); break;
    case 'quiz': startQuiz(t.dataset.scope); break;
    case 'listen': startListen(t.dataset.scope); break;
    case 'phrase': go('phrase',{scope:t.dataset.scope,pq:''}); break;
    case 'stats': go('stats'); break;
    case 'answer':{
      if(SESS.answered)break;
      const id=+t.dataset.id;const q=SESS.qs[SESS.idx];
      SESS.answered=true;SESS.picked=id;
      const ok=id===q.w.id;
      if(ok)SESS.score++;
      grade(q.w.id,ok);
      render();
      if(ok)speak(q.w.el);
      break;
    }
    case 'qnext': SESS.idx++;SESS.answered=false;SESS.picked=null;render();break;
    case 'lanswer':{
      if(SESS.answered)break;
      const id=+t.dataset.id;const q=SESS.qs[SESS.idx];
      SESS.answered=true;SESS.picked=id;
      const ok=id===q.w.id;if(ok)SESS.score++;
      grade(q.w.id,ok);render();break;
    }
    case 'lnext':{
      SESS.idx++;SESS.answered=false;SESS.picked=null;render();
      if(SESS.idx<SESS.qs.length)setTimeout(()=>speak(SESS.qs[SESS.idx].w.el),300);
      break;
    }
    case 'again':{
      const m=t.dataset.mode,sc=t.dataset.scope;
      if(m==='study')startStudy(sc);else if(m==='quiz')startQuiz(sc);else startListen(sc);
      break;
    }
    case 'reset':
      if(confirm('לאפס את כל ההתקדמות? פעולה זו אינה הפיכה.')){
        DB={srs:{},streak:0,lastDay:null,bestQuiz:0};save();toast('ההתקדמות אופסה');go('home');
      }break;
  }
});

/* ---------------- Service worker ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

render();
</script>
</body>
</html>
