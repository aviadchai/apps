<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>טיימר כושר</title>
<link rel="icon" href="icon-timer.svg" type="image/svg+xml">
<link rel="manifest" href="timer-manifest.json">
<meta name="theme-color" content="#07080D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="טיימר">
<link rel="apple-touch-icon" href="icon-timer.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#07080D;
  --elev:#12141d;
  --elev2:#1a1d29;
  --line:#252a3a;
  --text:#f3f5fb;
  --muted:#8b90a3;
  --accent:#ff7a18;
  --accent-soft:rgba(255,122,24,.16);
  --work:#ff7a18;
  --work-glow:rgba(255,122,24,.55);
  --rest:#22d3a5;
  --rest-glow:rgba(34,211,165,.5);
  --danger:#ff4d5e;
  --ph:var(--work);
  --ph-glow:var(--work-glow);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.mono{font-family:ui-monospace,'SF Mono','Roboto Mono','Menlo',monospace;font-variant-numeric:tabular-nums;}
body{display:flex;flex-direction:column;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  position:relative;isolation:isolate;}

.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 22%,var(--ph-glow),transparent 70%);
  opacity:.35;transition:background .6s ease,opacity .6s ease;animation:breathe 6s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.28;transform:scale(1);}50%{opacity:.5;transform:scale(1.06);}}
.grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:
    linear-gradient(transparent 95%,rgba(255,255,255,.03) 0) 0 0/100% 26px,
    linear-gradient(90deg,transparent 95%,rgba(255,255,255,.03) 0) 0 0/26px 100%;
  -webkit-mask:radial-gradient(70% 60% at 50% 40%,#000,transparent 80%);
          mask:radial-gradient(70% 60% at 50% 40%,#000,transparent 80%);}

.wrap{flex:1;width:100%;max-width:460px;margin:0 auto;padding:12px 18px;
  display:flex;flex-direction:column;min-height:0;}

.top{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-height:40px;flex-shrink:0;}
.top h1{font-size:19px;font-weight:800;letter-spacing:.3px;flex:1;text-align:center;}
.top .brand{display:inline-flex;align-items:center;gap:7px;}
.top .brand .glyph{width:22px;height:22px;color:var(--accent);}
.iconbtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--elev);
  color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  transition:transform .12s,background .15s;}
.iconbtn:active{transform:scale(.9);background:var(--elev2);}
.iconbtn svg{width:20px;height:20px;}
.iconbtn.loop{color:var(--muted);}
.iconbtn.loop.on{color:var(--accent);background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 16px var(--accent-soft);}
.iconbtn.loop .slash{display:none;}
.iconbtn.loop:not(.on) .slash{display:block;}

/* ================= SETUP ================= */
#setup{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;}

.wheels{display:flex;gap:12px;flex-shrink:0;}
.card{flex:1;background:linear-gradient(160deg,var(--elev),#0f111a);border:1px solid var(--line);
  border-radius:22px;padding:14px 12px 12px;position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,transparent,var(--ph),transparent);opacity:.8;}
.card.work{--ph:var(--work);--ph-glow:var(--work-glow);}
.card.rest{--ph:var(--rest);--ph-glow:var(--rest-glow);}
.tag{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:800;
  letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;}
.tag .dot{width:9px;height:9px;border-radius:50%;background:var(--ph);box-shadow:0 0 12px 1px var(--ph);}
.tag .txt{color:var(--ph);}

/* wheel picker */
.wheel{position:relative;height:154px;overflow:hidden;
  -webkit-mask:linear-gradient(180deg,transparent,#000 26%,#000 74%,transparent);
          mask:linear-gradient(180deg,transparent,#000 26%,#000 74%,transparent);}
.wheel .band{position:absolute;left:6px;right:6px;top:50%;height:46px;transform:translateY(-50%);
  border-top:1.5px solid var(--ph);border-bottom:1.5px solid var(--ph);border-radius:12px;
  background:var(--ph-glow);opacity:.12;pointer-events:none;}
.wheel-scroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;padding:54px 0;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;}
.wheel-scroll::-webkit-scrollbar{display:none;}
.wheel-item{height:46px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:20px;font-weight:700;color:var(--muted);transition:color .15s,transform .15s,text-shadow .15s;}
.wheel-item.sel{color:var(--ph);font-size:27px;font-weight:800;transform:scale(1.04);
  text-shadow:0 0 18px var(--ph-glow);}
.wheel-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px;opacity:.7;}

/* rounds + sound */
.rowcard{background:linear-gradient(160deg,var(--elev),#0f111a);border:1px solid var(--line);
  border-radius:18px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.rowcard .lab{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.rowcard .lab svg{width:19px;height:19px;color:var(--accent);}
.seg{display:flex;gap:6px;}
.seg button{min-width:42px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:var(--elev2);
  color:var(--muted);font-size:14px;font-weight:800;cursor:pointer;transition:.15s;font-family:inherit;}
.seg button.on{background:var(--accent);color:#0b0c12;border-color:var(--accent);box-shadow:0 0 16px var(--accent-soft);}
.sound-row{flex-direction:column;align-items:stretch;gap:10px;}
.sound-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
.sound-pick button{padding:9px 3px;border-radius:12px;border:1px solid var(--line);background:var(--elev2);
  color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:4px;}
.sound-pick button svg{width:18px;height:18px;color:var(--accent);}
.sound-pick button.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft);}

.start{margin-top:auto;padding:17px;border:none;border-radius:19px;cursor:pointer;font-family:inherit;
  font-size:18px;font-weight:900;letter-spacing:.5px;color:#0b0c12;position:relative;overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg,#ff9a3d,var(--accent));box-shadow:0 10px 30px -6px var(--work-glow);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s;}
.start:active{transform:scale(.97);}
.start svg{width:22px;height:22px;}
.start::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35),transparent 70%);
  transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite;}
@keyframes sheen{0%,60%{transform:translateX(-120%);}80%,100%{transform:translateX(120%);}}

/* ================= RUNNING ================= */
#run{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;}
#run.on{display:flex;}
.phase-name{font-size:26px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--ph);
  text-shadow:0 0 20px var(--ph-glow);transition:color .4s;}
.phase-name.swap{animation:popname .45s ease;}
@keyframes popname{0%{transform:scale(.6);opacity:0;letter-spacing:8px;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.ringbox{position:relative;width:min(74vw,300px);height:min(74vw,300px);margin:14px 0;}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);}
.ringbox .track{stroke:#191c28;}
.ringbox .bar{stroke:var(--ph);stroke-linecap:round;filter:drop-shadow(0 0 8px var(--ph-glow));transition:stroke .4s;}
.ringbox .pulse{animation:ringpulse 1s ease-out infinite;}
@keyframes ringpulse{0%{filter:drop-shadow(0 0 6px var(--ph-glow));}50%{filter:drop-shadow(0 0 22px var(--ph-glow));}100%{filter:drop-shadow(0 0 6px var(--ph-glow));}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.center .time{font-size:74px;font-weight:800;line-height:1;letter-spacing:2px;color:var(--text);
  text-shadow:0 0 26px var(--ph-glow);transition:transform .12s,color .2s;}
.center .time.tick{animation:tickpop .5s ease;color:var(--danger);}
@keyframes tickpop{0%{transform:scale(1.35);}100%{transform:scale(1);}}
.center .rounds{margin-top:12px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:1px;}
.pips{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;justify-content:center;max-width:230px;}
.pips .pip{width:9px;height:9px;border-radius:50%;background:#2a2f40;transition:.3s;}
.pips .pip.done{background:var(--ph);box-shadow:0 0 10px var(--ph-glow);}
.pips .pip.cur{background:var(--ph);transform:scale(1.35);box-shadow:0 0 12px var(--ph-glow);}
.next-hint{margin-top:14px;font-size:13px;color:var(--muted);font-weight:600;min-height:18px;letter-spacing:.5px;}
.run-ctrl{display:flex;gap:12px;margin-top:22px;width:100%;max-width:340px;}
.run-ctrl button{flex:1;padding:16px;border-radius:17px;font-family:inherit;font-size:17px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s;}
.run-ctrl button:active{transform:scale(.96);}
.run-ctrl button svg{width:20px;height:20px;}
.btn-pause{background:var(--elev);color:var(--text);border:1px solid var(--line);}
.btn-pause.paused{background:var(--accent);color:#0b0c12;border-color:var(--accent);}
.btn-stop{background:rgba(255,77,94,.12);color:var(--danger);border:1px solid rgba(255,77,94,.3);}

.hidden{display:none!important;}
@media (max-height:680px){
  .wheel{height:120px;} .wheel-scroll{padding:37px 0;}
  .center .time{font-size:64px;} .ringbox{width:min(62vw,250px);height:min(62vw,250px);}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div class="aura" id="aura"></div>
<div class="grid-bg"></div>

<div class="wrap">
  <div class="top">
    <button class="iconbtn" id="backBtn" aria-label="חזור">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <h1><span class="brand"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>טיימר כושר</span></h1>
    <button class="iconbtn loop on" id="loopBtn" aria-label="לולאה אינסופית" title="לולאה אינסופית — פועל/כבוי">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12c-2-2.67-4-4-6-4a4 4 0 100 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 100-8c-2 0-4 1.33-6 4Z"/><line class="slash" x1="4" y1="20" x2="20" y2="4"/></svg>
    </button>
  </div>

  <!-- ============ SETUP ============ -->
  <div id="setup">
    <div class="wheels">
      <div class="card work">
        <div class="tag"><span class="dot"></span><span class="txt">עבודה</span></div>
        <div class="wheel"><div class="band"></div><div class="wheel-scroll" id="workScroll"></div></div>
        <div class="wheel-hint">גלול לדקות : שניות</div>
      </div>
      <div class="card rest">
        <div class="tag"><span class="dot"></span><span class="txt">מנוחה</span></div>
        <div class="wheel"><div class="band"></div><div class="wheel-scroll" id="restScroll"></div></div>
        <div class="wheel-hint">גלול לדקות : שניות</div>
      </div>
    </div>

    <div class="rowcard sound-row">
      <span class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a9 9 0 010 14"/></svg>צליל התראה</span>
      <div class="sound-pick" id="soundPick">
        <button data-s="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>פעמון</button>
        <button data-s="chime"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>צליל</button>
        <button data-s="whistle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a4 4 0 004 4h6l6 3v-9a4 4 0 00-4-4H7a4 4 0 00-4 4z"/><circle cx="7" cy="12" r="1.4"/></svg>משרוקית</button>
        <button data-s="digital"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2-6 4 12 2-6h6"/></svg>דיגיטלי</button>
        <button data-s="airhorn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4l7 3V7z"/><path d="M10 8c3 0 5 1.5 5 4s-2 4-5 4"/><path d="M18 6c2 1 3 3.5 3 6s-1 5-3 6"/></svg>צופר</button>
        <button data-s="beep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l3-8 2 16 3-8h4"/></svg>ביפ</button>
      </div>
    </div>

    <button class="start" id="startBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>הפעל אימון
    </button>
  </div>

  <!-- ============ RUNNING ============ -->
  <div id="run">
    <div class="phase-name" id="phaseName">עבודה</div>
    <div class="ringbox">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="6"/>
        <circle class="bar" id="bar" cx="50" cy="50" r="45" fill="none" stroke-width="6"
          stroke-dasharray="282.74" stroke-dashoffset="0"/>
      </svg>
      <div class="center">
        <span class="time mono" id="bigTime">0:30</span>
        <span class="rounds mono" id="roundInfo">סבב 1</span>
        <div class="pips" id="pips"></div>
      </div>
    </div>
    <div class="next-hint" id="nextHint"></div>
    <div class="run-ctrl">
      <button class="btn-pause" id="pauseBtn"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>השהה</button>
      <button class="btn-stop" id="stopBtn"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>עצור</button>
    </div>
  </div>
</div>

<script>
(function(){
  var R=45, CIRC=2*Math.PI*R, ITEM=46;
  var WORK_MIN=5, WORK_MAX=600, REST_MIN=0, REST_MAX=300;

  var cfg={ work:30, rest:15, rounds:0, sound:'bell' };
  try{ var s=JSON.parse(localStorage.getItem('fitTimer2')||'{}');
       ['work','rest','rounds'].forEach(function(k){ if(typeof s[k]==='number') cfg[k]=s[k]; });
       if(s.sound) cfg.sound=s.sound; }catch(e){}
  cfg.work=Math.min(WORK_MAX,Math.max(WORK_MIN,cfg.work));
  cfg.rest=Math.min(REST_MAX,Math.max(REST_MIN,cfg.rest));
  if(cfg.rounds!==0) cfg.rounds=1; // loop on (0=∞) or off (single round)
  function save(){ try{ localStorage.setItem('fitTimer2',JSON.stringify(cfg)); }catch(e){} }

  var $=function(id){return document.getElementById(id);};
  var el={ setup:$('setup'), run:$('run'), aura:$('aura'),
    loopBtn:$('loopBtn'), soundPick:$('soundPick'),
    startBtn:$('startBtn'), pauseBtn:$('pauseBtn'), stopBtn:$('stopBtn'), backBtn:$('backBtn'),
    phaseName:$('phaseName'), bigTime:$('bigTime'), roundInfo:$('roundInfo'),
    pips:$('pips'), bar:$('bar'), nextHint:$('nextHint') };

  function fmt(sec){ sec=Math.max(0,Math.round(sec));
    var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }

  // ---------- wheel pickers ----------
  function makeWheel(scrollId, t, min, max){
    var scroll=$(scrollId);
    var vals=[]; for(var v=min; v<=max; v++) vals.push(v);
    var frag=document.createDocumentFragment();
    vals.forEach(function(v){ var d=document.createElement('div'); d.className='wheel-item mono';
      d.textContent=fmt(v); frag.appendChild(d); });
    scroll.appendChild(frag);
    var w={ scroll:scroll, t:t, vals:vals, min:min, idx:-1, sel:null, timer:null };
    function setSel(idx){
      if(w.sel) w.sel.classList.remove('sel');
      var node=scroll.children[idx]; if(node){ node.classList.add('sel'); w.sel=node; }
    }
    function onScroll(){
      var idx=Math.round(scroll.scrollTop/ITEM);
      idx=Math.max(0,Math.min(vals.length-1,idx));
      if(idx!==w.idx){ w.idx=idx; setSel(idx); cfg[t]=vals[idx]; save(); }
    }
    scroll.addEventListener('scroll',onScroll,{passive:true});
    // init position to current cfg value
    w.setValue=function(val){
      var idx=Math.max(0,Math.min(vals.length-1,val-min));
      w.idx=idx; setSel(idx); scroll.scrollTop=idx*ITEM;
    };
    return w;
  }
  var wWork=makeWheel('workScroll','work',WORK_MIN,WORK_MAX);
  var wRest=makeWheel('restScroll','rest',REST_MIN,REST_MAX);
  // position after layout
  requestAnimationFrame(function(){ wWork.setValue(cfg.work); wRest.setValue(cfg.rest); });

  function renderChrome(){
    el.loopBtn.classList.toggle('on',cfg.rounds===0);
    [].forEach.call(el.soundPick.children,function(b){ b.classList.toggle('on',b.dataset.s===cfg.sound); });
  }
  el.loopBtn.addEventListener('click',function(){ cfg.rounds = cfg.rounds===0 ? 1 : 0; renderChrome(); save(); });
  el.soundPick.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
    cfg.sound=b.dataset.s; renderChrome(); save(); primeAudio(); playSound(cfg.sound,'work'); });
  renderChrome();

  // ---------- audio ----------
  var ac=null;
  function ctx(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); return ac; }
  function primeAudio(){ try{ var c=ctx(); if(c.state==='suspended') c.resume();
    var o=c.createOscillator(),g=c.createGain(); g.gain.value=0.0001; o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+0.02);}catch(e){} }
  function tone(freq,t0,dur,vol,type,glideTo){
    var c=ctx(); var o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
  }
  function playSound(kind,phase){
    var c; try{ c=ctx(); if(c.state==='suspended') c.resume(); }catch(e){ return; }
    var t=c.currentTime, base=phase==='rest'?0.85:1;
    if(kind==='bell'){
      [1,2.76,5.4].forEach(function(m,i){ tone(660*base*m, t, 1.3-i*0.25, i===0?0.5:0.22-i*0.05, 'sine'); });
      tone(660*base, t, 0.05, 0.4, 'triangle');
    } else if(kind==='chime'){
      [523,659,784,1046].forEach(function(f,i){ tone(f*base, t+i*0.11, 0.5, 0.4, 'sine'); });
    } else if(kind==='whistle'){
      tone(1800*base, t, 0.5, 0.4, 'sine', 2400*base);
      tone(1810*base, t, 0.5, 0.2, 'sine', 2410*base);
    } else if(kind==='digital'){
      [0,0.13,0.26].forEach(function(d){ tone(988*base, t+d, 0.1, 0.35, 'square'); });
    } else if(kind==='airhorn'){
      tone(233*base, t, 0.7, 0.4, 'sawtooth'); tone(311*base, t, 0.7, 0.35, 'sawtooth');
      tone(466*base, t, 0.7, 0.2, 'square');
    } else {
      tone(880*base, t, 0.18, 0.4, 'sine');
    }
  }
  function tick(){ var c; try{c=ctx();}catch(e){return;} tone(720,c.currentTime,0.08,0.3,'square'); }
  function finishFanfare(){ var c; try{c=ctx();}catch(e){return;} var t=c.currentTime;
    [523,659,784,1046,1318].forEach(function(f,i){ tone(f,t+i*0.12,0.5,0.4,i>=3?'triangle':'sine'); }); }
  function vibrate(p){ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }

  // ---------- engine ----------
  var st={running:false,paused:false,phase:'work',round:1,endAt:0,remain:0,dur:0,lastWhole:-1,raf:null};

  function setPhaseVars(phase){
    var ph=phase==='work'?'var(--work)':'var(--rest)';
    var gl=phase==='work'?'var(--work-glow)':'var(--rest-glow)';
    el.aura.style.setProperty('--ph',ph); el.aura.style.setProperty('--ph-glow',gl);
    el.run.style.setProperty('--ph',ph); el.run.style.setProperty('--ph-glow',gl);
  }
  function buildPips(){
    el.pips.innerHTML='';
    if(cfg.rounds>0 && cfg.rounds<=12){ for(var i=0;i<cfg.rounds;i++){ var d=document.createElement('div'); d.className='pip'; el.pips.appendChild(d);} }
  }
  function paintPips(){
    [].forEach.call(el.pips.children,function(p,i){ p.className='pip'+(i<st.round-1?' done':i===st.round-1?' cur':''); });
  }
  function beginPhase(phase){
    st.phase=phase; st.dur=phase==='work'?cfg.work:cfg.rest; st.remain=st.dur;
    st.endAt=performance.now()+st.dur*1000; st.lastWhole=-1;
    setPhaseVars(phase);
    el.phaseName.textContent=phase==='work'?'עבודה':'מנוחה';
    el.phaseName.classList.remove('swap'); void el.phaseName.offsetWidth; el.phaseName.classList.add('swap');
    el.bar.classList.remove('pulse');
    playSound(cfg.sound,phase);
    vibrate(phase==='work'?[90,50,90]:60);
    el.nextHint.textContent = phase==='work'
      ? (cfg.rest>0?'אחריי: מנוחה '+fmt(cfg.rest):'')
      : 'אחריי: עבודה '+fmt(cfg.work);
    paintPips(); draw(true);
  }
  function draw(force){
    var frac = st.dur>0 ? Math.max(0,st.remain/st.dur) : 0;
    el.bar.style.strokeDashoffset=(CIRC*(1-frac)).toFixed(2);
    var whole=Math.ceil(st.remain-0.0001); if(whole<0) whole=0;
    if(whole!==st.lastWhole || force){
      el.bigTime.textContent=fmt(whole);
      if(!force && whole<=3 && whole>0){ tick(); vibrate(40);
        el.bigTime.classList.remove('tick'); void el.bigTime.offsetWidth; el.bigTime.classList.add('tick');
        el.bar.classList.add('pulse'); }
      st.lastWhole=whole;
    }
    el.roundInfo.textContent = cfg.rounds>0 ? ('סבב '+st.round+' / '+cfg.rounds) : ('סבב '+st.round);
  }
  function loop(){
    if(!st.running) return;
    if(!st.paused){
      st.remain=(st.endAt-performance.now())/1000;
      if(st.remain<=0){ endPhase(); if(!st.running) return; }
      else draw(false);
    }
    st.raf=requestAnimationFrame(loop);
  }
  function endPhase(){
    vibrate([120,60,120]);
    if(st.phase==='work'){ if(cfg.rest>0){ beginPhase('rest'); return; } nextRound(); }
    else nextRound();
  }
  function nextRound(){
    st.round++;
    if(cfg.rounds>0 && st.round>cfg.rounds){ finish(); return; }
    beginPhase('work');
  }
  function finish(){ stop(); finishFanfare(); vibrate([150,80,150,80,250]); showSetup(); }
  function start(){
    primeAudio();
    st.running=true; st.paused=false; st.round=1;
    el.setup.classList.add('hidden'); el.run.classList.add('on');
    el.pauseBtn.classList.remove('paused');
    el.pauseBtn.querySelector('svg').innerHTML='<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
    buildPips(); beginPhase('work'); requestWake();
    cancelAnimationFrame(st.raf); st.raf=requestAnimationFrame(loop);
  }
  function stop(){ st.running=false; st.paused=false; cancelAnimationFrame(st.raf); releaseWake(); }
  function showSetup(){ el.run.classList.remove('on'); el.setup.classList.remove('hidden');
    el.aura.style.setProperty('--ph','var(--work)'); el.aura.style.setProperty('--ph-glow','var(--work-glow)'); }

  el.startBtn.addEventListener('click',start);
  el.stopBtn.addEventListener('click',function(){ stop(); showSetup(); });
  el.pauseBtn.addEventListener('click',function(){
    if(!st.running) return;
    st.paused=!st.paused;
    if(st.paused){ st.remain=(st.endAt-performance.now())/1000; el.pauseBtn.classList.add('paused');
      el.pauseBtn.querySelector('svg').innerHTML='<path d="M8 5v14l11-7z"/>'; }
    else { st.endAt=performance.now()+st.remain*1000; el.pauseBtn.classList.remove('paused');
      el.pauseBtn.querySelector('svg').innerHTML='<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'; }
  });
  el.backBtn.addEventListener('click',function(){
    if(st.running){ stop(); showSetup(); return; }
    if(document.referrer && /deal/.test(document.referrer)){ location.href='deal.html'; return; }
    if(history.length>1) history.back(); else location.href='index.html';
  });

  var wl=null;
  async function requestWake(){ try{ if('wakeLock' in navigator) wl=await navigator.wakeLock.request('screen'); }catch(e){} }
  function releaseWake(){ try{ if(wl){ wl.release(); wl=null; } }catch(e){} }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&st.running) requestWake(); });

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
</body>
</html>
