<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#EAFBF5"/>
      <stop offset="1" stop-color="#DFF7EF"/>
    </linearGradient>
    <radialGradient id="tile" gradientUnits="userSpaceOnUse" cx="196" cy="150" r="330">
      <stop offset="0" stop-color="#33E6CF"/>
      <stop offset="0.55" stop-color="#0FB9A7"/>
      <stop offset="1" stop-color="#0A8577"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- little tail, bottom-left, behind the tile -->
  <rect x="150" y="330" width="66" height="86" rx="16" fill="#0A8577" transform="rotate(-9 183 373)"/>
  <!-- bubble tile -->
  <rect x="98" y="86" width="316" height="300" rx="82" fill="url(#tile)"/>
  <text x="250" y="232" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800"
        font-size="238" fill="#ffffff">2</text>
</svg>
