const STORAGE_KEY = "greek_vocab_v4";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
}

function initWordState() {
  const map = {};
  ALL_WORDS.forEach(w => {
    map[w.id] = { score: 0, attempts: 0, correct: 0, lastSeen: null };
  });
  return map;
}

function pickWord(wordState, unlockedLevel) {
  const pool = ALL_WORDS.filter(w => w.level <= unlockedLevel);
  const weighted = pool.map(w => {
    const s = wordState[w.id];
    const daysSince = s.lastSeen
      ? (Date.now() - new Date(s.lastSeen)) / 86400000
      : 999;
    const weight = Math.max(1, (10 - s.score) * 3 + Math.min(daysSince * 2, 20));
    return { word: w, weight };
  });
  const total = weighted.reduce((a, b) => a + b.weight, 0);
  let r = Math.random() * total;
  for (const item of weighted) {
    r -= item.weight;
    if (r <= 0) return item.word;
  }
  return weighted[weighted.length - 1].word;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "el-GR";
  utt.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const greek = voices.find(v => v.lang === "el-GR") ||
                voices.find(v => v.lang.startsWith("el"));
  if (greek) utt.voice = greek;
  window.speechSynthesis.speak(utt);
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function normalize(s) {
  return s.trim().replace(/[.,!?;:"'()\/\-]/g, "").replace(/\s+/g, " ").toLowerCase();
}

function checkAnswer(greek, correctHebrew, userAnswer) {
  if (!userAnswer.trim()) return { correct: false, feedback: "לא הקלדת כלום" };

  const normalUser = normalize(userAnswer);
  const normalCorrect = normalize(correctHebrew);

  if (normalUser === normalCorrect) {
    return { correct: true, feedback: "מצוין!" };
  }

  const variants = correctHebrew.split("/").map(v => normalize(v.trim())).filter(Boolean);

  for (const v of variants) {
    if (normalUser === v || v === normalUser) {
      return { correct: true, feedback: "נכון!" };
    }
  }

  for (const v of variants) {
    if (normalUser.includes(v) || v.includes(normalUser)) {
      if (normalUser.length >= 2 && v.length >= 2) {
        return { correct: true, feedback: "קרוב מספיק!" };
      }
    }
  }

  const parenthetical = correctHebrew.match(/^([^(]+)\s*\(/);
  if (parenthetical) {
    const mainPart = normalize(parenthetical[1]);
    if (normalUser === mainPart || normalUser.includes(mainPart) || mainPart.includes(normalUser)) {
      if (normalUser.length >= 2) {
        return { correct: true, feedback: "נכון!" };
      }
    }
  }

  return { correct: false, feedback: "התשובה הנכונה: " + correctHebrew };
}

function ProgressBar({ value, max, color = "#3b82f6" }) {
  const pct = max ? Math.round((value / max) * 100) : 0;
  return (
    <div style={{ background: "#e5e7eb", borderRadius: 99, height: 8, overflow: "hidden" }}>
      <div style={{
        width: pct + "%", height: "100%",
        background: color, borderRadius: 99,
        transition: "width 0.6s ease"
      }} />
    </div>
  );
}

function StarRating({ score }) {
  const stars = Math.min(5, Math.max(0, Math.round(score / 2)));
  return (
    <span style={{ fontSize: 14, letterSpacing: 1 }}>
      {"★".repeat(stars)}{"☆".repeat(5 - stars)}
    </span>
  );
}

      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ fontSize: 48, marginBottom: 8 }}>🇬🇷</div>
        <h1 style={{ margin: 0, fontSize: 26, fontWeight: 800, color: "#1e3a5f", fontFamily: "sans-serif" }}>
          יווניCal
        </h1>
        <p style={{ margin: "4px 0 0", color: "#6b7280", fontSize: 14 }}>
          500 מילים לתייר שנחת הרגע
        </p>
      </div>

      <div style={{
        display: "grid", gridTemplateColumns: "1fr 1fr 1fr",
        gap: 12, marginBottom: 24
      }}>
        {[
          { label: "נלמדו", value: learned, color: "#3b82f6", icon: "📚" },
          { label: "שולטים", value: mastered, color: "#10b981", icon: "⭐" },
          { label: "חלשות", value: weak, color: "#ef4444", icon: "🔄" },
        ].map(s => (
          <div key={s.label} style={{
            background: "#f8fafc", borderRadius: 14, padding: "14px 10px",
            textAlign: "center", border: "1px solid #e2e8f0"
          }}>
            <div style={{ fontSize: 22 }}>{s.icon}</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: s.color }}>{s.value}</div>
            <div style={{ fontSize: 12, color: "#6b7280" }}>{s.label}</div>
          </div>
        ))}
      </div>

      <div style={{
        background: "#f0f9ff", borderRadius: 14, padding: 16,
        marginBottom: 20, border: "1px solid #bae6fd"
      }}>
        <div style={{
          display: "flex", justifyContent: "space-between",
          marginBottom: 8, fontSize: 14, fontWeight: 600, color: "#0369a1"
        }}>
          <span>התקדמות כללית</span>
          <span>{learned} / {total}</span>
        </div>
        <ProgressBar value={learned} max={total} color="#0ea5e9" />
        <div style={{ marginTop: 8, fontSize: 12, color: "#6b7280", textAlign: "center" }}>
          רמה נוכחית: {Math.min(10, Math.floor(mastered / 50) + 1)} — {LEVEL_NAMES[Math.min(10, Math.floor(mastered / 50) + 1)]}
        </div>
      </div>

      <button onClick={() => onStart("all")} style={{
        width: "100%", padding: "16px 0", fontSize: 18, fontWeight: 700,
        background: "linear-gradient(135deg, #1e3a5f, #2563eb)",
        color: "#fff", border: "none", borderRadius: 14, cursor: "pointer",
        marginBottom: 12, letterSpacing: 0.5, boxShadow: "0 4px 14px rgba(37,99,235,0.35)"
      }}>
        תרגול חכם 🚀
      </button>

      {weak > 0 && (
        <button onClick={() => onStart("weak")} style={{
          width: "100%", padding: "13px 0", fontSize: 16, fontWeight: 600,
          background: "#fef2f2", color: "#dc2626",
          border: "2px solid #fca5a5", borderRadius: 14, cursor: "pointer",
          marginBottom: 12
        }}>
          חזרה על מילים קשות ({weak}) 🔄
        </button>
      )}

      <button onClick={onRoadmap} style={{
        width: "100%", padding: "13px 0", fontSize: 16, fontWeight: 600,
        background: "#f0fdf4", color: "#16a34a",
        border: "2px solid #86efac", borderRadius: 14, cursor: "pointer"
      }}>
        מפת הדרכים 🗺️
      </button>
    </div>
  );
}

function RoadmapScreen({ wordState, onBack }) {
  const levels = Array.from({ length: 10 }, (_, i) => i + 1);

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", marginBottom: 20, gap: 12 }}>
        <button onClick={onBack} style={{
          background: "none", border: "none", fontSize: 22, cursor: "pointer"
        }}>←</button>
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: "#1e3a5f" }}>
          מפת הדרכים
        </h2>
      </div>

      {levels.map(lvl => {
        const words = ALL_WORDS.filter(w => w.level === lvl);
        const attempted = words.filter(w => wordState[w.id]?.attempts > 0).length;
        const mastered = words.filter(w => wordState[w.id]?.score >= 8).length;
        const pct = Math.round((mastered / 50) * 100);
        const isActive = attempted > 0;

        return (
          <div key={lvl} style={{
            display: "flex", gap: 14, alignItems: "flex-start",
            marginBottom: 16, opacity: isActive ? 1 : 0.5
          }}>
            <div style={{
              minWidth: 44, height: 44, borderRadius: "50%",
              background: mastered === 50 ? "#10b981" : isActive ? "#2563eb" : "#e5e7eb",
              color: "#fff", display: "flex", alignItems: "center", justifyContent: "center",
              fontWeight: 800, fontSize: 16, flexShrink: 0
            }}>
              {mastered === 50 ? "✓" : lvl}
            </div>
            <div style={{ flex: 1 }}>
              <div style={{
                display: "flex", justifyContent: "space-between",
                fontSize: 14, fontWeight: 700, color: "#1e3a5f", marginBottom: 4
              }}>
                <span>{LEVEL_NAMES[lvl]}</span>
                <span style={{ color: "#6b7280" }}>{mastered}/50</span>
              </div>
              <ProgressBar value={mastered} max={50}
                color={mastered === 50 ? "#10b981" : "#2563eb"} />
              <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 3 }}>
                {pct}% שולטים · {attempted} נלמדו
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function PracticeScreen({ wordState, mode, onEnd, onUpdateWord }) {
  const [currentWord, setCurrentWord] = useState(null);
  const [input, setInput] = useState("");
  const [result, setResult] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [sessionStats, setSessionStats] = useState({ correct: 0, wrong: 0, total: 0 });
  const inputRef = useRef(null);

  const unlockedLevel = Math.min(10,
    Math.floor(ALL_WORDS.filter(w => wordState[w.id]?.score >= 8).length / 50) + 1
  );

  const loadNext = useCallback(() => {
    const word = pickWord(wordState, unlockedLevel);
    setCurrentWord(word);
    setInput("");
    setResult(null);
    setRevealed(false);
    setTimeout(() => inputRef.current?.focus(), 100);
  }, [wordState, unlockedLevel]);

  useEffect(() => { loadNext(); }, []);

  useEffect(() => {
    if (currentWord) speak(currentWord.greek);
  }, [currentWord]);

  const handleSubmit = () => {
    if (!input.trim() || result) return;
    const { correct, feedback } = checkAnswer(currentWord.greek, currentWord.hebrew, input);
    setResult({ correct, feedback });

    const prev = wordState[currentWord.id];
    const newScore = correct
      ? Math.min(10, prev.score + 1)
      : Math.max(0, prev.score - 1);

    onUpdateWord(currentWord.id, {
      score: newScore,
      attempts: prev.attempts + 1,
      correct: prev.correct + (correct ? 1 : 0),
      lastSeen: new Date().toISOString()
    });

    setSessionStats(s => ({
      correct: s.correct + (correct ? 1 : 0),
      wrong: s.wrong + (correct ? 0 : 1),
      total: s.total + 1
    }));
  };

  const handleReveal = () => {
    if (revealed || result) return;
    setRevealed(true);
    const prev = wordState[currentWord.id];
    onUpdateWord(currentWord.id, {
      score: Math.max(0, prev.score - 1),
      attempts: prev.attempts + 1,
      correct: prev.correct,
      lastSeen: new Date().toISOString()
    });
    setSessionStats(s => ({ ...s, wrong: s.wrong + 1, total: s.total + 1 }));
  };

  if (!currentWord) return <div style={{ padding: 40, textAlign: "center" }}>טוען...</div>;

  const accuracy = sessionStats.total
    ? Math.round((sessionStats.correct / sessionStats.total) * 100) : 0;

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",
        marginBottom: 20
      }}>
        <button onClick={onEnd} style={{
          background: "none", border: "none", fontSize: 22, cursor: "pointer"
        }}>←</button>
        <div style={{ fontSize: 13, color: "#6b7280", display: "flex", gap: 16 }}>
          <span>✅ {sessionStats.correct}</span>
          <span>❌ {sessionStats.wrong}</span>
          {sessionStats.total > 0 && <span>🎯 {accuracy}%</span>}
        </div>
      </div>

      <div style={{
        background: "linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%)",
        borderRadius: 20, padding: "32px 24px", textAlign: "center",
        marginBottom: 20, boxShadow: "0 8px 28px rgba(37,99,235,0.28)"
      }}>
        <div style={{ fontSize: 11, color: "#93c5fd", marginBottom: 8, letterSpacing: 1 }}>
          רמה {currentWord.level} · {LEVEL_NAMES[currentWord.level]}
        </div>
        <div style={{
          fontSize: 48, fontWeight: 800, color: "#fff",
          letterSpacing: 2, marginBottom: 8, wordBreak: "break-word"
        }}>
          {currentWord.greek}
        </div>
        <StarRating score={wordState[currentWord.id]?.score || 0} />
        <div style={{ marginTop: 4, fontSize: 11, color: "#93c5fd" }}>
          {wordState[currentWord.id]?.attempts || 0} ניסיונות
        </div>

        <button
          onClick={() => speak(currentWord.greek)}
          style={{
            marginTop: 16, padding: "8px 20px", borderRadius: 99,
            background: "rgba(255,255,255,0.2)", border: "1px solid rgba(255,255,255,0.4)",
            color: "#fff", fontSize: 15, cursor: "pointer", display: "inline-flex",
            alignItems: "center", gap: 6
          }}>
          🔊 שמע
        </button>
      </div>

      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: "#6b7280", marginBottom: 8, textAlign: "center" }}>
          מה הפירוש בעברית?
        </div>
        <input
          ref={inputRef}
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && handleSubmit()}
          disabled={!!result}
          placeholder="הקלד את התרגום..."
          dir="rtl"
          style={{
            width: "100%", padding: "14px 16px", fontSize: 18,
            border: result
              ? ("2px solid " + (result.correct ? "#10b981" : "#ef4444"))
              : "2px solid #e5e7eb",
            borderRadius: 12, outline: "none", boxSizing: "border-box",
            background: result
              ? (result.correct ? "#f0fdf4" : "#fef2f2")
              : "#fff",
            textAlign: "right"
          }}
        />
      </div>

      {result && (
        <div style={{
          padding: "12px 16px", borderRadius: 12, marginBottom: 16,
          background: result.correct ? "#f0fdf4" : "#fef2f2",
          border: "1px solid " + (result.correct ? "#86efac" : "#fca5a5"),
          color: result.correct ? "#166534" : "#991b1b",
          fontSize: 15, fontWeight: 600, textAlign: "center", direction: "rtl"
        }}>
          {result.feedback}
          {!result.correct && (
            <div style={{ fontSize: 13, fontWeight: 400, marginTop: 4, color: "#6b7280" }}>
              התשובה: {currentWord.hebrew}
            </div>
          )}
        </div>
      )}

      {revealed && !result && (
        <div style={{
          padding: "12px 16px", borderRadius: 12, marginBottom: 16,
          background: "#fffbeb", border: "1px solid #fcd34d",
          color: "#92400e", fontSize: 16, fontWeight: 700,
          textAlign: "center", direction: "rtl"
        }}>
          📖 התשובה: {currentWord.hebrew}
          <div style={{ fontSize: 12, fontWeight: 400, color: "#78716c", marginTop: 4 }}>
            נספר כטעות — לחץ המשך
          </div>
        </div>
      )}

      {!result && !revealed ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <button
            onClick={handleSubmit}
            disabled={!input.trim()}
            style={{
              width: "100%", padding: "15px 0", fontSize: 17, fontWeight: 700,
              background: "#2563eb",
              color: "#fff", border: "none", borderRadius: 14, cursor: "pointer",
              opacity: !input.trim() ? 0.5 : 1
            }}>
            בדוק ✓
          </button>
          <button
            onClick={handleReveal}
            style={{
              width: "100%", padding: "12px 0", fontSize: 15, fontWeight: 600,
              background: "#fff", color: "#6b7280",
              border: "2px solid #e5e7eb", borderRadius: 14, cursor: "pointer"
            }}>
            לא יודע — הצג תשובה 👁️
          </button>
        </div>
      ) : (
        <button onClick={loadNext} style={{
          width: "100%", padding: "15px 0", fontSize: 17, fontWeight: 700,
          background: "linear-gradient(135deg, #1e3a5f, #2563eb)",
          color: "#fff", border: "none", borderRadius: 14, cursor: "pointer"
        }}>
          המשך ←
        </button>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [wordState, setWordState] = useState(null);
  const [practiceMode, setPracticeMode] = useState("all");

  useEffect(() => {
    const saved = loadData();
    if (saved?.wordState) {
      const merged = initWordState();
      Object.keys(saved.wordState).forEach(id => {
        if (merged[id] !== undefined) merged[id] = saved.wordState[id];
      });
      setWordState(merged);
    } else {
      setWordState(initWordState());
    }
    setScreen("home");
  }, []);

  const saveTimer = useRef(null);
  useEffect(() => {
    if (!wordState) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveData({ wordState, savedAt: new Date().toISOString() });
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [wordState]);

  const handleUpdateWord = useCallback((id, updates) => {
    setWordState(prev => ({
      ...prev,
      [id]: { ...prev[id], ...updates }
    }));
  }, []);

  if (screen === "loading" || !wordState) {
    return (
      <div style={{
        minHeight: "100vh", display: "flex", alignItems: "center",
        justifyContent: "center", flexDirection: "column", gap: 12,
        background: "#f8fafc", fontFamily: "sans-serif"
      }}>
        <div style={{ fontSize: 48 }}>🇬🇷</div>
        <div style={{ color: "#6b7280", fontSize: 16 }}>טוען...</div>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", minHeight: "100dvh", background: "#f8fafc",
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      direction: "rtl"
    }}>
      {screen === "home" && (
        <HomeScreen
          wordState={wordState}
          onStart={(mode) => { setPracticeMode(mode); setScreen("practice"); }}
          onRoadmap={() => setScreen("roadmap")}
        />
      )}
      {screen === "practice" && (
        <PracticeScreen
          wordState={wordState}
          mode={practiceMode}
          onEnd={() => setScreen("home")}
          onUpdateWord={handleUpdateWord}
        />
      )}
      {screen === "roadmap" && (
        <RoadmapScreen
          wordState={wordState}
          onBack={() => setScreen("home")}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
