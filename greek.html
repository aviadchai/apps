const WORD_WIKI = {
  12:"Water", 14:"Flush toilet", 15:"Hospital", 39:"Fire", 40:"Ice",
  61:"Coffee", 64:"Red wine", 67:"Bread", 82:"Fish", 93:"Ice cream",
  101:"Hotel", 118:"Beach", 119:"Ocean", 120:"Sun", 128:"Ship",
  152:"Airplane", 156:"Bus", 159:"Taxicab", 160:"Automobile", 162:"Bicycle",
  206:"Clothing", 207:"Sneakers", 216:"Gift", 218:"Handbag", 238:"Smartphone",
  252:"Greek Orthodox Church", 256:"Castle", 261:"Mountain", 262:"River", 270:"Landscape",
  341:"Birthday cake", 342:"Fireworks", 345:"Champagne", 349:"Joy", 350:"Sadness",
  369:"Flower", 374:"Dog", 375:"Cat", 376:"Horse", 378:"Bird",
  413:"Heart", 428:"Ambulance", 430:"Wildfire", 435:"Snake", 436:"Scorpion",
  451:"Santorini", 477:"Christmas tree", 482:"Sirtaki", 484:"Taverna", 492:"Acropolis of Athens"
};

const _wikiCache = {};

function WordImage({ wordId, size = 80, style }) {
  const title = WORD_WIKI[wordId];
  const [src, setSrc] = React.useState(null);
  React.useEffect(() => {
    if (!title) return;
    if (_wikiCache[wordId] !== undefined) {
      if (_wikiCache[wordId]) setSrc(_wikiCache[wordId]);
      return;
    }
    _wikiCache[wordId] = false;
    fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)
      .then(r => r.json())
      .then(d => { const u = d?.thumbnail?.source; _wikiCache[wordId] = u || false; if (u) setSrc(u); })
      .catch(() => { _wikiCache[wordId] = false; });
  }, [wordId]);
  if (!src) return null;
  return <img src={src} alt="" style={{ width: size, height: size, objectFit: "cover", borderRadius: 10, marginBottom: 8, boxShadow: "0 2px 10px rgba(0,0,0,0.25)", ...style }} onError={() => setSrc(null)} />;
}

  1:"הישרדות בסיסית",2:"מסעדה וקפה",3:"מלון וחוף",
  4:"תחבורה וזמן",5:"קניות ובריאות",6:"תיירות ואתרים",
  7:"אנשים ושיחה",8:"טבע ומזג אוויר",9:"חירום ורפואה",
  10:"שפה ותרבות"
};

const STORAGE_KEY = "greek_vocab_v5";
const OLD_STORAGE_KEY = "greek_vocab_v4";
const IDB_NAME = "greekVocabDB";
const IDB_STORE = "state";

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbSave(data) {
  openIDB().then(db => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(data, STORAGE_KEY);
  }).catch(() => {});
}

function idbLoadKey(key) {
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  })).catch(() => null);
}

function idbLoad() {
  return idbLoadKey(STORAGE_KEY).then(data => data || idbLoadKey(OLD_STORAGE_KEY));
}

function migrateStreak(data) {
  if (data && data.wordState) {
    Object.keys(data.wordState).forEach(id => {
      if (data.wordState[id].streak === undefined) {
        data.wordState[id].streak = 0;
      }
    });
  }
  return data;
}

// v4 -> v5: add per-phrase scoring map + practice-type preference, keep all existing word progress intact.
function migrateToV5(data) {
  if (!data) return data;
  if (!data.phraseState) data.phraseState = {};
  if (data.practiceType !== "words" && data.practiceType !== "phrases" && data.practiceType !== "mixed") {
    data.practiceType = "mixed";
  }
  return data;
}

function migrateData(data) {
  return migrateToV5(migrateStreak(data));
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrateData(JSON.parse(raw));
  } catch (e) {}
  try {
    const rawOld = localStorage.getItem(OLD_STORAGE_KEY);
    if (rawOld) return migrateData(JSON.parse(rawOld));
  } catch (e) {}
  return null;
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
  idbSave(data);
}

function initWordState() {
  const map = {};
  ALL_WORDS.forEach(w => {
    map[w.id] = { score: 0, attempts: 0, correct: 0, streak: 0, lastSeen: null, pinned: false };
  });
  return map;
}

function initPhraseState() {
  const map = {};
  PHRASE_PATTERNS.forEach(p => {
    map[p.id] = { score: 0, attempts: 0, correct: 0, streak: 0, lastSeen: null, pinned: false };
  });
  return map;
}

const LEARNED_STREAK = 3;
const PHRASE_UNLOCK_SCORE = 2;
const PHRASE_UNLOCK_RATIO = 0.4;

function isPatternUnlocked(wordState, pattern) {
  const ids = pattern.usesWordIds || [];
  if (ids.length === 0) return true;
  const readyCount = ids.filter(id => (wordState[id]?.score || 0) >= PHRASE_UNLOCK_SCORE).length;
  return readyCount / ids.length >= PHRASE_UNLOCK_RATIO;
}

function getUnlockedPhrases(wordState, phraseState, unlockedLevel) {
  return PHRASE_PATTERNS.filter(p =>
    p.level <= unlockedLevel &&
    isPatternUnlocked(wordState, p) &&
    (phraseState[p.id]?.streak || 0) < LEARNED_STREAK
  );
}

function pickPhrase(wordState, phraseState, unlockedLevel, recentIds) {
  const pool = getUnlockedPhrases(wordState, phraseState, unlockedLevel);
  if (pool.length === 0) return null;
  const recentSet = new Set(recentIds || []);
  const nonRecent = pool.filter(p => !recentSet.has(p.id));
  const candidates = nonRecent.length > 0 ? nonRecent : pool;
  const weighted = candidates.map(p => {
    const s = phraseState[p.id] || { score: 0, attempts: 0, lastSeen: null };
    const daysSince = s.lastSeen ? (Date.now() - new Date(s.lastSeen)) / 86400000 : 999;
    const scoreFactor = Math.pow(10 - s.score, 2);
    const timeFactor = Math.min(daysSince * 3, 30);
    const newBonus = s.attempts === 0 ? 15 : 0;
    const weight = Math.max(1, scoreFactor + timeFactor + newBonus);
    return { item: p, weight };
  });
  const total = weighted.reduce((a, b) => a + b.weight, 0);
  let r = Math.random() * total;
  for (const it of weighted) {
    r -= it.weight;
    if (r <= 0) return it.item;
  }
  return weighted[weighted.length - 1].item;
}

// practiceType: "words" | "phrases" | "mixed" — decides whether pickPracticeItem draws from ALL_WORDS, PHRASE_PATTERNS, or both.
function pickPracticeItem(wordState, phraseState, unlockedLevel, mode, practiceType, recentIds) {
  if (practiceType === "phrases") {
    const phrase = pickPhrase(wordState, phraseState, unlockedLevel, recentIds);
    return phrase ? { ...phrase, _isPhrase: true } : null;
  }
  if (practiceType === "mixed") {
    const phrasePool = getUnlockedPhrases(wordState, phraseState, unlockedLevel);
    if (phrasePool.length > 0 && Math.random() < 0.3) {
      const phrase = pickPhrase(wordState, phraseState, unlockedLevel, recentIds);
      if (phrase) return { ...phrase, _isPhrase: true };
    }
  }
  const word = pickWord(wordState, unlockedLevel, mode, recentIds);
  return { ...word, _isPhrase: false };
}

function getFocusGroup(wordState, unlockedLevel, mode) {
  let pool = ALL_WORDS.filter(w => w.level <= unlockedLevel);
  if (mode === "weak") return pool.filter(w => wordState[w.id]?.attempts > 0 && wordState[w.id]?.score < 3).slice(0, 8);
  if (mode === "pinned") return pool.filter(w => wordState[w.id]?.pinned).slice(0, 8);

  const inProgress = pool.filter(w => {
    const s = wordState[w.id];
    return s.attempts > 0 && s.streak < LEARNED_STREAK;
  });
  const notStarted = pool.filter(w => wordState[w.id].attempts === 0);

  const group = [...inProgress];
  for (const w of notStarted) {
    if (group.length >= 7) break;
    group.push(w);
  }
  if (group.length < 4 && notStarted.length > 0) {
    for (const w of notStarted) {
      if (group.length >= 7) break;
      if (!group.includes(w)) group.push(w);
    }
  }
  return group.length > 0 ? group : pool.filter(w => wordState[w.id].streak < LEARNED_STREAK).slice(0, 7);
}

function pickWord(wordState, unlockedLevel, mode, recentIds) {
  const focus = getFocusGroup(wordState, unlockedLevel, mode);
  const allPool = ALL_WORDS.filter(w => w.level <= unlockedLevel && (wordState[w.id]?.streak || 0) < LEARNED_STREAK);
  const useFocus = focus.length > 0 && Math.random() < 0.75;
  const pool = useFocus ? focus : (allPool.length > 0 ? allPool : ALL_WORDS.filter(w => w.level <= unlockedLevel));

  const recentSet = new Set(recentIds || []);
  const nonRecent = pool.filter(w => !recentSet.has(w.id));
  const candidates = nonRecent.length > 0 ? nonRecent : pool;

  const weighted = candidates.map(w => {
    const s = wordState[w.id];
    const daysSince = s.lastSeen
      ? (Date.now() - new Date(s.lastSeen)) / 86400000
      : 999;
    const scoreFactor = Math.pow(10 - s.score, 2);
    const timeFactor = Math.min(daysSince * 3, 30);
    const newBonus = s.attempts === 0 ? 15 : 0;
    let weight = Math.max(1, scoreFactor + timeFactor + newBonus);
    if (s.pinned) weight *= 4;
    return { word: w, weight };
  });
  const total = weighted.reduce((a, b) => a + b.weight, 0);
  let r = Math.random() * total;
  for (const item of weighted) {
    r -= item.weight;
    if (r <= 0) return item.word;
  }
  return weighted[weighted.length - 1].word;
}

      })},

      })},
    { needs: ["νησί","πλοίο","εισιτήριο","πόσο"],

      })},

        he: "סליחה, איפה תחנת האוטובוס?"
      })},
    { needs: ["στην υγειά μας","κρασί","νόστιμο"],

        he: "לחיים! היין מאוד טעים!"
      })},
    { needs: ["πονάω","κεφάλι","φαρμακείο","πού"],

  if (matching.length === 0) {

    return {

      he: known.map(w => w.hebrew).join(", "),
    };
  }
  return matching[dayHash % matching.length].build();
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "el-GR";
  utt.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const greek = voices.find(v => v.lang === "el-GR") ||
                voices.find(v => v.lang.startsWith("el"));
  if (greek) utt.voice = greek;
  window.speechSynthesis.speak(utt);
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function normalize(s) {
  return s.trim().replace(/[.,!?;:"'()\/\-]/g, "").replace(/\s+/g, " ").toLowerCase();
}

function checkAnswer(greek, correctHebrew, userAnswer) {
  if (!userAnswer.trim()) return { correct: false, feedback: "לא הקלדת כלום" };

  const normalUser = normalize(userAnswer);
  const normalCorrect = normalize(correctHebrew);

  if (normalUser === normalCorrect) {
    return { correct: true, feedback: "מצוין!" };
  }

  const variants = correctHebrew.split("/").map(v => normalize(v.trim())).filter(Boolean);

  for (const v of variants) {
    if (normalUser === v || v === normalUser) {
      return { correct: true, feedback: "נכון!" };
    }
  }

  for (const v of variants) {
    if (normalUser.includes(v) || v.includes(normalUser)) {
      if (normalUser.length >= 2 && v.length >= 2) {
        return { correct: true, feedback: "קרוב מספיק!" };
      }
    }
  }

  const parenthetical = correctHebrew.match(/^([^(]+)\s*\(/);
  if (parenthetical) {
    const mainPart = normalize(parenthetical[1]);
    if (normalUser === mainPart || normalUser.includes(mainPart) || mainPart.includes(normalUser)) {
      if (normalUser.length >= 2) {
        return { correct: true, feedback: "נכון!" };
      }
    }
  }

  return { correct: false, feedback: "התשובה הנכונה: " + correctHebrew };
}

function ProgressBar({ value, max, color = "#007aff" }) {
  const pct = max ? Math.round((value / max) * 100) : 0;
  return (
    <div style={{ background: "#e5e5ea", borderRadius: 99, height: 6, overflow: "hidden" }}>
      <div style={{
        width: pct + "%", height: "100%",
        background: color, borderRadius: 99,
        transition: "width 0.6s ease"
      }} />
    </div>
  );
}

function StarRating({ score }) {
  const stars = Math.min(5, Math.max(0, Math.round(score / 2)));
  return (
    <span style={{ fontSize: 14, letterSpacing: 2 }}>
      {[1,2,3,4,5].map(i => (
        <span key={i} style={{ color: i <= stars ? "#ff9f0a" : "rgba(255,255,255,0.25)" }}>●</span>
      ))}
    </span>
  );
}

function getReviewDue(wordState) {
  return ALL_WORDS.filter(w => {
    const s = wordState[w.id];
    if (!s || s.streak < LEARNED_STREAK) return false;
    if (!s.lastSeen) return true;
    const hoursSince = (Date.now() - new Date(s.lastSeen).getTime()) / 3600000;
    const interval = Math.pow(2, Math.min(s.score, 8)) * 4;
    return hoursSince >= interval;
  });
}

function LearnNewScreen({ wordState, onDone, onUpdateWord }) {
  const [phase, setPhase] = useState("cards");
  const [cardIndex, setCardIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, total: 0 });
  const [queue, setQueue] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [round, setRound] = useState(1);

  const unlockedLevel = Math.min(10, Math.floor(ALL_WORDS.filter(w => wordState[w.id]?.score >= 8).length / 50) + 1);
  const [words] = useState(() => {
    const inProgress = ALL_WORDS.filter(w => w.level <= unlockedLevel && wordState[w.id]?.attempts > 0 && wordState[w.id]?.streak < LEARNED_STREAK);
    const fresh = ALL_WORDS.filter(w => w.level <= unlockedLevel && wordState[w.id]?.attempts === 0);
    const batch = [...inProgress.slice(0, 3), ...fresh].slice(0, 6);
    return batch.length > 0 ? batch : ALL_WORDS.filter(w => w.level <= unlockedLevel).slice(0, 6);
  });

  const makeQuestion = useCallback((w) => {
    const others = ALL_WORDS.filter(o => o.id !== w.id && o.level <= unlockedLevel)
      .sort(() => Math.random() - 0.5).slice(0, 3);
    return { word: w, options: [w, ...others].sort(() => Math.random() - 0.5) };
  }, [unlockedLevel]);

  const startQuiz = useCallback(() => {
    const focusCount = 18;
    const widerCount = 7;
    const focusQ = [];
    for (let r = 0; r < 3; r++) {
      [...words].sort(() => Math.random() - 0.5).forEach(w => focusQ.push(makeQuestion(w)));
    }
    const widerPool = ALL_WORDS.filter(w =>
      w.level <= unlockedLevel &&
      (wordState[w.id]?.streak || 0) < LEARNED_STREAK &&
      !words.find(fw => fw.id === w.id)
    ).sort(() => Math.random() - 0.5).slice(0, widerCount);
    const widerQ = widerPool.map(w => makeQuestion(w));
    const mixed = [];
    let fi = 0, wi = 0;
    while (fi < focusQ.length || wi < widerQ.length) {
      if (fi < focusQ.length && (Math.random() < 0.7 || wi >= widerQ.length)) {
        mixed.push(focusQ[fi++]);
      } else if (wi < widerQ.length) {
        mixed.push(widerQ[wi++]);
      }
    }
    setQueue(mixed);
    setQIdx(0);
    setSelected(null);
    setRound(1);
    setPhase("quiz");
  }, [words, wordState, makeQuestion, unlockedLevel]);

  if (phase === "cards") {
    const w = words[cardIndex];
    return (
      <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto", animation: "fadeIn 0.3s ease" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <button onClick={onDone} style={{
            background: "#fff", border: "none", borderRadius: 10, fontSize: 18,
            width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 1px 4px rgba(0,0,0,0.06)", color: "#007aff", cursor: "pointer"
          }}>←</button>
          <div style={{ fontSize: 14, color: "#8e8e93", fontWeight: 600 }}>
            {cardIndex + 1} / {words.length}
          </div>
          <div style={{ width: 36 }} />
        </div>

        <div style={{ background: "#e5e5ea", borderRadius: 99, height: 4, marginBottom: 24, overflow: "hidden" }}>
          <div style={{ width: ((cardIndex + 1) / words.length * 100) + "%", height: "100%", background: "#007aff", borderRadius: 99, transition: "width 0.3s" }} />
        </div>

        <div onClick={() => { setFlipped(!flipped); speak(w.greek); }} style={{
          background: "#fff", borderRadius: 20, padding: "40px 24px",
          textAlign: "center", cursor: "pointer", minHeight: 260,

        }}>

            {LEVEL_NAMES[w.level]}
          </div>
          <div style={{ fontSize: 36, fontWeight: 700, color: "#1c1c1e", direction: "ltr", marginBottom: 8 }}>
            {w.greek}
          </div>
          <button onClick={(e) => { e.stopPropagation(); speak(w.greek); }} style={{
            background: "#f2f2f7", border: "none", borderRadius: 99, padding: "6px 16px",
            fontSize: 13, color: "#007aff", fontWeight: 500, cursor: "pointer", marginBottom: 16
          }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#007aff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{verticalAlign:"middle",marginLeft:4}}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            השמע
          </button>
          <WordImage wordId={w.id} size={64} />
          {flipped ? (
            <div style={{ animation: "fadeIn 0.2s ease" }}>
              <div style={{ fontSize: 22, fontWeight: 600, color: "#007aff", marginBottom: 4 }}>
                {w.hebrew}
              </div>
            </div>
          ) : (
            <div style={{ fontSize: 14, color: "#aeaeb2" }}>
              הקש לתרגום
            </div>
          )}
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          {cardIndex > 0 && (
            <button onClick={() => { setCardIndex(cardIndex - 1); setFlipped(false); }} style={{
              flex: 1, padding: "14px 0", fontSize: 16, fontWeight: 600,
              background: "#fff", color: "#8e8e93", border: "none", borderRadius: 14, cursor: "pointer",
              boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
            }}>הקודם</button>
          )}
          <button onClick={() => {
            if (cardIndex < words.length - 1) { setCardIndex(cardIndex + 1); setFlipped(false); }
            else startQuiz();
          }} style={{
            flex: 1, padding: "14px 0", fontSize: 16, fontWeight: 700,
            background: "#007aff", color: "#fff", border: "none", borderRadius: 14, cursor: "pointer",
            boxShadow: "0 2px 8px rgba(0,122,255,0.3)"
          }}>
            {cardIndex < words.length - 1 ? "הבא" : "התחל מבחן"}
          </button>
        </div>
      </div>
    );
  }

  if (phase === "done") {
    const pct = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center", animation: "fadeIn 0.3s ease" }}>
        <div style={{ fontSize: 48, fontWeight: 700, color: pct >= 80 ? "#007aff" : "#ff9f0a", marginTop: 40, marginBottom: 8 }}>{pct}%</div>
        <div style={{ fontSize: 20, fontWeight: 700, color: "#1c1c1e", marginBottom: 8 }}>
          {pct >= 80 ? "מצוין!" : pct >= 50 ? "לא רע!" : "שווה לחזור"}
        </div>
        <div style={{ fontSize: 15, color: "#8e8e93", marginBottom: 32 }}>{stats.correct} מתוך {stats.total} נכון</div>
        <button onClick={onDone} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "#007aff", color: "#fff", border: "none", borderRadius: 14, cursor: "pointer"
        }}>חזרה</button>
      </div>
    );
  }

  if (queue.length === 0) return null;
  const q = queue[qIdx];
  const totalQ = queue.length;
  const isFocusWord = words.find(w => w.id === q.word.id);

  function handleQuizSelect(id) {
    if (selected !== null) return;
    setSelected(id);
    const correct = id === q.word.id;
    setStats(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    const prev = wordState[q.word.id];
    onUpdateWord(q.word.id, {
      score: correct ? Math.min(10, prev.score + 1) : Math.max(0, prev.score - 1),
      attempts: prev.attempts + 1,
      correct: prev.correct + (correct ? 1 : 0),
      streak: correct ? (prev.streak || 0) + 1 : 0,
      lastSeen: new Date().toISOString()
    });
    if (correct) speak(q.word.greek);
    if (!correct) {
      setQueue(prev => [...prev, makeQuestion(q.word)]);
    }
  }

  function handleNext() {
    if (qIdx < queue.length - 1) {
      setQIdx(qIdx + 1);
      setSelected(null);
    } else {
      setPhase("done");
    }
  }

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto", animation: "fadeIn 0.3s ease" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <button onClick={onDone} style={{
          background: "#fff", border: "none", borderRadius: 10, fontSize: 18,
          width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)", color: "#007aff", cursor: "pointer"
        }}>←</button>
        <div style={{ fontSize: 13, color: "#8e8e93", fontWeight: 600 }}>
          {qIdx + 1}/{totalQ}
        </div>
        <div style={{ fontSize: 13, color: "#007aff", fontWeight: 600 }}>{stats.correct} נכון</div>
      </div>
      <div style={{ background: "#e5e5ea", borderRadius: 99, height: 4, marginBottom: 24, overflow: "hidden" }}>
        <div style={{ width: ((qIdx + 1) / totalQ * 100) + "%", height: "100%", background: "#007aff", borderRadius: 99, transition: "width 0.3s" }} />
      </div>

      <div style={{
        background: "#007aff", borderRadius: 20, padding: "28px 24px",
        textAlign: "center", marginBottom: 20,
        boxShadow: "0 4px 16px rgba(0,122,255,0.25)"
      }}>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,0.7)", marginBottom: 8 }}>{LEVEL_NAMES[q.word.level]}</div>
        <div style={{ fontSize: 32, fontWeight: 700, color: "#fff", direction: "ltr" }}>{q.word.greek}</div>
        <WordImage wordId={q.word.id} size={48} style={{marginTop:8}} />
        <button onClick={() => speak(q.word.greek)} style={{
          marginTop: 8, background: "rgba(255,255,255,0.2)", border: "none",
          borderRadius: 99, padding: "6px 16px", fontSize: 13, color: "#fff", cursor: "pointer"
        }}>השמע</button>
      </div>

      <div style={{ fontSize: 16, fontWeight: 600, color: "#1c1c1e", textAlign: "center", marginBottom: 16 }}>מה התרגום?</div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        {q.options.map(opt => {
          const isThis = selected === opt.id;
          const isRight = opt.id === q.word.id;
          let bg = "#fff", border = "1px solid #e5e5ea", color = "#1c1c1e";
          if (selected !== null) {
            if (isRight) { bg = "#e8f4fd"; border = "2px solid #007aff"; color = "#007aff"; }
            else if (isThis) { bg = "#fff3e0"; border = "2px solid #ff9f0a"; color = "#ff9f0a"; }
          }
          return (
            <button key={opt.id} onClick={() => handleQuizSelect(opt.id)} style={{
              padding: "14px 16px", fontSize: 16, fontWeight: 600, textAlign: "right",
              background: bg, border, color, borderRadius: 14, cursor: selected ? "default" : "pointer",
              boxShadow: "0 1px 4px rgba(0,0,0,0.04)"
            }}>
              {isRight && selected !== null ? "✓ " : ""}{opt.hebrew}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <button onClick={handleNext} style={{
          width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,
          background: "#007aff", color: "#fff", border: "none", borderRadius: 14, cursor: "pointer"
        }}>
          {qIdx < queue.length - 1 ? "הבא" : "סיכום"}
        </button>
      )}
    </div>
  );
}

function RoadmapScreen({ wordState, onBack }) {
  const [expandedLevel, setExpandedLevel] = useState(null);
  const levels = Array.from({ length: 10 }, (_, i) => i + 1);

  return (
    <div style={{ padding: "24px 20px", maxWidth: 480, margin: "0 auto", animation: "fadeIn 0.4s ease" }}>
      <div style={{ display: "flex", alignItems: "center", marginBottom: 20, gap: 12 }}>
        <button onClick={onBack} style={{
          background: "#fff", border: "none", borderRadius: 10,
          fontSize: 18, cursor: "pointer", width: 36, height: 36,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)", color: "#007aff"
        }}>←</button>
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 700, color: "#1c1c1e" }}>
          מפת הדרכים
        </h2>
      </div>

      {levels.map(lvl => {
        const words = ALL_WORDS.filter(w => w.level === lvl);
        const learnedWords = words.filter(w => (wordState[w.id]?.streak || 0) >= LEARNED_STREAK);
        const attempted = learnedWords.length;
        const mastered = words.filter(w => wordState[w.id]?.score >= 8).length;
        const pct = Math.round((mastered / 50) * 100);
        const isActive = attempted > 0;
        const done = mastered === 50;
        const isExpanded = expandedLevel === lvl;

        return (
          <div key={lvl} style={{
            marginBottom: 10, opacity: isActive ? 1 : 0.5,
            background: "#fff", borderRadius: 14,
            border: "none",
            boxShadow: "0 1px 4px rgba(0,0,0,0.06)",
            overflow: "hidden"
          }}>
            <div onClick={() => attempted > 0 && setExpandedLevel(isExpanded ? null : lvl)} style={{
              display: "flex", gap: 14, alignItems: "flex-start",
              padding: "12px 14px",
              cursor: attempted > 0 ? "pointer" : "default"
            }}>
              <div style={{
                minWidth: 36, height: 36, borderRadius: "50%",
                background: done ? "#007aff" : isActive ? "#ff9f0a" : "#e5e5ea",
                color: "#fff", display: "flex", alignItems: "center", justifyContent: "center",
                fontWeight: 700, fontSize: 14, flexShrink: 0
              }}>
                {done ? "✓" : lvl}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{
                  display: "flex", justifyContent: "space-between",
                  fontSize: 14, fontWeight: 600, color: "#1c1c1e", marginBottom: 4
                }}>
                  <span>{LEVEL_NAMES[lvl]}</span>
                  <span style={{ color: "#8e8e93", fontSize: 12 }}>
                    {mastered}/50
                    {attempted > 0 && <span style={{ marginRight: 6 }}>{isExpanded ? "▲" : "▼"}</span>}
                  </span>
                </div>
                <ProgressBar value={mastered} max={50}
                  color={done ? "#007aff" : "#ff9f0a"} />
                <div style={{ fontSize: 11, color: "#8e8e93", marginTop: 3 }}>
                  {pct}% שולטים · {attempted} נלמדו
                </div>
              </div>
            </div>
            {isExpanded && (
              <div style={{
                padding: "0 14px 14px",
                borderTop: "1px solid #f2f2f7",
                animation: "fadeIn 0.2s ease"
              }}>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, paddingTop: 10 }}>
                  {words.map(w => {
                    const streak = wordState[w.id]?.streak || 0;
                    const isLearned = streak >= LEARNED_STREAK;
                    const isMastered = wordState[w.id]?.score >= 8;
                    return (
                      <div key={w.id} style={{
                        padding: "6px 10px", borderRadius: 8,
                        background: isMastered ? "#e8f4fd" : isLearned ? "#f0f9e8" : "#f2f2f7",
                        border: isMastered ? "1px solid #007aff30" : isLearned ? "1px solid #34c75930" : "1px solid #e5e5ea",
                        fontSize: 13, direction: "ltr", textAlign: "left"
                      }}>
                        <span style={{ fontWeight: 600, color: isLearned ? "#1c1c1e" : "#aeaeb2" }}>{w.greek}</span>
                        <span style={{ color: "#8e8e93", fontSize: 11, marginLeft: 4 }}>{w.hebrew}</span>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 10, justifyContent: "center", fontSize: 11, color: "#8e8e93" }}>
                  <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: "#e8f4fd", border: "1px solid #007aff30", marginLeft: 4 }} />שולט</span>
                  <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: "#f0f9e8", border: "1px solid #34c75930", marginLeft: 4 }} />נלמד</span>
                  <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: "#f2f2f7", border: "1px solid #e5e5ea", marginLeft: 4 }} />טרם נלמד</span>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function PracticeScreen({ wordState, phraseState, mode, practiceType, onEnd, onUpdateWord, onUpdatePhrase }) {
  const [currentWord, setCurrentWord] = useState(null);
  const [input, setInput] = useState("");
  const [result, setResult] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [sessionStats, setSessionStats] = useState({ correct: 0, wrong: 0, total: 0 });
  const inputRef = useRef(null);
  const recentRef = useRef([]);

  const unlockedLevel = Math.min(10,
    Math.floor(ALL_WORDS.filter(w => wordState[w.id]?.score >= 8).length / 50) + 1
  );

  const loadNext = useCallback(() => {
    const item = pickPracticeItem(wordState, phraseState, unlockedLevel, mode, practiceType, recentRef.current);
    if (!item) {
      setCurrentWord({ _locked: true });
      return;
    }
    recentRef.current = [...recentRef.current, item.id].slice(-5);
    setCurrentWord(item);
    setInput("");
    setResult(null);
    setRevealed(false);
    setTimeout(() => inputRef.current?.focus(), 80);
  }, [wordState, phraseState, unlockedLevel, mode, practiceType]);

  useEffect(() => { loadNext(); }, []);
  useEffect(() => { if (currentWord && !currentWord._locked) speak(currentWord.greek); }, [currentWord]);

  const recordResult = (correct) => {
    const isPhrase = !!currentWord._isPhrase;
    const stateMap = isPhrase ? phraseState : wordState;
    const update = isPhrase ? onUpdatePhrase : onUpdateWord;
    const prev = stateMap[currentWord.id];
    update(currentWord.id, {
      score: correct ? Math.min(10, prev.score + 1) : Math.max(0, prev.score - 1),
      attempts: prev.attempts + 1,
      correct: prev.correct + (correct ? 1 : 0),
      streak: correct ? (prev.streak || 0) + 1 : 0,
      lastSeen: new Date().toISOString()
    });
    setSessionStats(s => ({
      correct: s.correct + (correct ? 1 : 0),
      wrong: s.wrong + (correct ? 0 : 1),
      total: s.total + 1
    }));
  };

  const handleSubmit = () => {
    if (!input.trim() || result) return;
    const res = checkAnswer(currentWord.greek, currentWord.hebrew, input);
    setResult({ correct: res.correct, feedback: res.feedback });
    recordResult(res.correct);
  };

  const handleReveal = () => {
    if (revealed || result) return;
    setRevealed(true);
    const isPhrase = !!currentWord._isPhrase;
    const stateMap = isPhrase ? phraseState : wordState;
    const update = isPhrase ? onUpdatePhrase : onUpdateWord;
    const prev = stateMap[currentWord.id];
    update(currentWord.id, {
      score: Math.max(0, prev.score - 1),
      attempts: prev.attempts + 1,
      correct: prev.correct,
      streak: 0,
      lastSeen: new Date().toISOString()
    });
    setSessionStats(s => ({ ...s, wrong: s.wrong + 1, total: s.total + 1 }));
  };

  if (!currentWord) return <div style={{ padding: 40, textAlign: "center" }}>טוען...</div>;

  if (currentWord._locked) {
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center", animation: "fadeIn 0.3s ease" }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: "#1c1c1e", marginBottom: 12 }}>
          עוד אין תבניות משפט זמינות
        </div>
        <div style={{ fontSize: 14, color: "#8e8e93", marginBottom: 32 }}>
          למד עוד מילים כדי לפתוח משפטים שימושיים כתגמול
        </div>
        <button onClick={onEnd} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "#007aff", color: "#fff", border: "none", borderRadius: 14, cursor: "pointer"
        }}>חזרה</button>
      </div>
    );
  }

  const accuracy = sessionStats.total ? Math.round((sessionStats.correct / sessionStats.total) * 100) : 0;

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto", animation: "slideUp 0.3s ease" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <button onClick={onEnd} style={{
          background: "#fff", border: "none", borderRadius: 10,
          fontSize: 18, cursor: "pointer", width: 36, height: 36,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)", color: "#007aff"
        }}>←</button>
        <div style={{
          display: "flex", gap: 14, background: "#fff",
          padding: "6px 14px", borderRadius: 99,
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
        }}>
          <span style={{ fontSize: 13, color: "#007aff", fontWeight: 600 }}>{sessionStats.correct} נכון</span>
          <span style={{ fontSize: 13, color: "#ff9f0a", fontWeight: 600 }}>{sessionStats.wrong} שגוי</span>
          {sessionStats.total > 0 && <span style={{ fontSize: 13, color: "#8e8e93", fontWeight: 600 }}>{accuracy}%</span>}
        </div>
      </div>

      <div style={{
        background: "#007aff", borderRadius: 20, padding: "28px 24px",
        textAlign: "center", marginBottom: 20,
        boxShadow: "0 4px 16px rgba(0,122,255,0.25)"
      }}>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,0.6)", marginBottom: 12, letterSpacing: 1 }}>
          רמה {currentWord.level} · {LEVEL_NAMES[currentWord.level]}{currentWord._isPhrase ? " · משפט" : ""}
        </div>
        {!currentWord._isPhrase && <WordImage wordId={currentWord.id} size={80} />}
        <div style={{
          fontSize: currentWord._isPhrase ? 28 : 46, fontWeight: 700, color: "#fff",
          letterSpacing: 1, marginBottom: 20, wordBreak: "break-word", direction: "ltr"
        }}>
          {currentWord.greek}
        </div>
        <button onClick={() => speak(currentWord.greek)} style={{
          padding: "8px 22px", borderRadius: 99,
          background: "rgba(255,255,255,0.2)", border: "1px solid rgba(255,255,255,0.3)",
          color: "#fff", fontSize: 14, cursor: "pointer", display: "inline-flex",
          alignItems: "center", gap: 6, fontWeight: 500
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          שמע
        </button>
      </div>

      <input
        ref={inputRef}
        value={input}
        onChange={e => setInput(e.target.value)}
        onKeyDown={e => e.key === "Enter" && handleSubmit()}
        disabled={!!result || revealed}
        placeholder="תרגום לעברית..."
        dir="rtl"
        style={{
          width: "100%", padding: "15px 16px", fontSize: 19,
          border: result
            ? ("1.5px solid " + (result.correct ? "#007aff" : "#ff9f0a"))
            : "1.5px solid #e5e5ea",
          borderRadius: 14, outline: "none", boxSizing: "border-box",
          background: result ? (result.correct ? "#e8f4fd" : "#fff3e0") : "#fff",
          textAlign: "right", marginBottom: 12
        }}
      />

      {result && (
        <div style={{
          padding: "12px 16px", borderRadius: 12, marginBottom: 12,
          background: result.correct ? "#e8f4fd" : "#fff3e0",
          color: result.correct ? "#007aff" : "#cc7a00",
          fontSize: 15, fontWeight: 600, textAlign: "center", direction: "rtl"
        }}>
          {result.feedback}
        </div>
      )}

      {revealed && !result && (
        <div style={{
          padding: "12px 16px", borderRadius: 12, marginBottom: 12,
          background: "#fff3e0", color: "#cc7a00",
          fontSize: 16, fontWeight: 700, textAlign: "center", direction: "rtl"
        }}>
          התשובה: {currentWord.hebrew}
          <div style={{ fontSize: 12, fontWeight: 400, color: "#8e8e93", marginTop: 4 }}>נספר כטעות</div>
        </div>
      )}

      {!result && !revealed ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <button onClick={handleSubmit} disabled={!input.trim()} style={{
            width: "100%", padding: "15px 0", fontSize: 17, fontWeight: 700,
            background: "#007aff", color: "#fff", border: "none",
            borderRadius: 14, cursor: "pointer", opacity: !input.trim() ? 0.4 : 1
          }}>
            בדוק
          </button>
          <button onClick={handleReveal} style={{
            width: "100%", padding: "12px 0", fontSize: 15, fontWeight: 600,
            background: "#fff", color: "#8e8e93", border: "none",
            borderRadius: 14, cursor: "pointer",
            boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
          }}>
            לא יודע — הצג תשובה
          </button>
        </div>
      ) : (
        <button onClick={loadNext} style={{
          width: "100%", padding: "15px 0", fontSize: 17, fontWeight: 700,
          background: "#007aff", color: "#fff", border: "none",
          borderRadius: 14, cursor: "pointer"
        }}>
          המשך
        </button>
      )}
    </div>
  );
}

function LearnedScreen({ wordState, onBack, onResetWord }) {
  const learnedWords = ALL_WORDS.filter(w => (wordState[w.id]?.streak || 0) >= LEARNED_STREAK);
  const grouped = {};
  learnedWords.forEach(w => {
    if (!grouped[w.level]) grouped[w.level] = [];
    grouped[w.level].push(w);
  });

  return (
    <div style={{ padding: "24px 20px", maxWidth: 480, margin: "0 auto", animation: "fadeIn 0.4s ease" }}>
      <div style={{ display: "flex", alignItems: "center", marginBottom: 20, gap: 12 }}>
        <button onClick={onBack} style={{
          background: "#fff", border: "none", borderRadius: 10,
          fontSize: 18, cursor: "pointer", width: 36, height: 36,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)", color: "#007aff"
        }}>←</button>
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 700, color: "#1c1c1e" }}>
          מילים שנלמדו ({learnedWords.length})
        </h2>
      </div>

      {learnedWords.length === 0 ? (
        <div style={{ textAlign: "center", padding: 40, color: "#8e8e93", fontSize: 15 }}>
          עוד לא למדת מילים — התחל לתרגל!
        </div>
      ) : Object.keys(grouped).sort((a, b) => a - b).map(lvl => (
        <div key={lvl} style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: "#8e8e93", marginBottom: 8 }}>
            {LEVEL_NAMES[lvl]} ({grouped[lvl].length})
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {grouped[lvl].map(w => {
              const isMastered = wordState[w.id]?.score >= 8;
              return (
                <div key={w.id} style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                  background: "#fff", borderRadius: 12, padding: "10px 14px",
                  boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <button onClick={() => speak(w.greek)} style={{
                      background: "none", border: "none", padding: 0, cursor: "pointer",
                      fontSize: 18, color: "#007aff", flexShrink: 0
                    }}>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007aff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                    </button>
                    <div style={{ direction: "ltr", textAlign: "left" }}>
                      <span style={{ fontSize: 16, fontWeight: 600, color: "#1c1c1e" }}>{w.greek}</span>
                      <span style={{ fontSize: 13, color: "#8e8e93", marginLeft: 8 }}>{w.hebrew}</span>
                      {isMastered && <span style={{ fontSize: 10, color: "#007aff", marginRight: 6 }}> שולט</span>}
                    </div>
                  </div>
                  <button onClick={() => onResetWord(w.id)} style={{
                    background: "#f2f2f7", border: "none", borderRadius: 8,
                    padding: "6px 10px", fontSize: 11, fontWeight: 600,
                    color: "#ff9f0a", cursor: "pointer"
                  }}>
                    החזר לתרגול
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [wordState, setWordState] = useState(null);
  const [phraseState, setPhraseState] = useState(null);
  const [practiceMode, setPracticeMode] = useState("all");
  const [practiceType, setPracticeType] = useState("mixed");
  const [startedAt, setStartedAt] = useState(null);

  const [recovered, setRecovered] = useState(false);

  useEffect(() => {
    function applyData(saved) {
      if (saved?.wordState) {
        const mergedWords = initWordState();
        Object.keys(saved.wordState).forEach(id => {
          if (mergedWords[id] !== undefined) mergedWords[id] = { ...mergedWords[id], ...saved.wordState[id] };
        });
        const mergedPhrases = initPhraseState();
        if (saved.phraseState) {
          Object.keys(saved.phraseState).forEach(id => {
            if (mergedPhrases[id] !== undefined) mergedPhrases[id] = { ...mergedPhrases[id], ...saved.phraseState[id] };
          });
        }
        let sa = saved.startedAt || null;
        if (!sa) {
          const dates = Object.values(mergedWords).map(s => s.lastSeen).filter(Boolean);
          if (dates.length > 0) sa = dates.sort()[0];
        }
        const pt = ["words", "phrases", "mixed"].includes(saved.practiceType) ? saved.practiceType : "mixed";
        return { wordState: mergedWords, phraseState: mergedPhrases, startedAt: sa, practiceType: pt };
      }
      return null;
    }

    const lsData = loadData();
    const lsResult = applyData(lsData);
    if (lsResult) {
      setWordState(lsResult.wordState);
      setPhraseState(lsResult.phraseState);
      setStartedAt(lsResult.startedAt);
      setPracticeType(lsResult.practiceType);
      setScreen("home");
    } else {
      idbLoad().then(idbData => {
        const idbResult = applyData(idbData ? migrateData(idbData) : null);
        if (idbResult) {
          setWordState(idbResult.wordState);
          setPhraseState(idbResult.phraseState);
          setStartedAt(idbResult.startedAt);
          setPracticeType(idbResult.practiceType);
          setRecovered(true);
          saveData({ wordState: idbResult.wordState, phraseState: idbResult.phraseState, practiceType: idbResult.practiceType, startedAt: idbResult.startedAt, savedAt: new Date().toISOString() });
        } else {
          const now = new Date().toISOString();
          setWordState(initWordState());
          setPhraseState(initPhraseState());
          setStartedAt(now);
        }
        setScreen("home");
      });
    }
  }, []);

  const wordStateRef = useRef(wordState);
  const phraseStateRef = useRef(phraseState);
  const practiceTypeRef = useRef(practiceType);
  const startedAtRef = useRef(startedAt);
  useEffect(() => { startedAtRef.current = startedAt; }, [startedAt]);
  useEffect(() => {
    wordStateRef.current = wordState;
    phraseStateRef.current = phraseState;
    practiceTypeRef.current = practiceType;
    if (!wordState) return;
    saveData({ wordState, phraseState, practiceType, startedAt: startedAtRef.current, savedAt: new Date().toISOString() });
  }, [wordState, phraseState, practiceType]);

  useEffect(() => {
    function emergencySave() {
      if (wordStateRef.current) {
        saveData({ wordState: wordStateRef.current, phraseState: phraseStateRef.current, practiceType: practiceTypeRef.current, startedAt: startedAtRef.current, savedAt: new Date().toISOString() });
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") emergencySave();
    });
    window.addEventListener("pagehide", emergencySave);
    window.addEventListener("beforeunload", emergencySave);
    return () => {
      document.removeEventListener("visibilitychange", emergencySave);
      window.removeEventListener("pagehide", emergencySave);
      window.removeEventListener("beforeunload", emergencySave);
    };
  }, []);

  const handleUpdateWord = useCallback((id, updates) => {
    setWordState(prev => {
      const next = { ...prev, [id]: { ...prev[id], ...updates } };
      wordStateRef.current = next;
      try { saveData({ wordState: next, phraseState: phraseStateRef.current, practiceType: practiceTypeRef.current, startedAt: startedAtRef.current, savedAt: new Date().toISOString() }); } catch(e) {}
      return next;
    });
  }, []);

  const handleUpdatePhrase = useCallback((id, updates) => {
    setPhraseState(prev => {
      const next = { ...prev, [id]: { ...prev[id], ...updates } };
      phraseStateRef.current = next;
      try { saveData({ wordState: wordStateRef.current, phraseState: next, practiceType: practiceTypeRef.current, startedAt: startedAtRef.current, savedAt: new Date().toISOString() }); } catch(e) {}
      return next;
    });
  }, []);

  const handleChangePracticeType = useCallback((type) => {
    setPracticeType(type);
  }, []);

  if (screen === "loading" || !wordState || !phraseState) {
    return (
      <div style={{
        minHeight: "100vh", display: "flex", alignItems: "center",
        justifyContent: "center", flexDirection: "column", gap: 12,
        background: "#f2f2f7"
      }}>
        <div style={{ fontSize: 20, fontWeight: 600, color: "#007aff" }}>Greek Vocabulary</div>
        <div style={{ color: "#8e8e93", fontSize: 14 }}>טוען...</div>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", minHeight: "100dvh", background: "#f2f2f7",
      direction: "rtl"
    }}>
      {recovered && (
        <div style={{
          position: "fixed", top: 16, left: 16, right: 16, zIndex: 999,
          padding: "12px 16px", borderRadius: 12,
          background: "#e8f4fd", border: "none",
          textAlign: "center", fontSize: 14, fontWeight: 600, color: "#007aff",
          boxShadow: "0 4px 12px rgba(0,0,0,0.1)",
          animation: "fadeIn 0.3s"
        }} onClick={() => setRecovered(false)}>
          הנתונים שוחזרו מגיבוי — הקש לסגור
        </div>
      )}
      {screen === "home" && (
        <HomeScreen
          wordState={wordState}
          startedAt={startedAt}
          practiceType={practiceType}
          onChangePracticeType={handleChangePracticeType}
          onLearn={() => { setPracticeMode("all"); setScreen("practice"); }}
          onReview={() => { setPracticeMode("all"); setScreen("practice"); }}
          onRoadmap={() => setScreen("roadmap")}
          onShowLearned={() => setScreen("learned")}
        />
      )}
      {screen === "learn" && (
        <LearnNewScreen
          wordState={wordState}
          onDone={() => setScreen("home")}
          onUpdateWord={handleUpdateWord}
        />
      )}
      {screen === "practice" && (
        <PracticeScreen
          wordState={wordState}
          phraseState={phraseState}
          mode={practiceMode}
          practiceType={practiceType}
          onEnd={() => setScreen("home")}
          onUpdateWord={handleUpdateWord}
          onUpdatePhrase={handleUpdatePhrase}
        />
      )}
      {screen === "roadmap" && (
        <RoadmapScreen
          wordState={wordState}
          onBack={() => setScreen("home")}
        />
      )}
      {screen === "learned" && (
        <LearnedScreen
          wordState={wordState}
          onBack={() => setScreen("home")}
          onResetWord={(id) => handleUpdateWord(id, { streak: 0, score: 0 })}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
