const _wikiCache = {};

function WordImage({ wordId, size = 80, style }) {
  const title = WORD_WIKI[wordId];
  const [src, setSrc] = React.useState(null);
  React.useEffect(() => {
    if (!title) return;
    if (_wikiCache[wordId] !== undefined) {
      if (_wikiCache[wordId]) setSrc(_wikiCache[wordId]);
      return;
    }
    _wikiCache[wordId] = false;
    fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)
      .then(r => r.json())
      .then(d => { const u = d?.thumbnail?.source; _wikiCache[wordId] = u || false; if (u) setSrc(u); })
      .catch(() => { _wikiCache[wordId] = false; });
  }, [wordId]);
  if (!src) return null;
  return <img src={src} alt="" style={{ width: size, height: size, objectFit: "cover", borderRadius: 10, marginBottom: 8, boxShadow: "0 2px 10px rgba(0,0,0,0.25)", ...style }} onError={() => setSrc(null)} />;
}

// ---- Text-to-speech (Greek) ----
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "el-GR";
  utt.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const greek = voices.find(v => v.lang === "el-GR") || voices.find(v => v.lang && v.lang.startsWith("el"));
  if (greek) utt.voice = greek;
  window.speechSynthesis.speak(utt);
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// ---- Answer checking ----
function normalize(s) {
  return s.trim().replace(/[.,!?;:"'()\/\-]/g, "").replace(/\s+/g, " ").toLowerCase();
}
function normalizeGreek(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?;:"'()]/g, "").replace(/\s+/g, " ").trim();
}
function checkAnswer(correctHebrew, userAnswer) {
  if (!userAnswer.trim()) return { correct: false };
  const nu = normalize(userAnswer);
  const nc = normalize(correctHebrew);
  if (nu === nc) return { correct: true };
  const variants = correctHebrew.split("/").map(v => normalize(v.trim())).filter(Boolean);
  for (const v of variants) if (nu === v) return { correct: true };
  for (const v of variants) {
    if ((nu.includes(v) || v.includes(nu)) && nu.length >= 2 && v.length >= 2) return { correct: true };
  }
  const paren = correctHebrew.match(/^([^(]+)\s*\(/);
  if (paren) {
    const main = normalize(paren[1]);
    if ((nu === main || nu.includes(main) || main.includes(nu)) && nu.length >= 2) return { correct: true };
  }
  return { correct: false };
}

// ---- Spaced-repetition model (Leitner boxes) ----
const DAY = 86400000;
// interval (in days) that a card waits before it is due again, indexed by box
const INTERVALS = [0, 0.01, 1, 3, 7, 16, 35, 75];
const MAX_BOX = 7;
const KNOWN_BOX = 4;     // survived a ~7-day gap -> "you know this word"
const MASTERED_BOX = 6;  // ~35-day gap -> mastered

const GREEK_LETTERS = "αβγδεζηθικλμνξοπρστυφχψω".split("");

const STORAGE_KEY = "greek_vocab_v6";
const LEGACY_KEYS = ["greek_vocab_v5", "greek_vocab_v4"];
const IDB_NAME = "greekVocabDB";
const IDB_STORE = "state";

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbSave(data) {
  openIDB().then(db => { db.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE).put(data, STORAGE_KEY); }).catch(() => {});
}
function idbLoadKey(key) {
  return openIDB().then(db => new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  })).catch(() => null);
}
function idbLoad() {
  return idbLoadKey(STORAGE_KEY)
    .then(d => d || idbLoadKey("greek_vocab_v5"))
    .then(d => d || idbLoadKey("greek_vocab_v4"));
}

function freshCard() {
  return { box: 0, due: 0, reps: 0, correct: 0, lapses: 0, streak: 0, lastSeen: null };
}
function initState(list) {
  const map = {};
  list.forEach(x => { map[x.id] = freshCard(); });
  return map;
}

// Convert an old v4/v5 card {score,attempts,correct,streak,lastSeen} into a v6 box card.
function migrateCard(old) {
  const c = freshCard();
  if (!old) return c;
  c.reps = old.attempts || 0;
  c.correct = old.correct || 0;
  c.lastSeen = old.lastSeen || null;
  if ((old.attempts || 0) === 0) { c.box = 0; return c; }
  // map score 0..10 and streak into a box; long streak / high score => higher box
  const score = old.score || 0;
  let box = Math.round(score / 1.7);            // 0..6
  if ((old.streak || 0) >= 3) box = Math.max(box, 4);
  c.box = Math.min(MAX_BOX, Math.max(1, box));
  c.streak = old.streak || 0;
  c.due = Date.now();                            // make everything due so it re-enters review
  return c;
}

const DEFAULT_META = { streak: 0, longest: 0, lastStudyDate: null, today: null, newDone: 0, reviewsDone: 0, newPerDay: 8, startedAt: null };

function loadRaw() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch (e) {}
  for (const k of LEGACY_KEYS) { try { const r = localStorage.getItem(k); if (r) return { __legacy: true, data: JSON.parse(r) }; } catch (e) {} }
  return null;
}
function saveAll(payload) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
  idbSave(payload);
}

// ---- date helpers ----
function dateStr(ms) {
  const d = new Date(ms);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const todayStr = () => dateStr(Date.now());
const yesterdayStr = () => dateStr(Date.now() - DAY);

// roll the daily counters over at midnight
function refreshDaily(meta) {
  if (meta.today !== todayStr()) {
    return { ...meta, today: todayStr(), newDone: 0, reviewsDone: 0 };
  }
  return meta;
}

// ---- grading ----
function gradeCard(card, correct) {
  const c = { ...card };
  c.reps += 1;
  c.lastSeen = new Date().toISOString();
  if (correct) {
    c.correct += 1;
    c.streak = (c.streak || 0) + 1;
    c.box = Math.min(MAX_BOX, (c.box || 0) + 1);
  } else {
    c.streak = 0;
    if ((c.box || 0) > 0) c.lapses += 1;
    c.box = c.box === 0 ? 1 : Math.max(1, c.box - 2);
  }
  c.due = Date.now() + INTERVALS[c.box] * DAY;
  return c;
}

const isDue = (c) => c && c.box >= 1 && c.due <= Date.now();
const isNew = (c) => !c || c.box === 0;
const isKnown = (c) => c && c.box >= KNOWN_BOX;
const isMastered = (c) => c && c.box >= MASTERED_BOX;

function countKnown(wordState) { return ALL_WORDS.filter(w => isKnown(wordState[w.id])).length; }
function countMastered(wordState) { return ALL_WORDS.filter(w => isMastered(wordState[w.id])).length; }
function countLearning(wordState) { return ALL_WORDS.filter(w => { const c = wordState[w.id]; return c && c.box >= 1 && c.box < KNOWN_BOX; }).length; }
function countDueWords(wordState) { return ALL_WORDS.filter(w => isDue(wordState[w.id])).length; }

// ---- phrases unlock when most of their component words are established ----
function phraseUnlocked(wordState, p) {
  const ids = p.usesWordIds || [];
  if (ids.length === 0) return true;
  const ready = ids.filter(id => (wordState[id]?.box || 0) >= 2).length;
  return ready / ids.length >= 0.6;
}
function countDuePhrases(wordState, phraseState) {
  return PHRASE_PATTERNS.filter(p => phraseUnlocked(wordState, p) && isDue(phraseState[p.id])).length;
}

/* ============================================================
   SESSION BUILDER
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const SESSION_CAP = 30;

function buildSession(wordState, phraseState, meta, opts) {
  opts = opts || {};
  const now = Date.now();
  // due reviews (words + unlocked phrases), soonest-due first
  const dueWords = ALL_WORDS.filter(w => isDue(wordState[w.id]))
    .sort((a, b) => wordState[a.id].due - wordState[b.id].due)
    .map(w => ({ kind: "word", id: w.id }));
  const duePhrases = PHRASE_PATTERNS.filter(p => phraseUnlocked(wordState, p) && isDue(phraseState[p.id]))
    .sort((a, b) => phraseState[a.id].due - phraseState[b.id].due)
    .map(p => ({ kind: "phrase", id: p.id }));

  let reviews = [...dueWords, ...duePhrases];

  // new words (lowest id first = level 1 upward), limited by remaining daily goal
  const newRemaining = opts.learnAhead ? opts.aheadCount || 6 : Math.max(0, meta.newPerDay - meta.newDone);
  let fresh = ALL_WORDS.filter(w => isNew(wordState[w.id])).slice(0, newRemaining)
    .map(w => ({ kind: "word", id: w.id, isNew: true }));

  // if practicing ahead and nothing is due and no new words remain, pull soonest-upcoming reviews
  if (opts.learnAhead && reviews.length === 0 && fresh.length === 0) {
    reviews = ALL_WORDS.filter(w => wordState[w.id].box >= 1)
      .sort((a, b) => wordState[a.id].due - wordState[b.id].due)
      .slice(0, 10).map(w => ({ kind: "word", id: w.id }));
  }

  // cap reviews so a session stays finishable; always keep all the new words
  const reviewBudget = Math.max(0, SESSION_CAP - fresh.length);
  reviews = reviews.slice(0, reviewBudget);

  // interleave: spread new words evenly through the review stream
  const queue = [];
  const R = shuffle(reviews);
  const N = fresh;
  const total = R.length + N.length;
  if (total === 0) return [];
  const gap = N.length > 0 ? Math.max(1, Math.floor((R.length + 1) / (N.length))) : Infinity;
  let ri = 0, ni = 0, since = gap;
  for (let k = 0; k < total; k++) {
    const wantNew = ni < N.length && (since >= gap || ri >= R.length);
    if (wantNew) { queue.push(N[ni++]); since = 0; }
    else if (ri < R.length) { queue.push(R[ri++]); since++; }
    else if (ni < N.length) { queue.push(N[ni++]); }
  }
  return queue;
}

/* ============================================================
   EXERCISE SELECTION + DISTRACTORS
   ============================================================ */
function itemData(kind, id) {
  return kind === "phrase" ? PHRASE_PATTERNS.find(p => p.id === id) : ALL_WORDS.find(w => w.id === id);
}

// pick an exercise mode from the card's strength (box) — difficulty escalates
function modeFor(kind, box, greek) {
  if (kind === "phrase") return box <= 2 ? "choiceE2H" : "typeE2H";
  const buildable = !/\s/.test(greek) && greek.length <= 10;
  if (box <= 1) return "choiceE2H";              // recognise meaning
  if (box === 2) return "choiceH2E";             // recognise the Greek form
  if (box === 3) return Math.random() < 0.5 ? "listenE2H" : "typeE2H";
  return buildable ? "buildH2E" : "choiceH2E";   // produce the Greek word
}

function distractors(kind, item, field, n) {
  const pool = kind === "phrase"
    ? PHRASE_PATTERNS.filter(p => p.id !== item.id)
    : ALL_WORDS.filter(w => w.id !== item.id && Math.abs(w.level - item.level) <= 2);
  const out = [];
  const seen = new Set([item[field]]);
  for (const x of shuffle(pool)) {
    if (seen.has(x[field])) continue;
    seen.add(x[field]); out.push(x);
    if (out.length >= n) break;
  }
  return out;
}

function SpeakerBtn({ text, light, size = 40 }) {
  return (
    <button onClick={() => speak(text)} aria-label="השמע" style={{
      width: size, height: size, borderRadius: "50%", flexShrink: 0,
      background: light ? "rgba(255,255,255,0.2)" : "#f2f2f7",

    }}>
      <svg width={size * 0.5} height={size * 0.5} viewBox="0 0 24 24" fill="none" stroke={light ? "#fff" : C.blue} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>
    </button>

}

function ProgressBar({ value, max, color = C.blue, height = 6 }) {
  const pct = max ? Math.min(100, Math.round((value / max) * 100)) : 0;
  return (
    <div style={{ background: C.faint, borderRadius: 99, height, overflow: "hidden" }}>
      <div style={{ width: pct + "%", height: "100%", background: color, borderRadius: 99, transition: "width 0.5s ease" }} />
    </div>
  );
}

function Ring({ value, max, size = 96, color = C.blue, label, sub }) {
  const r = (size - 12) / 2;
  const circ = 2 * Math.PI * r;
  const pct = max ? Math.min(1, value / max) : 0;
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.faint} strokeWidth="8" />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round"
          strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} style={{ transition: "stroke-dashoffset 0.6s ease" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontSize: 22, fontWeight: 800, color: C.ink }}>{label}</div>
        {sub && <div style={{ fontSize: 11, color: C.sub, fontWeight: 600 }}>{sub}</div>}
      </div>
    </div>
  );
}

const cardShadow = "0 1px 4px rgba(0,0,0,0.06)";
function BackBtn({ onClick, label }) {
  return (
    <button onClick={onClick} style={{
      background: C.card, border: "none", borderRadius: 10, fontSize: 18, cursor: "pointer",

}

   EXERCISE COMPONENTS

function IntroCard({ item, onContinue }) {

  return (
    <div style={{ animation: "slideUp 0.3s ease" }}>
      <div style={{ textAlign: "center", fontSize: 13, fontWeight: 700, color: C.green, marginBottom: 12 }}>מילה חדשה ✦</div>

const btnPrimary = { width: "100%", padding: "16px 0", fontSize: 17, fontWeight: 700, background: C.blue, color: "#fff", border: "none", borderRadius: 14, cursor: "pointer", boxShadow: "0 2px 8px rgba(0,122,255,0.3)" };
const btnGhost = { width: "100%", padding: "13px 0", fontSize: 15, fontWeight: 600, background: C.card, color: C.sub, border: "none", borderRadius: 14, cursor: "pointer", boxShadow: cardShadow };

// Prompt card at the top of an exercise
function PromptCard({ big, text, dir, level, tagRight, speakText, hideText, revealed, imageId }) {
  return (
    <div style={{ background: C.blue, borderRadius: 20, padding: "26px 20px", textAlign: "center", marginBottom: 18, boxShadow: "0 4px 16px rgba(0,122,255,0.25)" }}>
      <div style={{ fontSize: 11, color: "rgba(255,255,255,0.65)", marginBottom: 10, letterSpacing: 0.5 }}>
        {LEVEL_NAMES[level]}{tagRight ? " · " + tagRight : ""}
      </div>
      {imageId && <WordImage wordId={imageId} size={64} style={{ marginBottom: 6 }} />}
      {hideText && !revealed ? (
        <div style={{ fontSize: 34, color: "rgba(255,255,255,0.9)", margin: "6px 0 14px" }}>🎧</div>
      ) : (
        <div style={{ fontSize: big ? 40 : 24, fontWeight: 800, color: "#fff", direction: dir || "ltr", wordBreak: "break-word", margin: "2px 0 14px" }}>
          {text}
        </div>
      )}
      {speakText && <div style={{ display: "flex", justifyContent: "center" }}><SpeakerBtn text={speakText} light size={44} /></div>}
    </div>
  );
}

// Multiple-choice (either direction). options: array of {id, label}; correctId
function ChoiceExercise({ item, kind, direction, onGrade, onNext }) {
  const [picked, setPicked] = useState(null);
  const isE2H = direction === "E2H";
  const listen = direction === "listen";
  const field = isE2H || listen ? "hebrew" : "greek";
  const [opts] = useState(() => {
    const d = distractors(kind, item, field, 3);
    return shuffle([item, ...d]).map(x => ({ id: x.id, label: x[field] }));
  });
  useEffect(() => { if (listen) { const t = setTimeout(() => speak(item.greek), 200); return () => clearTimeout(t); } }, [item.id]);

  function choose(id) {
    if (picked !== null) return;
    setPicked(id);
    const correct = id === item.id;
    onGrade(correct);
    if (correct) speak(item.greek);
  }
  const answered = picked !== null;
  return (
    <div style={{ animation: "fadeIn 0.25s ease" }}>
      {(isE2H || listen)
        ? <PromptCard big={kind === "word"} text={item.greek} dir="ltr" level={item.level} tagRight={kind === "phrase" ? "משפט" : (listen ? "האזנה" : null)} speakText={item.greek} hideText={listen} revealed={answered} imageId={kind === "word" && !listen ? item.id : null} />
        : <PromptCard text={item.hebrew} dir="rtl" level={item.level} tagRight={kind === "phrase" ? "משפט" : "בחר/י ביוונית"} />}
      <div style={{ fontSize: 15, fontWeight: 600, color: C.ink, textAlign: "center", marginBottom: 14 }}>
        {listen ? "מה שמעת?" : isE2H ? "מה התרגום?" : "איזו מילה ביוונית?"}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        {opts.map(o => {
          const right = o.id === item.id, mine = picked === o.id;
          let bg = C.card, border = "1px solid " + C.faint, color = C.ink;
          if (answered && right) { bg = "#eaf7ee"; border = "2px solid " + C.green; color = C.green; }
          else if (answered && mine) { bg = "#fdecea"; border = "2px solid #ff453a"; color = "#ff453a"; }
          return (
            <button key={o.id} onClick={() => choose(o.id)} disabled={answered} style={{
              padding: "14px 16px", fontSize: 17, fontWeight: 600, textAlign: !isE2H && !listen ? "left" : "right",
              direction: !isE2H && !listen ? "ltr" : "rtl", background: bg, border, color, borderRadius: 14,
              cursor: answered ? "default" : "pointer", boxShadow: "0 1px 3px rgba(0,0,0,0.04)"
            }}>{answered && right ? "✓ " : ""}{o.label}</button>
          );
        })}
      </div>
      {answered && <ContinueBtn correct={picked === item.id} answer={isE2H || listen ? item.hebrew : item.greek} onNext={onNext} />}
    </div>
  );
}

// Type the Hebrew translation
function TypeExercise({ item, kind, onGrade, onNext }) {
  const [val, setVal] = useState("");
  const [res, setRes] = useState(null);
  const ref = useRef(null);
  useEffect(() => { setTimeout(() => ref.current && ref.current.focus(), 60); }, [item.id]);
  function submit() {
    if (res || !val.trim()) return;
    const r = checkAnswer(item.hebrew, val);
    setRes(r); onGrade(r.correct); if (r.correct) speak(item.greek);
  }
  function reveal() { if (res) return; setRes({ correct: false, revealed: true }); onGrade(false); }
  return (
    <div style={{ animation: "fadeIn 0.25s ease" }}>
      <PromptCard big={kind === "word"} text={item.greek} dir="ltr" level={item.level} tagRight={kind === "phrase" ? "משפט" : null} speakText={item.greek} imageId={kind === "word" ? item.id : null} />
      <input ref={ref} value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()}
        disabled={!!res} placeholder="תרגום לעברית..." dir="rtl" style={{
          width: "100%", padding: "15px 16px", fontSize: 19, borderRadius: 14, outline: "none", textAlign: "right", marginBottom: 12, boxSizing: "border-box",
          border: res ? "1.5px solid " + (res.correct ? C.green : C.orange) : "1.5px solid " + C.faint,
          background: res ? (res.correct ? "#eaf7ee" : "#fff3e0") : C.card
        }} />
      {!res ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <button onClick={submit} disabled={!val.trim()} style={{ ...btnPrimary, opacity: val.trim() ? 1 : 0.4 }}>בדוק</button>
          <button onClick={reveal} style={btnGhost}>לא יודע — הצג תשובה</button>
        </div>
      ) : <ContinueBtn correct={res.correct} answer={item.hebrew} onNext={onNext} />}
    </div>
  );
}

// Assemble the Greek word from scrambled letter tiles (production)
function BuildExercise({ item, onGrade, onNext }) {
  const target = item.greek;
  const [tiles] = useState(() => {
    const base = target.split("");
    const extras = shuffle(GREEK_LETTERS.filter(l => !normalizeGreek(target).includes(l))).slice(0, target.length <= 6 ? 3 : 2);
    return shuffle(base.concat(extras)).map((ch, i) => ({ key: i, ch }));
  });
  const [placed, setPlaced] = useState([]);   // array of tile keys
  const [res, setRes] = useState(null);
  const placedSet = new Set(placed);
  const assembled = placed.map(k => tiles.find(t => t.key === k).ch).join("");
  function add(k) { if (res) return; setPlaced(p => [...p, k]); }
  function removeAt(i) { if (res) return; setPlaced(p => p.filter((_, idx) => idx !== i)); }
  function check() {
    if (res || placed.length === 0) return;
    const correct = normalizeGreek(assembled) === normalizeGreek(target);
    setRes({ correct }); onGrade(correct); if (correct) speak(target);
  }
  function reveal() { if (res) return; setRes({ correct: false, revealed: true }); onGrade(false); }
  return (
    <div style={{ animation: "fadeIn 0.25s ease" }}>
      <PromptCard text={item.hebrew} dir="rtl" level={item.level} tagRight="הרכב/י ביוונית" imageId={item.id} />
      <div style={{ minHeight: 56, border: "1.5px dashed " + (res ? (res.correct ? C.green : C.orange) : C.faint), borderRadius: 14, padding: "10px 12px", marginBottom: 14, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", justifyContent: "center", direction: "ltr", background: C.card }}>
        {placed.length === 0 && <span style={{ color: C.sub, fontSize: 14 }}>הקש/י על האותיות לפי הסדר</span>}
        {placed.map((k, i) => (
          <button key={i} onClick={() => removeAt(i)} style={{ padding: "8px 12px", fontSize: 20, fontWeight: 700, borderRadius: 10, border: "none", background: "#e8f0ff", color: C.blue, cursor: res ? "default" : "pointer" }}>{tiles.find(t => t.key === k).ch}</button>
        ))}
      </div>
      {res && res.revealed && <div style={{ textAlign: "center", direction: "ltr", fontSize: 22, fontWeight: 700, color: C.orange, marginBottom: 12 }}>{target}</div>}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", marginBottom: 18, direction: "ltr" }}>
        {tiles.map(t => (
          <button key={t.key} onClick={() => add(t.key)} disabled={placedSet.has(t.key) || !!res} style={{
            padding: "12px 16px", fontSize: 22, fontWeight: 700, borderRadius: 12, border: "1px solid " + C.faint,
            background: placedSet.has(t.key) ? "#f2f2f7" : C.card, color: placedSet.has(t.key) ? "#c7c7cc" : C.ink,
            cursor: placedSet.has(t.key) || res ? "default" : "pointer", minWidth: 44, boxShadow: cardShadow
          }}>{t.ch}</button>
        ))}
      </div>
      {!res ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <button onClick={check} disabled={placed.length === 0} style={{ ...btnPrimary, opacity: placed.length ? 1 : 0.4 }}>בדוק</button>
          <button onClick={reveal} style={btnGhost}>לא יודע — הצג תשובה</button>
        </div>
      ) : <ContinueBtn correct={res.correct} answer={target} answerLtr onNext={onNext} />}
    </div>
  );
}

function ContinueBtn({ correct, answer, answerLtr, onNext }) {
  return (
    <div style={{ animation: "fadeIn 0.2s ease" }}>
      <div style={{ padding: "12px 16px", borderRadius: 12, marginBottom: 12, textAlign: "center", fontWeight: 700, fontSize: 16,
        background: correct ? "#eaf7ee" : "#fff3e0", color: correct ? C.green : "#cc7a00" }}>
        {correct ? "מצוין! ✓" : <span>התשובה: <span style={{ direction: answerLtr ? "ltr" : "rtl", display: "inline-block" }}>{answer}</span></span>}
      </div>
      <button onClick={onNext} style={btnPrimary}>המשך</button>
    </div>
  );
}

/* ============================================================
   SESSION SCREEN
   ============================================================ */
function SessionScreen({ queue, wordState, phraseState, knownCount, onAnswer, onExit }) {
  const [items, setItems] = useState(() => queue.map(q => ({ ...q, phase: q.isNew ? "intro" : "quiz" })));
  const [pos, setPos] = useState(0);
  const [stats, setStats] = useState({ correct: 0, total: 0, learned: 0 });
  const [initialLen] = useState(queue.length);
  const [knownStart] = useState(knownCount);

  const knownNow = countKnown(wordState);
  const [bump, setBump] = useState(false);
  const knownRef = useRef(knownNow);
  useEffect(() => {
    if (knownNow > knownRef.current) { setBump(true); const t = setTimeout(() => setBump(false), 700); knownRef.current = knownNow; return () => clearTimeout(t); }
    knownRef.current = knownNow;
  }, [knownNow]);

  if (pos >= items.length) {
    const gained = countKnown(wordState) - knownStart;
    const acc = stats.total ? Math.round((stats.correct / stats.total) * 100) : 0;
    return (
      <div style={{ padding: "48px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center", animation: "slideUp 0.3s ease" }}>
        <div style={{ fontSize: 56, marginBottom: 8 }}>🎉</div>
        <div style={{ fontSize: 24, fontWeight: 800, color: C.ink, marginBottom: 6 }}>סיימת את התרגול!</div>
        <div style={{ fontSize: 15, color: C.sub, marginBottom: 28 }}>{stats.total} כרטיסים · {acc}% דיוק</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 28 }}>
          <SummaryStat n={stats.total} label="תרגלת" color={C.blue} />
          <SummaryStat n={"+" + Math.max(0, gained)} label="מילים חדשות שאתה יודע" color={C.green} />
          <SummaryStat n={acc + "%"} label="דיוק" color={C.orange} />
        </div>
        <button onClick={onExit} style={btnPrimary}>חזרה למסך הבית</button>
      </div>
    );
  }

  const cur = items[pos];
  const data = itemData(cur.kind, cur.id);
  const card = cur.kind === "phrase" ? phraseState[cur.id] : wordState[cur.id];
  const mode = cur.phase === "intro" ? "intro" : (cur._mode || modeFor(cur.kind, card.box, data.greek));
  // lock the chosen mode onto the item so a re-render doesn't reshuffle it
  if (cur.phase === "quiz" && !cur._mode) cur._mode = mode;

  function advance() { setPos(p => p + 1); }

  function handleGrade(correct) {
    const wasNew = cur.isNew && card.box === 0;
    onAnswer(cur.kind, cur.id, correct, wasNew);
    setStats(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1, learned: s.learned }));
    if (!correct) {
      // requeue this item a few positions later for immediate re-practice
      setItems(prev => {
        const copy = prev.slice();
        const insertAt = Math.min(copy.length, pos + 3 + Math.floor(Math.random() * 2));
        copy.splice(insertAt, 0, { kind: cur.kind, id: cur.id, phase: "quiz" });
        return copy;
      });
    }
  }

  function introContinue() {
    setItems(prev => { const copy = prev.slice(); copy[pos] = { ...copy[pos], phase: "quiz" }; return copy; });
  }

  const progressMax = Math.max(initialLen, items.length);
  return (
    <div style={{ padding: "16px 16px 32px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <button onClick={onExit} aria-label="יציאה" style={{ background: "none", border: "none", fontSize: 26, color: C.sub, cursor: "pointer", lineHeight: 1, padding: 0 }}>×</button>
        <div style={{ flex: 1 }}><ProgressBar value={pos} max={progressMax} height={8} /></div>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.green, display: "flex", alignItems: "center", gap: 4, transform: bump ? "scale(1.15)" : "scale(1)", transition: "transform .25s" }}>
          <span>✓</span><span>{knownNow}</span>
        </div>
      </div>

      {mode === "intro" && <IntroCard item={data} onContinue={introContinue} />}
      {mode === "choiceE2H" && <ChoiceExercise key={cur.id + "-" + pos} item={data} kind={cur.kind} direction="E2H" onGrade={handleGrade} onNext={advance} />}
      {mode === "choiceH2E" && <ChoiceExercise key={cur.id + "-" + pos} item={data} kind={cur.kind} direction="H2E" onGrade={handleGrade} onNext={advance} />}
      {mode === "listenE2H" && <ChoiceExercise key={cur.id + "-" + pos} item={data} kind={cur.kind} direction="listen" onGrade={handleGrade} onNext={advance} />}
      {mode === "typeE2H" && <TypeExercise key={cur.id + "-" + pos} item={data} kind={cur.kind} onGrade={handleGrade} onNext={advance} />}
      {mode === "buildH2E" && <BuildExercise key={cur.id + "-" + pos} item={data} onGrade={handleGrade} onNext={advance} />}
    </div>
  );
}

function SummaryStat({ n, label, color }) {
  return (
    <div style={{ flex: 1, background: C.card, borderRadius: 14, padding: "14px 6px", boxShadow: cardShadow }}>
      <div style={{ fontSize: 24, fontWeight: 800, color }}>{n}</div>
      <div style={{ fontSize: 11, color: C.sub, fontWeight: 600, marginTop: 2 }}>{label}</div>
    </div>
  );
}

/* ============================================================
   HOME SCREEN
   ============================================================ */
const MILESTONES = [
  { target: 50, label: "תבין/י שלטים ותפריטים" },
  { target: 150, label: "תסתדר/י בשיחה בסיסית" },
  { target: 300, label: "תנהל/י שיחות יומיום" },
  { target: 500, label: "תדבר/י יוונית ברמה טובה" },
];

function HomeScreen({ wordState, phraseState, meta, onStart, onLearnAhead, onBrowse, onSettings }) {
  const known = countKnown(wordState);
  const learning = countLearning(wordState);
  const dueWords = countDueWords(wordState);
  const duePhrases = countDuePhrases(wordState, phraseState);
  const dueTotal = dueWords + duePhrases;
  const newLeft = Math.max(0, meta.newPerDay - meta.newDone);
  const newSeenEver = ALL_WORDS.filter(w => !isNew(wordState[w.id])).length;
  const sessionSize = dueTotal + Math.min(newLeft, ALL_WORDS.length - newSeenEver);

  const nextMs = MILESTONES.find(m => known < m.target);
  const daysActive = meta.startedAt ? Math.max(1, Math.floor((Date.now() - new Date(meta.startedAt)) / DAY) + 1) : 1;
  const rate = known > 0 ? Math.max(0.3, Math.round((known / daysActive) * 10) / 10) : meta.newPerDay;
  let prediction = "";
  if (known === 0) prediction = "כל יום: מילים חדשות + חזרה על מה שלמדת";
  else if (!nextMs) prediction = "כל 500 המילים בידך — כל הכבוד! 🏆";
  else {
    const left = Math.ceil((nextMs.target - known) / rate);
    const t = left <= 30 ? left + " ימים" : Math.round(left / 30) + " חודשים";
    prediction = "בעוד ~" + t + " " + nextMs.label;
  }

  const dailyGoalMet = meta.newDone >= meta.newPerDay;
  const nothingToDo = sessionSize === 0;

  return (
    <div style={{ padding: "22px 18px 40px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
        <div>
          <h1 style={{ margin: 0, fontSize: 26, fontWeight: 800, color: C.ink, letterSpacing: -0.5 }}>יוונית</h1>
          <div style={{ color: C.sub, fontSize: 14, direction: "ltr", textAlign: "right" }}>Ελληνικά</div>
        </div>
        <button onClick={onSettings} aria-label="הגדרות" style={{ background: C.card, border: "none", borderRadius: 12, width: 40, height: 40, cursor: "pointer", boxShadow: cardShadow, fontSize: 18 }}>⚙︎</button>
      </div>

      {/* streak + today ring */}
      <div style={{ display: "flex", gap: 12, marginBottom: 14 }}>
        <div style={{ flex: 1, background: C.card, borderRadius: 18, padding: "18px 14px", boxShadow: cardShadow, display: "flex", flexDirection: "column", justifyContent: "center" }}>
          <div style={{ fontSize: 32, fontWeight: 800, color: C.orange }}>🔥 {meta.streak}</div>
          <div style={{ fontSize: 12, color: C.sub, fontWeight: 600, marginTop: 2 }}>ימים ברצף</div>
          <div style={{ fontSize: 11, color: C.sub, marginTop: 8 }}>שיא: {meta.longest} · פעיל {daysActive} ימים</div>
        </div>
        <div style={{ background: C.card, borderRadius: 18, padding: "14px", boxShadow: cardShadow, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Ring value={meta.newDone} max={meta.newPerDay} color={dailyGoalMet ? C.green : C.blue}
            label={meta.newDone + "/" + meta.newPerDay} sub="חדשות היום" />
        </div>
      </div>

      {/* progress toward all 500 */}
      <div style={{ background: C.card, borderRadius: 18, padding: 16, marginBottom: 14, boxShadow: cardShadow }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8, fontSize: 14, fontWeight: 700, color: C.ink }}>
          <span>מילים שאתה יודע</span>
          <span style={{ color: C.blue }}>{known} / {ALL_WORDS.length}</span>
        </div>
        <ProgressBar value={known} max={ALL_WORDS.length} />
        <div style={{ marginTop: 8, fontSize: 12, color: C.sub, textAlign: "center" }}>{prediction}</div>
      </div>

      {/* main CTA */}
      {!nothingToDo ? (
        <button onClick={onStart} style={{ ...btnPrimary, padding: "18px 0", fontSize: 19, marginBottom: 10 }}>
          {dueTotal > 0 && newLeft > 0 ? "התחל תרגול יומי" : dueTotal > 0 ? "חזרה על " + dueTotal + " מילים" : "למד " + Math.min(newLeft, sessionSize) + " מילים חדשות"}
          <div style={{ fontSize: 12, fontWeight: 500, opacity: 0.85, marginTop: 3 }}>
            {[Math.min(newLeft, ALL_WORDS.length - newSeenEver) > 0 ? Math.min(newLeft, ALL_WORDS.length - newSeenEver) + " חדשות" : null, dueTotal > 0 ? dueTotal + " לחזרה" : null].filter(Boolean).join(" · ")}
          </div>
        </button>
      ) : (
        <div style={{ background: "#eaf7ee", borderRadius: 18, padding: "18px 16px", textAlign: "center", marginBottom: 10 }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: C.green }}>סיימת להיום! 🎉</div>
          <div style={{ fontSize: 13, color: "#4a8c5f", marginTop: 4 }}>אין מילים לחזרה כרגע. חזור/י מחר לשמור על הרצף.</div>
        </div>
      )}

      <button onClick={onLearnAhead} style={{ ...btnGhost, color: C.blue, marginBottom: 10 }}>
        {nothingToDo ? "תרגול נוסף (קדימה)" : "למד/י עוד קדימה"}
      </button>

      {/* mini stats */}
      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <MiniStat n={known} label="יודע" color={C.green} />
        <MiniStat n={learning} label="בלמידה" color={C.orange} />
        <MiniStat n={dueTotal} label="לחזרה עכשיו" color={dueTotal ? C.blue : C.sub} />
      </div>

      <button onClick={onBrowse} style={{ ...btnGhost, color: C.blue }}>מפת המילים · כל 500</button>
    </div>
  );
}

function MiniStat({ n, label, color }) {
  return (
    <div style={{ flex: 1, textAlign: "center", background: C.card, borderRadius: 14, padding: "12px 4px", boxShadow: cardShadow }}>
      <div style={{ fontSize: 22, fontWeight: 800, color }}>{n}</div>
      <div style={{ fontSize: 11, color: C.sub, fontWeight: 600 }}>{label}</div>
    </div>
  );
}

/* ============================================================
   BROWSE (map of all words by level + status)
   ============================================================ */
function BrowseScreen({ wordState, onBack }) {
  const [open, setOpen] = useState(null);
  const levels = Array.from({ length: 10 }, (_, i) => i + 1);
  return (
    <div style={{ padding: "22px 18px 40px", maxWidth: 480, margin: "0 auto", animation: "fadeIn 0.3s ease" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18 }}>
        <BackBtn onClick={onBack} />
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: C.ink }}>מפת המילים</h2>
      </div>
      <div style={{ display: "flex", gap: 12, marginBottom: 16, justifyContent: "center", fontSize: 11, color: C.sub }}>
        <Legend color={C.green} t="יודע" /><Legend color={C.orange} t="בלמידה" /><Legend color={C.faint} t="טרם" />
      </div>
      {levels.map(lvl => {
        const words = ALL_WORDS.filter(w => w.level === lvl);
        const known = words.filter(w => isKnown(wordState[w.id])).length;
        const learning = words.filter(w => { const c = wordState[w.id]; return c && c.box >= 1 && c.box < KNOWN_BOX; }).length;
        const started = known + learning;
        const isOpen = open === lvl;
        return (
          <div key={lvl} style={{ marginBottom: 10, background: C.card, borderRadius: 16, boxShadow: cardShadow, overflow: "hidden", opacity: started > 0 ? 1 : 0.6 }}>
            <div onClick={() => setOpen(isOpen ? null : lvl)} style={{ display: "flex", gap: 12, alignItems: "center", padding: "14px 14px", cursor: "pointer" }}>
              <div style={{ minWidth: 34, height: 34, borderRadius: "50%", background: known === 50 ? C.green : started > 0 ? C.orange : C.faint, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 14, flexShrink: 0 }}>{known === 50 ? "✓" : lvl}</div>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, fontWeight: 700, color: C.ink, marginBottom: 5 }}>
                  <span>{LEVEL_NAMES[lvl]}</span><span style={{ color: C.sub, fontSize: 12 }}>{known}/50 {isOpen ? "▲" : "▼"}</span>
                </div>
                <ProgressBar value={known} max={50} color={known === 50 ? C.green : C.orange} height={5} />
              </div>
            </div>
            {isOpen && (
              <div style={{ padding: "0 12px 14px", borderTop: "1px solid #f2f2f7" }}>
                <div style={{ display: "flex", flexDirection: "column", gap: 5, paddingTop: 10 }}>
                  {words.map(w => {
                    const c = wordState[w.id];
                    const st = isKnown(c) ? C.green : (c && c.box >= 1) ? C.orange : C.faint;
                    return (
                      <div key={w.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 8px", borderRadius: 10, background: "#fafafa" }}>
                        <span style={{ width: 8, height: 8, borderRadius: "50%", background: st, flexShrink: 0 }} />
                        <SpeakerBtn text={w.greek} size={30} />
                        <span style={{ direction: "ltr", fontWeight: 600, color: C.ink, fontSize: 15 }}>{w.greek}</span>
                        <span style={{ color: C.sub, fontSize: 13, marginRight: "auto" }}>{w.hebrew}</span>
                        {isMastered(c) && <span style={{ fontSize: 11 }}>⭐</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}
function Legend({ color, t }) {
  return <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: color, marginLeft: 4, verticalAlign: "middle" }} />{t}</span>;
}

/* ============================================================
   SETTINGS
   ============================================================ */
function SettingsScreen({ meta, onSetGoal, onReset, onBack }) {
  const [confirm, setConfirm] = useState(false);
  return (
    <div style={{ padding: "22px 18px 40px", maxWidth: 480, margin: "0 auto", animation: "fadeIn 0.3s ease" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <BackBtn onClick={onBack} />
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: C.ink }}>הגדרות</h2>
      </div>
      <div style={{ background: C.card, borderRadius: 16, padding: 16, marginBottom: 16, boxShadow: cardShadow }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: C.ink, marginBottom: 4 }}>מילים חדשות ביום</div>
        <div style={{ fontSize: 12, color: C.sub, marginBottom: 12 }}>כמה מילים חדשות להציג בכל יום. עדיף מעט וקבוע מהרבה ולא עקבי.</div>
        <div style={{ display: "flex", gap: 8 }}>
          {[5, 8, 12, 15].map(n => (
            <button key={n} onClick={() => onSetGoal(n)} style={{
              flex: 1, padding: "12px 0", fontSize: 16, fontWeight: 700, borderRadius: 12, cursor: "pointer",
              border: meta.newPerDay === n ? "2px solid " + C.blue : "1px solid " + C.faint,
              background: meta.newPerDay === n ? "#e8f0ff" : C.card, color: meta.newPerDay === n ? C.blue : C.ink
            }}>{n}</button>
          ))}
        </div>
      </div>
      <div style={{ background: C.card, borderRadius: 16, padding: 16, boxShadow: cardShadow }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: C.ink, marginBottom: 4 }}>איפוס התקדמות</div>
        <div style={{ fontSize: 12, color: C.sub, marginBottom: 12 }}>מוחק את כל ההתקדמות, הרצף והמילים שנלמדו.</div>
        {!confirm ? (
          <button onClick={() => setConfirm(true)} style={{ ...btnGhost, color: "#ff453a" }}>אפס הכל</button>
        ) : (
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setConfirm(false)} style={{ ...btnGhost, flex: 1 }}>ביטול</button>
            <button onClick={onReset} style={{ flex: 1, padding: "13px 0", fontSize: 15, fontWeight: 700, background: "#ff453a", color: "#fff", border: "none", borderRadius: 14, cursor: "pointer" }}>כן, אפס</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [screen, setScreen] = useState("loading");
  const [wordState, setWordState] = useState(null);
  const [phraseState, setPhraseState] = useState(null);
  const [meta, setMeta] = useState(null);
  const [queue, setQueue] = useState([]);

  const wRef = useRef(null), pRef = useRef(null), mRef = useRef(null);
  const persist = useCallback(() => {
    if (!wRef.current) return;
    saveAll({ wordState: wRef.current, phraseState: pRef.current, meta: mRef.current, savedAt: new Date().toISOString() });
  }, []);

  // ---- load ----
  useEffect(() => {
    function hydrate(saved) {
      const w = initState(ALL_WORDS), p = initState(PHRASE_PATTERNS);
      let m = { ...DEFAULT_META };
      if (saved && saved.__legacy) {
        // migrate v4/v5
        const old = saved.data;
        if (old.wordState) Object.keys(old.wordState).forEach(id => { if (w[id]) w[id] = migrateCard(old.wordState[id]); });
        if (old.phraseState) Object.keys(old.phraseState).forEach(id => { if (p[id]) p[id] = migrateCard(old.phraseState[id]); });
        m.startedAt = old.startedAt || new Date().toISOString();
      } else if (saved && saved.wordState) {
        Object.keys(saved.wordState).forEach(id => { if (w[id]) w[id] = { ...w[id], ...saved.wordState[id] }; });
        if (saved.phraseState) Object.keys(saved.phraseState).forEach(id => { if (p[id]) p[id] = { ...p[id], ...saved.phraseState[id] }; });
        m = { ...DEFAULT_META, ...(saved.meta || {}) };
        if (!m.startedAt) m.startedAt = new Date().toISOString();
      } else {
        m.startedAt = new Date().toISOString();
      }
      m = refreshDaily(m);
      return { w, p, m };
    }
    const raw = loadRaw();
    if (raw) {
      const { w, p, m } = hydrate(raw);
      wRef.current = w; pRef.current = p; mRef.current = m;
      setWordState(w); setPhraseState(p); setMeta(m); setScreen("home");
      persist();
    } else {
      idbLoad().then(idb => {
        const src = idb ? (idb.wordState && idb.meta ? idb : { __legacy: true, data: idb }) : null;
        const { w, p, m } = hydrate(src);
        wRef.current = w; pRef.current = p; mRef.current = m;
        setWordState(w); setPhraseState(p); setMeta(m); setScreen("home");
        persist();
      });
    }
  }, []);

  // ---- emergency save ----
  useEffect(() => {
    const save = () => persist();
    const vis = () => { if (document.visibilityState === "hidden") save(); };
    document.addEventListener("visibilitychange", vis);
    window.addEventListener("pagehide", save);
    window.addEventListener("beforeunload", save);
    return () => { document.removeEventListener("visibilitychange", vis); window.removeEventListener("pagehide", save); window.removeEventListener("beforeunload", save); };
  }, [persist]);

  // ---- record one answer: update card + daily counters + streak ----
  const onAnswer = useCallback((kind, id, correct, wasNew) => {
    const stateRef = kind === "phrase" ? pRef : wRef;
    const setter = kind === "phrase" ? setPhraseState : setWordState;
    const prev = stateRef.current[id];
    const next = { ...stateRef.current, [id]: gradeCard(prev, correct) };
    stateRef.current = next;
    setter(next);

    let m = refreshDaily({ ...mRef.current });
    if (wasNew) m.newDone += 1; else m.reviewsDone += 1;
    // streak: bump once per calendar day of study
    if (m.lastStudyDate !== todayStr()) {
      m.streak = m.lastStudyDate === yesterdayStr() ? m.streak + 1 : 1;
      m.lastStudyDate = todayStr();
      m.longest = Math.max(m.longest || 0, m.streak);
    }
    mRef.current = m; setMeta(m);
    persist();
  }, [persist]);

  const startSession = useCallback((opts) => {
    mRef.current = refreshDaily({ ...mRef.current }); setMeta(mRef.current);
    const q = buildSession(wRef.current, pRef.current, mRef.current, opts);
    if (q.length === 0) return;
    setQueue(q); setScreen("session");
  }, []);

  const setGoal = useCallback((n) => { const m = { ...mRef.current, newPerDay: n }; mRef.current = m; setMeta(m); persist(); }, [persist]);
  const resetAll = useCallback(() => {
    const w = initState(ALL_WORDS), p = initState(PHRASE_PATTERNS), m = { ...DEFAULT_META, startedAt: new Date().toISOString(), today: todayStr() };
    wRef.current = w; pRef.current = p; mRef.current = m;
    setWordState(w); setPhraseState(p); setMeta(m); persist(); setScreen("home");
  }, [persist]);

  if (screen === "loading" || !wordState || !meta) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 10, background: C.bg }}>
      <div style={{ fontSize: 22, fontWeight: 800, color: C.blue }}>יוונית</div>
      <div style={{ color: C.sub, fontSize: 14 }}>טוען…</div>
    </div>;
  }

  return (
    <div style={{ minHeight: "100vh", minHeight: "100dvh", background: C.bg, direction: "rtl" }}>
      {screen === "home" && <HomeScreen wordState={wordState} phraseState={phraseState} meta={meta}
        onStart={() => startSession({})} onLearnAhead={() => startSession({ learnAhead: true, aheadCount: 6 })}
        onBrowse={() => setScreen("browse")} onSettings={() => setScreen("settings")} />}
      {screen === "session" && <SessionScreen queue={queue} wordState={wordState} phraseState={phraseState}
        knownCount={countKnown(wordState)} onAnswer={onAnswer} onExit={() => { persist(); setScreen("home"); }} />}
      {screen === "browse" && <BrowseScreen wordState={wordState} onBack={() => setScreen("home")} />}
      {screen === "settings" && <SettingsScreen meta={meta} onSetGoal={setGoal} onReset={resetAll} onBack={() => setScreen("home")} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
