const LEVEL_NAMES = {
  1:"הישרדות בסיסית",2:"מסעדה וקפה",3:"מלון וחוף",
  4:"תחבורה וזמן",5:"קניות ובריאות",6:"תיירות ואתרים",
  7:"אנשים ושיחה",8:"טבע ומזג אוויר",9:"חירום ורפואה",
  10:"שפה ותרבות"
};

const STORAGE_KEY = "greek_vocab_v4";
const IDB_NAME = "greekVocabDB";
const IDB_STORE = "state";

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbSave(data) {
  openIDB().then(db => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(data, STORAGE_KEY);
  }).catch(() => {});
}

function idbLoad() {
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(STORAGE_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  })).catch(() => null);
}

function migrateStreak(data) {
  if (data && data.wordState) {
    Object.keys(data.wordState).forEach(id => {
      if (data.wordState[id].streak === undefined) {
        data.wordState[id].streak = 0;
      }
    });
  }
  return data;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      return migrateStreak(JSON.parse(raw));
    }
  } catch (e) {}
  return null;
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
  idbSave(data);
}

function initWordState() {
  const map = {};
  ALL_WORDS.forEach(w => {
    map[w.id] = { score: 0, attempts: 0, correct: 0, streak: 0, lastSeen: null, pinned: false };
  });
  return map;
}

function getFocusGroup(wordState, unlockedLevel, mode) {
  let pool = ALL_WORDS.filter(w => w.level <= unlockedLevel);
  if (mode === "weak") return pool.filter(w => wordState[w.id]?.attempts > 0 && wordState[w.id]?.score < 3).slice(0, 8);
  if (mode === "pinned") return pool.filter(w => wordState[w.id]?.pinned).slice(0, 8);

  const inProgress = pool.filter(w => {
    const s = wordState[w.id];
    return s.attempts > 0 && s.streak < 5;
  });
  const notStarted = pool.filter(w => wordState[w.id].attempts === 0);

  const group = [...inProgress];
  for (const w of notStarted) {
    if (group.length >= 7) break;
    group.push(w);
  }
  if (group.length < 4 && notStarted.length > 0) {
    for (const w of notStarted) {
      if (group.length >= 7) break;
      if (!group.includes(w)) group.push(w);
    }
  }
  return group.length > 0 ? group : pool.filter(w => wordState[w.id].streak < 5).slice(0, 7);
}

function pickWord(wordState, unlockedLevel, mode, recentIds) {
  const focus = getFocusGroup(wordState, unlockedLevel, mode);
  const allPool = ALL_WORDS.filter(w => w.level <= unlockedLevel && (wordState[w.id]?.streak || 0) < 5);
  const useFocus = focus.length > 0 && Math.random() < 0.75;
  const pool = useFocus ? focus : (allPool.length > 0 ? allPool : ALL_WORDS.filter(w => w.level <= unlockedLevel));

  const recentSet = new Set(recentIds || []);
  const nonRecent = pool.filter(w => !recentSet.has(w.id));
  const candidates = nonRecent.length > 0 ? nonRecent : pool;

  const weighted = candidates.map(w => {
    const s = wordState[w.id];
    const daysSince = s.lastSeen
      ? (Date.now() - new Date(s.lastSeen)) / 86400000
      : 999;
    const scoreFactor = Math.pow(10 - s.score, 2);
    const timeFactor = Math.min(daysSince * 3, 30);
    const newBonus = s.attempts === 0 ? 15 : 0;
    let weight = Math.max(1, scoreFactor + timeFactor + newBonus);
    if (s.pinned) weight *= 4;
    return { word: w, weight };
  });
  const total = weighted.reduce((a, b) => a + b.weight, 0);
  let r = Math.random() * total;
  for (const item of weighted) {
    r -= item.weight;
    if (r <= 0) return item.word;
  }
  return weighted[weighted.length - 1].word;
}

    { needs: ["καλημέρα","θάλασσα","ήλιος","όμορφος"],

    { needs: ["με λένε","χαίρομαι","πώς σε λένε;"],

        gr: "Γεια! Με λένε... Πώς σε λένε; Χαίρομαι!",

      })},
    { needs: ["σήμερα","ζεστό","παγωτό"],
      build: () => ({
        gr: "Σήμερα είναι πολύ ζεστό. Θέλω ένα παγωτό!",
        he: "היום חם מאוד. אני רוצה גלידה!"
      })},
    { needs: ["νησί","πλοίο","εισιτήριο","πόσο"],
      build: () => ({
        gr: "Θέλω να πάω στο νησί. Πόσο κάνει το εισιτήριο για το πλοίο;",

      })},
    { needs: ["λεωφορείο","σταθμός","πού"],
      build: () => ({

        he: "סליחה, איפה תחנת האוטובוס?"
      })},
    { needs: ["στην υγειά μας","κρασί","νόστιμο"],
      build: () => ({
        gr: "Στην υγειά μας! Το κρασί είναι πολύ νόστιμο!",
        he: "לחיים! היין מאוד טעים!"
      })},
    { needs: ["πονάω","κεφάλι","φαρμακείο","πού"],
      build: () => ({

        he: "כואב לי הראש. איפה בית המרקחת?"

    { needs: ["αγοράζω","δώρο","πόσο"],

  const matching = templates.filter(t => t.needs.every(n => has(n)));
  if (matching.length === 0) {
    const known = learnedWords.slice(0, 4);
    return {
      gr: known.map(w => w.greek).join(", "),
      he: known.map(w => w.hebrew).join(", "),

  }
  return matching[dayHash % matching.length].build();
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "el-GR";
  utt.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const greek = voices.find(v => v.lang === "el-GR") ||
                voices.find(v => v.lang.startsWith("el"));
  if (greek) utt.voice = greek;
  window.speechSynthesis.speak(utt);
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function normalize(s) {
  return s.trim().replace(/[.,!?;:"'()\/\-]/g, "").replace(/\s+/g, " ").toLowerCase();
}

function checkAnswer(greek, correctHebrew, userAnswer) {
  if (!userAnswer.trim()) return { correct: false, feedback: "לא הקלדת כלום" };

  const normalUser = normalize(userAnswer);
  const normalCorrect = normalize(correctHebrew);

  if (normalUser === normalCorrect) {
    return { correct: true, feedback: "מצוין!" };
  }

  const variants = correctHebrew.split("/").map(v => normalize(v.trim())).filter(Boolean);

  for (const v of variants) {
    if (normalUser === v || v === normalUser) {
      return { correct: true, feedback: "נכון!" };
    }
  }

  for (const v of variants) {
    if (normalUser.includes(v) || v.includes(normalUser)) {
      if (normalUser.length >= 2 && v.length >= 2) {
        return { correct: true, feedback: "קרוב מספיק!" };
      }
    }
  }

  const parenthetical = correctHebrew.match(/^([^(]+)\s*\(/);
  if (parenthetical) {
    const mainPart = normalize(parenthetical[1]);
    if (normalUser === mainPart || normalUser.includes(mainPart) || mainPart.includes(normalUser)) {
      if (normalUser.length >= 2) {
        return { correct: true, feedback: "נכון!" };
      }
    }
  }

  return { correct: false, feedback: "התשובה הנכונה: " + correctHebrew };
}

function ProgressBar({ value, max, color = "#007aff" }) {
  const pct = max ? Math.round((value / max) * 100) : 0;
  return (
    <div style={{ background: "#e5e5ea", borderRadius: 99, height: 6, overflow: "hidden" }}>
      <div style={{
        width: pct + "%", height: "100%",
        background: color, borderRadius: 99,
        transition: "width 0.6s ease"
      }} />
    </div>
  );
}

function StarRating({ score }) {
  const stars = Math.min(5, Math.max(0, Math.round(score / 2)));
  return (
    <span style={{ fontSize: 14, letterSpacing: 2 }}>
      {[1,2,3,4,5].map(i => (
        <span key={i} style={{ color: i <= stars ? "#ff9f0a" : "rgba(255,255,255,0.25)" }}>●</span>
      ))}
    </span>
  );
}

                background: done ? "#007aff" : isActive ? "#ff9f0a" : "#e5e5ea",
                color: "#fff", display: "flex", alignItems: "center", justifyContent: "center",
                fontWeight: 700, fontSize: 14, flexShrink: 0
              }}>
                {done ? "✓" : lvl}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{
                  display: "flex", justifyContent: "space-between",
                  fontSize: 14, fontWeight: 600, color: "#1c1c1e", marginBottom: 4
                }}>
                  <span>{LEVEL_NAMES[lvl]}</span>
                  <span style={{ color: "#8e8e93", fontSize: 12 }}>
                    {mastered}/50
                    {attempted > 0 && <span style={{ marginRight: 6 }}>{isExpanded ? "▲" : "▼"}</span>}
                  </span>
                </div>
                <ProgressBar value={mastered} max={50}
                  color={done ? "#007aff" : "#ff9f0a"} />
                <div style={{ fontSize: 11, color: "#8e8e93", marginTop: 3 }}>
                  {pct}% שולטים · {attempted} נלמדו
                </div>
              </div>
            </div>
            {isExpanded && (
              <div style={{
                padding: "0 14px 14px",
                borderTop: "1px solid #f2f2f7",
                animation: "fadeIn 0.2s ease"
              }}>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, paddingTop: 10 }}>
                  {words.map(w => {
                    const streak = wordState[w.id]?.streak || 0;
                    const isLearned = streak >= 5;
                    const isMastered = wordState[w.id]?.score >= 8;
                    return (
                      <div key={w.id} style={{
                        padding: "6px 10px", borderRadius: 8,
                        background: isMastered ? "#e8f4fd" : isLearned ? "#f0f9e8" : "#f2f2f7",
                        border: isMastered ? "1px solid #007aff30" : isLearned ? "1px solid #34c75930" : "1px solid #e5e5ea",
                        fontSize: 13, direction: "ltr", textAlign: "left"
                      }}>
                        <span style={{ fontWeight: 600, color: isLearned ? "#1c1c1e" : "#aeaeb2" }}>{w.greek}</span>
                        <span style={{ color: "#8e8e93", fontSize: 11, marginLeft: 4 }}>{w.hebrew}</span>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 10, justifyContent: "center", fontSize: 11, color: "#8e8e93" }}>
                  <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: "#e8f4fd", border: "1px solid #007aff30", marginLeft: 4 }} />שולט</span>
                  <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: "#f0f9e8", border: "1px solid #34c75930", marginLeft: 4 }} />נלמד</span>
                  <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: "#f2f2f7", border: "1px solid #e5e5ea", marginLeft: 4 }} />טרם נלמד</span>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function pickVariation(word, wordState) {
  const s = wordState[word.id];
  const streak = s?.streak || 0;
  const attempts = s?.attempts || 0;
  const types = ["greekToHebrew"];
  if (attempts >= 2) types.push("hebrewToGreek");
  if (streak >= 2) types.push("audioOnly");
  if (streak >= 3) types.push("hebrewToGreek");
  return types[Math.floor(Math.random() * types.length)];
}

function generateChoices(correctWord, wordState, unlockedLevel, field) {
  const pool = ALL_WORDS.filter(w => w.level <= unlockedLevel && w.id !== correctWord.id);
  const shuffled = pool.sort(() => Math.random() - 0.5);
  const wrongs = shuffled.slice(0, 3);
  const all = [correctWord, ...wrongs].sort(() => Math.random() - 0.5);
  return all;
}

const VAR_LABELS = {
  greekToHebrew: "תרגם לעברית",
  hebrewToGreek: "בחר ביוונית",
  audioOnly: "מה שמעת?"
};

function PracticeScreen({ wordState, mode, onEnd, onUpdateWord }) {
  const [currentWord, setCurrentWord] = useState(null);
  const [variation, setVariation] = useState("greekToHebrew");
  const [choices, setChoices] = useState([]);
  const [input, setInput] = useState("");
  const [result, setResult] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [sessionStats, setSessionStats] = useState({ correct: 0, wrong: 0, total: 0 });
  const inputRef = useRef(null);
  const recentRef = useRef([]);

  const unlockedLevel = Math.min(10,
    Math.floor(ALL_WORDS.filter(w => wordState[w.id]?.score >= 8).length / 50) + 1
  );

  const recentCap = 5;

  const loadNext = useCallback(() => {
    const word = pickWord(wordState, unlockedLevel, mode, recentRef.current);
    recentRef.current = [...recentRef.current, word.id].slice(-recentCap);
    const v = pickVariation(word, wordState);
    setCurrentWord(word);
    setVariation(v);
    if (v === "hebrewToGreek") {
      setChoices(generateChoices(word, wordState, unlockedLevel));
    }
    setInput("");
    setResult(null);
    setRevealed(false);
    if (v !== "hebrewToGreek") setTimeout(() => inputRef.current?.focus(), 100);
  }, [wordState, unlockedLevel, mode, recentCap]);

  useEffect(() => { loadNext(); }, []);

  useEffect(() => {
    if (currentWord && variation !== "hebrewToGreek") speak(currentWord.greek);
  }, [currentWord, variation]);

  const recordResult = (correct) => {
    const prev = wordState[currentWord.id];
    const newScore = correct
      ? Math.min(10, prev.score + 1)
      : Math.max(0, prev.score - 1);
    const newStreak = correct ? (prev.streak || 0) + 1 : 0;
    onUpdateWord(currentWord.id, {
      score: newScore,
      attempts: prev.attempts + 1,
      correct: prev.correct + (correct ? 1 : 0),
      streak: newStreak,
      lastSeen: new Date().toISOString()
    });
    setSessionStats(s => ({
      correct: s.correct + (correct ? 1 : 0),
      wrong: s.wrong + (correct ? 0 : 1),
      total: s.total + 1
    }));
  };

  const handleSubmit = () => {
    if (!input.trim() || result) return;
    const res = checkAnswer(currentWord.greek, currentWord.hebrew, input);
    setResult({ correct: res.correct, feedback: res.feedback });
    recordResult(res.correct);
  };

  const handleChoice = (word) => {
    if (result) return;
    const correct = word.id === currentWord.id;
    setResult({
      correct,
      feedback: correct ? "מצוין!" : "התשובה הנכונה: " + currentWord.greek
    });
    recordResult(correct);
  };

  const handleReveal = () => {
    if (revealed || result) return;
    setRevealed(true);
    const prev = wordState[currentWord.id];
    onUpdateWord(currentWord.id, {
      score: Math.max(0, prev.score - 1),
      attempts: prev.attempts + 1,
      correct: prev.correct,
      streak: 0,
      lastSeen: new Date().toISOString()
    });
    setSessionStats(s => ({ ...s, wrong: s.wrong + 1, total: s.total + 1 }));
  };

  if (!currentWord) return <div style={{ padding: 40, textAlign: "center" }}>טוען...</div>;

  const accuracy = sessionStats.total
    ? Math.round((sessionStats.correct / sessionStats.total) * 100) : 0;

  const isTyping = variation !== "hebrewToGreek";
  const showGreek = variation === "greekToHebrew";
  const showHebrew = variation === "hebrewToGreek";
  const showAudioOnly = variation === "audioOnly";

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto", animation: "slideUp 0.3s ease" }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",
        marginBottom: 16
      }}>
        <button onClick={onEnd} style={{
          background: "#fff", border: "none", borderRadius: 10,
          fontSize: 18, cursor: "pointer", width: 36, height: 36,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)", color: "#007aff"
        }}>←</button>
        <div style={{
          display: "flex", gap: 14, background: "#fff",
          padding: "6px 14px", borderRadius: 99, border: "none",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
        }}>
          <span style={{ fontSize: 13, color: "#007aff", fontWeight: 600 }}>{sessionStats.correct} נכון</span>
          <span style={{ fontSize: 13, color: "#ff9f0a", fontWeight: 600 }}>{sessionStats.wrong} שגוי</span>
          {sessionStats.total > 0 && <span style={{ fontSize: 13, color: "#8e8e93", fontWeight: 600 }}>{accuracy}%</span>}
        </div>
      </div>

      {mode === "all" && (() => {
        const focus = getFocusGroup(wordState, unlockedLevel, mode);
        if (focus.length === 0) return null;
        const done = focus.filter(w => (wordState[w.id]?.streak || 0) >= 5).length;
        return (
          <div style={{
            display: "flex", alignItems: "center", gap: 6, marginBottom: 12,
            justifyContent: "center", flexWrap: "wrap"
          }}>
            <span style={{ fontSize: 11, color: "#8e8e93", fontWeight: 500 }}>התמקדות:</span>
            {focus.map(w => {
              const streak = wordState[w.id]?.streak || 0;
              const isCurrent = currentWord && w.id === currentWord.id;
              return (
                <div key={w.id} style={{
                  width: isCurrent ? 20 : 8, height: 8, borderRadius: 4,
                  background: streak >= 5 ? "#007aff" : streak > 0 ? "#ff9f0a" : "#e5e5ea",
                  transition: "all 0.2s"
                }} />
              );
            })}
            <span style={{ fontSize: 11, color: "#8e8e93" }}>{done}/{focus.length}</span>
          </div>
        );
      })()}

      <div style={{
        background: showHebrew ? "#ff9f0a" : "#007aff",
        borderRadius: 20, padding: "28px 24px", textAlign: "center",
        marginBottom: 20,
        boxShadow: showHebrew
          ? "0 4px 16px rgba(255,159,10,0.25)"
          : "0 4px 16px rgba(0,122,255,0.25)"
      }}>
        <div style={{
          display: "inline-block", padding: "3px 12px", borderRadius: 99, marginBottom: 10,

        }}>
          {VAR_LABELS[variation]}
        </div>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,0.7)", marginBottom: 8, letterSpacing: 1 }}>
          רמה {currentWord.level} · {LEVEL_NAMES[currentWord.level]}
        </div>

        {showAudioOnly ? (
          <div style={{
            fontSize: 42, marginBottom: 8, color: "#fff", fontWeight: 300,
            letterSpacing: 4
          }}>♪ ♪ ♪</div>
        ) : (
          <div style={{
            fontSize: 44, fontWeight: 700, color: "#fff",
            letterSpacing: 1, marginBottom: 8, wordBreak: "break-word",
            direction: showHebrew ? "rtl" : "ltr"
          }}>
            {showHebrew ? currentWord.hebrew : currentWord.greek}
          </div>
        )}

        <StarRating score={wordState[currentWord.id]?.score || 0} />
        <div style={{ marginTop: 4, fontSize: 11, color: "rgba(255,255,255,0.6)" }}>
          {wordState[currentWord.id]?.attempts || 0} ניסיונות
        </div>

        <div style={{ marginTop: 16, display: "flex", justifyContent: "center", gap: 10 }}>
          <button
            onClick={() => speak(currentWord.greek)}
            style={{
              padding: "8px 18px", borderRadius: 99,
              background: "rgba(255,255,255,0.2)", border: "1px solid rgba(255,255,255,0.3)",
              color: "#fff", fontSize: 14, cursor: "pointer", display: "inline-flex",
              alignItems: "center", gap: 6, fontWeight: 500
            }}>
            {showAudioOnly && !result ? "שמע שוב" : "שמע"}
          </button>
          <button
            onClick={() => onUpdateWord(currentWord.id, { pinned: !wordState[currentWord.id]?.pinned })}
            style={{
              padding: "8px 18px", borderRadius: 99,
              background: wordState[currentWord.id]?.pinned ? "rgba(255,255,255,0.35)" : "rgba(255,255,255,0.2)",
              border: "1px solid rgba(255,255,255,0.3)",
              color: "#fff", fontSize: 14, cursor: "pointer", display: "inline-flex",
              alignItems: "center", gap: 6, fontWeight: 500
            }}>
            {wordState[currentWord.id]?.pinned ? "נעוץ" : "נעץ"}
          </button>
        </div>
      </div>

      {variation === "hebrewToGreek" ? (
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 13, color: "#8e8e93", marginBottom: 10, textAlign: "center" }}>
            בחר את המילה הנכונה ביוונית:
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {choices.map(w => {
              const isCorrectChoice = w.id === currentWord.id;
              const chosen = result !== null;
              let bg = "#fff", border = "#e5e5ea", color = "#1c1c1e";
              if (chosen && isCorrectChoice) { bg = "#e8f4fd"; border = "#007aff"; color = "#007aff"; }
              else if (chosen && !isCorrectChoice) { bg = "#fff3e0"; border = "#ff9f0a"; color = "#cc7a00"; }
              return (
                <button key={w.id} onClick={() => handleChoice(w)}
                  disabled={!!result}
                  style={{
                    padding: "14px 16px", fontSize: 18, fontWeight: 600,
                    background: bg, border: `1.5px solid ${border}`, color,
                    borderRadius: 12, cursor: result ? "default" : "pointer",
                    textAlign: "left", direction: "ltr", width: "100%",
                    letterSpacing: 1,
                    boxShadow: chosen ? "none" : "0 1px 4px rgba(0,0,0,0.06)"
                  }}>
                  {w.greek}
                </button>
              );
            })}
          </div>
          {!result && !revealed && (
            <button onClick={handleReveal} style={{
              width: "100%", padding: "10px 0", fontSize: 14, fontWeight: 600,
              background: "#fff", color: "#8e8e93", marginTop: 10,
              border: "none", borderRadius: 12, cursor: "pointer",
              boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
            }}>
              לא יודע — הצג תשובה
            </button>

        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 13, color: "#8e8e93", marginBottom: 8, textAlign: "center" }}>
            מה הפירוש בעברית?
          </div>
          <input
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && handleSubmit()}
            disabled={!!result}
            placeholder="הקלד את התרגום..."
            dir="rtl"
            style={{
              width: "100%", padding: "14px 16px", fontSize: 18,
              border: result
                ? ("1.5px solid " + (result.correct ? "#007aff" : "#ff9f0a"))

              borderRadius: 12, outline: "none", boxSizing: "border-box",
              background: result
                ? (result.correct ? "#e8f4fd" : "#fff3e0")
                : "#fff",
              textAlign: "right"

      {result && (
        <div style={{
          padding: "12px 16px", borderRadius: 12, marginBottom: 16,
          background: result.correct ? "#e8f4fd" : "#fff3e0",
          border: "none",
          color: result.correct ? "#007aff" : "#cc7a00",
          fontSize: 15, fontWeight: 600, textAlign: "center", direction: "rtl"
        }}>
          {result.feedback}
        </div>
      )}

      {revealed && !result && (
        <div style={{
          padding: "12px 16px", borderRadius: 12, marginBottom: 16,
          background: "#fff3e0", border: "none",
          color: "#cc7a00", fontSize: 16, fontWeight: 700,
          textAlign: "center", direction: "rtl"
        }}>
          התשובה: {currentWord.hebrew}
          <div style={{ fontSize: 12, fontWeight: 400, color: "#8e8e93", marginTop: 4 }}>
            נספר כטעות — לחץ המשך
          </div>
        </div>
      )}

      {!result && !revealed ? (
        variation === "hebrewToGreek" ? null : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <button
              onClick={handleSubmit}
              disabled={!input.trim()}
              style={{
                width: "100%", padding: "15px 0", fontSize: 17, fontWeight: 700,
                background: "#007aff",
                color: "#fff", border: "none", borderRadius: 14, cursor: "pointer",
                opacity: !input.trim() ? 0.5 : 1
              }}>
              בדוק
            </button>
            <button
              onClick={handleReveal}
              style={{
                width: "100%", padding: "12px 0", fontSize: 15, fontWeight: 600,
                background: "#fff", color: "#8e8e93",
                border: "none", borderRadius: 14, cursor: "pointer",
                boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
              }}>
              לא יודע — הצג תשובה
            </button>
          </div>
        )
      ) : (
        <button onClick={loadNext} style={{
          width: "100%", padding: "15px 0", fontSize: 17, fontWeight: 700,
          background: "#007aff",
          color: "#fff", border: "none", borderRadius: 14, cursor: "pointer"
        }}>
          המשך
        </button>
      )}
    </div>
  );
}

function LearnedScreen({ wordState, onBack, onResetWord }) {
  const learnedWords = ALL_WORDS.filter(w => (wordState[w.id]?.streak || 0) >= 5);
  const grouped = {};
  learnedWords.forEach(w => {
    if (!grouped[w.level]) grouped[w.level] = [];
    grouped[w.level].push(w);
  });

  return (
    <div style={{ padding: "24px 20px", maxWidth: 480, margin: "0 auto", animation: "fadeIn 0.4s ease" }}>
      <div style={{ display: "flex", alignItems: "center", marginBottom: 20, gap: 12 }}>
        <button onClick={onBack} style={{
          background: "#fff", border: "none", borderRadius: 10,
          fontSize: 18, cursor: "pointer", width: 36, height: 36,

          boxShadow: "0 1px 4px rgba(0,0,0,0.06)", color: "#007aff"

          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {grouped[lvl].map(w => {

                <div key={w.id} style={{

                  background: "#fff", borderRadius: 12, padding: "10px 14px",
                  boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <button onClick={() => speak(w.greek)} style={{
                      background: "none", border: "none", padding: 0, cursor: "pointer",

                    }}>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007aff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                    </button>

                    </div>
                  </div>
                  <button onClick={() => onResetWord(w.id)} style={{
                    background: "#f2f2f7", border: "none", borderRadius: 8,
                    padding: "6px 10px", fontSize: 11, fontWeight: 600,
                    color: "#ff9f0a", cursor: "pointer"
                  }}>
                    החזר לתרגול
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [wordState, setWordState] = useState(null);
  const [practiceMode, setPracticeMode] = useState("all");
  const [startedAt, setStartedAt] = useState(null);

  const [recovered, setRecovered] = useState(false);

  useEffect(() => {
    function applyData(saved) {
      if (saved?.wordState) {
        const merged = initWordState();
        Object.keys(saved.wordState).forEach(id => {
          if (merged[id] !== undefined) merged[id] = { ...merged[id], ...saved.wordState[id] };
        });
        let sa = saved.startedAt || null;
        if (!sa) {
          const dates = Object.values(merged).map(s => s.lastSeen).filter(Boolean);
          if (dates.length > 0) sa = dates.sort()[0];
        }
        return { state: merged, startedAt: sa };
      }
      return null;
    }

    const lsData = loadData();
    const lsResult = applyData(lsData);
    if (lsResult) {
      setWordState(lsResult.state);
      setStartedAt(lsResult.startedAt);
      setScreen("home");
    } else {
      idbLoad().then(idbData => {
        const idbResult = applyData(idbData ? migrateStreak(idbData) : null);
        if (idbResult) {
          setWordState(idbResult.state);
          setStartedAt(idbResult.startedAt);
          setRecovered(true);
          saveData({ wordState: idbResult.state, startedAt: idbResult.startedAt, savedAt: new Date().toISOString() });
        } else {
          const now = new Date().toISOString();
          setWordState(initWordState());
          setStartedAt(now);
        }
        setScreen("home");
      });
    }
  }, []);

  const wordStateRef = useRef(wordState);
  const startedAtRef = useRef(startedAt);
  useEffect(() => { startedAtRef.current = startedAt; }, [startedAt]);
  useEffect(() => {
    wordStateRef.current = wordState;
    if (!wordState) return;
    saveData({ wordState, startedAt: startedAtRef.current, savedAt: new Date().toISOString() });
  }, [wordState]);

  useEffect(() => {
    function emergencySave() {
      if (wordStateRef.current) {
        saveData({ wordState: wordStateRef.current, startedAt: startedAtRef.current, savedAt: new Date().toISOString() });
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") emergencySave();
    });
    window.addEventListener("pagehide", emergencySave);
    window.addEventListener("beforeunload", emergencySave);
    return () => {
      document.removeEventListener("visibilitychange", emergencySave);
      window.removeEventListener("pagehide", emergencySave);
      window.removeEventListener("beforeunload", emergencySave);
    };
  }, []);

  const handleUpdateWord = useCallback((id, updates) => {
    setWordState(prev => {
      const next = { ...prev, [id]: { ...prev[id], ...updates } };
      wordStateRef.current = next;
      try { saveData({ wordState: next, startedAt: startedAtRef.current, savedAt: new Date().toISOString() }); } catch(e) {}
      return next;
    });
  }, []);

  if (screen === "loading" || !wordState) {
    return (
      <div style={{
        minHeight: "100vh", display: "flex", alignItems: "center",
        justifyContent: "center", flexDirection: "column", gap: 12,
        background: "#f2f2f7"
      }}>
        <div style={{ fontSize: 20, fontWeight: 600, color: "#007aff" }}>Greek Vocabulary</div>
        <div style={{ color: "#8e8e93", fontSize: 14 }}>טוען...</div>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", minHeight: "100dvh", background: "#f2f2f7",
      direction: "rtl"
    }}>
      {recovered && (
        <div style={{
          position: "fixed", top: 16, left: 16, right: 16, zIndex: 999,
          padding: "12px 16px", borderRadius: 12,
          background: "#e8f4fd", border: "none",
          textAlign: "center", fontSize: 14, fontWeight: 600, color: "#007aff",
          boxShadow: "0 4px 12px rgba(0,0,0,0.1)",
          animation: "fadeIn 0.3s"
        }} onClick={() => setRecovered(false)}>
          הנתונים שוחזרו מגיבוי — הקש לסגור
        </div>
      )}
      {screen === "home" && (
        <HomeScreen
          wordState={wordState}
          startedAt={startedAt}
          onStart={(mode) => { setPracticeMode(mode); setScreen("practice"); }}
          onRoadmap={() => setScreen("roadmap")}
          onShowLearned={() => setScreen("learned")}
        />
      )}
      {screen === "practice" && (
        <PracticeScreen
          wordState={wordState}
          mode={practiceMode}
          onEnd={() => setScreen("home")}
          onUpdateWord={handleUpdateWord}
        />
      )}
      {screen === "roadmap" && (
        <RoadmapScreen
          wordState={wordState}
          onBack={() => setScreen("home")}
        />
      )}
      {screen === "learned" && (
        <LearnedScreen
          wordState={wordState}
          onBack={() => setScreen("home")}
          onResetWord={(id) => handleUpdateWord(id, { streak: 0, score: 0 })}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
