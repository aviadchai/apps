name: CarBoard Sync
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: carboard-updates
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.issue.user.login == 'aviadchai' && startsWith(github.event.issue.title, 'carboard-sync:')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and synchronize one vehicle record
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            let payload;
            try { payload = JSON.parse(issue.body || ''); } catch(e) {
              core.setFailed('Issue body must be valid JSON');
              return;
            }
            if (payload.type !== 'carboard-sync' || payload.version !== 1 || !payload.listing) {
              core.setFailed('Invalid synchronization format');
              return;
            }
            const input = payload.listing;
            if (typeof input.id !== 'string' || !/^[a-zA-Z0-9-]{5,80}$/.test(input.id)) {
              core.setFailed('Invalid record ID');
              return;
            }
            const owner = context.repo.owner, repo = context.repo.repo;
            const path = 'carboard/data.json';
            const current = await github.rest.repos.getContent({owner,repo,path,ref:'master'});
            const data = JSON.parse(Buffer.from(current.data.content,'base64').toString('utf8'));
            if (!Array.isArray(data.listings)) throw Error('Missing listings array');
            const i = data.listings.findIndex(x => x.id === input.id);
            if (input.deleted === true) {
              if (i >= 0) data.listings.splice(i,1);
            } else {
              const allowed = [
                'id','title','year','engine','gear','plate','hand','km','kmNote',
                'price','location','source','url','status','verdict','priority',
                'updatedAt','notes','positives','risks','tasks','timeline','createdAt'
              ];
              const record = {};
              for(const k of allowed) if (Object.prototype.hasOwnProperty.call(input,k)) record[k]=input[k];
              if(typeof record.title!=='string' || !record.title.trim() || record.title.length>130) throw Error('Invalid title');
              if(record.notes && (typeof record.notes!=='string'||record.notes.length>5000)) throw Error('Invalid notes');
              if(record.url && !/^https?:\/\//i.test(record.url)) throw Error('Only http(s) links are permitted');
              if(record.timeline && (!Array.isArray(record.timeline)||record.timeline.length>120)) throw Error('Too many timeline entries');
              if(record.tasks && (!Array.isArray(record.tasks)||record.tasks.length>80)) throw Error('Too many tasks');
              if(record.positives && !Array.isArray(record.positives)) throw Error('Invalid positives');
              if(record.risks && !Array.isArray(record.risks)) throw Error('Invalid risks');
              record.syncedAt=new Date().toISOString();
              if(i>=0) data.listings[i]=record; else data.listings.push(record);
            }
            data.updatedAt=new Date().toISOString();
            const content=Buffer.from(JSON.stringify(data,null,2)+'\n','utf8').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,sha:current.data.sha,content,branch:'master',
              message:'data(carboard): sync '+input.id+' from issue #'+issue.number
            });
            await github.rest.issues.createComment({
              owner,repo,issue_number:issue.number,
              body:'העדכון סונכרן ללוח CarBoard. [פתח את הלוח](https://aviadchai.github.io/apps/carboard/).'
            });
            await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed'});
