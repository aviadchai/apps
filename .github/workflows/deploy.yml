name: Deploy feature branch
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout files from feature branch
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git fetch origin ${{ inputs.branch }}
          git checkout origin/${{ inputs.branch }} -- greek-vocab.html greek-vocab-manifest.json icon-greek-vocab.svg icon-greek-vocab-180.png icon-greek-vocab-512.png index.html sw.js
          git add greek-vocab.html greek-vocab-manifest.json icon-greek-vocab.svg icon-greek-vocab-180.png icon-greek-vocab-512.png index.html sw.js
          git diff --cached --quiet && echo "No changes" || git commit -m "Deploy ${{ inputs.branch }}"
          git push origin master
