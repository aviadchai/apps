function pickSceneImg(scene, word) {
  const imgs = SCENE_IMGS[scene] || SCENE_IMGS.sign;
  let h = 0;
  for (let i = 0; i < word.length; i++) h = ((h << 5) - h + word.charCodeAt(i)) | 0;
  return imgs[Math.abs(h) % imgs.length];
}

  "Έψιλον":"έψιλον","Ζήτα":"ζήτα","Ήτα":"ήτα","Θήτα":"θήτα",

  "Φι":"φι","Χι":"χι","Ψι":"ψι","Ωμέγα":"ωμέγα"
};
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const pron = LETTER_PRONUNCIATIONS[text];
  const sayText = pron || text;
  const utt = new SpeechSynthesisUtterance(sayText);
  utt.lang = "el-GR";
  utt.rate = 0.6;
  const voices = window.speechSynthesis.getVoices();
  const greek = voices.find(v => v.lang === "el-GR") || voices.find(v => v.lang.startsWith("el"));
  if (greek) utt.voice = greek;
  window.speechSynthesis.speak(utt);
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function nameTooSimilar(a, b) {
  if (a === b) return true;
  if (a.length === b.length) {
    let diffs = 0;
    for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) diffs++; }
    if (diffs <= 1) return true;
  }
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  if (longer.length - shorter.length === 1) {
    for (let i = 0; i < longer.length; i++) {
      if (longer.slice(0, i) + longer.slice(i + 1) === shorter) return true;
    }
  }
  return false;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  const start = new Date(dateStr);
  const today = new Date();
  const startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.floor((todayDay - startDay) / 86400000);
}

const DIFF_LINE = {1:"#34c759",2:"#ff9f0a",3:"#ff453a"};
function BingoCell({ letter, state, onClick, highlight }) {
  const learned = state?.learned;
  const diff = letter.difficulty;
  const almostDone = !learned && (state?.quizCorrect || 0) >= 8;
  return (
    <div onClick={onClick} style={{
      position: "relative",
      background: learned ? "#007aff" : "#fff",
      borderRadius: 12,
      padding: "7px 2px",
      textAlign: "center",
      cursor: "pointer",
      border: almostDone ? "1.5px solid #ff9f0a" : !learned ? `1px solid ${DIFF_LINE[diff]}40` : "none",
      transition: "all 0.15s ease",
      minHeight: 50,
      boxShadow: learned ? "0 2px 8px rgba(0,122,255,0.25)" : "0 1px 4px rgba(0,0,0,0.06)",
      overflow: "hidden"
    }}>
      <div style={{
        fontSize: 18, fontWeight: 600,
        color: learned ? "#fff" : "#1c1c1e",
        lineHeight: 1.1
      }}>
        {letter.upper}
      </div>
      <div style={{
        fontSize: 11,
        color: learned ? "rgba(255,255,255,0.85)" : "#8e8e93",
        marginTop: 1
      }}>
        {letter.lower}
      </div>
      {learned ? (
        <div style={{
          position: "absolute", top: 3, left: 3,
          fontSize: 9, lineHeight: 1, color: "#fff", fontWeight: 600
        }}>✓</div>
      ) : almostDone ? (
        <div style={{
          position: "absolute", top: 2, left: 2,
          fontSize: 8, fontWeight: 700, color: "#ff9f0a",
          lineHeight: 1
        }}>{state.quizCorrect}/10</div>
      ) : (state?.quizCorrect > 0) && (
        <div style={{
          position: "absolute", bottom: 5, left: 4, right: 4,
          height: 2.5, borderRadius: 2, background: "#e5e5ea", overflow: "hidden"
        }}>
          <div style={{
            width: (state.quizCorrect / 10 * 100) + "%",
            height: "100%", borderRadius: 2,
            background: "#007aff"
          }} />
        </div>
      )}
    </div>
  );
}

  function handleTouchStart(e) { touchRef.current = e.touches[0].clientX; }
  function handleTouchEnd(e) {
    if (touchRef.current === null) return;
    const dx = e.changedTouches[0].clientX - touchRef.current;
    touchRef.current = null;
    if (Math.abs(dx) > 50) {
      if (dx < 0) { slideDirRef.current = "Right"; onNext && onNext(); }
      else { slideDirRef.current = "Left"; onPrev && onPrev(); }
    }
  }
  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",

function QuizScreen({ letterStates, focusLevel, onEnd, onUpdate }) {
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, total: 0 });

  useEffect(() => {
    const qs = generateQuiz(letterStates);
    setQuestions(qs);
  }, []);

  function generateQuiz(states) {
    const weighted = LETTERS.map(letter => {
      const s = states[letter.id];
      const progress = s.quizCorrect || 0;
      let weight;
      if (s.learned) { weight = 1; }
      else if (s.quizTotal === 0) { weight = 15; }
      else {
        const accuracy = s.quizCorrect / s.quizTotal;
        weight = Math.max(2, Math.round((1 - accuracy) * 20) + (10 - progress));
      }
      if (letter.difficulty === focusLevel) weight *= 3;
      else if (letter.difficulty > focusLevel) weight = Math.max(1, Math.ceil(weight / 3));
      return { letter, weight };
    });
    const pool = [];
    weighted.forEach(({ letter, weight }) => {
      for (let i = 0; i < weight; i++) pool.push(letter);
    });
    const picked = [];
    const used = new Set();
    while (picked.length < 12 && pool.length > 0) {
      const idx = Math.floor(Math.random() * pool.length);
      const letter = pool[idx];
      if (!used.has(letter.id)) {
        picked.push(letter);
        used.add(letter.id);
      }
      pool.splice(idx, 1);
    }
    const qs = [];
    const types = ["identify", "sound", "reverse"];

    picked.forEach((letter, i) => {
      const type = types[i % 3];
      let others;
      if (type === "sound") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && l.sound !== letter.sound)).slice(0, 3);
      } else if (type === "identify") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && !nameTooSimilar(l.nameHe, letter.nameHe))).slice(0, 3);
      } else {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && !nameTooSimilar(l.nameHe, letter.nameHe))).slice(0, 3);
      }
      const options = shuffle([letter, ...others]);

      if (type === "identify") {
        qs.push({
          type, letter, options,
          question: `מה שם האות ${letter.upper} ?`,
          getLabel: l => l.nameHe,
          correctId: letter.id
        });
      } else if (type === "sound") {
        qs.push({
          type, letter, options,
          question: `איך נשמעת ${letter.upper}${letter.lower} ?`,
          getLabel: l => `${l.soundHe}  (${l.sound})`,
          correctId: letter.id
        });
      } else {
        qs.push({
          type, letter, options,
          question: `איפה האות ${letter.nameHe} ?`,
          getLabel: l => `${l.upper}${l.lower}`,
          correctId: letter.id,
          bigOptions: true
        });
      }
    });

    return shuffle(qs).slice(0, 10);
  }

  if (questions.length === 0) return null;

  if (qi >= questions.length) {
    const pct = Math.round((stats.correct / stats.total) * 100);
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center" }}>
        <h2 style={{ fontSize: 24, fontWeight: 700, color: "#1c1c1e", marginBottom: 8, marginTop: 32 }}>
          {pct >= 80 ? "מצוין!" : pct >= 50 ? "לא רע!" : "צריך תרגול"}
        </h2>
        <div style={{ fontSize: 48, fontWeight: 700, color: pct >= 80 ? "#007aff" : "#ff9f0a", marginBottom: 8 }}>
          {pct}%
        </div>
        <div style={{ fontSize: 16, color: "#8e8e93", marginBottom: 32 }}>
          {stats.correct} מתוך {stats.total} תשובות נכונות
        </div>
        <button onClick={onEnd} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "#007aff",
          color: "#fff", border: "none", borderRadius: 14
        }}>
          חזרה הביתה
        </button>
      </div>
    );
  }

  const q = questions[qi];
  const isCorrect = selected !== null ? selected === q.correctId : null;

  function handleSelect(id) {
    if (selected !== null) return;
    setSelected(id);
    const correct = id === q.correctId;
    setStats(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    onUpdate(q.letter.id, correct);
    if (correct) speak(q.letter.example);
  }

  function handleNext() {
    setSelected(null);
    setQi(qi + 1);
  }

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",
        marginBottom: 20
      }}>
        <button onClick={onEnd} style={{
          background: "#fff", border: "none", fontSize: 18,
          width: 36, height: 36, borderRadius: 10, color: "#007aff",
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
        }}>←</button>
        <div style={{ fontSize: 14, color: "#8e8e93", fontWeight: 600 }}>
          {qi + 1} / {questions.length}
        </div>
        <div style={{ fontSize: 13, color: "#007aff", fontWeight: 600 }}>
          {stats.correct} נכון
        </div>
      </div>

      <div style={{
        background: "#e5e5ea", borderRadius: 99, height: 6, marginBottom: 24, overflow: "hidden"
      }}>
        <div style={{
          width: ((qi + 1) / questions.length * 100) + "%",
          height: "100%", background: "#007aff", borderRadius: 99,
          transition: "width 0.4s"
        }} />
      </div>

      {q.type !== "reverse" && (
        <div style={{
          textAlign: "center", marginBottom: 24
        }}>
          <div style={{
            fontSize: 80, fontWeight: 700, color: "#1c1c1e",
            lineHeight: 1, marginBottom: 8, cursor: "pointer"
          }} onClick={() => speak(q.letter.name)}>
            {q.letter.upper}{q.letter.lower}
          </div>
          <button onClick={() => speak(q.letter.name)} style={{
            padding: "6px 16px", borderRadius: 99,
            background: "#e8f4fd", border: "none",
            color: "#007aff", fontSize: 13, cursor: "pointer", fontWeight: 500
          }}>שמע</button>
        </div>
      )}

      <div style={{
        fontSize: 18, fontWeight: 600, color: "#1c1c1e",
        textAlign: "center", marginBottom: 20
      }}>
        {q.question}
      </div>

      <div style={{
        display: "grid",
        gridTemplateColumns: q.bigOptions ? "1fr 1fr" : "1fr",
        gap: 10, marginBottom: 20
      }}>
        {q.options.map(opt => {
          const isThis = selected === opt.id;
          const isRight = opt.id === q.correctId;
          let bg = "#fff", border = "#e5e5ea", color = "#1c1c1e";
          if (selected !== null) {
            if (isRight) { bg = "#e8f4fd"; border = "#007aff"; color = "#007aff"; }
            else if (isThis && !isRight) { bg = "#fff3e0"; border = "#ff9f0a"; color = "#cc7a00"; }
          }
          return (
            <button key={opt.id} onClick={() => handleSelect(opt.id)} style={{
              padding: q.bigOptions ? "18px 10px" : "14px 18px",
              fontSize: q.bigOptions ? 32 : 16,
              fontWeight: q.bigOptions ? 700 : 600,
              background: bg,
              color,
              border: `1.5px solid ${border}`,
              borderRadius: 14,
              textAlign: "center",
              transition: "all 0.15s",
              boxShadow: selected === null ? "0 1px 4px rgba(0,0,0,0.06)" : "none"
            }}>
              {q.getLabel(opt)}
              {selected !== null && isRight && " ✓"}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <div>
          <div style={{
            padding: "12px 16px", borderRadius: 12, marginBottom: 14,
            background: isCorrect ? "#e8f4fd" : "#fff3e0",
            border: "none",
            textAlign: "center", fontSize: 14, fontWeight: 600,
            color: isCorrect ? "#007aff" : "#cc7a00"
          }}>
            {isCorrect ? "נכון!" : `לא — התשובה: ${q.letter.nameHe} (${q.letter.upper}${q.letter.lower}) = ${q.letter.soundHe}`}
          </div>
          <button onClick={handleNext} style={{
            width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,
            background: "#007aff",
            color: "#fff", border: "none", borderRadius: 14
          }}>
            {qi + 1 < questions.length ? "הבא" : "סיכום"}
          </button>
        </div>
      )}
    </div>
  );
}

const UNLOCK_THRESHOLD = 6;

function getUnlockedLevel(letterStates) {
  const learnedEasy = LETTERS.filter(l => l.difficulty === 1 && letterStates[l.id]?.learned).length;
  const learnedMed = LETTERS.filter(l => l.difficulty === 2 && letterStates[l.id]?.learned).length;
  if (learnedEasy >= UNLOCK_THRESHOLD && learnedMed >= UNLOCK_THRESHOLD) return 3;
  if (learnedEasy >= UNLOCK_THRESHOLD) return 2;
  return 1;
}

function NumberModal({ num, state, onClose, onNext, onPrev }) {
  const touchRef = useRef(null);
  const slideDirRef = useRef(null);
  function handleTouchStart(e) { touchRef.current = e.touches[0].clientX; }
  function handleTouchEnd(e) {
    if (touchRef.current === null) return;
    const dx = e.changedTouches[0].clientX - touchRef.current;
    touchRef.current = null;
    if (Math.abs(dx) > 50) {
      if (dx < 0) { slideDirRef.current = "Right"; onNext && onNext(); }
      else { slideDirRef.current = "Left"; onPrev && onPrev(); }
    }
  }
  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
      display: "flex", alignItems: "center", justifyContent: "center",
      zIndex: 100, padding: 20, backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)"

      <div onClick={e => e.stopPropagation()}
        onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}

          maxWidth: 360, width: "100%", position: "relative",
          boxShadow: "0 20px 60px rgba(0,0,0,0.15)",
          animation: `${slideDirRef.current ? "slideIn" + slideDirRef.current : "fadeIn"} 0.25s ease`

        <button onClick={onClose} style={{

          background: "#f2f2f7", border: "none", fontSize: 14, color: "#8e8e93",

          display: "flex", alignItems: "center", justifyContent: "center"

        <div style={{ textAlign: "center", marginBottom: 20 }}>

function NumberQuizScreen({ numberStates, onEnd, onUpdate }) {
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, total: 0 });

  useEffect(() => {
    const basic = NUMBERS.filter(n => parseInt(n.val) <= 10);
    const advanced = NUMBERS.filter(n => parseInt(n.val) > 10);
    const pool = [...basic, ...basic, ...advanced];
    const picked = [];
    const used = new Set();
    const shuffled = shuffle(pool);
    for (const n of shuffled) {
      if (!used.has(n.id)) { picked.push(n); used.add(n.id); }
      if (picked.length >= 10) break;
    }
    const qs = picked.map((num, i) => {
      const others = shuffle(NUMBERS.filter(n => n.id !== num.id)).slice(0, 3);
      const options = shuffle([num, ...others]);
      if (i % 3 === 0) {
        return { num, options, question: `מה המספר ${num.gr} ?`, getLabel: n => n.he, correctId: num.id, showSpeak: true };
      } else if (i % 3 === 1) {
        return { num, options, question: `איך אומרים ${num.he} ביוונית?`, getLabel: n => n.gr, correctId: num.id, ltr: true };
      } else {
        return { num, options, question: `מה המספר ${num.val} ביוונית?`, getLabel: n => n.gr, correctId: num.id, ltr: true };
      }
    });
    setQuestions(qs);
  }, []);

  if (questions.length === 0) return null;

  if (qi >= questions.length) {
    const pct = Math.round((stats.correct / stats.total) * 100);
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center" }}>
        <h2 style={{ fontSize: 24, fontWeight: 700, color: "#1c1c1e", marginBottom: 8, marginTop: 32 }}>
          {pct >= 80 ? "מצוין!" : pct >= 50 ? "לא רע!" : "צריך תרגול"}
        </h2>
        <div style={{ fontSize: 48, fontWeight: 700, color: pct >= 80 ? "#007aff" : "#ff9f0a", marginBottom: 8 }}>{pct}%</div>
        <div style={{ fontSize: 16, color: "#8e8e93", marginBottom: 32 }}>{stats.correct} מתוך {stats.total} תשובות נכונות</div>
        <button onClick={onEnd} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "#007aff", color: "#fff", border: "none", borderRadius: 14
        }}>חזרה הביתה</button>
      </div>
    );
  }

  const q = questions[qi];
  const isCorrect = selected !== null ? selected === q.correctId : null;

  function handleSelect(id) {
    if (selected !== null) return;
    setSelected(id);
    const correct = id === q.correctId;
    setStats(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    onUpdate(q.num.id, correct);
    if (correct) speak(q.num.gr);
  }

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <button onClick={onEnd} style={{
          background: "#fff", border: "none", fontSize: 18,
          width: 36, height: 36, borderRadius: 10, color: "#007aff",
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
        }}>←</button>
        <div style={{ fontSize: 14, color: "#8e8e93", fontWeight: 600 }}>{qi + 1} / {questions.length}</div>
        <div style={{ fontSize: 13, color: "#007aff", fontWeight: 600 }}>{stats.correct} נכון</div>
      </div>
      <div style={{ background: "#e5e5ea", borderRadius: 99, height: 6, marginBottom: 24, overflow: "hidden" }}>
        <div style={{ width: ((qi + 1) / questions.length * 100) + "%", height: "100%", background: "#007aff", borderRadius: 99, transition: "width 0.4s" }} />
      </div>
      <div style={{ textAlign: "center", marginBottom: 20 }}>
        <div style={{ fontSize: 18, fontWeight: 600, color: "#1c1c1e", marginBottom: 8 }}>{q.question}</div>
        {q.showSpeak && (
          <button onClick={() => speak(q.num.gr)} style={{
            padding: "6px 16px", borderRadius: 99,
            background: "#e8f4fd", border: "none",
            color: "#007aff", fontSize: 13, fontWeight: 500, cursor: "pointer"
          }}>שמע</button>
        )}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
        {q.options.map(opt => {
          const isThis = selected === opt.id;
          const isRight = opt.id === q.correctId;
          let bg = "#fff", border = "#e5e5ea", color = "#1c1c1e";
          if (selected !== null) {
            if (isRight) { bg = "#e8f4fd"; border = "#007aff"; color = "#007aff"; }
            else if (isThis && !isRight) { bg = "#fff3e0"; border = "#ff9f0a"; color = "#cc7a00"; }
          }
          return (
            <button key={opt.id} onClick={() => handleSelect(opt.id)} style={{
              padding: "14px 10px", fontSize: 18, fontWeight: 600,
              background: bg, color, border: `1.5px solid ${border}`,
              borderRadius: 14, textAlign: "center", transition: "all 0.15s",
              direction: q.ltr ? "ltr" : "rtl",
              boxShadow: selected === null ? "0 1px 4px rgba(0,0,0,0.06)" : "none"
            }}>
              {q.getLabel(opt)}{selected !== null && isRight && " ✓"}
            </button>
          );
        })}
      </div>
      {selected !== null && (
        <div>
          <div style={{
            padding: "12px 16px", borderRadius: 12, marginBottom: 14,
            background: isCorrect ? "#e8f4fd" : "#fff3e0",
            textAlign: "center", fontSize: 14, fontWeight: 600,
            color: isCorrect ? "#007aff" : "#cc7a00"
          }}>
            {isCorrect ? `נכון! ${q.num.gr} = ${q.num.he}` : `לא — ${q.num.gr} = ${q.num.he} (${q.num.pron})`}
          </div>
          <button onClick={() => { setSelected(null); setQi(qi + 1); }} style={{
            width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,
            background: "#007aff", color: "#fff", border: "none", borderRadius: 14
          }}>{qi + 1 < questions.length ? "הבא" : "סיכום"}</button>
        </div>
      )}
    </div>
  );
}

                    }}>{correct}/10</div>
                  </div>
                );

        );

function FinalExamScreen({ onEnd, onFail }) {
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, wrong: 0 });
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    const picked = shuffle(LETTERS).slice(0, 10);
    const types = ["identify", "sound", "reverse"];
    const qs = picked.map((letter, i) => {
      const type = types[i % 3];
      let others;
      if (type === "sound") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && l.sound !== letter.sound)).slice(0, 3);
      } else if (type === "identify") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && !nameTooSimilar(l.nameHe, letter.nameHe))).slice(0, 3);
      } else {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && !nameTooSimilar(l.nameHe, letter.nameHe))).slice(0, 3);
      }
      const options = shuffle([letter, ...others]);
      const question = type === "identify" ? `מה שם האות ${letter.upper} ?`
        : type === "sound" ? `איך נשמעת ${letter.upper}${letter.lower} ?`
        : `איפה האות ${letter.nameHe} ?`;
      const getLabel = type === "identify" ? l => l.nameHe
        : type === "sound" ? l => `${l.soundHe}  (${l.sound})`
        : l => `${l.upper}${l.lower}`;
      return { letter, options, question, getLabel, correctId: letter.id, type, bigOptions: type === "reverse" };
    });
    setQuestions(qs);
  }, []);

  if (questions.length === 0) return null;

  if (qi >= questions.length) {
    const passed = stats.wrong === 0;
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center" }}>
        <h2 style={{ fontSize: 24, fontWeight: 700, color: "#1c1c1e", marginBottom: 8, marginTop: 32 }}>
          {passed ? "עברת את המבחן הסופי!" : "צריך עוד תרגול"}
        </h2>
        <div style={{ fontSize: 48, fontWeight: 700, color: passed ? "#007aff" : "#ff9f0a", marginBottom: 8 }}>
          {stats.correct}/10
        </div>
        <div style={{ fontSize: 16, color: "#8e8e93", marginBottom: 16 }}>
          תשובות נכונות
        </div>
        {!passed && (
          <div style={{
            padding: 14, borderRadius: 14, background: "#fff3e0",
            border: "none", color: "#cc7a00",
            fontSize: 14, marginBottom: 16
          }}>
            כל האותיות חזרו ל-8 תשובות נכונות — תרגל שוב כדי להגיע ל-10
          </div>
        )}
        <button onClick={() => { if (!passed) onFail(); onEnd(); }} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "#007aff",
          color: "#fff", border: "none", borderRadius: 14
        }}>
          חזרה הביתה
        </button>
      </div>
    );
  }

  const q = questions[qi];
  const isCorrect = selected !== null ? selected === q.correctId : null;

  function handleSelect(id) {
    if (selected !== null) return;
    setSelected(id);
    const correct = id === q.correctId;
    if (correct) {
      setStats(s => ({ ...s, correct: s.correct + 1 }));
      speak(q.letter.name);
    } else {
      setStats(s => ({ ...s, wrong: s.wrong + 1 }));
      setFailed(true);
    }
  }

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16
      }}>
        <button onClick={onEnd} style={{
          background: "#fff", border: "none", fontSize: 18,
          width: 36, height: 36, borderRadius: 10, color: "#007aff",
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
        }}>←</button>
        <div style={{
          fontSize: 14, fontWeight: 700, color: "#007aff",
          background: "#e8f4fd", padding: "4px 14px", borderRadius: 99
        }}>
          מבחן סופי
        </div>
        <div style={{ fontSize: 14, color: "#8e8e93", fontWeight: 600 }}>{qi + 1}/10</div>
      </div>

      <div style={{ background: "#e5e5ea", borderRadius: 99, height: 6, marginBottom: 20, overflow: "hidden" }}>
        <div style={{
          width: ((qi + 1) / 10 * 100) + "%",
          height: "100%", background: failed ? "#ff9f0a" : "#007aff",
          borderRadius: 99, transition: "width 0.4s"
        }} />
      </div>

      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 56, fontWeight: 700, color: "#1c1c1e", lineHeight: 1, marginBottom: 8 }}>
          {q.letter.upper}{q.letter.lower}
        </div>
        <div style={{ fontSize: 15, color: "#8e8e93" }}>{q.question}</div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: q.bigOptions ? "1fr 1fr" : "1fr", gap: 10, marginBottom: 16 }}>
        {q.options.map(opt => {
          const isThis = selected === opt.id;
          const isRight = opt.id === q.correctId;
          let bg = "#fff", border = "#e5e5ea", color = "#1c1c1e";
          if (selected !== null) {
            if (isRight) { bg = "#e8f4fd"; border = "#007aff"; color = "#007aff"; }
            else if (isThis && !isRight) { bg = "#fff3e0"; border = "#ff9f0a"; color = "#cc7a00"; }
          }
          return (
            <button key={opt.id} onClick={() => handleSelect(opt.id)} style={{
              padding: q.bigOptions ? "16px 10px" : "14px 18px",
              fontSize: q.bigOptions ? 28 : 17, fontWeight: 600,
              background: bg, color, border: `1.5px solid ${border}`,
              borderRadius: 14, textAlign: "center", transition: "all 0.15s",
              boxShadow: selected === null ? "0 1px 4px rgba(0,0,0,0.06)" : "none"
            }}>
              {q.getLabel(opt)}
              {selected !== null && isRight && " ✓"}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <button onClick={() => { setSelected(null); setQi(qi + 1); }} style={{
          width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,
          background: "#007aff",
          color: "#fff", border: "none", borderRadius: 14
        }}>
          הבא
        </button>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [letterStates, setLetterStates] = useState(null);
  const [numberStates, setNumberStates] = useState(null);
  const [selectedLetter, setSelectedLetter] = useState(null);
  const [selectedNumber, setSelectedNumber] = useState(null);
  const [challengeStart, setChallengeStart] = useState(null);

  useEffect(() => {
    const saved = loadData();
    if (saved?.letterStates) {
      const merged = initState();
      Object.keys(saved.letterStates).forEach(id => {
        if (merged[id]) merged[id] = { ...merged[id], ...saved.letterStates[id] };
      });
      setLetterStates(merged);
      setChallengeStart(saved.challengeStart || null);
    } else {
      setLetterStates(initState());
    }
    if (saved?.numberStates) {
      const mergedN = initNumberState();
      Object.keys(saved.numberStates).forEach(id => {
        if (mergedN[id]) mergedN[id] = { ...mergedN[id], ...saved.numberStates[id] };
      });
      setNumberStates(mergedN);
    } else {
      setNumberStates(initNumberState());
    }
    setScreen("home");
  }, []);

  const saveTimer = useRef(null);
  useEffect(() => {
    if (!letterStates || !numberStates) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveData({ letterStates, numberStates, challengeStart, savedAt: new Date().toISOString() });
    }, 300);
    return () => clearTimeout(saveTimer.current);
  }, [letterStates, numberStates, challengeStart]);

  function handleQuizUpdate(id, correct) {
    setLetterStates(prev => {
      const cur = prev[id];
      const newCorrect = correct
        ? cur.quizCorrect + 1
        : Math.max(0, cur.quizCorrect - 3);
      return {
        ...prev,
        [id]: {
          ...cur,
          quizCorrect: newCorrect,
          quizTotal: cur.quizTotal + 1,
          learned: newCorrect >= 10 ? true : false
        }
      };
    });
    if (!challengeStart) {
      setChallengeStart(new Date().toISOString());
    }
  }

  function handleNumberQuizUpdate(id, correct) {
    setNumberStates(prev => {
      const cur = prev[id];
      const newCorrect = correct
        ? cur.quizCorrect + 1
        : Math.max(0, cur.quizCorrect - 3);
      return {
        ...prev,
        [id]: {
          ...cur,
          quizCorrect: newCorrect,
          quizTotal: cur.quizTotal + 1,
          learned: newCorrect >= 10
        }
      };
    });
  }

  function navigateLetter(dir) {
    if (!selectedLetter) return;
    const idx = LETTERS.findIndex(l => l.id === selectedLetter.id);
    const next = idx + dir;
    if (next >= 0 && next < LETTERS.length) setSelectedLetter(LETTERS[next]);
  }

  function navigateNumber(dir) {
    if (!selectedNumber) return;
    const idx = NUMBERS.findIndex(n => n.id === selectedNumber.id);
    const next = idx + dir;
    if (next >= 0 && next < NUMBERS.length) setSelectedNumber(NUMBERS[next]);
  }

  if (screen === "loading" || !letterStates || !numberStates) {
    return (
      <div style={{
        minHeight: "100vh", display: "flex", alignItems: "center",
        justifyContent: "center", flexDirection: "column", gap: 12,
        background: "#f8fafc"
      }}>
        <div style={{ fontSize: 48 }}>🇬🇷</div>
        <div style={{ color: "#6b7280" }}>טוען...</div>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", minHeight: "100dvh", background: "#f8fafc",
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      direction: "rtl"
    }}>
      {screen === "home" && (
        <HomeScreen
          letterStates={letterStates}
          numberStates={numberStates}
          challengeStart={challengeStart}
          onSelectLetter={l => setSelectedLetter(l)}
          onSelectNumber={n => setSelectedNumber(n)}
          onStartQuiz={() => setScreen("quiz")}
          onStartReading={() => setScreen("reading")}
          onStartFinal={() => setScreen("final")}
          onStartNumberQuiz={() => setScreen("numquiz")}
        />
      )}
      {screen === "quiz" && (
        <QuizScreen
          letterStates={letterStates}
          focusLevel={getUnlockedLevel(letterStates)}
          onEnd={() => setScreen("home")}
          onUpdate={handleQuizUpdate}
        />
      )}
      {screen === "reading" && (
        <ReadingQuizScreen onEnd={() => setScreen("home")} />
      )}
      {screen === "numquiz" && (
        <NumberQuizScreen
          numberStates={numberStates}
          onEnd={() => setScreen("home")}
          onUpdate={handleNumberQuizUpdate}
        />
      )}
      {screen === "final" && (
        <FinalExamScreen
          onEnd={() => setScreen("home")}
          onFail={() => {
            setLetterStates(prev => {
              const next = { ...prev };
              LETTERS.forEach(l => {
                if (next[l.id]?.learned) {
                  next[l.id] = { ...next[l.id], quizCorrect: 8, learned: false };
                }
              });
              return next;
            });
          }}
        />
      )}
      {selectedLetter && (
        <LetterModal
          letter={selectedLetter}
          state={letterStates[selectedLetter.id]}
          onClose={() => setSelectedLetter(null)}
          onNext={() => navigateLetter(1)}
          onPrev={() => navigateLetter(-1)}
        />
      )}
      {selectedNumber && (
        <NumberModal
          num={selectedNumber}
          state={numberStates[selectedNumber.id]}
          onClose={() => setSelectedNumber(null)}
          onNext={() => navigateNumber(1)}
          onPrev={() => navigateNumber(-1)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

<script>
(function(){
  var APP_VER = 'abc_v29';
  if ('caches' in window && localStorage.getItem('abc_ver') !== APP_VER) {
    caches.keys().then(function(names) {
      return Promise.all(names.map(function(n){ return caches.delete(n); }));
    }).then(function(){
      localStorage.setItem('abc_ver', APP_VER);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(r){ return r.unregister(); }));
        }).then(function(){
          navigator.serviceWorker.register('sw.js').then(function(){
            window.location.reload();
          });
        });
      }
    });
  } else {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
      navigator.serviceWorker.addEventListener('controllerchange', function(){ window.location.reload(); });
    }
  }
})();
</script>
