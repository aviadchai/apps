function pickSceneImg(scene, word) {
  const imgs = SCENE_IMGS[scene] || SCENE_IMGS.sign;
  let h = 0;
  for (let i = 0; i < word.length; i++) h = ((h << 5) - h + word.charCodeAt(i)) | 0;
  return imgs[Math.abs(h) % imgs.length];
}

function buildAbcParagraph(learnedLetters) {
  if (learnedLetters.length < 3) return null;
  const ids = new Set(learnedLetters.map(l => l.id));
  const allExamples = LETTERS.filter(l => ids.has(l.id)).map(l => ({
    word: l.example, he: l.exampleHe, letter: l.lower, name: l.nameHe
  }));
  if (allExamples.length < 2) return null;

  const templates = [
    { minLetters: 3,
      build: (ex) => ({
        gr: ex.slice(0, 3).map(e => e.word).join(", "),
        he: `${ex.slice(0, 3).map(e => `${e.word} (${e.he})`).join(" · ")}`,
        note: `מילים שמתחילות באותיות שלמדת: ${ex.slice(0, 3).map(e => e.letter).join(", ")}`
      })},
    { minLetters: 5,
      build: (ex) => ({
        gr: ex.slice(0, 5).map(e => e.word).join(", "),
        he: `${ex.slice(0, 5).map(e => `${e.word} (${e.he})`).join(" · ")}`,
        note: `כבר מכיר/ה ${ex.length} אותיות — כל מילה מתחילה באות שלמדת`
      })},
    { minLetters: 8,
      build: (ex) => ({
        gr: ex.slice(0, 6).map(e => e.word).join(" · "),
        he: ex.slice(0, 6).map(e => `${e.word} = ${e.he}`).join(" · "),
        note: `${ex.length} אותיות — את/ה יכול/ה לקרוא את האות הראשונה של כל מילה!`
      })},
  ];

  const dayHash = new Date().toISOString().slice(0, 10).split("").reduce((a, c) => a + c.charCodeAt(0), 0);
  const shuffled = [...allExamples].sort((a, b) => (a.word + dayHash).localeCompare(b.word + dayHash));
  const best = templates.filter(t => shuffled.length >= t.minLetters);
  if (best.length === 0) return null;
  const tmpl = best[dayHash % best.length];
  return tmpl.build(shuffled);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const pron = LETTER_PRONUNCIATIONS[text];
  const sayText = pron || text;
  const utt = new SpeechSynthesisUtterance(sayText);
  utt.lang = "el-GR";
  utt.rate = 0.6;
  const voices = window.speechSynthesis.getVoices();
  const greek = voices.find(v => v.lang === "el-GR") || voices.find(v => v.lang.startsWith("el"));
  if (greek) utt.voice = greek;
  window.speechSynthesis.speak(utt);
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function nameTooSimilar(a, b) {
  if (a === b) return true;
  if (a.length === b.length) {
    let diffs = 0;
    for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) diffs++; }
    if (diffs <= 1) return true;
  }
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  if (longer.length - shorter.length === 1) {
    for (let i = 0; i < longer.length; i++) {
      if (longer.slice(0, i) + longer.slice(i + 1) === shorter) return true;
    }
  }
  return false;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  const start = new Date(dateStr);
  const today = new Date();
  const startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.floor((todayDay - startDay) / 86400000);
}

function QuizScreen({ letterStates, focusLevel, onEnd, onUpdate }) {
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, total: 0 });

  useEffect(() => {
    const qs = generateQuiz(letterStates);
    setQuestions(qs);
  }, []);

  function generateQuiz(states) {
    const weighted = LETTERS.map(letter => {
      const s = states[letter.id];
      const progress = s.quizCorrect || 0;
      let weight;
      if (s.learned) { weight = 1; }
      else if (s.quizTotal === 0) { weight = 15; }
      else {
        const accuracy = s.quizCorrect / s.quizTotal;
        weight = Math.max(2, Math.round((1 - accuracy) * 20) + (10 - progress));
      }
      if (letter.difficulty === focusLevel) weight *= 3;
      else if (letter.difficulty > focusLevel) weight = Math.max(1, Math.ceil(weight / 3));
      return { letter, weight };
    });
    const pool = [];
    weighted.forEach(({ letter, weight }) => {
      for (let i = 0; i < weight; i++) pool.push(letter);
    });
    const picked = [];
    const used = new Set();
    while (picked.length < 12 && pool.length > 0) {
      const idx = Math.floor(Math.random() * pool.length);
      const letter = pool[idx];
      if (!used.has(letter.id)) {
        picked.push(letter);
        used.add(letter.id);
      }
      pool.splice(idx, 1);
    }
    const qs = [];
    const types = ["identify", "sound", "reverse"];

    picked.forEach((letter, i) => {
      const type = types[i % 3];
      let others;
      if (type === "sound") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && l.sound !== letter.sound)).slice(0, 3);
      } else if (type === "identify") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && !nameTooSimilar(l.nameHe, letter.nameHe))).slice(0, 3);
      } else {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && !nameTooSimilar(l.nameHe, letter.nameHe))).slice(0, 3);
      }
      const options = shuffle([letter, ...others]);

      if (type === "identify") {
        qs.push({
          type, letter, options,
          question: `מה שם האות ${letter.upper} ?`,
          getLabel: l => l.nameHe,
          correctId: letter.id
        });
      } else if (type === "sound") {
        qs.push({
          type, letter, options,
          question: `איך נשמעת ${letter.upper}${letter.lower} ?`,
          getLabel: l => `${l.soundHe}  (${l.sound})`,
          correctId: letter.id
        });
      } else {
        qs.push({
          type, letter, options,
          question: `איפה האות ${letter.nameHe} ?`,
          getLabel: l => `${l.upper}${l.lower}`,
          correctId: letter.id,
          bigOptions: true
        });
      }
    });

    return shuffle(qs).slice(0, 10);
  }

  if (questions.length === 0) return null;

  if (qi >= questions.length) {
    const pct = Math.round((stats.correct / stats.total) * 100);
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center" }}>
        <h2 style={{ fontSize: 24, fontWeight: 700, color: "#1c1c1e", marginBottom: 8, marginTop: 32 }}>
          {pct >= 80 ? "מצוין!" : pct >= 50 ? "לא רע!" : "צריך תרגול"}
        </h2>
        <div style={{ fontSize: 48, fontWeight: 700, color: pct >= 80 ? "#007aff" : "#ff9f0a", marginBottom: 8 }}>
          {pct}%
        </div>
        <div style={{ fontSize: 16, color: "#8e8e93", marginBottom: 32 }}>
          {stats.correct} מתוך {stats.total} תשובות נכונות
        </div>
        <button onClick={onEnd} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "#007aff",
          color: "#fff", border: "none", borderRadius: 14
        }}>
          חזרה הביתה
        </button>
      </div>
    );
  }

  const q = questions[qi];
  const isCorrect = selected !== null ? selected === q.correctId : null;

  function handleSelect(id) {
    if (selected !== null) return;
    setSelected(id);
    const correct = id === q.correctId;
    setStats(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    onUpdate(q.letter.id, correct);
    if (correct) speak(q.letter.example);
  }

  function handleNext() {
    setSelected(null);
    setQi(qi + 1);
  }

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",
        marginBottom: 20
      }}>
        <button onClick={onEnd} style={{
          background: "#fff", border: "none", fontSize: 18,
          width: 36, height: 36, borderRadius: 10, color: "#007aff",
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
        }}>←</button>
        <div style={{ fontSize: 14, color: "#8e8e93", fontWeight: 600 }}>
          {qi + 1} / {questions.length}
        </div>
        <div style={{ fontSize: 13, color: "#007aff", fontWeight: 600 }}>
          {stats.correct} נכון
        </div>
      </div>

      <div style={{
        background: "#e5e5ea", borderRadius: 99, height: 6, marginBottom: 24, overflow: "hidden"
      }}>
        <div style={{
          width: ((qi + 1) / questions.length * 100) + "%",
          height: "100%", background: "#007aff", borderRadius: 99,
          transition: "width 0.4s"
        }} />
      </div>

      {q.type !== "reverse" && (
        <div style={{
          textAlign: "center", marginBottom: 24
        }}>
          <div style={{
            fontSize: 80, fontWeight: 700, color: "#1c1c1e",
            lineHeight: 1, marginBottom: 8, cursor: "pointer"
          }} onClick={() => speak(q.letter.name)}>
            {q.letter.upper}{q.letter.lower}
          </div>
          <button onClick={() => speak(q.letter.name)} style={{
            padding: "6px 16px", borderRadius: 99,
            background: "#e8f4fd", border: "none",
            color: "#007aff", fontSize: 13, cursor: "pointer", fontWeight: 500
          }}>שמע</button>
        </div>
      )}

      <div style={{
        fontSize: 18, fontWeight: 600, color: "#1c1c1e",
        textAlign: "center", marginBottom: 20
      }}>
        {q.question}
      </div>

      <div style={{
        display: "grid",
        gridTemplateColumns: q.bigOptions ? "1fr 1fr" : "1fr",
        gap: 10, marginBottom: 20
      }}>
        {q.options.map(opt => {
          const isThis = selected === opt.id;
          const isRight = opt.id === q.correctId;
          let bg = "#fff", border = "#e5e5ea", color = "#1c1c1e";
          if (selected !== null) {
            if (isRight) { bg = "#e8f4fd"; border = "#007aff"; color = "#007aff"; }
            else if (isThis && !isRight) { bg = "#fff3e0"; border = "#ff9f0a"; color = "#cc7a00"; }
          }
          return (
            <button key={opt.id} onClick={() => handleSelect(opt.id)} style={{
              padding: q.bigOptions ? "18px 10px" : "14px 18px",
              fontSize: q.bigOptions ? 32 : 16,
              fontWeight: q.bigOptions ? 700 : 600,
              background: bg,
              color,
              border: `1.5px solid ${border}`,
              borderRadius: 14,
              textAlign: "center",
              transition: "all 0.15s",
              boxShadow: selected === null ? "0 1px 4px rgba(0,0,0,0.06)" : "none"
            }}>
              {q.getLabel(opt)}
              {selected !== null && isRight && " ✓"}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <div>
          <div style={{
            padding: "12px 16px", borderRadius: 12, marginBottom: 14,
            background: isCorrect ? "#e8f4fd" : "#fff3e0",
            border: "none",
            textAlign: "center", fontSize: 14, fontWeight: 600,
            color: isCorrect ? "#007aff" : "#cc7a00"
          }}>
            {isCorrect ? "נכון!" : `לא — התשובה: ${q.letter.nameHe} (${q.letter.upper}${q.letter.lower}) = ${q.letter.soundHe}`}
          </div>
          <button onClick={handleNext} style={{
            width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,
            background: "#007aff",
            color: "#fff", border: "none", borderRadius: 14
          }}>
            {qi + 1 < questions.length ? "הבא" : "סיכום"}
          </button>
        </div>
      )}
    </div>
  );
}

      })()}

      <div style={{

      }}>
        מה המילה הזו אומרת?
      </div>

      <div style={{
        display: "grid", gridTemplateColumns: "1fr",
        gap: 10, marginBottom: 20
      }}>
        {q.options.map(opt => {
          const isThis = selected === opt.gr;
          const isRight = opt.gr === q.correctId;
          let bg = "#fff", border = "#e5e5ea", color = "#1c1c1e";
          if (selected !== null) {
            if (isRight) { bg = "#e8f4fd"; border = "#007aff"; color = "#007aff"; }

          }
          return (
            <button key={opt.gr} onClick={() => handleSelect(opt.gr)} style={{
              padding: "14px 18px",

              background: bg, color, border: `1.5px solid ${border}`,

            }}>

            padding: "12px 16px", borderRadius: 12, marginBottom: 14,

            width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,

}

const UNLOCK_THRESHOLD = 6;

function getUnlockedLevel(letterStates) {
  const learnedEasy = LETTERS.filter(l => l.difficulty === 1 && letterStates[l.id]?.learned).length;
  const learnedMed = LETTERS.filter(l => l.difficulty === 2 && letterStates[l.id]?.learned).length;
  if (learnedEasy >= UNLOCK_THRESHOLD && learnedMed >= UNLOCK_THRESHOLD) return 3;
  if (learnedEasy >= UNLOCK_THRESHOLD) return 2;
  return 1;
}

function NumberQuizScreen({ numberStates, onEnd, onUpdate }) {
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, total: 0 });

  useEffect(() => {
    const basic = NUMBERS.filter(n => parseInt(n.val) <= 10);
    const advanced = NUMBERS.filter(n => parseInt(n.val) > 10);
    const pool = [...basic, ...basic, ...advanced];
    const picked = [];
    const used = new Set();
    const shuffled = shuffle(pool);
    for (const n of shuffled) {
      if (!used.has(n.id)) { picked.push(n); used.add(n.id); }
      if (picked.length >= 10) break;
    }
    const types = ["identify", "sound", "reverse"];
    const qs = picked.map((num, i) => {
      const type = types[i % 3];
      const numVal = parseInt(num.val);
      const similar = NUMBERS.filter(n => n.id !== num.id && (
        numVal <= 10 ? parseInt(n.val) <= 10 : parseInt(n.val) > 10
      ));
      const fallback = NUMBERS.filter(n => n.id !== num.id);
      const pool3 = similar.length >= 3 ? similar : fallback;
      const others = shuffle(pool3).slice(0, 3);
      const options = shuffle([num, ...others]);
      if (type === "identify") {
        return { num, options, type, question: `מה המספר הזה?`, getLabel: n => `${n.he} (${n.val})`, correctId: num.id, showBig: true };
      } else if (type === "sound") {
        return { num, options, type, question: `איך אומרים ${num.he} ביוונית?`, getLabel: n => `${n.gr} (${n.pron})`, correctId: num.id, ltr: true };
      } else {
        return { num, options, type, question: `איפה המספר ${num.he} ?`, getLabel: n => `${n.val}`, correctId: num.id, bigOptions: true };
      }
    });
    setQuestions(shuffle(qs));
  }, []);

  if (questions.length === 0) return null;

  if (qi >= questions.length) {
    const pct = Math.round((stats.correct / stats.total) * 100);
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center" }}>
        <h2 style={{ fontSize: 24, fontWeight: 700, color: "#1c1c1e", marginBottom: 8, marginTop: 32 }}>
          {pct >= 80 ? "מצוין!" : pct >= 50 ? "לא רע!" : "צריך תרגול"}
        </h2>
        <div style={{ fontSize: 48, fontWeight: 700, color: pct >= 80 ? "#007aff" : "#ff9f0a", marginBottom: 8 }}>{pct}%</div>
        <div style={{ fontSize: 16, color: "#8e8e93", marginBottom: 32 }}>{stats.correct} מתוך {stats.total} תשובות נכונות</div>
        <button onClick={onEnd} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "#007aff", color: "#fff", border: "none", borderRadius: 14
        }}>חזרה הביתה</button>
      </div>
    );
  }

  const q = questions[qi];
  const isCorrect = selected !== null ? selected === q.correctId : null;

  function handleSelect(id) {
    if (selected !== null) return;
    setSelected(id);
    const correct = id === q.correctId;
    setStats(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    onUpdate(q.num.id, correct);
    if (correct) speak(q.num.gr);
  }

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <button onClick={onEnd} style={{
          background: "#fff", border: "none", fontSize: 18,
          width: 36, height: 36, borderRadius: 10, color: "#007aff",
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
        }}>←</button>
        <div style={{ fontSize: 14, color: "#8e8e93", fontWeight: 600 }}>{qi + 1} / {questions.length}</div>
        <div style={{ fontSize: 13, color: "#007aff", fontWeight: 600 }}>{stats.correct} נכון</div>
      </div>
      <div style={{ background: "#e5e5ea", borderRadius: 99, height: 6, marginBottom: 24, overflow: "hidden" }}>
        <div style={{ width: ((qi + 1) / questions.length * 100) + "%", height: "100%", background: "#007aff", borderRadius: 99, transition: "width 0.4s" }} />
      </div>
      {q.showBig && (
        <div style={{ textAlign: "center", marginBottom: 16 }}>
          <div style={{ fontSize: 48, fontWeight: 700, color: "#1c1c1e", lineHeight: 1, marginBottom: 4, direction: "ltr", cursor: "pointer" }}
            onClick={() => speak(q.num.gr)}>
            {q.num.gr}
          </div>
          <div style={{ fontSize: 16, color: "#8e8e93", direction: "ltr" }}>{q.num.pron}</div>
          <button onClick={() => speak(q.num.gr)} style={{
            marginTop: 8, padding: "6px 16px", borderRadius: 99,
            background: "#e8f4fd", border: "none",
            color: "#007aff", fontSize: 13, fontWeight: 500, cursor: "pointer"
          }}>שמע</button>
        </div>
      )}

      <div style={{ fontSize: 18, fontWeight: 600, color: "#1c1c1e", textAlign: "center", marginBottom: 20 }}>{q.question}</div>

      <div style={{ display: "grid", gridTemplateColumns: q.bigOptions ? "1fr 1fr" : "1fr", gap: 10, marginBottom: 20 }}>
        {q.options.map(opt => {
          const isThis = selected === opt.id;
          const isRight = opt.id === q.correctId;
          let bg = "#fff", border = "#e5e5ea", color = "#1c1c1e";
          if (selected !== null) {
            if (isRight) { bg = "#e8f4fd"; border = "#007aff"; color = "#007aff"; }
            else if (isThis && !isRight) { bg = "#fff3e0"; border = "#ff9f0a"; color = "#cc7a00"; }
          }
          return (
            <button key={opt.id} onClick={() => handleSelect(opt.id)} style={{
              padding: q.bigOptions ? "18px 10px" : "14px 18px",
              fontSize: q.bigOptions ? 32 : 16, fontWeight: 600,
              background: bg, color, border: `1.5px solid ${border}`,
              borderRadius: 14, textAlign: "center", transition: "all 0.15s",
              direction: q.ltr ? "ltr" : "rtl",
              boxShadow: selected === null ? "0 1px 4px rgba(0,0,0,0.06)" : "none"
            }}>
              {q.getLabel(opt)}{selected !== null && isRight && " ✓"}
            </button>
          );
        })}
      </div>
      {selected !== null && (
        <div>
          <div style={{
            padding: "12px 16px", borderRadius: 12, marginBottom: 14,
            background: isCorrect ? "#e8f4fd" : "#fff3e0",
            textAlign: "center", fontSize: 14, fontWeight: 600,
            color: isCorrect ? "#007aff" : "#cc7a00"
          }}>
            {isCorrect ? `נכון! ${q.num.gr} (${q.num.pron}) = ${q.num.he}` : `לא — ${q.num.gr} (${q.num.pron}) = ${q.num.he}`}
          </div>
          <button onClick={() => { setSelected(null); setQi(qi + 1); }} style={{
            width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,
            background: "#007aff", color: "#fff", border: "none", borderRadius: 14
          }}>{qi + 1 < questions.length ? "הבא" : "סיכום"}</button>
        </div>
      )}
    </div>
  );
}

function NotebookScreen() {
  const todayIdx = Math.floor(Date.now() / 86400000) % GREEK_PASSAGES.length;
  const [passageIdx, setPassageIdx] = useState(todayIdx);
  const [translation, setTranslation] = useState("");
  const [revealed, setRevealed] = useState(false);
  const [drawMode, setDrawMode] = useState("pen"); // "pen" | "mark"
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const lastPosRef = useRef(null);
  const strokesRef = useRef([]);
  const currentStrokeRef = useRef(null);
  const wordTouchRef = useRef({ x: 0, y: 0 });

  const passage = GREEK_PASSAGES[passageIdx];
  const textLines = passage.gr.split("\n");
  const lineH = 86;
  const totalLines = Math.max(9, textLines.length + 5);
  const notebookH = totalLines * lineH + 28;

  function speakWord(word) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(word.replace(/[—\-]/g, ""));
    utt.lang = "el-GR";
    utt.rate = 0.85;
    window.speechSynthesis.speak(utt);
  }

  function getPos(e, canvas) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * (canvas.width / rect.width),
      y: (src.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function applyStyle(ctx, mode) {
    if (mode === "pen") {
      ctx.strokeStyle = "#1a237e";
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = "#ffe066";
      ctx.lineWidth = 20;
      ctx.globalAlpha = 0.45;
    }
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }

  function startDraw(e) {
    e.preventDefault();
    const canvas = canvasRef.current;
    if (!canvas) return;
    drawingRef.current = true;
    const pos = getPos(e, canvas);
    lastPosRef.current = { ...pos };
    currentStrokeRef.current = { mode: drawMode, points: [{ ...pos }] };
    if (drawMode === "pen") {
      const ctx = canvas.getContext("2d");
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = "#1a237e";
      ctx.fill();
    }
  }

  function doDraw(e) {
    e.preventDefault();
    if (!drawingRef.current || !lastPosRef.current || !currentStrokeRef.current) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const pos = getPos(e, canvas);
    const ctx = canvas.getContext("2d");
    ctx.beginPath();
    ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
    ctx.lineTo(pos.x, pos.y);
    applyStyle(ctx, drawMode);
    ctx.stroke();
    ctx.globalAlpha = 1;
    currentStrokeRef.current.points.push({ ...pos });
    lastPosRef.current = { ...pos };
  }

  function endDraw() {
    if (drawingRef.current && currentStrokeRef.current && currentStrokeRef.current.points.length > 0) {
      strokesRef.current = [...strokesRef.current, currentStrokeRef.current];
    }
    drawingRef.current = false;
    lastPosRef.current = null;
    currentStrokeRef.current = null;
  }

  function redrawAll() {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokesRef.current.forEach(stroke => {
      if (stroke.points.length < 2) {
        if (stroke.mode === "pen") {
          ctx.beginPath();
          ctx.arc(stroke.points[0].x, stroke.points[0].y, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = "#1a237e";
          ctx.globalAlpha = 1;
          ctx.fill();
        }
        return;
      }
      ctx.beginPath();
      stroke.points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      applyStyle(ctx, stroke.mode);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }

  function undo() {
    if (strokesRef.current.length === 0) return;
    strokesRef.current = strokesRef.current.slice(0, -1);
    redrawAll();
  }

  function clearCanvas() {
    strokesRef.current = [];
    const canvas = canvasRef.current;
    if (canvas) canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  }

  function goToPassage(idx) {
    setPassageIdx(idx);
    setTranslation("");
    setRevealed(false);
    strokesRef.current = [];
    setTimeout(() => {
      const canvas = canvasRef.current;
      if (canvas) canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    }, 0);
  }

  return (
    <div>
      <div style={{
        background: "#fffde7", borderRadius: 14, padding: "12px 14px",
        marginBottom: 10, boxShadow: "0 1px 4px rgba(0,0,0,0.06)",
        border: "1px solid #f5e642"
      }}>
        <div style={{ fontSize: 11, color: "#8e8e93", fontWeight: 500, marginBottom: 6 }}>התרגום שלי</div>
        <textarea
          value={translation}
          onChange={e => setTranslation(e.target.value)}
          placeholder="כתוב כאן את התרגום..."
          style={{
            width: "100%", minHeight: 58, border: "none", background: "transparent",
            fontSize: 15, color: "#1c1c1e", fontFamily: "inherit",
            resize: "none", outline: "none", direction: "rtl", lineHeight: 1.7
          }}
        />
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
        <button onClick={() => setDrawMode("pen")} style={{
          flex: 1, padding: "10px 0", fontSize: 13, fontWeight: 600,
          background: drawMode === "pen" ? "#1a237e" : "#fff",
          color: drawMode === "pen" ? "#fff" : "#1a237e",
          border: "1.5px solid #1a237e", borderRadius: 12
        }}>✏️ עט</button>
        <button onClick={() => setDrawMode("mark")} style={{
          flex: 1, padding: "10px 0", fontSize: 13, fontWeight: 600,
          background: drawMode === "mark" ? "#ffe066" : "#fff",
          color: "#7a5c00",
          border: "1.5px solid #ffe066", borderRadius: 12
        }}>🖍️ סמן</button>
        <button onClick={undo} style={{
          flex: 1, padding: "10px 0", fontSize: 13, fontWeight: 600,
          background: "#fff", color: "#636366",
          border: "1.5px solid #e5e5ea", borderRadius: 12
        }}>↩ בטל</button>
      </div>

      <div style={{
        position: "relative", overflow: "hidden", userSelect: "none",
        margin: "0 -16px 10px", boxShadow: "0 2px 12px rgba(0,0,0,0.1)"
      }}>
        <div style={{ background: "#fafaf2", padding: "14px 14px 14px 52px", position: "relative" }}>
          <div style={{ position: "absolute", left: 48, top: 0, bottom: 0, width: 2, background: "#ffcdd2" }} />
          {Array.from({ length: totalLines }, (_, i) => (
            <div key={i} style={{ height: lineH, borderBottom: "1px solid #c8e6c9" }} />
          ))}
        </div>
        <canvas
          ref={canvasRef}
          width={660}
          height={notebookH}
          style={{
            position: "absolute", inset: 0, width: "100%", height: "100%",
            touchAction: "none", cursor: "crosshair"
          }}
          onTouchStart={startDraw}
          onTouchMove={doDraw}
          onTouchEnd={endDraw}
          onMouseDown={startDraw}
          onMouseMove={doDraw}
          onMouseUp={endDraw}
          onMouseLeave={endDraw}
        />
        <div style={{ position: "absolute", inset: 0, padding: "14px 14px 14px 52px", pointerEvents: "none" }}>
          {Array.from({ length: totalLines }, (_, i) => (

function AlphaOrderScreen({ onEnd }) {
  const [shuffled] = useState(() => shuffle([...LETTERS]));
  const [nextIdx, setNextIdx] = useState(0);
  const [tapped, setTapped] = useState(new Set());
  const [wrongId, setWrongId] = useState(null);
  const [done, setDone] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startRef = useRef(Date.now());

  useEffect(() => {
    if (done) return;
    const t = setInterval(() => setElapsed(Math.floor((Date.now() - startRef.current) / 1000)), 1000);
    return () => clearInterval(t);
  }, [done]);

  function speakLetter(letter) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(letter.name);
    utt.lang = "el-GR"; utt.rate = 0.85;
    window.speechSynthesis.speak(utt);
  }

  function handleTap(letter) {
    if (done || tapped.has(letter.id)) return;
    speakLetter(letter);
    if (letter.id === LETTERS[nextIdx].id) {
      const newTapped = new Set(tapped);
      newTapped.add(letter.id);
      setTapped(newTapped);
      if (nextIdx + 1 === LETTERS.length) { setDone(true); }
      else { setNextIdx(nextIdx + 1); }
    } else {
      setWrongId(letter.id);
      setTimeout(() => setWrongId(null), 500);
    }
  }

  const fmtTime = s => s >= 60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : `${s} שנ'`;

  if (done) {
    return (
      <div style={{ position:"fixed",inset:0,background:"#f2f2f7",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:32 }}>
        <div style={{ fontSize:60 }}>🏆</div>
        <div style={{ fontSize:24,fontWeight:700,color:"#1c1c1e" }}>כל הכבוד!</div>
        <div style={{ fontSize:15,color:"#8e8e93" }}>24 אותיות בסדר נכון</div>
        <div style={{ fontSize:40,fontWeight:700,color:"#5856d6",marginTop:8 }}>{fmtTime(elapsed)}</div>
        <button onClick={onEnd} style={{ marginTop:12,padding:"14px 44px",fontSize:16,fontWeight:600,background:"#5856d6",color:"#fff",border:"none",borderRadius:14 }}>חזרה</button>
      </div>
    );
  }

  return (
    <div style={{ position:"fixed",inset:0,background:"#f2f2f7",zIndex:100,overflowY:"auto",padding:"0 16px 24px",paddingTop:"calc(env(safe-area-inset-top) + 12px)" }}>
      <div style={{ display:"flex",alignItems:"center",marginBottom:12 }}>
        <button onClick={onEnd} style={{ background:"none",border:"none",fontSize:22,color:"#5856d6",padding:"4px 0" }}>←</button>
        <div style={{ flex:1,textAlign:"center" }}>
          <div style={{ fontSize:17,fontWeight:600,color:"#1c1c1e" }}>סדר האלפבית</div>
          <div style={{ fontSize:12,color:"#8e8e93" }}>{nextIdx}/24 · {fmtTime(elapsed)}</div>
        </div>
        <div style={{ width:32 }} />
      </div>
      <div style={{ background:"#e5e5ea",borderRadius:99,height:5,marginBottom:10,overflow:"hidden" }}>
        <div style={{ width:`${nextIdx/24*100}%`,height:"100%",background:"#5856d6",borderRadius:99,transition:"width 0.3s" }} />
      </div>
      <div style={{ textAlign:"center",marginBottom:12,fontSize:13,color:"#5856d6",fontWeight:600,padding:"6px 16px",background:"#f0effe",borderRadius:10 }}>
        {nextIdx < 24 ? `לחץ על האות ה-${nextIdx+1} באלפבית` : ""}
      </div>
      <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8 }}>
        {shuffled.map(letter => {
          const isOk = tapped.has(letter.id);
          const isWrong = wrongId === letter.id;
          return (
            <button key={letter.id} onClick={() => handleTap(letter)} style={{
              padding:"10px 4px",fontSize:26,fontWeight:600,
              background: isOk ? "#34c759" : isWrong ? "#ff3b30" : "#fff",
              color: isOk || isWrong ? "#fff" : "#1a237e",
              border:"1.5px solid " + (isOk ? "#34c759" : isWrong ? "#ff3b30" : "#e5e5ea"),
              borderRadius:12,transition:"background 0.15s, border 0.15s",
              cursor: isOk ? "default" : "pointer",
              display:"flex",flexDirection:"column",alignItems:"center",lineHeight:1.1
            }}>
              <div style={{ fontSize:22,fontWeight:700 }}>{letter.upper}</div>
              <div style={{ fontSize:15,fontWeight:400,opacity:0.8 }}>{letter.lower}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// Groups hardest letters first so they come up early in the writing test (difficulty 3 > 2 > 1).
// Each letter is queued twice - once for its uppercase form, once for lowercase - so the test
// actually covers both shapes instead of only ever asking for one of them.
function buildWritingQueue() {
  const byDiff = { 3: [], 2: [], 1: [] };
  LETTERS.forEach(l => {
    byDiff[l.difficulty].push({ letter: l, caseType: "upper" });
    byDiff[l.difficulty].push({ letter: l, caseType: "lower" });
  });
  return [...shuffle(byDiff[3]), ...shuffle(byDiff[2]), ...shuffle(byDiff[1])];
}

const WRITE_CHECK_SYSTEM = `אתה מזהה אותיות יווניות בכתב יד מצוירות ביד (עכבר/מגע), לעיתים לא מדויקות. היה סלחני לכתב יד לא מושלם, אבל התבונן בקפידה בפרטים המבחינים בין אותיות דומות לפני שאתה עונה.

שים לב במיוחד לזוגות אותיות שקל להתבלבל ביניהם:
- ψ (פסי קטנה) מול ω (אומגה קטנה): ל-ψ יש קו אנכי (גבעול) שעובר במרכז הצורה ויורד מתחתיה; ל-ω אין קו כזה, רק בסיס גלי עם שני תלתלים בקצוות ובלי שום קו במרכז.
- Ψ (פסי גדולה) מול Υ (איפסילון גדולה): Ψ היא קלשון עם שלושה קווים שמתחברים לגבעול אחד; Υ היא רק צורת V עם קו יורד אחד.
- θ/φ/ο: ל-θ יש קו אופקי במרכז המעגל, ל-φ יש קו אנכי שעובר דרך המעגל וממשיך מעליו ומתחתיו, ל-ο אין שום קו נוסף - רק מעגל/אליפסה נקיים.
- ν/υ/ω: ν היא צורת V פשוטה, υ היא V עם קצה קטן/וו בתחתית, ω היא צורת גל עם שני תלתלים ובלי קו במרכז.
- Ξ/Ε/Σ: ל-Ξ שלושה קווים אופקיים נפרדים בלי גב אנכי, ל-Ε שלושה קווים אופקיים עם גב אנכי מחבר (צורת E), ל-Σ יש קו זיגזג רציף מחבר.
- Λ/Α/Δ: Λ היא V הפוך פשוט בלי קו רוחב, Α היא V הפוך עם קו רוחב (מפרק) באמצע, Δ הוא משולש סגור לגמרי.

לפני שאתה קובע תשובה, בדוק: האם יש קו/גבעול נוסף שעובר או יוצא מהצורה הבסיסית? זה כמעט תמיד ההבדל בין שתי אותיות שנראות דומות ממבט ראשון.

שים לב אם האות מצוירת כאות גדולה/רישית (למשל Α, Β, Γ) או כאות קטנה (למשל α, β, γ), ושמור על אותה צורה בתשובה - אל תמיר קטנה לגדולה או להפך.
החזר JSON בלבד, ללא הסברים ובלי markdown: {"letter":"<אות יוונית אחת בדיוק כפי שצויירה, כולל אם גדולה או קטנה>"}
אם אין ציור ברור בתמונה, החזר {"letter":""}. נחש תמיד את האות הכי דומה, גם אם לא בטוח.`;

function acceptedGlyphs(letter, caseType) {
  if (caseType === "upper") return [letter.upper.trim()];
  return letter.lower.split("/").map(s => s.trim());
}

function matchesLetter(letter, caseType, detected) {
  return acceptedGlyphs(letter, caseType).includes((detected || "").trim());
}

// Claude is asked to reply with strict JSON, but occasionally wraps it in prose - fall back to
// pulling the first Greek letter out of the raw text rather than treating that as a hard failure.
function extractLetterFallback(text) {
  const m = text.match(/[Α-Ωα-ωΆ-Ώά-ώ]/);
  return m ? m[0] : "";
}

// The drawing canvas is much larger than any single letter drawn on it, so a naive full-canvas
// export is mostly blank white space with a tiny mark in the middle - very hard for a vision
// model to read confidently. Crop tightly to the actual strokes (with padding) and upscale into
// a fixed square canvas so the shape fills most of the frame.
function getCroppedDrawingDataURL(canvas, strokes) {
  if (!strokes.length) return canvas.toDataURL("image/png");
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  strokes.forEach(s => s.points.forEach(p => {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
  }));
  const pad = 30;
  minX = Math.max(0, minX - pad);
  minY = Math.max(0, minY - pad);
  maxX = Math.min(canvas.width, maxX + pad);
  maxY = Math.min(canvas.height, maxY + pad);
  const w = maxX - minX, h = maxY - minY;
  if (w <= 0 || h <= 0) return canvas.toDataURL("image/png");

  const OUT_SIZE = 400;
  const out = document.createElement("canvas");
  out.width = OUT_SIZE;
  out.height = OUT_SIZE;
  const octx = out.getContext("2d");
  octx.fillStyle = "#fff";
  octx.fillRect(0, 0, OUT_SIZE, OUT_SIZE);
  const scale = OUT_SIZE / Math.max(w, h);
  const destW = w * scale, destH = h * scale;
  octx.drawImage(canvas, minX, minY, w, h, (OUT_SIZE - destW) / 2, (OUT_SIZE - destH) / 2, destW, destH);
  return out.toDataURL("image/png");
}

function DrawScreen({ onEnd }) {
  const [letters] = useState(buildWritingQueue);
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState({ c: 0, w: 0 });
  const [done, setDone] = useState(false);
  const [hasDrawing, setHasDrawing] = useState(false);
  const [checking, setChecking] = useState(false);
  const [result, setResult] = useState(null); // { correct, detected } | { failed: true } | null
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const lastPosRef = useRef(null);
  const strokesRef = useRef([]);
  const currentStrokeRef = useRef(null);

  const { letter, caseType } = letters[idx];
  const targetGlyph = caseType === "upper" ? letter.upper : letter.lower;

  function getPos(e, canvas) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX-rect.left)*(canvas.width/rect.width), y: (src.clientY-rect.top)*(canvas.height/rect.height) };
  }

  function startDraw(e) {
    e.preventDefault();
    const canvas = canvasRef.current; if (!canvas) return;
    drawingRef.current = true;
    setHasDrawing(true);
    const pos = getPos(e, canvas);
    lastPosRef.current = {...pos};
    currentStrokeRef.current = { points: [{...pos}] };
    const ctx = canvas.getContext("2d");
    ctx.beginPath(); ctx.arc(pos.x,pos.y,2,0,Math.PI*2); ctx.fillStyle="#1c1c1e"; ctx.fill();
  }

  function doDraw(e) {
    e.preventDefault();
    if (!drawingRef.current || !lastPosRef.current || !currentStrokeRef.current) return;
    const canvas = canvasRef.current; if (!canvas) return;
    const pos = getPos(e, canvas);
    const ctx = canvas.getContext("2d");
    ctx.beginPath(); ctx.moveTo(lastPosRef.current.x,lastPosRef.current.y); ctx.lineTo(pos.x,pos.y);
    ctx.strokeStyle="#1c1c1e"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.stroke();
    currentStrokeRef.current.points.push({...pos});
    lastPosRef.current = {...pos};
  }

  function endDraw() {
    if (drawingRef.current && currentStrokeRef.current?.points.length > 0)
      strokesRef.current = [...strokesRef.current, currentStrokeRef.current];
    drawingRef.current = false; lastPosRef.current = null; currentStrokeRef.current = null;
  }

  function redrawAll() {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    strokesRef.current.forEach(stroke => {
      if (stroke.points.length < 2) { ctx.beginPath(); ctx.arc(stroke.points[0].x,stroke.points[0].y,2,0,Math.PI*2); ctx.fillStyle="#1c1c1e"; ctx.fill(); return; }
      ctx.beginPath();
      stroke.points.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
      ctx.strokeStyle="#1c1c1e"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.stroke();
    });
  }

  function undo() {
    strokesRef.current = strokesRef.current.slice(0,-1);
    redrawAll();
    setHasDrawing(strokesRef.current.length > 0);
  }

  function clearCanvas() {
    strokesRef.current = [];
    setHasDrawing(false);
    setResult(null);
    const canvas = canvasRef.current;
    if (canvas) canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
  }

  async function checkDrawing() {
    if (!hasDrawing || checking) return;
    setChecking(true);
    setResult(null);
    try {
      const canvas = canvasRef.current;
      const base64 = getCroppedDrawingDataURL(canvas, strokesRef.current).split(",")[1];
      const resp = await fetch("https://carty-api.aviadchai.workers.dev", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 1000,
          system: WRITE_CHECK_SYSTEM,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: "image/png", data: base64 } },
              { type: "text", text: "איזו אות יוונית זו? החזר JSON בלבד." }
            ]
          }]
        })
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.[0]?.text || "{}";
      let detected;
      try {
        detected = JSON.parse(text.replace(/```json|```/g, "").trim()).letter || "";
      } catch (parseErr) {
        detected = extractLetterFallback(text);
        if (!detected) throw parseErr;
      }
      setResult({ correct: matchesLetter(letter, caseType, detected), detected });
    } catch (e) {
      setResult({ failed: true });
    } finally {
      setChecking(false);
    }
  }

  function retry() {
    clearCanvas();
  }

  function next(correct) {
    setScore(s => correct ? { c: s.c+1, w: s.w } : { c: s.c, w: s.w+1 });
    if (idx+1 >= letters.length) { setDone(true); return; }
    setIdx(idx+1); setRevealed(false); setResult(null); setHasDrawing(false);
    strokesRef.current = [];
    setTimeout(() => { const c=canvasRef.current; if(c) c.getContext("2d").clearRect(0,0,c.width,c.height); }, 0);
  }

  if (done) {
    return (
      <div style={{ position:"fixed",inset:0,background:"#f2f2f7",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:32 }}>
        <div style={{ fontSize:60 }}>✍️</div>
        <div style={{ fontSize:24,fontWeight:700,color:"#1c1c1e" }}>סיימת את מבחן הכתיבה!</div>
        <div style={{ display:"flex",gap:24,marginTop:8 }}>
          <div style={{ textAlign:"center" }}><div style={{ fontSize:40,fontWeight:700,color:"#34c759" }}>{score.c}</div><div style={{ fontSize:12,color:"#8e8e93" }}>נכון</div></div>
          <div style={{ textAlign:"center" }}><div style={{ fontSize:40,fontWeight:700,color:"#ff3b30" }}>{score.w}</div><div style={{ fontSize:12,color:"#8e8e93" }}>לא נכון</div></div>
        </div>
        <button onClick={onEnd} style={{ marginTop:12,padding:"14px 44px",fontSize:16,fontWeight:600,background:"#34c759",color:"#fff",border:"none",borderRadius:14 }}>חזרה</button>
      </div>
    );
  }

  return (
    <div style={{ position:"fixed",inset:0,background:"#f2f2f7",zIndex:100,overflowY:"auto",padding:"0 16px 24px",paddingTop:"calc(env(safe-area-inset-top) + 12px)" }}>
      <div style={{ display:"flex",alignItems:"center",marginBottom:12 }}>
        <button onClick={onEnd} style={{ background:"none",border:"none",fontSize:22,color:"#34c759",padding:"4px 0" }}>←</button>
        <div style={{ flex:1,textAlign:"center" }}>
          <div style={{ fontSize:17,fontWeight:600,color:"#1c1c1e" }}>מבחן כתיבה</div>
          <div style={{ fontSize:12,color:"#8e8e93" }}>{idx+1}/{letters.length} · ✓{score.c} ✗{score.w}</div>
        </div>
        <div style={{ width:32 }} />
      </div>
      <div style={{ background:"#e5e5ea",borderRadius:99,height:5,marginBottom:14,overflow:"hidden" }}>
        <div style={{ width:`${idx/letters.length*100}%`,height:"100%",background:"#34c759",borderRadius:99 }} />
      </div>

      <div style={{ background:"#fff",borderRadius:16,padding:"18px 16px",textAlign:"center",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.06)" }}>
        <div style={{ fontSize:11,color:"#8e8e93",fontWeight:500,marginBottom:6 }}>
          כתוב את {caseType === "upper" ? "האות הגדולה" : "האות הקטנה"} ביוונית:
        </div>
        <div style={{ fontSize:30,fontWeight:700,color:"#1c1c1e",marginBottom:4 }}>{letter.nameHe}</div>
        <div style={{ fontSize:15,color:"#636366" }}>{letter.soundHe} · {letter.hint}</div>
      </div>

      <div style={{ position:"relative",background:"#fff",borderRadius:16,overflow:"hidden",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.08)" }}>
        {revealed && (
          <div style={{ position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:160,fontWeight:300,color:"#007aff",opacity:0.13,pointerEvents:"none",userSelect:"none",direction:"ltr" }}>
            {targetGlyph}
          </div>
        )}
        <canvas ref={canvasRef} width={600} height={380}
          style={{ width:"100%",aspectRatio:"600 / 380",display:"block",touchAction:"none",cursor:"crosshair" }}
          onTouchStart={startDraw} onTouchMove={doDraw} onTouchEnd={endDraw}
          onMouseDown={startDraw} onMouseMove={doDraw} onMouseUp={endDraw} onMouseLeave={endDraw}

    </div>

}

        boxShadow: "0 2px 8px rgba(255,159,10,0.2)", marginBottom: 14
      }}>מבחן מספרים</button>

      {(() => {
        const almostNums = NUMBERS.filter(n => {
          const s = numberStates[n.id];
          return !s?.learned && (s?.quizCorrect || 0) >= 8;
        });
        if (almostNums.length === 0) return null;
        return (
          <div style={{
            background: "#fff", borderRadius: 14, padding: 14,
            marginBottom: 14, boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
          }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: "#1c1c1e", marginBottom: 10 }}>
              כמעט שם — {almostNums.length} מספרים
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {almostNums.map(n => {
                const correct = numberStates[n.id]?.quizCorrect || 0;
                return (
                  <div key={n.id} onClick={() => onSelectNumber(n)} style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center",
                    background: "#f2f2f7", borderRadius: 10, padding: "8px 12px", cursor: "pointer"
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 20, fontWeight: 700, color: "#1c1c1e" }}>{n.val}</span>
                      <span style={{ fontSize: 14, color: "#8e8e93", direction: "ltr" }}>{n.gr}</span>
                      <span style={{ fontSize: 13, color: "#aeaeb2" }}>({n.he})</span>
                    </div>
                    <div style={{
                      fontSize: 13, fontWeight: 700, color: "#cc7a00",
                      background: "#fff3e0", padding: "2px 8px", borderRadius: 8
                    }}>{correct}/10</div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}
      </>)}

      {tab === "notebook" && <NotebookScreen />}

    </div>
  );
}

function FinalExamScreen({ onEnd, onFail }) {
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, wrong: 0 });
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    const picked = shuffle(LETTERS).slice(0, 10);
    const types = ["identify", "sound", "reverse"];
    const qs = picked.map((letter, i) => {
      const type = types[i % 3];
      let others;
      if (type === "sound") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && l.sound !== letter.sound)).slice(0, 3);
      } else if (type === "identify") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && !nameTooSimilar(l.nameHe, letter.nameHe))).slice(0, 3);
      } else {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && !nameTooSimilar(l.nameHe, letter.nameHe))).slice(0, 3);
      }
      const options = shuffle([letter, ...others]);
      const question = type === "identify" ? `מה שם האות ${letter.upper} ?`
        : type === "sound" ? `איך נשמעת ${letter.upper}${letter.lower} ?`
        : `איפה האות ${letter.nameHe} ?`;
      const getLabel = type === "identify" ? l => l.nameHe
        : type === "sound" ? l => `${l.soundHe}  (${l.sound})`
        : l => `${l.upper}${l.lower}`;
      return { letter, options, question, getLabel, correctId: letter.id, type, bigOptions: type === "reverse" };
    });
    setQuestions(qs);
  }, []);

  if (questions.length === 0) return null;

  if (qi >= questions.length) {
    const passed = stats.wrong === 0;
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center" }}>
        <h2 style={{ fontSize: 24, fontWeight: 700, color: "#1c1c1e", marginBottom: 8, marginTop: 32 }}>
          {passed ? "עברת את המבחן הסופי!" : "צריך עוד תרגול"}
        </h2>
        <div style={{ fontSize: 48, fontWeight: 700, color: passed ? "#007aff" : "#ff9f0a", marginBottom: 8 }}>
          {stats.correct}/10
        </div>
        <div style={{ fontSize: 16, color: "#8e8e93", marginBottom: 16 }}>
          תשובות נכונות
        </div>
        {!passed && (
          <div style={{
            padding: 14, borderRadius: 14, background: "#fff3e0",
            border: "none", color: "#cc7a00",
            fontSize: 14, marginBottom: 16
          }}>
            כל האותיות חזרו ל-8 תשובות נכונות — תרגל שוב כדי להגיע ל-10
          </div>
        )}
        <button onClick={() => { if (!passed) onFail(); onEnd(); }} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "#007aff",
          color: "#fff", border: "none", borderRadius: 14
        }}>
          חזרה הביתה
        </button>
      </div>
    );
  }

  const q = questions[qi];
  const isCorrect = selected !== null ? selected === q.correctId : null;

  function handleSelect(id) {
    if (selected !== null) return;
    setSelected(id);
    const correct = id === q.correctId;
    if (correct) {
      setStats(s => ({ ...s, correct: s.correct + 1 }));
      speak(q.letter.name);
    } else {
      setStats(s => ({ ...s, wrong: s.wrong + 1 }));
      setFailed(true);
    }
  }

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16
      }}>
        <button onClick={onEnd} style={{
          background: "#fff", border: "none", fontSize: 18,
          width: 36, height: 36, borderRadius: 10, color: "#007aff",
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)"
        }}>←</button>
        <div style={{
          fontSize: 14, fontWeight: 700, color: "#007aff",
          background: "#e8f4fd", padding: "4px 14px", borderRadius: 99
        }}>
          מבחן סופי
        </div>
        <div style={{ fontSize: 14, color: "#8e8e93", fontWeight: 600 }}>{qi + 1}/10</div>
      </div>

      <div style={{ background: "#e5e5ea", borderRadius: 99, height: 6, marginBottom: 20, overflow: "hidden" }}>
        <div style={{
          width: ((qi + 1) / 10 * 100) + "%",
          height: "100%", background: failed ? "#ff9f0a" : "#007aff",
          borderRadius: 99, transition: "width 0.4s"
        }} />
      </div>

      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 56, fontWeight: 700, color: "#1c1c1e", lineHeight: 1, marginBottom: 8 }}>
          {q.letter.upper}{q.letter.lower}
        </div>
        <div style={{ fontSize: 15, color: "#8e8e93" }}>{q.question}</div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: q.bigOptions ? "1fr 1fr" : "1fr", gap: 10, marginBottom: 16 }}>
        {q.options.map(opt => {
          const isThis = selected === opt.id;
          const isRight = opt.id === q.correctId;
          let bg = "#fff", border = "#e5e5ea", color = "#1c1c1e";
          if (selected !== null) {
            if (isRight) { bg = "#e8f4fd"; border = "#007aff"; color = "#007aff"; }
            else if (isThis && !isRight) { bg = "#fff3e0"; border = "#ff9f0a"; color = "#cc7a00"; }
          }
          return (
            <button key={opt.id} onClick={() => handleSelect(opt.id)} style={{
              padding: q.bigOptions ? "16px 10px" : "14px 18px",
              fontSize: q.bigOptions ? 28 : 17, fontWeight: 600,
              background: bg, color, border: `1.5px solid ${border}`,
              borderRadius: 14, textAlign: "center", transition: "all 0.15s",
              boxShadow: selected === null ? "0 1px 4px rgba(0,0,0,0.06)" : "none"
            }}>
              {q.getLabel(opt)}
              {selected !== null && isRight && " ✓"}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <button onClick={() => { setSelected(null); setQi(qi + 1); }} style={{
          width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,
          background: "#007aff",
          color: "#fff", border: "none", borderRadius: 14
        }}>
          הבא
        </button>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [letterStates, setLetterStates] = useState(null);
  const [numberStates, setNumberStates] = useState(null);
  const [selectedLetter, setSelectedLetter] = useState(null);
  const [selectedNumber, setSelectedNumber] = useState(null);
  const [challengeStart, setChallengeStart] = useState(null);
  const [numChallengeStart, setNumChallengeStart] = useState(null);

  useEffect(() => {
    const saved = loadData();
    if (saved?.letterStates) {
      const merged = initState();
      Object.keys(saved.letterStates).forEach(id => {
        if (merged[id]) merged[id] = { ...merged[id], ...saved.letterStates[id] };
      });
      setLetterStates(merged);
      setChallengeStart(saved.challengeStart || null);
    } else {
      setLetterStates(initState());
    }
    if (saved?.numberStates) {
      const mergedN = initNumberState();
      Object.keys(saved.numberStates).forEach(id => {
        if (mergedN[id]) mergedN[id] = { ...mergedN[id], ...saved.numberStates[id] };
      });
      setNumberStates(mergedN);
    } else {
      setNumberStates(initNumberState());
    }
    setNumChallengeStart(saved?.numChallengeStart || null);
    setScreen("home");
  }, []);

  const saveTimer = useRef(null);
  useEffect(() => {
    if (!letterStates || !numberStates) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveData({ letterStates, numberStates, challengeStart, numChallengeStart, savedAt: new Date().toISOString() });
    }, 300);
    return () => clearTimeout(saveTimer.current);
  }, [letterStates, numberStates, challengeStart, numChallengeStart]);

  function handleQuizUpdate(id, correct) {
    setLetterStates(prev => {
      const cur = prev[id];
      const newCorrect = correct
        ? cur.quizCorrect + 1
        : Math.max(0, cur.quizCorrect - 3);
      return {
        ...prev,
        [id]: {
          ...cur,
          quizCorrect: newCorrect,
          quizTotal: cur.quizTotal + 1,
          learned: newCorrect >= 10 ? true : false
        }
      };
    });
    if (!challengeStart) {
      setChallengeStart(new Date().toISOString());
    }
  }

  function handleNumberQuizUpdate(id, correct) {
    setNumberStates(prev => {
      const cur = prev[id];
      const newCorrect = correct
        ? cur.quizCorrect + 1
        : Math.max(0, cur.quizCorrect - 3);
      return {
        ...prev,
        [id]: {
          ...cur,
          quizCorrect: newCorrect,
          quizTotal: cur.quizTotal + 1,
          learned: newCorrect >= 10
        }
      };
    });
    if (!numChallengeStart) {
      setNumChallengeStart(new Date().toISOString());
    }
  }

  function navigateLetter(dir) {
    if (!selectedLetter) return;
    const idx = LETTERS.findIndex(l => l.id === selectedLetter.id);
    const next = idx + dir;
    if (next >= 0 && next < LETTERS.length) setSelectedLetter(LETTERS[next]);
  }

  function navigateNumber(dir) {
    if (!selectedNumber) return;
    const idx = NUMBERS.findIndex(n => n.id === selectedNumber.id);
    const next = idx + dir;
    if (next >= 0 && next < NUMBERS.length) setSelectedNumber(NUMBERS[next]);
  }

  if (screen === "loading" || !letterStates || !numberStates) {
    return (
      <div style={{
        minHeight: "100vh", display: "flex", alignItems: "center",
        justifyContent: "center", flexDirection: "column", gap: 12,
        background: "#f8fafc"
      }}>
        <div style={{ fontSize: 48 }}>🇬🇷</div>
        <div style={{ color: "#6b7280" }}>טוען...</div>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", minHeight: "100dvh", background: "#f8fafc",
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      direction: "rtl"
    }}>
      {screen === "home" && (
        <HomeScreen
          letterStates={letterStates}
          numberStates={numberStates}
          challengeStart={challengeStart}
          onSelectLetter={l => setSelectedLetter(l)}
          onSelectNumber={n => setSelectedNumber(n)}
          onStartQuiz={() => setScreen("quiz")}
          onStartReading={() => setScreen("reading")}
          onStartFinal={() => setScreen("final")}
          onStartNumberQuiz={() => setScreen("numquiz")}
          onStartAlphaOrder={() => setScreen("alphaorder")}
          onStartDraw={() => setScreen("draw")}
          numChallengeStart={numChallengeStart}
        />
      )}
      {screen === "alphaorder" && <AlphaOrderScreen onEnd={() => setScreen("home")} />}
      {screen === "draw" && <DrawScreen onEnd={() => setScreen("home")} />}
      {screen === "quiz" && (
        <QuizScreen
          letterStates={letterStates}
          focusLevel={getUnlockedLevel(letterStates)}
          onEnd={() => setScreen("home")}
          onUpdate={handleQuizUpdate}
        />
      )}
      {screen === "reading" && (
        <ReadingQuizScreen onEnd={() => setScreen("home")} />
      )}
      {screen === "numquiz" && (
        <NumberQuizScreen
          numberStates={numberStates}
          onEnd={() => setScreen("home")}
          onUpdate={handleNumberQuizUpdate}
        />
      )}
      {screen === "final" && (
        <FinalExamScreen
          onEnd={() => setScreen("home")}
          onFail={() => {
            setLetterStates(prev => {
              const next = { ...prev };
              LETTERS.forEach(l => {
                if (next[l.id]?.learned) {
                  next[l.id] = { ...next[l.id], quizCorrect: 8, learned: false };
                }
              });
              return next;
            });
          }}
        />
      )}
      {selectedLetter && (
        <LetterModal
          letter={selectedLetter}
          state={letterStates[selectedLetter.id]}
          onClose={() => setSelectedLetter(null)}
          onNext={() => navigateLetter(1)}
          onPrev={() => navigateLetter(-1)}
        />
      )}
      {selectedNumber && (
        <NumberModal
          num={selectedNumber}
          state={numberStates[selectedNumber.id]}
          onClose={() => setSelectedNumber(null)}
          onNext={() => navigateNumber(1)}
          onPrev={() => navigateNumber(-1)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
(function(){
  var APP_VER = 'abc_v30';
  if ('caches' in window && localStorage.getItem('abc_ver') !== APP_VER) {
    caches.keys().then(function(names) {
      return Promise.all(names.map(function(n){ return caches.delete(n); }));
    }).then(function(){
      localStorage.setItem('abc_ver', APP_VER);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(r){ return r.unregister(); }));
        }).then(function(){
          navigator.serviceWorker.register('sw.js').then(function(){
            window.location.reload();
          });
        });
      }
    });
  } else {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
      navigator.serviceWorker.addEventListener('controllerchange', function(){ window.location.reload(); });
    }
  }
})();
</script>
</body>
