function loadData() {

}
function saveData(d) {

const LETTER_PRONUNCIATIONS = {
  "Άλφα":"άλφα","Βήτα":"βήτα","Γάμα":"γάμμα","Δέλτα":"δέλτα",
  "Έψιλον":"έψιλον","Ζήτα":"ζήτα","Ήτα":"ήτα","Θήτα":"θήτα",
  "Ιώτα":"ιώτα","Κάππα":"κάππα","Λάμδα":"λάμδα","Μι":"μι",
  "Νι":"νι","Ξι":"ξι","Όμικρον":"όμικρον","Πι":"πι",
  "Ρο":"ρο","Σίγμα":"σίγμα","Ταυ":"ταυ","Ύψιλον":"ύψιλον",
  "Φι":"φι","Χι":"χι","Ψι":"ψι","Ωμέγα":"ωμέγα"
};
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const pron = LETTER_PRONUNCIATIONS[text];
  const sayText = pron || text;
  const utt = new SpeechSynthesisUtterance(sayText);
  utt.lang = "el-GR";
  utt.rate = 0.6;
  const voices = window.speechSynthesis.getVoices();
  const greek = voices.find(v => v.lang === "el-GR") || voices.find(v => v.lang.startsWith("el"));
  if (greek) utt.voice = greek;
  window.speechSynthesis.speak(utt);
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}

function QuizScreen({ letterStates, focusLevel, onEnd, onUpdate }) {
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, total: 0 });

  useEffect(() => {
    const qs = generateQuiz(letterStates);
    setQuestions(qs);
  }, []);

  function generateQuiz(states) {
    const weighted = LETTERS.map(letter => {
      const s = states[letter.id];
      const progress = s.quizCorrect || 0;
      let weight;
      if (s.learned) { weight = 1; }
      else if (s.quizTotal === 0) { weight = 15; }
      else {
        const accuracy = s.quizCorrect / s.quizTotal;
        weight = Math.max(2, Math.round((1 - accuracy) * 20) + (10 - progress));
      }
      if (letter.difficulty === focusLevel) weight *= 3;
      else if (letter.difficulty > focusLevel) weight = Math.max(1, Math.ceil(weight / 3));
      return { letter, weight };
    });
    const pool = [];
    weighted.forEach(({ letter, weight }) => {
      for (let i = 0; i < weight; i++) pool.push(letter);
    });
    const picked = [];
    const used = new Set();
    while (picked.length < 12 && pool.length > 0) {
      const idx = Math.floor(Math.random() * pool.length);
      const letter = pool[idx];
      if (!used.has(letter.id)) {
        picked.push(letter);
        used.add(letter.id);
      }
      pool.splice(idx, 1);
    }
    const qs = [];
    const types = ["identify", "sound", "reverse"];

    picked.forEach((letter, i) => {
      const type = types[i % 3];
      let others;
      if (type === "sound") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && l.sound !== letter.sound)).slice(0, 3);
      } else if (type === "identify") {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id && l.nameHe !== letter.nameHe)).slice(0, 3);
      } else {
        others = shuffle(LETTERS.filter(l => l.id !== letter.id)).slice(0, 3);
      }
      const options = shuffle([letter, ...others]);

      if (type === "identify") {
        qs.push({
          type, letter, options,
          question: `מה שם האות ${letter.upper} ?`,
          getLabel: l => l.nameHe,
          correctId: letter.id
        });
      } else if (type === "sound") {
        qs.push({
          type, letter, options,
          question: `איך נשמעת ${letter.upper}${letter.lower} ?`,
          getLabel: l => `${l.soundHe}  (${l.sound})`,
          correctId: letter.id
        });
      } else {
        qs.push({
          type, letter, options,
          question: `איפה האות ${letter.nameHe} ?`,
          getLabel: l => `${l.upper}${l.lower}`,
          correctId: letter.id,
          bigOptions: true
        });
      }
    });

    return shuffle(qs).slice(0, 10);
  }

  if (questions.length === 0) return null;

  if (qi >= questions.length) {
    const pct = Math.round((stats.correct / stats.total) * 100);
    return (
      <div style={{ padding: "40px 20px", maxWidth: 480, margin: "0 auto", textAlign: "center" }}>
        <div style={{ fontSize: 64, marginBottom: 16 }}>
          {pct >= 80 ? "🏆" : pct >= 50 ? "💪" : "📚"}
        </div>
        <h2 style={{ fontSize: 24, fontWeight: 800, color: "#1e3a5f", marginBottom: 8 }}>
          {pct >= 80 ? "מצוין!" : pct >= 50 ? "לא רע!" : "צריך תרגול"}
        </h2>
        <div style={{ fontSize: 48, fontWeight: 800, color: pct >= 80 ? "#10b981" : pct >= 50 ? "#f59e0b" : "#ef4444", marginBottom: 8 }}>
          {pct}%
        </div>
        <div style={{ fontSize: 16, color: "#6b7280", marginBottom: 32 }}>
          {stats.correct} מתוך {stats.total} תשובות נכונות
        </div>
        <button onClick={onEnd} style={{
          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "linear-gradient(135deg, #1e3a5f, #2563eb)",
          color: "#fff", border: "none", borderRadius: 14
        }}>
          חזרה הביתה
        </button>
      </div>
    );
  }

  const q = questions[qi];
  const isCorrect = selected !== null ? selected === q.correctId : null;

  function handleSelect(id) {
    if (selected !== null) return;
    setSelected(id);
    const correct = id === q.correctId;
    setStats(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    onUpdate(q.letter.id, correct);
    if (correct) speak(q.letter.example);
  }

  function handleNext() {
    setSelected(null);
    setQi(qi + 1);
  }

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",
        marginBottom: 20
      }}>
        <button onClick={onEnd} style={{
          background: "none", border: "none", fontSize: 22
        }}>←</button>
        <div style={{ fontSize: 14, color: "#6b7280", fontWeight: 600 }}>
          {qi + 1} / {questions.length}
        </div>
        <div style={{ fontSize: 13, color: "#6b7280" }}>
          ✅ {stats.correct}
        </div>
      </div>

      <div style={{
        background: "#e5e7eb", borderRadius: 99, height: 6, marginBottom: 24, overflow: "hidden"
      }}>
        <div style={{
          width: ((qi + 1) / questions.length * 100) + "%",
          height: "100%", background: "#2563eb", borderRadius: 99,
          transition: "width 0.4s"
        }} />
      </div>

      {q.type !== "reverse" && (
        <div style={{
          textAlign: "center", marginBottom: 24
        }}>
          <div style={{
            fontSize: 80, fontWeight: 800, color: "#1e3a5f",
            lineHeight: 1, marginBottom: 8, cursor: "pointer"
          }} onClick={() => speak(q.letter.name)}>
            {q.letter.upper}{q.letter.lower}
          </div>
          <button onClick={() => speak(q.letter.name)} style={{
            padding: "6px 16px", borderRadius: 99,
            background: "#eff6ff", border: "1px solid #bfdbfe",
            color: "#2563eb", fontSize: 13, cursor: "pointer"
          }}>🔊</button>
        </div>
      )}

      <div style={{
        fontSize: 18, fontWeight: 600, color: "#374151",
        textAlign: "center", marginBottom: 20
      }}>
        {q.question}
      </div>

      <div style={{
        display: "grid",
        gridTemplateColumns: q.bigOptions ? "1fr 1fr" : "1fr",
        gap: 10, marginBottom: 20
      }}>
        {q.options.map(opt => {
          const isThis = selected === opt.id;
          const isRight = opt.id === q.correctId;
          let bg = "#fff", border = "#e5e7eb", color = "#1e293b";
          if (selected !== null) {
            if (isRight) { bg = "#f0fdf4"; border = "#10b981"; color = "#166534"; }
            else if (isThis && !isRight) { bg = "#fef2f2"; border = "#ef4444"; color = "#991b1b"; }
          }
          return (
            <button key={opt.id} onClick={() => handleSelect(opt.id)} style={{
              padding: q.bigOptions ? "18px 10px" : "14px 18px",
              fontSize: q.bigOptions ? 32 : 16,
              fontWeight: q.bigOptions ? 800 : 600,
              background: bg,
              color,
              border: `2px solid ${border}`,
              borderRadius: 14,
              textAlign: "center",
              transition: "all 0.15s"
            }}>
              {q.getLabel(opt)}
              {selected !== null && isRight && " ✓"}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <div>
          <div style={{
            padding: "12px 16px", borderRadius: 12, marginBottom: 14,
            background: isCorrect ? "#f0fdf4" : "#fef2f2",
            border: "1px solid " + (isCorrect ? "#86efac" : "#fca5a5"),
            textAlign: "center", fontSize: 14, color: isCorrect ? "#166534" : "#991b1b"
          }}>
            {isCorrect ? "נכון! 🎉" : `לא — התשובה: ${q.letter.nameHe} (${q.letter.upper}${q.letter.lower}) = ${q.letter.soundHe}`}
          </div>
          <button onClick={handleNext} style={{
            width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,
            background: "linear-gradient(135deg, #1e3a5f, #2563eb)",
            color: "#fff", border: "none", borderRadius: 14
          }}>
            {qi + 1 < questions.length ? "הבא →" : "סיכום"}
          </button>
        </div>
      )}
    </div>
  );
}

        <h2 style={{ fontSize: 24, fontWeight: 800, color: "#1e3a5f", marginBottom: 8 }}>
          {pct >= 80 ? "קורא יוונית!" : pct >= 50 ? "לא רע!" : "צריך תרגול"}

          padding: "14px 40px", fontSize: 16, fontWeight: 700,
          background: "linear-gradient(135deg, #1e3a5f, #2563eb)",

        }}>

  const q = questions[qi];

    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",

      }}>

          background: "none", border: "none", fontSize: 22
        }}>←</button>
        <div style={{ fontSize: 14, color: "#6b7280", fontWeight: 600 }}>
          {qi + 1} / {questions.length}
        </div>
        <div style={{ fontSize: 13, color: "#6b7280" }}>
          {'✅'} {stats.correct}
        </div>
      </div>

      <div style={{
        background: "#e5e7eb", borderRadius: 99, height: 6, marginBottom: 24, overflow: "hidden"
      }}>
        <div style={{
          width: ((qi + 1) / questions.length * 100) + "%",
          height: "100%", background: "#8b5cf6", borderRadius: 99,
          transition: "width 0.4s"
        }} />
      </div>

      <div style={{
        fontSize: 14, color: "#6b7280", textAlign: "center", marginBottom: 8
      }}>
        איך קוראים את המילה הזו?
      </div>

      <div style={{
        textAlign: "center", marginBottom: 24
      }}>
        <div style={{
          fontSize: 48, fontWeight: 800, color: "#1e3a5f",
          lineHeight: 1.2, marginBottom: 6, cursor: "pointer",
          direction: "ltr"
        }} onClick={() => speak(q.word.gr)}>
          {q.word.gr}
        </div>
        <button onClick={() => speak(q.word.gr)} style={{
          padding: "6px 16px", borderRadius: 99,

        }}>{'🔊'} שמע</button>

      <div style={{
        display: "grid", gridTemplateColumns: "1fr",
        gap: 10, marginBottom: 20
      }}>
        {q.options.map(opt => {
          const isThis = selected === opt.en;

          let bg = "#fff", border = "#e5e7eb", color = "#1e293b";
          if (selected !== null) {
            if (isRight) { bg = "#f0fdf4"; border = "#10b981"; color = "#166534"; }

              : `לא — ${q.word.gr} = ${q.correctEn} (${q.word.he})`}
          </div>
          <button onClick={() => { setSelected(null); setQi(qi + 1); }} style={{
            width: "100%", padding: "14px 0", fontSize: 16, fontWeight: 700,

const UNLOCK_THRESHOLD = 6;

function getUnlockedLevel(letterStates) {
  const learnedEasy = LETTERS.filter(l => l.difficulty === 1 && letterStates[l.id]?.learned).length;
  const learnedMed = LETTERS.filter(l => l.difficulty === 2 && letterStates[l.id]?.learned).length;
  if (learnedEasy >= UNLOCK_THRESHOLD && learnedMed >= UNLOCK_THRESHOLD) return 3;
  if (learnedEasy >= UNLOCK_THRESHOLD) return 2;
  return 1;
}

function HomeScreen({ letterStates, onSelectLetter, onStartQuiz, onStartReading, challengeStart }) {
  const learnedCount = LETTERS.filter(l => letterStates[l.id]?.learned).length;
  const learnedEasy = LETTERS.filter(l => l.difficulty === 1 && letterStates[l.id]?.learned).length;
  const learnedMed = LETTERS.filter(l => l.difficulty === 2 && letterStates[l.id]?.learned).length;
  const learnedHard = LETTERS.filter(l => l.difficulty === 3 && letterStates[l.id]?.learned).length;
  const unlockedLevel = getUnlockedLevel(letterStates);

  const challengeDay = challengeStart
    ? Math.min(10, daysSince(challengeStart) + 1)
    : 0;
  const todayPlan = challengeDay > 0 ? DAY_PLAN[challengeDay - 1] : null;
  const todayTarget = todayPlan ? todayPlan.target : 0;
  const todayRemaining = Math.max(0, todayTarget - learnedCount);

  return (
    <div style={{ padding: "20px 16px", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ textAlign: "center", marginBottom: 20 }}>
        <div style={{ fontSize: 40, marginBottom: 4 }}>🇬🇷</div>
        <h1 style={{ margin: 0, fontSize: 28, fontWeight: 800, color: "#1e3a5f" }}>
          αβγ
        </h1>
        <p style={{ margin: "4px 0 0", color: "#6b7280", fontSize: 14 }}>
          האלפבית היווני ב-10 ימים <span style={{ color: "#9ca3af", fontSize: 11 }}>(v12)</span>
        </p>
      </div>

      {challengeDay > 0 && (
        <div style={{
          background: "#f0f9ff", borderRadius: 14, padding: 14,
          marginBottom: 16, border: "1px solid #bae6fd"
        }}>
          <div style={{
            display: "flex", justifyContent: "space-between",
            fontSize: 14, fontWeight: 600, color: "#0369a1", marginBottom: 8
          }}>
            <span>יום {challengeDay}/10 — יעד: {todayTarget} אותיות</span>
            <span>{learnedCount}/24</span>
          </div>
          {todayRemaining > 0 ? (
            <div style={{
              fontSize: 13, color: "#b45309", fontWeight: 600,
              marginBottom: 8, textAlign: "center",
              padding: "6px 10px", borderRadius: 8,
              background: "#fef3c7"
            }}>
              {'📋'} נשאר להיום: {todayRemaining} {todayRemaining === 1 ? "אות" : "אותיות"}
            </div>
          ) : todayPlan && (
            <div style={{
              fontSize: 13, color: "#166534", fontWeight: 600,
              marginBottom: 8, textAlign: "center",
              padding: "6px 10px", borderRadius: 8,
              background: "#dcfce7"
            }}>
              {'✅'} סיימת את המשימה של היום!
            </div>
          )}
          <div style={{ background: "#e0f2fe", borderRadius: 99, height: 8, overflow: "hidden" }}>
            <div style={{
              width: (learnedCount / 24 * 100) + "%",
              height: "100%", background: "#0ea5e9", borderRadius: 99,
              transition: "width 0.6s"
            }} />
          </div>
          <div style={{
            display: "flex", gap: 4, marginTop: 10, justifyContent: "center", flexWrap: "wrap"
          }}>
            {DAY_PLAN.map((dp, i) => {
              const dayNum = i + 1;
              const current = dayNum === challengeDay;
              const isFuture = dayNum > challengeDay;
              const met = learnedCount >= dp.target;
              const pct = Math.min(1, learnedCount / dp.target);
              if (isFuture) return (
                <div key={i} style={{
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
                  width: 30
                }}>
                  <div style={{
                    width: 28, height: 28, borderRadius: "50%",
                    background: "#e5e7eb", color: "#9ca3af",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 10, fontWeight: 700
                  }}>{dayNum}</div>
                  <div style={{ fontSize: 8, color: "#d1d5db", fontWeight: 600 }}>
                    {dp.target}
                  </div>
                </div>
              );
              return (
                <div key={i} style={{
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
                  width: 30
                }}>
                  <div style={{ position: "relative", width: 28, height: 28 }}>
                    <svg width="28" height="28" viewBox="0 0 28 28">
                      <circle cx="14" cy="14" r="12" fill="none"
                        stroke={met ? "#10b981" : current ? "#93c5fd" : "#e5e7eb"}
                        strokeWidth="3" />
                      {pct > 0 && !met && (
                        <circle cx="14" cy="14" r="12" fill="none"
                          stroke={current ? "#2563eb" : "#10b981"}
                          strokeWidth="3"
                          strokeDasharray={`${pct * 75.4} 75.4`}
                          strokeLinecap="round"
                          transform="rotate(-90 14 14)" />
                      )}
                    </svg>
                    <div style={{
                      position: "absolute", inset: 0,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 10, fontWeight: 700,
                      color: met ? "#10b981" : current ? "#2563eb" : "#9ca3af"
                    }}>
                      {met ? "✓" : dayNum}
                    </div>
                  </div>
                  <div style={{
                    fontSize: 8, fontWeight: 600,
                    color: met ? "#10b981" : "#9ca3af"
                  }}>
                    {Math.min(learnedCount, dp.target)}/{dp.target}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{
        display: "flex", gap: 8, marginBottom: 16, justifyContent: "center"
      }}>
        {[1,2,3].map(d => {
          const count = d === 1 ? learnedEasy : d === 2 ? learnedMed : learnedHard;
          return (
            <div key={d} style={{
              flex: 1, textAlign: "center", padding: "8px 4px",
              borderRadius: 10, background: DIFF_BG[d],
              border: "1px solid " + DIFF_COLORS[d] + "40"
            }}>
              <div style={{ fontSize: 10, color: DIFF_COLORS[d], fontWeight: 600 }}>{DIFF_NAMES[d]}</div>
              <div style={{ fontSize: 18, fontWeight: 800, color: DIFF_COLORS[d] }}>{count}/8</div>
            </div>
          );
        })}
      </div>

      <div style={{
        display: "grid", gridTemplateColumns: "repeat(6, 1fr)",
        gap: 6, marginBottom: 20
      }}>
        {LETTERS.map(letter => (
          <BingoCell
            key={letter.id}
            letter={letter}
            state={letterStates[letter.id]}
            highlight={false}
            onClick={() => onSelectLetter(letter)}
          />
        ))}
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 0 }}>
        <button onClick={onStartQuiz} style={{
          flex: 1, padding: "15px 0", fontSize: 16, fontWeight: 700,
          background: "linear-gradient(135deg, #1e3a5f, #2563eb)",
          color: "#fff", border: "none", borderRadius: 14,
          boxShadow: "0 4px 14px rgba(37,99,235,0.35)"
        }}>
          {'📝'} מבחן אותיות
        </button>
        <button onClick={onStartReading} style={{
          flex: 1, padding: "15px 0", fontSize: 16, fontWeight: 700,
          background: "linear-gradient(135deg, #6d28d9, #8b5cf6)",
          color: "#fff", border: "none", borderRadius: 14,
          boxShadow: "0 4px 14px rgba(139,92,246,0.35)"
        }}>
          {'📖'} מבחן קריאה
        </button>
      </div>

      {learnedCount === 24 && (
        <div style={{
          marginTop: 16, padding: 16, borderRadius: 14,
          background: "linear-gradient(135deg, #10b981, #059669)",
          textAlign: "center", color: "#fff"
        }}>
          <div style={{ fontSize: 32 }}>🏆</div>
          <div style={{ fontSize: 18, fontWeight: 700 }}>כל האותיות נלמדו!</div>
          <div style={{ fontSize: 13, opacity: 0.9 }}>את/ה שולט/ת באלפבית היווני</div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("loading");
  const [letterStates, setLetterStates] = useState(null);
  const [selectedLetter, setSelectedLetter] = useState(null);
  const [challengeStart, setChallengeStart] = useState(null);

  useEffect(() => {
    const saved = loadData();
    if (saved?.letterStates) {
      const merged = initState();
      Object.keys(saved.letterStates).forEach(id => {
        if (merged[id]) merged[id] = { ...merged[id], ...saved.letterStates[id] };
      });
      setLetterStates(merged);
      setChallengeStart(saved.challengeStart || null);
    } else {
      setLetterStates(initState());
    }
    setScreen("home");
  }, []);

  const saveTimer = useRef(null);
  useEffect(() => {
    if (!letterStates) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveData({ letterStates, challengeStart, savedAt: new Date().toISOString() });
    }, 300);
    return () => clearTimeout(saveTimer.current);
  }, [letterStates, challengeStart]);

  function handleQuizUpdate(id, correct) {
    setLetterStates(prev => {
      const cur = prev[id];
      const newCorrect = correct
        ? cur.quizCorrect + 1
        : Math.max(0, cur.quizCorrect - 3);
      return {
        ...prev,
        [id]: {
          ...cur,
          quizCorrect: newCorrect,
          quizTotal: cur.quizTotal + 1,
          learned: newCorrect >= 10 ? true : false
        }
      };
    });
    if (!challengeStart) {
      setChallengeStart(new Date().toISOString());
    }
  }

  if (screen === "loading" || !letterStates) {
    return (
      <div style={{
        minHeight: "100vh", display: "flex", alignItems: "center",
        justifyContent: "center", flexDirection: "column", gap: 12,
        background: "#f8fafc"
      }}>
        <div style={{ fontSize: 48 }}>🇬🇷</div>
        <div style={{ color: "#6b7280" }}>טוען...</div>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", minHeight: "100dvh", background: "#f8fafc",
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      direction: "rtl"
    }}>
      {screen === "home" && (
        <HomeScreen
          letterStates={letterStates}
          challengeStart={challengeStart}
          onSelectLetter={l => setSelectedLetter(l)}
          onStartQuiz={() => setScreen("quiz")}
          onStartReading={() => setScreen("reading")}
        />
      )}
      {screen === "quiz" && (
        <QuizScreen
          letterStates={letterStates}
          focusLevel={getUnlockedLevel(letterStates)}
          onEnd={() => setScreen("home")}
          onUpdate={handleQuizUpdate}
        />
      )}
      {screen === "reading" && (
        <ReadingQuizScreen onEnd={() => setScreen("home")} />
      )}
      {selectedLetter && (
        <LetterModal
          letter={selectedLetter}
          state={letterStates[selectedLetter.id]}
          onClose={() => setSelectedLetter(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
(function(){
  var APP_VER = 'abc_v12';
  if ('caches' in window && localStorage.getItem('abc_ver') !== APP_VER) {
    caches.keys().then(function(names) {
      return Promise.all(names.map(function(n){ return caches.delete(n); }));
    }).then(function(){
      localStorage.setItem('abc_ver', APP_VER);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(r){ return r.unregister(); }));
        }).then(function(){
          navigator.serviceWorker.register('sw.js').then(function(){
            window.location.reload();
          });
        });
      }
    });
  } else {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
      navigator.serviceWorker.addEventListener('controllerchange', function(){ window.location.reload(); });
    }
  }
})();
</script>
</body>
